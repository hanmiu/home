<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""/>
  
  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Stylish&display=swap" rel="stylesheet">
  
  <title>신기한 생물 사전 2025</title>
  
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background-color: #ffffa6;
    }
    
    #title {
      width: 100vw;
      height: 7vh;
      background-image: url('./25_creatures/front/strange_creatures.png');
      background-position: center center;
      background-repeat: no-repeat;

    }
    
    #notice {
      text-align: center;
      margin-top: 10px;
      margin-bottom: 10px;
      font-family: 'Noto Serif KR';
      font-size: 2vh;
      color: deeppink;
    }
    
    #info {
      padding: 2vh;
      font-family: 'Noto Serif KR';

      color: black;

    }
    
    #map {
      display: block;
      width: 100vw;

    }
    
    .ui {
      text-align: center;
    }
    
    .button {
      display: inline-block;
      position: relative;
      left: -1px;
      top: -1px;
      box-sizing: border-box;
      margin: 0.5vh;
      margin-bottom: 1vh;
      font-family: 'Stylish';
      text-align: center;
      font-size: 2.5vh;
      background-color: azure;
      color: #2f5f5f;
      padding: 0.5vh 1vh 0.5vh 1vh;
      border-radius: 1vh;
      border: 1px solid #427979;
      user-select: none;
      -webkit-user-select: none;
      box-shadow: 1px 1px 2px rgba(0, 0, 0, 0.3), inset 2px 2px 2px rgba(255, 255, 255, 0.2), inset -2px -2px 2px rgba(0, 0, 0, 0.2);
      cursor: pointer;
    }
    
    .button:active {
      left: 0px;
      top: 0px;
      background-color: #c6d4d4;
      box-shadow: 0px 0px 2px rgba(0, 0, 0, 0.3),inset -2px -2px 2px rgba(255, 255, 255, 0.2), inset 2px 2px 2px rgba(0, 0, 0, 0.2);
    }
    
    .sbutton {
      display: inline-block;
      position: relative;
      left: -1px;
      top: -1px;
      box-sizing: border-box;
      margin: 0.5vh;
      font-family: 'Stylish';
      text-align: center;
      font-size: 2.5vh;
      background-color: azure;
      color: #2f5f5f;
      padding: 0.5vh;
      border-radius: 1vh;
      border: 1px solid #427979;
      user-select: none;
      -webkit-user-select: none;
      box-shadow: 1px 1px 2px rgba(0, 0, 0, 0.3), inset 2px 2px 2px rgba(255, 255, 255, 0.2), inset -2px -2px 2px rgba(0, 0, 0, 0.2);
      cursor: pointer;
    }
    
    .sbutton:active {
      left: 0px;
      top: 0px;
      background-color: #c6d4d4;
      box-shadow: 0px 0px 2px rgba(0, 0, 0, 0.3),inset -2px -2px 2px rgba(255, 255, 255, 0.2), inset 2px 2px 2px rgba(0, 0, 0, 0.2);
    }
    
    .creat {
      color: deeppink;
    }
    
    #stage {
      display: none;
      position: fixed;
      left: 0px;
      top: 0px;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 1);
    }
    
    #video-bg {
      position: absolute;
      left: 0px;
      top: 0px;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
    }
    
    #webgl {
      position: absolute;
      left: 0px;
      top: 0px;
      width: 100%;
      height: 100%;
    }
    
    #profile {
      position: absolute;
      left: 0px;
      top: 0px;
      width: 82vw;
      height: 20vh;
      font-family: 'Stylish';
      font-size: 3vh;
      color: white;
      text-shadow: 0px 0px 2px deeppink;
      padding: 4vh 2vh 2vh 5vh;
    }
    
    #dialog {
      position: absolute;
      left: 0px;
      bottom: 0px;
      height: 20vh;
      font-family: 'Stylish';
      font-size: 3vh;
      color: white;
      text-shadow: 0px 0px 2px deeppink;
      padding: 2vh 2vh 2vh 5vh;
    }
    
    .t-right {
      text-align: right;
    }
    
    #loading {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      font-family: 'Stylish';
      font-size: 4vh;
      color: white;
      text-shadow: 0px 0px 4px deeppink;
      display: none;
    }
    
    .spinner {
      display: inline-block;
      width: 3vh;
      height: 3vh;
      border: 0.5vh solid rgba(255, 255, 255, 0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-left: 1vh;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="title"></div>
  <div id="notice">안전 주의! 스마트폰을 보며 걷지 않기</div>
  <div class="ui">
    <div id="trace_on" class="button">현재 위치</div>
  </div>
  <div id="map"></div>
  <div id="info">(준비중)</div>
  
  <div id="stage">
    <video id="video-bg" autoplay playsinline muted></video>
    <div id="webgl"></div>
    <div id="loading">로딩중<span class="spinner"></span></div>
    <div id="profile"></div>
    <div id="dialog"></div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""></script>
  
  <!-- Three.js -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

  <script>
    'use strict';
    
    // ============================================================
    // Josa 유틸리티 (인라인)
    // ============================================================
    const Josa = (() => {
      const hasJong = (string) => {
        const code = string.charCodeAt(string.length - 1);
        return (code - 0xac00) % 28 > 0;
      };
      
      const formats = {
        '을/를': (s) => hasJong(s) ? '을' : '를',
        '은/는': (s) => hasJong(s) ? '은' : '는',
        '이/가': (s) => hasJong(s) ? '이' : '가',
        '와/과': (s) => hasJong(s) ? '과' : '와'
      };
      
      // 축약형도 처리
      ['을', '를', '을를'].forEach(k => formats[k] = formats['을/를']);
      ['은', '는', '은는'].forEach(k => formats[k] = formats['은/는']);
      ['이', '가', '이가'].forEach(k => formats[k] = formats['이/가']);
      ['와', '과', '와과'].forEach(k => formats[k] = formats['와/과']);
      
      return {
        c: (word, format) => {
          if (!formats[format]) throw new Error('Invalid format!');
          return formats[format](word);
        },
        r: (word, format) => word + Josa.c(word, format)
      };
    })();
    
    // ============================================================
    // 전역 변수
    // ============================================================
    let map, markerHere, markerRange, latlngHere;
    let spots = [];
    let dicSpots = {};
    
    const rangeMeet = {
      max: 500,
      now: 500
    };
    
    let isTraceOn = false;
    let isFirstTrace = true; // 최초 위치 추적 여부
    let pastTimestamp = 0;
    let elapsedTime = 0;
    let spotMarkers = []; // 생물 마커들을 추적
    
    // Three.js 변수
    let camera, scene, renderer;
    let creatureMesh = null;
    let videoElement = null;
    let isVideoInitiated = false;
    
    // DOM 요소
    const el = {
      traceOn: document.querySelector('#trace_on'),
      map: document.querySelector('#map'),
      info: document.querySelector('#info'),
      stage: document.querySelector('#stage'),
      videoBg: document.querySelector('#video-bg'),
      webgl: document.querySelector('#webgl'),
      profile: document.querySelector('#profile'),
      dialog: document.querySelector('#dialog'),
      loading: document.querySelector('#loading')
    };
    
    // ============================================================
    // 주기적 업데이트 클래스
    // ============================================================
    class Periodic {
      constructor(seconds, callback) {
        this.dur = seconds * 1000;
        this.elapsed = 0;
        this.callback = callback;
      }
      
      update(diff) {
        this.elapsed += diff;
        if (this.elapsed >= this.dur) {
          this.elapsed = 0;
          this.callback();
        }
      }
    }
    
    const periodics = {
      trace: new Periodic(10, () => {
        navigator.geolocation.getCurrentPosition(trace, errorTrace);
        displayInfo();
      })
    };
    
    // ============================================================
    // 맵 관련 함수
    // ============================================================
    async function initMap() {
      // 유치원: 37.683408, 126.769612
      latlngHere = [37.683408, 126.769612];
      map = L.map('map').setView(latlngHere, 15);
      
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
        maxZoom: 18,
        tileSize: 512,
        zoomOffset: -1
      }).addTo(map);
      
      markerRange = L.circle(latlngHere, {
        color: 'rgba(255, 255, 0, 0.5)',
        fillColor: '#f03',
        fillOpacity: 0.1,
        radius: rangeMeet.now
      }).addTo(map);

      markerHere = L.circleMarker(latlngHere, {
        color: 'red',
        fillColor: '#f03',
        fillOpacity: 0.25,
        radius: 5
      }).addTo(map);
      
      // 데이터 로드
      await loadSpots();
    }
    
    async function loadSpots() {
      try {
        const response = await fetch('./25_creatures/data/data_kj.tsv');
        const text = await response.text();
        parseSpots(text.split('\n'));
      } catch (error) {
        console.error('Failed to load spots:', error);
      }
    }
    
    function parseSpots(lines) {
      const fields = lines.shift().split('\t').map(x => x.trim());
      
      for (let i = 0; i < lines.length; i++) {
        const line = lines[i];
        if (!line.trim()) continue;
        
        const items = line.split('\t').map(x => x.trim());
        const spot = {};
        
        for (let j = 0; j < fields.length; j++) {
          spot[fields[j]] = items[j];
        }
        
        spot.latlng = spot.latlng.split(',').map(x => Number(x.trim()));
        
        // file에서 이름 추출 (확장자 제거)
        if (spot.file) {
          spot.name = spot.file.replace('.png', '');
        }
        
        spots.push(spot);
        if (spot.name) {
          dicSpots[spot.name] = spot;
        }
      }
      
      // 마커 추가
      for (const spot of spots) {
        const displayName = spot.name || spot.file || '이름 없음';
        const marker = L.marker(spot.latlng).addTo(map).bindPopup(displayName);
        spot.marker = marker;
        spotMarkers.push(marker);
      }
    }
    
    // 500m 반경 내 랜덤 위치 생성
    function getRandomLocationNearby(centerLatlng, maxDistanceMeters) {
      // 랜덤 거리 (0 ~ maxDistance)
      const distance = Math.random() * maxDistanceMeters;
      // 랜덤 각도 (0 ~ 360도)
      const angle = Math.random() * 2 * Math.PI;
      
      // 대략적인 위도/경도 변환 (1도 ≈ 111km)
      // 경도는 위도에 따라 다르지만, 한국 기준으로 대략 계산
      const lat = centerLatlng[0];
      const lng = centerLatlng[1];
      
      const deltaLat = (distance * Math.cos(angle)) / 111000;
      const deltaLng = (distance * Math.sin(angle)) / (111000 * Math.cos(lat * Math.PI / 180));
      
      return [lat + deltaLat, lng + deltaLng];
    }
    
    function placeRandomCreaturesNearby() {
      if (spots.length === 0) return;
      
      // PNG file이 있는 생물만 필터링
      const creaturesWithAssets = spots.filter(spot => spot.file && spot.file.endsWith('.png'));
      
      // 모든 생물이 file을 가지고 있어야 하므로, 전체를 후보로 사용
      const candidatePool = creaturesWithAssets.length > 0 ? creaturesWithAssets : spots;
      
      // 랜덤으로 2개 선택 (중복 없이)
      const selectedCount = Math.min(2, candidatePool.length);
      const shuffled = [...candidatePool].sort(() => Math.random() - 0.5);
      const selectedCreatures = shuffled.slice(0, selectedCount);
      
      // 선택된 생물들을 현재 위치 근처로 이동
      selectedCreatures.forEach(creature => {
        const newLocation = getRandomLocationNearby(latlngHere, 450); // 500m보다 약간 작게
        creature.latlng = newLocation;
        creature.isNearby = true; // 근처 배치 표시
        
        // 마커 위치 업데이트
        if (creature.marker) {
          creature.marker.setLatLng(newLocation);
        }
      });
      
      console.log(`${selectedCount}개의 생물을 현재 위치 근처에 배치했습니다:`, 
                  selectedCreatures.map(c => c.name));
      
      // 안내 메시지 업데이트
      const names = selectedCreatures.map(c => {
        // "작가명_생물명" 형태에서 생물명만 추출
        const parts = c.name.split('_');
        return parts.length > 1 ? parts[1] : c.name;
      }).join(', ');
      el.info.innerHTML = `주변에 ${selectedCount}마리의 생물이 나타났습니다! (${names})<br><br>가까이 다가가서 만나보세요!`;
    }
    
    
    function findNearestSpot() {
      const list = spots.map(spot => ({
        name: spot.name,
        dist: map.distance(spot.latlng, latlngHere)
      })).sort((a, b) => a.dist - b.dist);
      
      return list.slice(0, 3);
    }
    
    function displayInfo() {
      if (!isTraceOn) return;
      
      const res = findNearestSpot();
      if (res.length === 0) return;
      
      const creats = res.filter(r => r.dist <= rangeMeet.max);
      let toMeet = '';
      
      if (creats.length > 0) {
        toMeet = creats.map(x => {
          const spot = dicSpots[x.name];
          const emoji = spot && spot.isNearby ? '⭐ ' : '';
          // "작가명_생물명" 형태에서 생물명만 추출
          const displayName = x.name.includes('_') ? x.name.split('_')[1] : x.name;
          return `<button class="sbutton">${emoji}${displayName}</button>`;
        }).join(', ');
        
        if (creats.length === 1) {
          const displayName = creats[0].name.includes('_') ? creats[0].name.split('_')[1] : creats[0].name;
          const josa = Josa.c(displayName, '을/를');
          toMeet += `${josa} 클릭해서 만나 보세요.`;
        } else {
          toMeet += ` 중에 하나를 클릭해서 만나 보세요. (⭐ 표시는 근처에 나타난 생물!)`;
        }
      }
      
      const name = res[0].name.includes('_') ? res[0].name.split('_')[1] : res[0].name;
      const isNearby = dicSpots[res[0].name] && dicSpots[res[0].name].isNearby;
      const nearbyHint = isNearby ? ' (⭐ 근처에 나타남!)' : '';
      
      rangeMeet.now = Math.min(res[res.length - 1].dist, rangeMeet.max) | 0;
      markerRange.setRadius(rangeMeet.now);
      
      el.info.innerHTML = `현재 위치에서 가장 가까운 생물은 ${res[0].dist | 0}m 떨어져 있는 『<span class="creat">${name}</span>』입니다${nearbyHint}. ${rangeMeet.now}m 안으로 가까이 다가가면 만날 수 있습니다. ${toMeet}`;
      
      // 버튼 이벤트 재설정
      const buttons = el.info.querySelectorAll('.sbutton');
      buttons.forEach(bt => bt.onclick = onCreatureClick);
    }
    
    function goThere(latlng) {
      latlngHere = latlng;
      map.setView(latlngHere, map.getZoom());
      markerRange.setLatLng(latlngHere);
      markerHere.setLatLng(latlngHere);
      displayInfo();
    }
    
    function trace(position) {
      const newLatlng = [position.coords.latitude, position.coords.longitude];
      
      // 최초 위치 추적 시 생물 배치 (위치 업데이트 전에 먼저 실행)
      if (isFirstTrace) {
        isFirstTrace = false;
        // 먼저 latlngHere를 업데이트 (placeRandomCreaturesNearby에서 사용)
        latlngHere = newLatlng;
        placeRandomCreaturesNearby();
      }
      
      goThere(newLatlng);
    }
    
    function errorTrace() {
      isTraceOn = false;
      console.error('Trace error');
      el.info.innerHTML = '스마트폰의 설정에서 브라우저의 위치 정보 사용을 켰는지 확인해 보세요.';
    }
    
    // ============================================================
    // Three.js AR 관련 함수
    // ============================================================
    function initThreeScene() {
      // 카메라
      camera = new THREE.PerspectiveCamera(
        40, 
        window.innerWidth / window.innerHeight, 
        1, 
        3000
      );
      camera.position.z = 6;
      
      // 씬
      scene = new THREE.Scene();
      
      // 렌더러
      renderer = new THREE.WebGLRenderer({ 
        alpha: true, 
        antialias: true 
      });
      
      // 모바일 최적화: 픽셀 비율 제한
      const pixelRatio = Math.min(window.devicePixelRatio, 2);
      renderer.setPixelRatio(pixelRatio);
      renderer.setSize(window.innerWidth, window.innerHeight);
      
      el.webgl.appendChild(renderer.domElement);
    }
    
    async function initCamera() {
      if (isVideoInitiated) return;
      
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          audio: false,
          video: { facingMode: 'environment' }
        });
        
        el.videoBg.srcObject = stream;
        await el.videoBg.play();
        isVideoInitiated = true;
        
      } catch (error) {
        console.error('Camera error:', error);
        alert('카메라 접근 권한이 필요합니다.');
      }
    }
    
    async function loadCreature(name) {
      showLoading(true);
      
      // 기존 생물 제거
      if (creatureMesh) {
        scene.remove(creatureMesh);
        if (creatureMesh.geometry) creatureMesh.geometry.dispose();
        if (creatureMesh.material) {
          if (creatureMesh.material.map) creatureMesh.material.map.dispose();
          creatureMesh.material.dispose();
        }
        creatureMesh = null;
      }
      
      const spot = dicSpots[name];
      
      if (!spot || !spot.file) {
        console.warn('Asset not found for:', name);
        showLoading(false);
        return;
      }
      
      // spot.file을 직접 사용
      await createCreatureMesh(`./25_creatures/assets/kj/${spot.file.normalize('NFC')}`, spot);
      
      showLoading(false);
    }
    
    async function createCreatureMesh(url, spot) {
      return new Promise((resolve, reject) => {
        const loader = new THREE.TextureLoader();
        
        loader.load(
          url,
          (texture) => {
            // 1024x1024 텍스처에 밉맵 생성
            texture.generateMipmaps = true;
            texture.minFilter = THREE.LinearMipmapLinearFilter;
            texture.magFilter = THREE.LinearFilter;
            
            // 투명도 처리
            const material = new THREE.MeshBasicMaterial({
              map: texture,
              transparent: true,
              alphaTest: 0.5,
              side: THREE.DoubleSide
            });
            
            // Quad 생성 (1:1 비율, 화면에 맞게 크기 조정)
            // 카메라 FOV와 거리를 고려하여 화면의 60-70% 정도 차지하도록
            const size = 1.5;
            const geometry = new THREE.PlaneGeometry(size, size);
            
            creatureMesh = new THREE.Mesh(geometry, material);
            scene.add(creatureMesh);
            
            resolve();
          },
          undefined,
          (error) => {
            console.error('Texture loading error:', error);
            reject(error);
          }
        );
      });
    }
    
    function showLoading(show) {
      el.loading.style.display = show ? 'block' : 'none';
    }
    
    function animateCreature() {
      if (!creatureMesh) return;
      
      const time = elapsedTime / 1000;
      
      // Y축 회전
      creatureMesh.rotation.y = 0.2 * Math.PI * Math.sin(time);
      
      // 상하 움직임
      const k = 0.5 + 0.5 * Math.sin(time * 4);
      creatureMesh.position.y = k * k * 0.2 - 0.2;
    }
    
    function render3D() {
      animateCreature();
      renderer.render(scene, camera);
    }
    
    // ============================================================
    // 뷰 모드 전환
    // ============================================================
    function changeViewMode(mode) {
      if (mode === 'map') {
        el.stage.style.display = 'none';
        el.map.style.display = 'block';
        if (el.videoBg.srcObject) {
          el.videoBg.pause();
        }
      } else if (mode === '3d') {
        if (!isVideoInitiated) {
          initCamera();
        }
        el.stage.style.display = 'block';
        el.map.style.display = 'none';
        if (el.videoBg.srcObject) {
          el.videoBg.play();
        }
      }
    }
    
    // ============================================================
    // 이벤트 핸들러
    // ============================================================
    async function onCreatureClick(e) {
      if (e.target.className !== 'sbutton') return;
      
      // 버튼 텍스트에서 이모지 제거하여 생물명만 추출
      const displayName = e.target.textContent.replace('⭐ ', '').trim();
      console.log('Meet creature:', displayName);
      
      // dicSpots에서 해당 생물 찾기 (전체 이름으로 저장되어 있음)
      let spot = null;
      for (const key in dicSpots) {
        const s = dicSpots[key];
        const creatureName = s.name.includes('_') ? s.name.split('_')[1] : s.name;
        if (creatureName === displayName) {
          spot = s;
          break;
        }
      }
      
      if (!spot) {
        console.error('Spot not found for:', displayName);
        return;
      }
      
      changeViewMode('3d');
      
      // 생물 정보 표시
      const emos = '🙀,🚀,🌀,🦋,🛸,🜀,🝀,🞀,🦠,🌸,💖,💚,🍓,🧸,🌕,🌧,💧,🌪,⭐,🦀,🍄,🌹,🌱,🌷,🌻,🍀,🐠,🦐,🤖,🏹,🍼'.split(',');
      const emo = emos[Math.random() * emos.length | 0];
      
      // file에서 작가명 추출 (예: "오유리_춤추는 뽀글뽀글 뽀글이.png" -> "오유리")
      let author = '';
      if (spot.name && spot.name.includes('_')) {
        author = spot.name.split('_')[0];
        if (author.length > 1) {
          author = author[0] + emo + author.slice(2);
        }
      }
      
      const profileText = spot.file 
        ? `${displayName}${Josa.c(displayName, '이/가')} 나타났다!`
        : `${displayName}${Josa.c(displayName, '은/는')} 아직 준비중!`;
      
      el.profile.innerHTML = `${profileText} ${author ? `<div class="t-right">- ${author}</div>` : ''}`;
      el.dialog.innerHTML = `${displayName}${Josa.c(displayName, '은/는')}... <br>${spot.desc}`;
      
      // 생물 로드 (전체 이름으로 전달)
      await loadCreature(spot.name);
    }
    
    el.traceOn.onclick = () => {
      isTraceOn = true;
      navigator.geolocation.getCurrentPosition(trace, errorTrace);
    };
    
    el.stage.onclick = () => {
      changeViewMode('map');
    };
    
    window.onresize = () => {
      if (camera && renderer) {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      }
    };
    
    // ============================================================
    // 메인 루프
    // ============================================================
    function loop(timestamp) {
      if (timestamp) {
        const diffTime = timestamp - pastTimestamp;
        elapsedTime += diffTime;
        pastTimestamp = timestamp;
        
        if (isTraceOn) {
          periodics.trace.update(diffTime);
        }
        
        if (el.stage.style.display === 'block') {
          render3D();
        }
      }
      
      requestAnimationFrame(loop);
    }
    
    // ============================================================
    // 초기화
    // ============================================================
    function init() {
      const params = new URLSearchParams(location.search.slice(1));
      let desc = `<strong>신기한 생물들이 주변에 나타났습니다!</strong><br><br>『현재 위치』 버튼을 눌러 가까운 생물을 만나보세요.<br><br><small>버튼을 누른 후 '위치 정보'와 '카메라' 사용 권한을 허용해주세요.</small>`;
      
      switch (params.get('w')) {
        case 'H1_5l6g':
          desc = `시험판: 이야기가 있는 보물 찾기에서 얻은 스티커가 있는 경우입니다. '현재 위치' 버튼을 클릭해 보세요!<br><br>버튼을 누른 후 '위치 정보'와 '카메라' 사용 권한을 수락해 주셔야 작동합니다.`;
          break;
      }
      
      switch (params.get('k')) {
        case '4545':
          desc = `가능한가!?`;
          break;
      }
      
      el.info.innerHTML = desc;
      
      initMap();
      initThreeScene();
      loop();
    }
    
    window.onload = init;
  </script>
</body>
</html>
