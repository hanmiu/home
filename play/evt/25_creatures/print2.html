  .slider-container input[type="range"]::-moz-range-thumb:hover{background:#357abd}

</head>
<body>
<header>
  <div class="controls-row">
    <button id="prev">◀ 이전</button>
    <button id="next">다음 ▶</button>
    <label>basename: <input id="base" size="28" placeholder="예) 김연우_달 디테일"/></label>
  </div>
  <div class="controls-row">
    <label>cell(px): <input id="cell" type="number" value="150" min="80" max="220" step="2"/></label>
  </div>
  <div class="controls-row">
    <button id="render">렌더</button>
    <button id="save">JPG 저장</button>

  <div class="border-controls">

    <label><input type="checkbox" id="borderRight" checked /> 우측</label>
    <label><input type="checkbox" id="borderBottom" checked /> 하단</label>
    <label><input type="checkbox" id="borderLeft" checked /> 좌측</label>

    <span style="font-weight:600;min-width:60px">탐색:</span>
    <input type="range" id="slider" min="0" max="0" value="0" step="1" />
    <span class="slider-info" id="sliderInfo">1 / 1</span>
  </div>
  <span class="hint">카드 사이즈: 89mm x 127mm (2102 x 3000px @600dpi) | 키보드 ← → 로 이동</span>
</header>
<main>
  <canvas id="card"></canvas>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script type="module">
// ============================================================
// CONFIG
// ============================================================
const CONFIG = {
  DPI: 600,
  PAPER: { W: 2102, H: 3000 }, // 89mm x 127mm @600dpi
  PAD_MM: 3,                    // 전역 테두리 패딩
  CELL_S: 150,                  // 보더 한 셀 정사각 크기(px)
  INNER_PAD: 6,                 // 각 셀 내부 여백(px) 5~7 권장
  GRID: { COLS: 11, ROWS: 15 }, // 개념상 그리드(보더 뜯어 사용)
  ASSETS_BASE: './assets/',
  TSV_URL: './data/data.tsv',
  SVG_LOGO_PATH: './front/strange_creatures.svg',
  QR_URL: 'https://www.hanmiu.cc/play/evt/c2025.html',
  QR_SIZE_MM: 13,
  SALT: '25_creatures_v1',
};

// ============================================================
// Utility Functions
// ============================================================
function mm2px(mm, dpi = CONFIG.DPI) {
  return Math.round(mm * dpi / 25.4);
}

const PAD = mm2px(CONFIG.PAD_MM);
const WORK_W = CONFIG.PAPER.W - 2 * PAD;
const WORK_H = CONFIG.PAPER.H - 2 * PAD;

// PRNG
function mulberry32(a) {
  return function() {
    a |= 0;
    a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function shuffleDeterministic(list, seed) {
  const rnd = mulberry32(seed);
  const a = list.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rnd() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

async function sha256hex(s) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
}

async function seedFrom(basename, salt = CONFIG.SALT) {
  const hex = await sha256hex((basename || '') + '|' + salt);
  return parseInt(hex.slice(0, 8), 16) >>> 0;
}

// TSV parsing
function parseTSVRecords(text) {
  const lines = text.split(/\r?\n/).filter(Boolean);
  if (lines.length === 0) return { bases: [], records: [], byBase: new Map() };
  
  const header = lines.shift().split(/\t/).map(h => h.trim());
  const idx = (name) => header.findIndex(h => h === name);
  const iFile = idx('file');
  
  if (iFile === -1) throw new Error('TSV에 file 컬럼이 필요합니다');
  
  const records = [];
  const bases = [];
  const byBase = new Map();
  
  for (const ln of lines) {
    const cols = ln.split(/\t/);
    const file = (cols[iFile] || '').trim();
    if (!file) continue;
    
    const base = file.replace(/\.png$/i, '').normalize('NFC').trim();
    const rec = { base, file };
    records.push(rec);
    bases.push(base);
    byBase.set(base, rec);
  }
  
  return { bases, records, byBase };
}

function computeFilename(index, record, ext) {
  const pad = String(index + 1).padStart(3, '0');
  const safe = (record?.base || 'unknown').replace(/[\/\\:*?"<>|]/g, '_');
  return `card_${pad}_${safe}.${ext}`;
}

function assetUrl(basename, base = CONFIG.ASSETS_BASE) {
  return base + encodeURIComponent(basename + '.png');
}

async function loadImage(src) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => resolve(img);
    img.onerror = () => reject(new Error(`Failed to load: ${src}`));
    img.src = src;
  });
}

function getBoundingBox(img) {
  const canvas = document.createElement('canvas');
  canvas.width = img.width;
  canvas.height = img.height;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(img, 0, 0);
  const data = ctx.getImageData(0, 0, img.width, img.height).data;
  
  let minX = img.width, minY = img.height, maxX = 0, maxY = 0;
  
  for (let y = 0; y < img.height; y++) {
    for (let x = 0; x < img.width; x++) {
      const i = (y * img.width + x) * 4;
      const alpha = data[i + 3];
      if (alpha > 10) {
        if (x < minX) minX = x;
        if (x > maxX) maxX = x;
        if (y < minY) minY = y;
        if (y > maxY) maxY = y;
      }
    }
  }
  
  if (maxX < minX || maxY < minY) {
    return { x: 0, y: 0, width: img.width, height: img.height };
  }
  
  return {
    x: minX,
    y: minY,
    width: maxX - minX + 1,
    height: maxY - minY + 1
  };
}

// ============================================================
// Grid Border System
// ============================================================
function gridMetrics(cellS = CONFIG.CELL_S) {
  const s = cellS;
  const gx = Math.round((WORK_W - CONFIG.GRID.COLS * s) / (CONFIG.GRID.COLS - 1));
  const gy = Math.round((WORK_H - CONFIG.GRID.ROWS * s) / (CONFIG.GRID.ROWS - 1));
  return { s, gx, gy };
}

function borderXY(side, idx, m) {
  const { s, gx, gy } = m;
  const W = CONFIG.PAPER.W;
  const H = CONFIG.PAPER.H;
  const pad = PAD;
  
  switch (side) {
    case 'top':
      return [pad + idx * (s + gx), pad];
    case 'right':
      return [W - pad - s, pad + idx * (s + gy)];
    case 'bottom':
      return [W - pad - s - idx * (s + gx), H - pad - s];
    case 'left':
      return [pad, H - pad - s - idx * (s + gy)];
    default:
      return [0, 0];
  }
}

function effectiveSlotCounts(sides) {
  const COLS = CONFIG.GRID.COLS;
  const ROWS = CONFIG.GRID.ROWS;
  
  return {
    top: sides.top ? COLS : 0,
    right: sides.right ? ROWS - (sides.top ? 1 : 0) - (sides.bottom ? 1 : 0) : 0,
    bottom: sides.bottom ? COLS : 0,
    left: sides.left ? ROWS - (sides.bottom ? 1 : 0) - (sides.top ? 1 : 0) : 0,
  };
}

function borderXYNoOverlap(side, idx, sides, m) {
  const skipTop = sides.top ? 1 : 0;
  const skipBottom = sides.bottom ? 1 : 0;
  
  switch (side) {
    case 'top':
      return borderXY('top', idx, m);
    case 'right':
      return borderXY('right', idx + skipTop, m);
    case 'bottom':
      return borderXY('bottom', idx, m);
    case 'left':
      return borderXY('left', idx + skipBottom, m);
    default:
      return [0, 0];
  }
}

function pickBordersBySide(allBases, mainBase, seed, sides = { top: true, right: true, bottom: true, left: true }) {
  const list = allBases.filter(b => b !== mainBase);
  const sh = shuffleDeterministic(list, seed);
  const cnt = effectiveSlotCounts(sides);
  
  let off = 0;
  const result = { top: [], right: [], bottom: [], left: [] };
  
  if (sides.top && cnt.top) {
    result.top = sh.slice(off, off + cnt.top);
    off += cnt.top;
  }
  if (sides.right && cnt.right) {
    result.right = sh.slice(off, off + cnt.right);
    off += cnt.right;
  }
  if (sides.bottom && cnt.bottom) {
    result.bottom = sh.slice(off, off + cnt.bottom);
    off += cnt.bottom;
  }
  if (sides.left && cnt.left) {
    result.left = sh.slice(off, off + cnt.left);
    off += cnt.left;
  }
  
  return result;
}

// ============================================================
// Draw Card Function
// ============================================================
async function drawCard({
  canvas,
  basename,
  allBasenames,
  record = null,
  drawQR = true,
  drawBorders = true,
  borderSides = { top: true, right: true, bottom: true, left: true }
}) {
  const ctx = canvas.getContext('2d');
  const { W, H } = CONFIG.PAPER;
  
  canvas.width = W;
  canvas.height = H;
  
  // Background
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, W, H);
  
  // Calculate metrics and borders
  const metrics = gridMetrics(CONFIG.CELL_S);
  const seed = await seedFrom(basename);
  const borders = pickBordersBySide(allBasenames, basename, seed, borderSides);
  
  // Load images in parallel
  const mainImgP = loadImage(assetUrl(basename));
  const svgLogoP = loadImage(CONFIG.SVG_LOGO_PATH).catch(e => null);
  
  // Layout measurements with better spacing
  const topBorderHeight = borderSides.top ? metrics.s : 0;
  const svgLogoTop = PAD + topBorderHeight + 80;  // 여백 증가
  const svgLogoMaxHeight = 220;
  const svgLogoMaxWidth = W * 0.75;
  
  // Draw SVG logo at top
  const svgLogo = await svgLogoP;
  let svgLogoBottom = svgLogoTop;
  
  if (svgLogo) {
    const aspectRatio = svgLogo.width / svgLogo.height;
    const logoW = svgLogoMaxWidth;
    const logoH = logoW / aspectRatio;
    const actualLogoH = Math.min(logoH, svgLogoMaxHeight);
    const actualLogoW = actualLogoH * aspectRatio;
    const logoX = (W - actualLogoW) / 2;
    
    ctx.drawImage(svgLogo, logoX, svgLogoTop + 50, actualLogoW, actualLogoH);
    svgLogoBottom = svgLogoTop + actualLogoH;
  }
  
  // Draw main image with better spacing
  const mainImageTop = svgLogoBottom + 100;  // 갭 증가
  const mainImageMaxSize = 880;  // 약간 줄여서 여유 확보
  let mainImageBottom = mainImageTop;
  
  try {
    const mainImg = await mainImgP;
    const bbox = getBoundingBox(mainImg);
    const scale = mainImageMaxSize / Math.max(bbox.width, bbox.height);
    const scaledW = Math.round(mainImg.width * scale);
    const scaledH = Math.round(mainImg.height * scale);
    const scaledBboxH = Math.round(bbox.height * scale);
    
    const bboxCenterX = W / 2;
    const bboxCenterY = mainImageTop + mainImageMaxSize / 2;
    const mainX = Math.round(bboxCenterX - scaledW / 2);
    const mainY = Math.round(bboxCenterY - scaledBboxH / 2 - bbox.y * scale);
    
    ctx.drawImage(mainImg, mainX, mainY + 20, scaledW, scaledH);
    mainImageBottom = bboxCenterY + scaledBboxH / 2;
  } catch (e) {
    console.warn('메인 이미지 로드 실패:', e);
  }
  
  // Draw question mark with better spacing
  const questionY = mainImageBottom + 170;  // 갭 조정
  ctx.fillStyle = '#333333';
  ctx.font = 'bold 140px "Noto Sans KR", sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  ctx.fillText('?', W / 2, questionY);
  
  // Draw instruction text with better spacing
  const instructionY = questionY + 270;  // 갭 조정
  ctx.font = '54px "Noto Sans KR", sans-serif';
  ctx.fillStyle = '#444444';
  const lineHeight = 38 * 1.4 * 2;
  
  ctx.fillText('아래 QR 코드를 스마트폰으로 찍어', W / 2, instructionY);
  ctx.fillText('신기한 생물을 찾아주세요!', W / 2, instructionY + lineHeight);
  
  // Draw QR code with better spacing
  if (drawQR) {
    const qrY = instructionY + lineHeight * 2 + 60;  // 갭 증가
    const qrSize = mm2px(CONFIG.QR_SIZE_MM);
    
    const tempDiv = document.createElement('div');
    tempDiv.style.position = 'absolute';
    tempDiv.style.left = '-9999px';
    document.body.appendChild(tempDiv);
    
    try {
      new QRCode(tempDiv, {
        text: CONFIG.QR_URL,
        width: qrSize,
        height: qrSize,
        colorDark: '#000000',
        colorLight: '#ffffff',
        correctLevel: QRCode.CorrectLevel.M
      });
      
      await new Promise(resolve => setTimeout(resolve, 100));
      
      const qrCanvas = tempDiv.querySelector('canvas');
      if (qrCanvas) {
        const qrX = (W - qrSize) / 2;
        ctx.drawImage(qrCanvas, qrX, qrY, qrSize, qrSize);
      }
    } catch (e) {
      console.error('QR 생성 실패:', e);
    } finally {
      document.body.removeChild(tempDiv);
    }
  }
  
  // Draw footer logo (한미유치원) using Path2D - CENTER ALIGNED
  const logoPath = new Path2D('M26.405471,23.244963C26.405471,23.244963 26.880837,26.114323 27.220195,29.950259 M37.189743,48.338714C37.189743,43.724875 33.062148,39.980291 27.979476,39.980291L24.830489,39.980291C19.746433,39.980291 15.620222,43.724875 15.620222,48.338714C15.620222,52.952553 19.746433,56.697136 24.830489,56.697136L27.979476,56.697136C33.062148,56.697136 37.189743,52.952553 37.189743,48.338714Z M54.945547,23.241356L54.945547,60.041296 M11.354173,29.950091L41.454242,29.950091 M18.038490,66.729916C18.038490,71.342105 16.821848,76.787099 25.890786,76.759868L58.120517,76.759868 M54.944924,43.324091L64.902262,43.324091 M262.922953,59.077087C262.922953,59.077087 263.527444,55.428316 263.958983,50.550415 M273.706943,31.599714C273.706943,26.985875 269.579348,23.241291 264.496676,23.241291L261.347689,23.241291C256.263633,23.241291 252.137422,26.985875 252.137422,31.599714C252.137422,36.213553 256.263633,39.958136 261.347689,39.958136L264.496676,39.958136C269.579348,39.958136 273.706943,36.213553 273.706943,31.599714Z M253.685090,66.729916C253.685090,71.342105 252.468448,76.787099 261.537386,76.759868L293.767117,76.759868 M292.293457,23.241356L292.293457,63.406550 M282.312224,57.379091L292.269562,57.379091 M246.855598,50.011786C262.999964,50.801475 272.258382,51.403953 280.394670,46.668091 M171.459341,34.570717C171.459341,28.397029 166.277669,23.386474 159.897018,23.386474L155.943864,23.386474C149.561476,23.386474 144.381541,28.397029 144.381541,34.570717C144.381541,40.744406 149.561476,45.754960 155.943864,45.754960L159.897018,45.754960C166.277669,45.754960 171.459341,40.744406 171.459341,34.570717Z M151.172657,76.708062C151.172657,62.098824 152.196076,54.288169 142.886601,53.984093C135.823653,53.753768 132.046537,49.789440 131.672115,45.755902 M164.606474,76.760062C164.606474,62.150824 163.644324,54.340169 172.953799,54.036093C180.016747,53.805768 183.793863,50.522206 184.168285,46.488668 M206.677144,26.649414C206.677144,26.649414 208.893038,40.001504 206.677144,46.092091C204.446501,52.221254 193.313708,63.261009 193.295554,63.428931 M206.674734,46.092091L220.042709,63.428931 M233.418747,23.263356L233.418747,73.416521 M193.295311,33.337091L220.043742,33.337091 M117.554547,23.263356L117.554547,73.416521 M77.430841,29.950134L100.398687,29.950134L100.398687,63.385425L77.430841,63.385425Z');
  // Path2D 바운딩 박스: x: 11~293 (width: 282), y: 23~77 (height: 54)
  const logoScale = 1.2;
  const logoPathWidth = 282 * logoScale;
  const logoPathHeight = 54 * logoScale;
  const bottomBorderHeight = borderSides.bottom ? metrics.s : 0;
  const logoX = W / 2;  // 가운데 정렬
  const logoY = H - PAD - bottomBorderHeight - mm2px(4);  // 하단에서 적절한 여백
  
  ctx.save();
  ctx.translate(logoX, logoY);
  ctx.scale(logoScale, logoScale);
  ctx.translate(-152, -50);  // 경로 중심점으로 이동 (대략 (11+293)/2 ≈ 152, (23+77)/2 ≈ 50)
  ctx.lineWidth = mm2px(0.2);
  ctx.lineCap = 'round';
  ctx.strokeStyle = 'black';
  ctx.stroke(logoPath);
  ctx.restore();
  
  // Draw borders
  if (drawBorders) {
    const cellPad = CONFIG.INNER_PAD;
    const s = metrics.s - cellPad * 2;
    const borderPromises = [];
    
    for (const [side, items] of Object.entries(borders)) {
      items.forEach((base, i) => {
        const p = loadImage(assetUrl(base)).then(img => {
          const [x, y] = borderXYNoOverlap(side, i, borderSides, metrics);
          ctx.drawImage(img, x + cellPad, y + cellPad, s, s);
        }).catch(e => console.warn('보더 이미지 오류:', base, e));
        borderPromises.push(p);
      });
    }
    
    await Promise.all(borderPromises);
  }
}

// ============================================================
// Main Application
// ============================================================
const $ = (s) => document.querySelector(s);
const baseInput = $('#base');
const cellInput = $('#cell');
const canvas = $('#card');

// Border checkboxes
const borderTop = $('#borderTop');
const borderRight = $('#borderRight');
const borderBottom = $('#borderBottom');
const borderLeft = $('#borderLeft');

// Slider
const slider = $('#slider');
const sliderInfo = $('#sliderInfo');

// Load TSV
const tsv = await (await fetch(CONFIG.TSV_URL, { cache: 'reload' })).text();
const { bases, records, byBase } = parseTSVRecords(tsv);
let currentIndex = 0;

// Initialize slider
slider.max = Math.max(0, bases.length - 1);
slider.value = 0;
sliderInfo.textContent = `1 / ${bases.length || 1}`;

// Initial values
baseInput.value = bases[currentIndex] || '';

// Render synchronization
let renderTask = Promise.resolve();

function getBorderSides() {
  return {
    top: borderTop.checked,
    right: borderRight.checked,
    bottom: borderBottom.checked,
    left: borderLeft.checked
  };
}

async function doRender() {
  const basename = baseInput.value.trim();
  CONFIG.CELL_S = Math.max(80, Math.min(220, parseInt(cellInput.value || 150, 10)));
  
  await drawCard({
    canvas,
    basename,
    allBasenames: bases,
    record: byBase.get(basename) || null,
    drawQR: true,
    drawBorders: true,
    borderSides: getBorderSides()
  });
}

function render() {
  renderTask = doRender();
  return renderTask;
}

async function loadByIndex(index) {
  if (index < 0 || index >= bases.length) return;
  currentIndex = index;
  baseInput.value = bases[currentIndex];
  slider.value = currentIndex;
  sliderInfo.textContent = `${currentIndex + 1} / ${bases.length}`;
  return render();
}

// Navigation
$('#prev').addEventListener('click', () => loadByIndex(currentIndex - 1));
$('#next').addEventListener('click', () => loadByIndex(currentIndex + 1));

document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft') {
    e.preventDefault();
    loadByIndex(currentIndex - 1);
  } else if (e.key === 'ArrowRight') {
    e.preventDefault();
    loadByIndex(currentIndex + 1);
  }
});

// Slider events
slider.addEventListener('input', () => {
  const index = parseInt(slider.value, 10);
  sliderInfo.textContent = `${index + 1} / ${bases.length}`;
});

slider.addEventListener('change', () => {
  const index = parseInt(slider.value, 10);
  loadByIndex(index);
});

// Manual render
$('#render').addEventListener('click', render);

// Border checkbox changes trigger auto-render
borderTop.addEventListener('change', render);
borderRight.addEventListener('change', render);
borderBottom.addEventListener('change', render);
borderLeft.addEventListener('change', render);

// basename input sync
baseInput.addEventListener('input', () => {
  const idx = bases.indexOf(baseInput.value.trim());
  if (idx !== -1) {
    currentIndex = idx;
    slider.value = idx;
    sliderInfo.textContent = `${idx + 1} / ${bases.length}`;
  }
});

// Initial render
await render();

// Single save (JPEG)
$('#save').addEventListener('click', async () => {
  await renderTask;
  canvas.toBlob((blob) => {
    const a = document.createElement('a');
    const rec = records[currentIndex] || byBase.get(baseInput.value.trim());
    const filename = computeFilename(currentIndex, rec, 'jpg');
    a.download = filename;
    a.href = URL.createObjectURL(blob);
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }, 'image/jpeg', 0.95);
});

// Batch save
$('#batchSave').addEventListener('click', async () => {
  const btn = $('#batchSave');
  const originalText = btn.textContent;
  btn.disabled = true;
  
  try {
    for (let i = 0; i < bases.length; i++) {
      btn.textContent = `저장 중... ${i + 1}/${bases.length}`;
      await loadByIndex(i);
      await renderTask;
      
      await new Promise((resolve) => {
        canvas.toBlob((blob) => {
          const a = document.createElement('a');
          const filename = computeFilename(i, records[i], 'jpg');
          a.download = filename;
          a.href = URL.createObjectURL(blob);
          a.click();
          setTimeout(() => {
            URL.revokeObjectURL(a.href);
            resolve();
          }, 250);
        }, 'image/jpeg', 0.95);
      });
    }
    
    btn.textContent = '✅ 완료!';
    setTimeout(() => {
      btn.textContent = originalText;
      btn.disabled = false;
    }, 1200);
  } catch (e) {
    alert('배치 저장 중 오류: ' + e.message);
    btn.textContent = originalText;
    btn.disabled = false;
  }
});
</script>
</body>
</html>
