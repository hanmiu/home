<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Creatures Card — Print</title>
<style>
  body{margin:0;background:#111;color:#eee;font-family:"Noto Sans KR",system-ui,sans-serif}
  header{padding:12px 16px;display:flex;gap:8px;align-items:center;background:#1c1c1c;position:sticky;top:0;flex-wrap:wrap}
  header input, header select, header button{font-size:14px;padding:6px 8px;border-radius:6px;border:1px solid #333;background:#222;color:#eee}
  #prev, #next{background:#334;font-weight:700;cursor:pointer}
  #prev:hover, #next:hover{background:#445}
  #batchSave{background:#433;font-weight:700}
  #batchSave:hover:not(:disabled){background:#544}
  #batchSave:disabled{opacity:0.6;cursor:not-allowed}
  main{padding:16px;display:grid;gap:16px;grid-template-columns:1fr;max-width:1080px;margin:0 auto}
  canvas{width:600px;max-width:100%;height:auto;background:#fff;box-shadow:0 10px 30px rgba(0,0,0,.4)}
  .hint{opacity:.8;font-size:13px}
  .border-controls{display:flex;gap:12px;align-items:center;padding:8px 12px;background:#252525;border-radius:6px;margin-top:8px}
  .border-controls label{display:flex;align-items:center;gap:4px;font-size:13px;cursor:pointer}
  .border-controls input[type="checkbox"]{cursor:pointer;width:16px;height:16px}
  .controls-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .slider-container{display:flex;gap:12px;align-items:center;padding:8px 12px;background:#252525;border-radius:6px;margin-top:8px;width:100%}
  .slider-container input[type="range"]{flex:1;height:8px;border-radius:4px;background:#444;outline:none;-webkit-appearance:none;appearance:none}
  .slider-container input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:20px;height:20px;border-radius:50%;background:#4a90e2;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.3)}
  .slider-container input[type="range"]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:#4a90e2;cursor:pointer;border:none;box-shadow:0 2px 6px rgba(0,0,0,.3)}
  .slider-container input[type="range"]::-webkit-slider-thumb:hover{background:#357abd}
  .slider-container input[type="range"]::-moz-range-thumb:hover{background:#357abd}
  .slider-info{font-size:13px;color:#bbb;min-width:80px;text-align:right}
</style>
</head>
<body>
<header>
  <div class="controls-row">
    <button id="prev">◀ 이전</button>
    <button id="next">다음 ▶</button>
    <label>basename: <input id="base" size="28" placeholder="예) 김연우_달 디테일"/></label>
    <label>code: <input id="code" size="28" placeholder="auto"/></label>
  </div>
  <div class="controls-row">
    <label>cell(px): <input id="cell" type="number" value="150" min="80" max="220" step="2"/></label>
    <label>QR base: <input id="qrbase" size="36" placeholder="기본값: https://www.hanmiu.cc/play/evt/25_creatures/card.html"/></label>
  </div>
  <div class="controls-row">
    <button id="render">렌더</button>
    <button id="save">JPG 저장</button>
    <button id="batchSave">🔄 전체 JPG 저장</button>
  </div>
  <div class="border-controls">
    <span style="font-weight:600">보더 표시:</span>
    <label>
      <input type="checkbox" id="borderTop" checked />
      상단
    </label>
    <label>
      <input type="checkbox" id="borderRight" checked />
      우측
    </label>
    <label>
      <input type="checkbox" id="borderBottom" checked />
      하단
    </label>
    <label>
      <input type="checkbox" id="borderLeft" checked />
      좌측
    </label>
  </div>
  <div class="slider-container">
    <span style="font-weight:600;min-width:60px">탐색:</span>
    <input type="range" id="slider" min="0" max="0" value="0" step="1" />
    <span class="slider-info" id="sliderInfo">1 / 1</span>
  </div>
  <span class="hint">카드 사이즈: 89mm x 127mm (2102 x 3000px @600dpi) | 키보드 ← → 로 이동</span>
</header>
<main>
  <canvas id="card"></canvas>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script type="module">
import { CONFIG, parseTSV, shortCode, fromShortCode, drawCard } from './layout.js';

const $ = (s)=>document.querySelector(s);
const baseInput = $('#base');
const codeInput = $('#code');
const cellInput = $('#cell');
const canvas = $('#card');

// 보더 체크박스
const borderTop = $('#borderTop');
const borderRight = $('#borderRight');
const borderBottom = $('#borderBottom');
const borderLeft = $('#borderLeft');

// 슬라이더
const slider = $('#slider');
const sliderInfo = $('#sliderInfo');

// TSV 로드
const tsv = await (await fetch(CONFIG.TSV_URL, {cache:'reload'})).text();
const bases = parseTSV(tsv);
let currentIndex = 0;

// 슬라이더 초기화
slider.max = bases.length - 1;
slider.value = 0;
sliderInfo.textContent = `1 / ${bases.length}`;

// 초기 값
baseInput.value = bases[currentIndex] || '';
codeInput.value = baseInput.value ? await shortCode(baseInput.value) : '';

async function render(){
  const basename = baseInput.value.trim();
  CONFIG.CELL_S = Math.max(80, Math.min(220, parseInt(cellInput.value||150,10)));
  
  // 보더 사이드 설정
  const borderSides = {
    top: borderTop.checked,
    right: borderRight.checked,
    bottom: borderBottom.checked,
    left: borderLeft.checked
  };
  
  // QR 코드는 항상 배포된 URL을 사용
  const defaultQrBase = 'https://www.hanmiu.cc/play/evt/25_creatures/card.html';
  const inputBase = (document.getElementById('qrbase').value || '').trim();
  const qrBase = inputBase || defaultQrBase;
  const code = await shortCode(basename);
  const url = qrBase + '?code=' + code;
  
  await drawCard({
    canvas, 
    basename, 
    allBasenames:bases, 
    drawQR:true, 
    qrUrl:url, 
    drawBorders:true,
    borderSides
  });
}

async function loadByIndex(index){
  if(index < 0 || index >= bases.length) return;
  currentIndex = index;
  baseInput.value = bases[currentIndex];
  codeInput.value = await shortCode(baseInput.value);
  slider.value = currentIndex;
  sliderInfo.textContent = `${currentIndex + 1} / ${bases.length}`;
  await render();
}

// 네비게이션
$('#prev').addEventListener('click', ()=>loadByIndex(currentIndex - 1));
$('#next').addEventListener('click', ()=>loadByIndex(currentIndex + 1));

// 키보드 화살표키 네비게이션
document.addEventListener('keydown', (e)=>{
  if(e.key === 'ArrowLeft'){
    e.preventDefault();
    loadByIndex(currentIndex - 1);
  } else if(e.key === 'ArrowRight'){
    e.preventDefault();
    loadByIndex(currentIndex + 1);
  }
});

// 슬라이더 이벤트
slider.addEventListener('input', ()=>{
  const index = parseInt(slider.value, 10);
  sliderInfo.textContent = `${index + 1} / ${bases.length}`;
});

slider.addEventListener('change', ()=>{
  const index = parseInt(slider.value, 10);
  loadByIndex(index);
});

// 수동 렌더
$('#render').addEventListener('click', render);

// 보더 체크박스 변경 시 자동 렌더
borderTop.addEventListener('change', render);
borderRight.addEventListener('change', render);
borderBottom.addEventListener('change', render);
borderLeft.addEventListener('change', render);

// basename↔code 동기화
baseInput.addEventListener('input', async ()=>{ 
  codeInput.value = await shortCode(baseInput.value);
  // 현재 인덱스 업데이트
  const idx = bases.indexOf(baseInput.value.trim());
  if(idx !== -1) {
    currentIndex = idx;
    slider.value = idx;
    sliderInfo.textContent = `${idx + 1} / ${bases.length}`;
  }
});
codeInput.addEventListener('input', async ()=>{ 
  try{ 
    const code = codeInput.value.trim();
    const basename = await fromShortCode(code, bases);
    if(basename) {
      baseInput.value = basename;
      const idx = bases.indexOf(basename);
      if(idx !== -1) {
        currentIndex = idx;
        slider.value = idx;
        sliderInfo.textContent = `${idx + 1} / ${bases.length}`;
      }
    }
  }catch{}
});

await render();

// 단일 저장(JPEG)
$('#save').addEventListener('click', async ()=>{
  canvas.toBlob((blob)=>{
    const a=document.createElement('a');
    const basename = baseInput.value.trim() || 'card';
    a.download = `${basename}.jpg`;
    a.href = URL.createObjectURL(blob);
    a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
  }, 'image/jpeg', 0.95);
});

// 배치 저장
$('#batchSave').addEventListener('click', async ()=>{
  const btn = $('#batchSave');
  const originalText = btn.textContent;
  btn.disabled = true;
  
  try {
    for(let i = 0; i < bases.length; i++){
      btn.textContent = `저장 중... ${i+1}/${bases.length}`;
      
      // 각 basename으로 렌더
      await loadByIndex(i);
      
      // blob 생성 및 다운로드
      await new Promise((resolve) => {
        canvas.toBlob((blob)=>{
          const a = document.createElement('a');
          a.download = `${bases[i]}.jpg`;
          a.href = URL.createObjectURL(blob);
          a.click();
          setTimeout(()=>{
            URL.revokeObjectURL(a.href);
            resolve();
          }, 300); // 각 다운로드 사이에 약간의 딜레이
        }, 'image/jpeg', 0.95);
      });
    }
    
    btn.textContent = '✅ 완료!';
    setTimeout(()=>{
      btn.textContent = originalText;
      btn.disabled = false;
    }, 2000);
  } catch(e) {
    alert('배치 저장 중 오류: ' + e.message);
    btn.textContent = originalText;
    btn.disabled = false;
  }
});
</script>
</body>
</html>
