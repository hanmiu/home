<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>한미유치원 신기한 생물</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { 
      font-family: 'Noto Sans KR', system-ui, sans-serif; 
      background: #f5f5f5;
    }

    /* === CARD 모드 스타일 === */
    .card-mode {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      overflow: hidden;
      transition: filter 1.5s ease-in-out;
    }
    
    /* 배경 도형 레이어 */
    .shapes-background {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }
    
    /* 도형은 WAAPI로만 애니메이션 */
    .shape {
      position: absolute;
      transform-box: fill-box;
      transform-origin: 50% 50%;
      will-change: transform, opacity;
    }
    
    .card-container {
      position: relative;
      z-index: 10;
      background: white;
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      text-align: center;
      max-width: 500px;
      width: 100%;
    }
    .svg-container {
      width: 200px;
      height: 200px;
      margin: 0 auto 30px;
      animation: float 3s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-15px); }
    }
    .svg-container img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .child-name {
      font-size: 36px;
      font-weight: 900;
      color: #333;
      margin-bottom: 10px;
    }
    .welcome-message {
      font-size: 20px;
      color: #666;
      line-height: 1.6;
      margin-bottom: 30px;
    }
    .tts-button {
      background: #667eea;
      color: white;
      border: none;
      padding: 15px 40px;
      font-size: 20px;
      font-weight: 700;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
      transition: all 0.3s;
    }
    .tts-button:hover {
      background: #5568d3;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
    }
    .tts-button:active {
      transform: translateY(0);
    }

    /* === PRINT 모드 스타일 === */
    .print-mode {
      padding: 20px;
    }
    .print-controls {
      text-align: center;
      margin-bottom: 30px;
    }
    .print-button {
      background: #4CAF50;
      color: white;
      border: none;
      padding: 15px 40px;
      font-size: 18px;
      font-weight: 700;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(76, 175, 80, 0.4);
    }
    .print-button:hover {
      background: #45a049;
    }
    .print-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0;
      max-width: 210mm;
      margin: 0 auto;
    }
    .print-card {
      width: 89mm;
      height: 127mm;
      border: 2px solid #333;
      background: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 10mm;
      page-break-inside: avoid;
    }
    .print-card .svg-box {
      width: 60mm;
      height: 60mm;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .print-card .svg-box img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }
    .print-card .name {
      font-size: 28px;
      font-weight: 900;
      color: #333;
      text-align: center;
      margin: 5mm 0;
    }
    .print-card .address {
      font-size: 14px;
      color: #666;
      text-align: center;
      margin-bottom: 5mm;
    }
    .print-card .qr-box {
      width: 22mm;
      height: 22mm;
    }

    /* 인쇄 스타일 */
    @media print {
      body { background: white; }
      .print-controls { display: none !important; }
      .print-grid {
        max-width: 100%;
        gap: 0;
      }
      .print-card {
        border: 1px solid #333;
      }
      @page {
        size: A4;
        margin: 0;
      }
    }

    /* 페이지 나누기 (4개마다) */
    .print-card:nth-child(4n) {
      page-break-after: always;
    }

    /* 숨김 input */
    #barcodeInput {
      position: absolute;
      left: -9999px;
      opacity: 0;
    }

    .error-message {
      text-align: center;
      padding: 40px;
      font-size: 20px;
      color: #e74c3c;
    }
  </style>

    // 이름 → 해시 함수 (확장)
    function nameToHash(name) {
      let sum = 0;
      let product = 1;
      let xorValue = 0;
      let firstChar = name.charCodeAt(0) || 0;
      let lastChar = name.charCodeAt(name.length - 1) || 0;
      
      for (let i = 0; i < name.length; i++) {
        const code = name.charCodeAt(i);
        sum += code;
        product = (product * (code % 100 + 1)) % 10000;
        xorValue ^= code;
      }
      
      return {
        genre: sum % 5,                    // 0-4: 5가지 장르
        scale: sum % 5,                    // 0-4: 5가지 음계
        tempo: 100 + (sum % 41),           // 100-140 BPM
        colorBase: sum % 360,              // 색상
        noteCount: 8 + (product % 5),      // 8-12개 음표
        octaveBase: 4 + (sum % 2),         // 옥타브
        melodyDirection: xorValue % 4,     // 멜로디 진행 방향

        arpPattern: xorValue % 3,          // 아르페지오 패턴
        dynamics: (sum + product) % 3      // 다이나믹스

      const notes = scale.notes;
      const root = notes[rootValue % notes.length];
      const third = notes[(rootValue + 2) % notes.length];
      const fifth = notes[(rootValue + 4) % notes.length];
      return [`${root}${octave}`, `${third}${octave}`, `${fifth}${octave}`];

        let value = charCode % 12;
        
        // 멜로디 진행 방향 적용
        if (melodyDirection === 0) {
          // 상승: 점점 높아짐
          value = (value + i * 2) % scale.notes.length;
        } else if (melodyDirection === 1) {
          // 하강: 점점 낮아짐
          value = (value + (hash.noteCount - i) * 2) % scale.notes.length;
        } else if (melodyDirection === 2) {
          // 지그재그
          value = i % 2 === 0 ? value : (value + 4) % scale.notes.length;
        }
        // melodyDirection === 3이면 랜덤 (기존 로직)
        
        // 옥타브 변화
        let octave = hash.octaveBase;
        if (melodyDirection === 0) {
          octave += Math.floor(i / 4); // 상승하면서 옥타브도 올라감
        } else if (melodyDirection === 1) {
          octave += Math.floor((hash.noteCount - i) / 4); // 하강
        } else {
          octave += (i % 3 === 0 ? 1 : 0);
        }
        octave = Math.min(octave, 6); // 너무 높지 않게
        
        // 리듬 패턴 (5가지)
        let duration = '8n';
        if (rhythmPattern === 0) {
          // 균등
          duration = '8n';
        } else if (rhythmPattern === 1) {
          // 긴-짧-긴-짧
          duration = i % 2 === 0 ? '4n' : '16n';
        } else if (rhythmPattern === 2) {
          // 점점 빨라짐
          duration = i < hash.noteCount / 2 ? '4n' : '16n';
        } else if (rhythmPattern === 3) {
          // 왈츠 느낌
          duration = i % 3 === 0 ? '4n' : '8n';
        } else {
          // 복잡한 패턴
          const patterns = ['8n', '16n', '8n', '8n', '16n'];
          duration = patterns[i % patterns.length];
        }
        
        // 장르별 리듬 오버라이드
        if (genre.feel === 'waltz') {
          duration = i % 3 === 0 ? '4n' : '8n';
        } else if (genre.feel === 'march') {
          duration = i % 2 === 0 ? '8n' : '16n';
        } else if (genre.feel === 'skip') {
          duration = '16n'; // 빠르게
        } else if (genre.feel === 'lullaby') {
          duration = '4n'; // 느리게
        }
        
        // 다이나믹스 적용
        let velocity = 0.7;
        if (dynamics === 1) {
          // 크레센도
          velocity = 0.5 + (i / hash.noteCount) * 0.4;
        } else if (dynamics === 2) {
          // 웨이브
          velocity = 0.6 + Math.sin(i * Math.PI / 3) * 0.3;
        }
        
        // 마지막 음은 짧고 밝게 (한 옥타브 높게)
        if (i === hash.noteCount - 1) {
          duration = '16n';
          octave = Math.min(hash.octaveBase + 2, 6);
          velocity = 0.9;
        }
        
        melodyNotes.push({
          note: valueToNote(value, scale, octave),
          duration: duration,
          velocity: velocity
        });
      }
      
      // 코드 생성 (밀도에 따라 다양하게)
      const chordGroups = [];
      const chordDensity = hash.chordDensity; // 0: 희소, 1: 중간, 2: 밀집
      
      let chordCount, chordInterval;
      if (chordDensity === 0) {
        chordCount = 2; // 2개만
        chordInterval = '2n';
      } else if (chordDensity === 1) {
        chordCount = 3; // 3개
        chordInterval = '2n';
      } else {
        chordCount = 4; // 4개
        chordInterval = '4n';
      }
      
      for (let i = 0; i < chordCount; i++) {
        const rootValue = (hash.colorBase + i * 5 + hash.melodyDirection * 2) % 7;
        chordGroups.push({
          chord: createChord(rootValue, scale, hash.octaveBase),
          duration: chordInterval
        });
      }
      
      // 아르페지오 생성 (arpPattern에 따라)
      const arpNotes = [];
      if (hash.arpPattern > 0) { // 0이 아닐 때만 아르페지오 추가
        const arpCount = Math.min(6, hash.noteCount);
        for (let i = 0; i < arpCount; i++) {
          const rootValue = (hash.colorBase + i * 3) % scale.notes.length;
          const chord = createChord(rootValue, scale, hash.octaveBase + 1);
          
          if (hash.arpPattern === 1) {
            // 상승 아르페지오
            arpNotes.push(chord[0], chord[1], chord[2]);
          } else if (hash.arpPattern === 2) {
            // 하강 아르페지오
            arpNotes.push(chord[2], chord[1], chord[0]);
          }
        }
      }
      
      return {
        hash,
        genre,
        scale,
        melodyNotes,
        chordGroups,
        chordInterval,
        arpNotes
      };
    }
    
    // 음악 정지
    function stopMusic() {
      if (!musicPlaying) return;
      
      console.log('⏹️ 음악 정지');
      
      if (Tone.Transport.state === 'started') {
        Tone.Transport.stop();
      }
      
      if (melodySeq) {
        melodySeq.dispose();
        melodySeq = null;
      }
      if (chordSeq) {
        chordSeq.dispose();
        chordSeq = null;
      }
      if (arpSeq) {
        arpSeq.dispose();
        arpSeq = null;
      }
      if (melodySynth) {
        melodySynth.dispose();
        melodySynth = null;
      }
      if (chordSynth) {
        chordSynth.dispose();
        chordSynth = null;
      }
      if (arpSynth) {
        arpSynth.dispose();
        arpSynth = null;
      }
      
      musicPlaying = false;
      musicNoteEvents = [];
      currentMusicNote = -1;
    }
    
    // 음악 재생
    async function playNameMusic(name) {
      console.log('🎵 음악 재생 시작:', name);
      
      // 기존 음악 정지
      stopMusic();
      
      // Tone.js 초기화
      await Tone.start();
      
      // 음악 데이터 생성
      const musicData = createMusicFromName(name);
      const { hash, genre, melodyNotes, chordGroups } = musicData;
      
      // 신스 생성 (밝고 경쾌한 음색 - 해시에 따라 변화)
      const oscillatorTypes = ['sine', 'triangle', 'sine4']; // 밝은 음색만
      const melodyOsc = oscillatorTypes[hash.oscillatorType];
      
      melodySynth = new Tone.PolySynth(Tone.Synth, {
        oscillator: { type: melodyOsc },
        envelope: { 
          attack: 0.005,   // 즉각적인 시작
          decay: 0.1,      // 짧은 감쇠
          sustain: 0.3,    // 적당한 지속
          release: 0.1     // 빠른 종료
        }
      }).toDestination();
      
      chordSynth = new Tone.PolySynth(Tone.Synth, {
        oscillator: { type: 'triangle' },
        envelope: { 
          attack: 0.01,    // 부드러운 시작
          decay: 0.15,     // 짧은 감쇠
          sustain: 0.2,    // 짧은 지속
          release: 0.15    // 빠른 종료
        }
      }).toDestination();
      
      melodySynth.volume.value = -6;   // 멜로디 더 밝게
      chordSynth.volume.value = -18;   // 코드는 더 작게 (배경 역할)
      
      // 아르페지오 신스 (선택적)
      if (musicData.arpNotes.length > 0) {
        arpSynth = new Tone.Synth({
          oscillator: { type: 'triangle8' },
          envelope: { 
            attack: 0.002,
            decay: 0.1,
            sustain: 0.05,
            release: 0.1
          }
        }).toDestination();
        arpSynth.volume.value = -14;  // 작게
      }
      
      // 템포 설정
      Tone.Transport.bpm.value = hash.tempo * genre.tempoMod;
      
      // 음표 이벤트 초기화
      musicNoteEvents = melodyNotes.map(() => ({ 
        active: false, 
        energy: 0, 
        decay: 0 
      }));
      
      // 멜로디 시퀀스
      let melodyIndex = 0;
      melodySeq = new Tone.Sequence((time, noteData) => {
        melodySynth.triggerAttackRelease(
          noteData.note, 
          noteData.duration, 
          time, 
          noteData.velocity
        );
        
        // 도형 반응을 위한 이벤트 스케줄
        Tone.Draw.schedule(() => {
          const idx = melodyIndex % melodyNotes.length;
          musicNoteEvents[idx] = {
            active: true,
            energy: noteData.velocity,
            decay: 0
          };
          currentMusicNote = idx;
          
          // 도형 업데이트 트리거
          if (shapesLayer) {
            triggerShapeReaction(idx, noteData.velocity);
          }
        }, time);
        
        melodyIndex++;
      }, melodyNotes, '8n');
      
      melodySeq.loop = false;
      melodySeq.start(0);
      
      // 코드 시퀀스
      chordSeq = new Tone.Sequence((time, chordData) => {
        chordSynth.triggerAttackRelease(chordData.chord, chordData.duration, time);
      }, chordGroups, musicData.chordInterval);  // 동적 간격
      
      chordSeq.loop = false;
      chordSeq.start(0);
      
      // 아르페지오 시퀀스 (있는 경우만)
      if (musicData.arpNotes.length > 0) {
        arpSeq = new Tone.Sequence((time, note) => {
          arpSynth.triggerAttackRelease(note, '16n', time);
        }, musicData.arpNotes, '16n');
        
        arpSeq.loop = false;
        arpSeq.start(0);
      }
      
      // 재생 상태 설정
      musicPlaying = true;
      Tone.Transport.start();
      
      // 음악 종료 시점 정확하게 계산 (마지막 음표 끝 + 0.2초)
      const lastNote = melodyNotes[melodyNotes.length - 1];
      const lastNoteDuration = Tone.Time(lastNote.duration).toSeconds();
      const totalDuration = (melodyNotes.length - 1) * Tone.Time('8n').toSeconds() + lastNoteDuration + 0.2;
      
      console.log('⏱️ 음악 재생 시간:', totalDuration.toFixed(2), '초');
      
      setTimeout(() => {
        stopMusic();
        console.log('✅ 음악 재생 완료');
      }, totalDuration * 1000);
    }
    
    // 도형 반응 트리거
    function triggerShapeReaction(noteIndex, energy) {
      if (!shapesLayer) return;
      
      const shapes = shapesLayer.querySelectorAll('.shape');
      const targetIndex = noteIndex % shapes.length;
      const shape = shapes[targetIndex];
      
      if (!shape) return;
      
      // 현재 transform 값 가져오기
      const currentTransform = shape.dataset.transform || shape.style.transform;
      
      // Bounce 효과
      const bounceKeyframes = [
        { transform: currentTransform + ' scale(1.0)', opacity: 0.75 },
        { transform: currentTransform + ' scale(1.5)', opacity: 1.0 },
        { transform: currentTransform + ' scale(1.0)', opacity: 0.75 }
      ];
      
      shape.animate(bounceKeyframes, {
        duration: 300,
        easing: 'ease-out'
      });
      
      // 색상 변경
      const fillElement = shape.querySelector('circle, rect, polygon');
      if (fillElement) {
        const brightColor = RAINBOW_COLORS[Math.floor(Math.random() * RAINBOW_COLORS.length)];
        fillElement.style.fill = brightColor;
      }
    }
    
    // ========== SVG 도형 생성 ==========
    function createShapeSVG(type, size, color) {
      const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      svg.setAttribute('width', size);
      svg.setAttribute('height', size);
      svg.setAttribute('viewBox', `0 0 ${size} ${size}`);
      svg.classList.add('shape');
      
      let shape;
      const center = size / 2;
      
      switch(type) {
        case 'circle': {
          shape = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
          shape.setAttribute('cx', center);
          shape.setAttribute('cy', center);
          shape.setAttribute('r', center - 2);
          shape.style.fill = color;
          break;
        }
        case 'square': {
          shape = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
          shape.setAttribute('x', 4);
          shape.setAttribute('y', 4);
          shape.setAttribute('width', size - 8);
          shape.setAttribute('height', size - 8);
          shape.style.fill = color;
          break;
        }
        case 'triangle': {
          shape = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
          const points = `${center},4 ${size-4},${size-4} 4,${size-4}`;
          shape.setAttribute('points', points);
          shape.style.fill = color;
          break;
        }
        case 'star': {
          shape = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
          const starPoints = [];
          for (let i = 0; i < 10; i++) {
            const radius = i % 2 === 0 ? center - 4 : (center - 4) * 0.4;
            const angle = (i * Math.PI) / 5 - Math.PI / 2;
            const x = center + radius * Math.cos(angle);
            const y = center + radius * Math.sin(angle);
            starPoints.push(`${x},${y}`);
          }
          shape.setAttribute('points', starPoints.join(' '));
          shape.style.fill = color;
          break;
        }
      }
      
      svg.appendChild(shape);
      return svg;
    }
    
    // Bounce 애니메이션
    function applyBounce(shape, baseTransform) {
      const bounceKeyframes = [
        { transform: baseTransform + ' scale(1.0)' },
        { transform: baseTransform + ' scale(1.3)' },
        { transform: baseTransform + ' scale(1.0)' }
      ];
      shape.animate(bounceKeyframes, {
        duration: 400,
        easing: 'ease-out',
        fill: 'forwards'
      });
    }
    
    // 도형 상태 업데이트
    function updateShapes() {
      if (!shapesLayer) return;
      
      console.log('🎨 배경 도형 업데이트 시작');
      
      const shapes = shapesLayer.querySelectorAll('.shape');
      const bounceCount = Math.floor(SHAPE_COUNT * BOUNCE_RATIO);
      
      const indices = Array.from({ length: SHAPE_COUNT }, (_, i) => i).sort(() => Math.random() - 0.5);
      const bounceIndices = new Set(indices.slice(0, bounceCount));
      
      shapes.forEach((shape, index) => {
        shape.style.opacity = 0.75;

        const x = Math.random() * 100;
        const y = Math.random() * 100;
        const rotation = Math.random() * 360;
        const scale = 0.5 + Math.random() * 0.8;
        const toTransform = `translate(${x}vw, ${y}vh) rotate(${rotation}deg) scale(${scale})`;

        const fromTransform = shape.dataset.transform || shape.style.transform || 'translate(0,0) rotate(0deg) scale(1)';

        shape.getAnimations().forEach(a => a.cancel());

        const duration = 1000 + Math.random() * 1000;
        const main = shape.animate(
          [
            { transform: fromTransform, opacity: parseFloat(getComputedStyle(shape).opacity) || 0.75 },
            { transform: toTransform, opacity: 0.75 }
          ],
          { duration, easing: 'ease-in-out', fill: 'forwards' }
        );

        shape.dataset.transform = toTransform;

        const fillElement = shape.querySelector('circle, rect, polygon');
        if (fillElement) {
          const nextColor = RAINBOW_COLORS[Math.floor(Math.random() * RAINBOW_COLORS.length)];
          const prevColor = getComputedStyle(fillElement).fill;
          try {
            fillElement.animate(
              [{ fill: prevColor }, { fill: nextColor }],
              { duration, easing: 'ease-in-out', fill: 'forwards' }
            ).finished.then(() => { fillElement.style.fill = nextColor; });
          } catch {
            fillElement.style.fill = nextColor;
          }
        }

        if (bounceIndices.has(index)) {
          main.finished.then(() => applyBounce(shape, toTransform));
        }
      });
      
      console.log('✅ 배경 도형 업데이트 완료');
    }
    
    // 도형 레이어 초기화
    function initShapes() {

        shape.style.transform = initialTransform;
        shape.dataset.transform = initialTransform;
        
        const fillElement = shape.querySelector('circle, rect, polygon');
        if (fillElement) fillElement.style.transition = 'none';
        
        shapesLayer.appendChild(shape);
      }
      
      console.log(`✅ ${SHAPE_COUNT}개 도형 생성 완료`);
      
      setTimeout(() => {
        updateShapes();
      }, 100);
    }

        return;
      }

      console.log('📢 TTS 텍스트:', text);

        utterance.rate = 1.0;

          console.log('▶️ TTS 시작');
        };
        
        // 🎵 TTS 종료 후 음악 재생
        utterance.onend = function() {
          console.log('⏹️ TTS 종료, 음악 재생 시작');
          
          // 이름을 기반으로 음악 재생
          playNameMusic(currentChild.name);
          
          // 음악 길이 계산 (대략 5-7초) + 여유 1초
          const estimatedMusicDuration = 6000;
          
          setTimeout(() => {
            document.getElementById('barcodeInput').focus();
            console.log('🎯 바코드 입력 포커스 복귀');
          }, estimatedMusicDuration);
        };
        
        window.speechSynthesis.speak(utterance);
      } else {
        console.error('❌ 브라우저가 TTS를 지원하지 않습니다');
        alert('이 브라우저는 음성 출력을 지원하지 않습니다.');
        setTimeout(() => {
          document.getElementById('barcodeInput').focus();
        }, 3000);
      }
    }

    // TTS 버튼 클릭
    window.speakWelcome = function() {
      console.log('🎤 TTS 버튼 클릭 - 자동 재생 활성화');
      ttsEnabled = true;
      playTTS();
    };

    // 바코드 리더 설정
    let barcodeReaderSetup = false;
    function setupBarcodeReader() {
      if (barcodeReaderSetup) return;
      
      console.log('🔧 바코드 리더 설정');
      barcodeReaderSetup = true;
      
      const input = document.getElementById('barcodeInput');
      
      setInterval(() => {
        if (document.activeElement !== input) {
          input.focus();
        }
      }, 1000);

      input.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
          let scannedId = input.value.trim();
          console.log('📥 바코드 입력:', scannedId);
          input.value = '';
          
          if (scannedId) {
            if (scannedId.includes('?') && scannedId.includes('id=')) {
              try {
                const url = new URL(scannedId);
                const extractedId = url.searchParams.get('id');
                if (extractedId) scannedId = extractedId;
              } catch (e) {
                console.error('❌ URL 파싱 실패:', e);
              }
            }
            
            console.log('✨ 카드 전환:', scannedId);
            renderCardMode(scannedId);
          }
        }
      });

      input.focus();
      console.log('✅ 바코드 리더 설정 완료');
    }

    // 초기화
    const params = new URLSearchParams(location.search);
    const mode = params.get('mode') || 'card';
    const id = params.get('id');
    
    console.log('🚀 페이지 로드:', { mode, id });

    if (mode === 'print') {
      renderPrintMode();
    } else {
      renderCardMode(id);
    }
    
    console.log('🏁 초기화 완료');
  </script>
</body>
</html>
