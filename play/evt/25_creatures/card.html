<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>신기한 생물 행정복지센터</title>
<style>
  :root { --accent:#4a90e2; }
  * { box-sizing: border-box; }
  body{margin:0;background:#f2f2f2;font-family:"Noto Sans KR",system-ui,sans-serif;color:#0f172a}
  .wrap{max-width:560px;margin:0 auto;padding:16px}
  h1{margin:4px 4px 12px;font-size:22px;line-height:1.2;font-weight:900}
  canvas{width:100%;height:auto;background:#fff;box-shadow:0 8px 24px rgba(0,0,0,.12);border-radius:12px}

  /* 패널 및 입력 UI */
  .panel{background:#fff;margin-top:16px;padding:16px 14px;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.08)}
  .panel label{ display:block; margin-bottom:6px; }
  textarea.desc-input{
    width:100%; max-width:100%;
    height:60px; min-height:60px; resize:vertical;
    padding:12px 14px; border:1px solid #e2e8f0; border-radius:10px;
    font:inherit; background:#fff; color:#0f172a;
  }
  .hint{color:#64748b;font-size:12px;margin-top:6px}
  .form-section{margin-top:14px;border-top:1px solid #eef2f7;padding-top:12px}
  .row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;margin:8px 0 4px}
  .slider-wrap{padding:10px 12px;border:1px solid #e2e8f0;border-radius:10px;background:#fff}
  input[type="range"]{width:100%}
  .ticks{display:flex;justify-content:space-between;font-size:12px;color:#64748b;margin-top:6px}

  /* 제출 버튼: 반/연령 색상 적용 */
  .btn-wrap{margin-top:16px;text-align:center}
  .form-btn{
    display:inline-block;padding:14px 22px;background:var(--accent);color:#fff;text-decoration:none;
    border-radius:10px;font-weight:800;font-size:16px;border:none;cursor:pointer;
    box-shadow:0 4px 12px rgba(0,0,0,.15);
    transition:transform .25s, box-shadow .25s, filter .25s
  }
  .form-btn:hover{filter:brightness(0.93);transform:translateY(-2px)}
  .form-btn:active{transform:translateY(0)}
  .err{color:#c00;padding:12px}
</style>
</head>
<body>
<div class="wrap">
  <h1>신기한 생물 행정복지센터</h1>
  <canvas id="card"></canvas>

  <!-- desc 입력 + 슬라이더 + 제출 버튼 -->
  <section class="panel" id="infoPanel" hidden>
    <div>
      <label for="descInput">신기한 생물 소개를 적어주세요.</label>
      <textarea id="descInput" class="desc-input" placeholder=""></textarea>
      <div class="hint">앞으로 등록한 소개가 나타나게 됩니다. 재등록하는 것도 가능합니다. 아래 속성도 조정해 주세요. 속성은 정규화 됩니다. 모두 9로 입력하면 실제 값은 각각 3이 됩니다. 총합 12로 재분배됩니다.</div>
    </div>

    <div class="form-section">
      <div class="row">
        <label for="curiosity">호기심</label>
        <output id="curiosityOut" for="curiosity">5</output>
      </div>
      <div class="slider-wrap">
        <input id="curiosity" type="range" min="1" max="9" step="1" value="5" list="tick-1-9" />
        <div class="ticks"><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span><span>8</span><span>9</span></div>
      </div>

      <div class="row">
        <label for="kindness">상냥함</label>
        <output id="kindnessOut" for="kindness">5</output>
      </div>
      <div class="slider-wrap">
        <input id="kindness" type="range" min="1" max="9" step="1" value="5" list="tick-1-9" />
        <div class="ticks"><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span><span>8</span><span>9</span></div>
      </div>

      <div class="row">
        <label for="bravery">용감함</label>
        <output id="braveryOut" for="bravery">5</output>
      </div>
      <div class="slider-wrap">
        <input id="bravery" type="range" min="1" max="9" step="1" value="5" list="tick-1-9" />
        <div class="ticks"><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span><span>8</span><span>9</span></div>
      </div>

      <div class="row">
        <label for="imagination">상상력</label>
        <output id="imaginationOut" for="imagination">5</output>
      </div>
      <div class="slider-wrap">
        <input id="imagination" type="range" min="1" max="9" step="1" value="5" list="tick-1-9" />
        <div class="ticks"><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span><span>8</span><span>9</span></div>
      </div>

      <div class="btn-wrap">
        <div class="hint" style="margin-bottom: 5px">아래 버튼을 누르고 채워진 내용대로 양식을 보내주세요.</div>
        <button class="form-btn" id="prefillBtn">신기한 생물 등록/갱신</button>
      </div>
    </div>
  </section>

  <div id="msg" class="err" hidden></div>
</div>

<!-- 슬라이더 공통 티크 -->
<datalist id="tick-1-9">
  <option value="1"></option><option value="2"></option><option value="3"></option>
  <option value="4"></option><option value="5"></option><option value="6"></option>
  <option value="7"></option><option value="8"></option><option value="9"></option>
</datalist>

<script type="module">
import { CONFIG, parseTSVRecords, fromShortCode, drawCard, colorForAge, hexToRgb } from './layout.js';

/** === 구글폼 프리필 설정 === */
const FORM_BASE = 'https://docs.google.com/forms/d/e/1FAIpQLScAtvL_ye7DZL5U5tSbSFJ_biHYMof6B8KF8ryoKEz-7a9iVw/viewform?usp=pp_url';
const ENTRY = {
  A: 'entry.1494415517',             // 짧은 한글 ← TSV file (확장자 포함)
  B: 'entry.460445458',              // 긴 한글 ← textarea 값(없으면 placeholder=기존 desc)
  curiosity: 'entry.1118185306',
  kindness: 'entry.1024942876',
  bravery: 'entry.673342022',
  imagination: 'entry.250048401'
};
function buildPrefillURL(values) {
  const qs = new URLSearchParams();
  Object.entries(values).forEach(([k, v]) => {
    if (v !== undefined && v !== null && String(v).trim() !== '') {
      qs.set(ENTRY[k], v);
    }
  });
  return FORM_BASE + '&' + qs.toString();
}

/** === 파라미터 === */
const params = new URLSearchParams(location.search);
const code = params.get('code');
const dataUrl = params.get('data') || CONFIG.TSV_URL;
const assetsBase = params.get('assets') || CONFIG.ASSETS_BASE;

/** === UI 참조 === */
const msg = document.getElementById('msg');
const infoPanel = document.getElementById('infoPanel');
const descInput = document.getElementById('descInput');
const prefillBtn = document.getElementById('prefillBtn');

function fail(e){ msg.hidden=false; msg.textContent = e instanceof Error? e.message : e; throw e; }

const sliders = [
  ['curiosity','curiosityOut'],
  ['kindness','kindnessOut'],
  ['bravery','braveryOut'],
  ['imagination','imaginationOut']
];
sliders.forEach(([id,outId])=>{
  const el = document.getElementById(id);
  const out = document.getElementById(outId);
  const sync = ()=> out.value = el.value;
  el.addEventListener('input', sync);
  sync();
});

if(!code) fail('code 파라미터가 필요합니다.');

try{
  // TSV 로드
  const tsv = await (await fetch(dataUrl, {cache:'reload'})).text();
  const { bases, byBase } = parseTSVRecords(tsv);

  // code → basename
  const basename = await fromShortCode(code, bases);
  if(!basename) fail('유효하지 않은 코드입니다.');

  // 캔버스 렌더 (보더/QR 제외)
  const canvas = document.getElementById('card');
  const record = byBase.get(basename) || null;
  await drawCard({
    canvas,
    basename,
    allBasenames: bases,
    record,
    assetsBase,
    drawQR:false,
    drawBorders:false
  });

  // desc 입력창: placeholder에 기존 desc 세팅 (값은 비워둠)
  const descFromData = record?.desc || '';
  // descInput.placeholder = descFromData;
  descInput.value = ''; // 미입력 시 placeholder 사용

  // 버튼 컬러를 반/연령 색으로 동적 적용
  const ageColor = colorForAge(record?.age);
  document.documentElement.style.setProperty('--accent', ageColor);
  prefillBtn.style.background = ageColor;
  prefillBtn.style.color = '#fff';
  try{
    const {r,g,b} = hexToRgb(ageColor);
    prefillBtn.style.boxShadow = `0 4px 12px rgba(${r},${g},${b},.30)`;
  }catch{}

  // 제출: 프리필 URL 열기
  const fileForA = (record?.file) || (basename + '.png');
  function readSlider(id){ return document.getElementById(id).value; }
  function buildCurrentPrefillURL(){
    const descToUse = (descInput.value && descInput.value.trim()) ? descInput.value : descFromData;
    return buildPrefillURL({
      A: fileForA,
      B: descToUse,
      curiosity: readSlider('curiosity'),
      kindness:  readSlider('kindness'),
      bravery:   readSlider('bravery'),
      imagination: readSlider('imagination'),
    });
  }
  prefillBtn.addEventListener('click', ()=>{
    const url = buildCurrentPrefillURL();
    window.open(url, '_blank', 'noopener');
  });

  infoPanel.hidden = false;
}catch(e){ fail(e); }
</script>
</body>
</html>
