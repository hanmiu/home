<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Creatures Card</title>
<style>
  body{margin:0;background:#f2f2f2;font-family:"Noto Sans KR",system-ui,sans-serif}
  .wrap{max-width:480px;margin:0 auto;padding:16px}
  canvas{width:100%;height:auto;background:#fff;box-shadow:0 8px 24px rgba(0,0,0,.12);}
  .btn-wrap{margin-top:20px;text-align:center}
  .form-btn{display:inline-block;padding:16px 32px;background:#4a90e2;color:#fff;text-decoration:none;border-radius:8px;font-weight:700;font-size:16px;border:none;cursor:pointer;box-shadow:0 4px 12px rgba(74,144,226,.3);transition:all .3s}
  .form-btn:hover{background:#357abd;box-shadow:0 6px 16px rgba(74,144,226,.4);transform:translateY(-2px)}
  .form-btn:active{transform:translateY(0)}
  .err{color:#c00;padding:12px}
</style>
</head>
<body>
<div class="wrap">
  <canvas id="card"></canvas>
  <div class="btn-wrap">
    <button class="form-btn" id="formBtn">설문 참여하기</button>
  </div>
  <div id="msg" class="err" hidden></div>
</div>
<script type="module">
import { CONFIG, parseTSVRecords, fromShortCode, drawCard } from './layout.js';

// 설정(필요시 쿼리로 오버라이드)
const params = new URLSearchParams(location.search);
const code = params.get('code');
const dataUrl = params.get('data') || CONFIG.TSV_URL;
const assetsBase = params.get('assets') || CONFIG.ASSETS_BASE;

const msg = document.getElementById('msg');
function fail(e){ msg.hidden=false; msg.textContent = e instanceof Error? e.message : e; throw e; }
if(!code) fail('code 파라미터가 필요합니다.');

try{
  // TSV 로드 → records/byBase
  const tsv = await (await fetch(dataUrl, {cache:'reload'})).text();
  const { bases, byBase } = parseTSVRecords(tsv);

  // shortCode로부터 basename 복원
  const basename = await fromShortCode(code, bases);
  if(!basename) fail('유효하지 않은 코드입니다.');

  // 캔버스 렌더 (보더/QR 제외, klass는 표시)
  const canvas = document.getElementById('card');
  await drawCard({
    canvas,
    basename,
    allBasenames: bases,
    record: byBase.get(basename) || null,
    assetsBase,
    drawQR:false,
    drawBorders:false
  });

  // 구글 폼 버튼 이벤트 (나중에 prefill URL 연결 예정)
  document.getElementById('formBtn').addEventListener('click', ()=>{
    // TODO: 구글 폼 URL + prefill 파라미터
    alert('구글 폼 연결 예정\nbasename: ' + basename);
  });
} catch(e){ fail(e); }
</script>
</body>
</html>
