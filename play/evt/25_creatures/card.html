<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Creatures Card</title>
<style>
  body{margin:0;background:#f2f2f2;font-family:"Noto Sans KR",system-ui,sans-serif}
  .wrap{max-width:560px;margin:0 auto;padding:16px}
  canvas{width:100%;height:auto;background:#fff;box-shadow:0 8px 24px rgba(0,0,0,.12);border-radius:12px}
  .panel{background:#fff;margin-top:16px;padding:16px 14px;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.08)}
  .title{font-weight:800;font-size:20px;margin:0 0 6px}
  .meta{color:#475569;font-size:14px;margin-bottom:10px}
  .logos{display:flex;gap:8px;align-items:center;margin:8px 0 6px}
  .logos img{height:24px}
  .desc{white-space:pre-wrap;line-height:1.5;color:#0f172a;margin:8px 0 0}
  .form-section{margin-top:14px;border-top:1px solid #eef2f7;padding-top:12px}
  .row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;margin:8px 0 4px}
  label{font-weight:700}
  .slider-wrap{padding:10px 12px;border:1px solid #e2e8f0;border-radius:10px;background:#fff}
  input[type="range"]{width:100%}
  .ticks{display:flex;justify-content:space-between;font-size:12px;color:#64748b;margin-top:6px}
  .btn-wrap{margin-top:16px;text-align:center}
  .form-btn{display:inline-block;padding:14px 22px;background:#4a90e2;color:#fff;text-decoration:none;border-radius:10px;font-weight:800;font-size:16px;border:none;cursor:pointer;box-shadow:0 4px 12px rgba(74,144,226,.30);transition:all .25s}
  .form-btn:hover{background:#357abd;box-shadow:0 6px 16px rgba(74,144,226,.40);transform:translateY(-2px)}
  .form-btn:active{transform:translateY(0)}
  .err{color:#c00;padding:12px}
</style>
</head>
<body>
<div class="wrap">
  <canvas id="card"></canvas>

  <!-- 정보 + desc + 슬라이더 + 버튼 -->
  <section class="panel" id="infoPanel" hidden>
    <h2 class="title" id="titleTxt"></h2>
    <div class="meta"><span id="authorTxt"></span> · <span id="klassTxt"></span></div>

    <div class="logos">
      <!-- 한미유치원 로고는 캔버스(Path2D)로 표시됩니다 -->
      <img id="creatureLogo" alt="신기한 생물 사전 로고" />
      <span style="font-size:12px;color:#64748b">로고 아래 소개</span>
    </div>

    <p class="desc" id="descTxt"></p>

    <div class="form-section">
      <div class="row">
        <label for="curiosity">호기심 (1–9)</label>
        <output id="curiosityOut" for="curiosity">5</output>
      </div>
      <div class="slider-wrap">
        <input id="curiosity" type="range" min="1" max="9" step="1" value="5" list="tick-1-9" />
        <div class="ticks"><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span><span>8</span><span>9</span></div>
      </div>

      <div class="row">
        <label for="kindness">상냥함 (1–9)</label>
        <output id="kindnessOut" for="kindness">5</output>
      </div>
      <div class="slider-wrap">
        <input id="kindness" type="range" min="1" max="9" step="1" value="5" list="tick-1-9" />
        <div class="ticks"><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span><span>8</span><span>9</span></div>
      </div>

      <div class="row">
        <label for="bravery">용감함 (1–9)</label>
        <output id="braveryOut" for="bravery">5</output>
      </div>
      <div class="slider-wrap">
        <input id="bravery" type="range" min="1" max="9" step="1" value="5" list="tick-1-9" />
        <div class="ticks"><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span><span>8</span><span>9</span></div>
      </div>

      <div class="row">
        <label for="imagination">상상력 (1–9)</label>
        <output id="imaginationOut" for="imagination">5</output>
      </div>
      <div class="slider-wrap">
        <input id="imagination" type="range" min="1" max="9" step="1" value="5" list="tick-1-9" />
        <div class="ticks"><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span><span>8</span><span>9</span></div>
      </div>

      <div class="btn-wrap">
        <button class="form-btn" id="prefillBtn">신기한 생물 등록/갱신</button>
      </div>
    </div>
  </section>

  <div class="btn-wrap">
    <!-- 기존 버튼은 유지/대체 가능 -->
    <button class="form-btn" id="formBtn">설문 참여하기(테스트)</button>
  </div>

  <div id="msg" class="err" hidden></div>
</div>

<!-- 공통 티크 -->
<datalist id="tick-1-9">
  <option value="1"></option><option value="2"></option><option value="3"></option>
  <option value="4"></option><option value="5"></option><option value="6"></option>
  <option value="7"></option><option value="8"></option><option value="9"></option>
</datalist>

<script type="module">
import { CONFIG, parseTSVRecords, fromShortCode, drawCard, splitBase } from './layout.js';

/** === (1) 구글폼 프리필 설정 === */
const FORM_BASE = 'https://docs.google.com/forms/d/e/1FAIpQLScAtvL_ye7DZL5U5tSbSFJ_biHYMof6B8KF8ryoKEz-7a9iVw/viewform?usp=pp_url';
const ENTRY = {
  A: 'entry.1494415517',             // 짧은 한글 ← TSV file (예: 김제나_제나와친구.png)
  B: 'entry.460445458',              // 긴 한글 ← TSV desc
  curiosity: 'entry.1118185306',     // 1~9
  kindness: 'entry.1024942876',      // 1~9
  bravery: 'entry.673342022',        // 1~9
  imagination: 'entry.250048401'     // 1~9
};
function buildPrefillURL(values) {
  const qs = new URLSearchParams();
  Object.entries(values).forEach(([k, v]) => {
    if (v !== undefined && v !== null && String(v).trim() !== '') {
      qs.set(ENTRY[k], v);
    }
  });
  return FORM_BASE + '&' + qs.toString();
}

/** === (2) 쿼리/경로 파라미터 === */
const params = new URLSearchParams(location.search);
const code = params.get('code');
const dataUrl = params.get('data') || CONFIG.TSV_URL;
const assetsBase = params.get('assets') || CONFIG.ASSETS_BASE;

const msg = document.getElementById('msg');
function fail(e){ msg.hidden=false; msg.textContent = e instanceof Error? e.message : e; throw e; }
if(!code) fail('code 파라미터가 필요합니다.');

/** === (3) UI 참조 === */
const infoPanel = document.getElementById('infoPanel');
const titleTxt = document.getElementById('titleTxt');
const authorTxt = document.getElementById('authorTxt');
const klassTxt = document.getElementById('klassTxt');
const descTxt = document.getElementById('descTxt');
const prefillBtn = document.getElementById('prefillBtn');
const testBtn = document.getElementById('formBtn');
const creatureLogo = document.getElementById('creatureLogo');

const sliders = [
  ['curiosity','curiosityOut'],
  ['kindness','kindnessOut'],
  ['bravery','braveryOut'],
  ['imagination','imaginationOut']
];
sliders.forEach(([id,outId])=>{
  const el = document.getElementById(id);
  const out = document.getElementById(outId);
  const sync = ()=> out.value = el.value;
  el.addEventListener('input', sync);
  sync();
});

/** === (4) 데이터 로드 & 렌더 === */
try{
  // TSV 로드 → records/byBase
  const tsv = await (await fetch(dataUrl, {cache:'reload'})).text();
  const { bases, byBase } = parseTSVRecords(tsv);

  // shortCode로부터 basename 복원
  const basename = await fromShortCode(code, bases);
  if(!basename) fail('유효하지 않은 코드입니다.');

  // 캔버스(이미지+Path2D 로고/텍스트/배지) 렌더
  const canvas = document.getElementById('card');
  await drawCard({
    canvas,
    basename,
    allBasenames: bases,
    record: byBase.get(basename) || null,
    assetsBase,
    drawQR:false,
    drawBorders:false
  });

  // DOM 정보 패널 채우기
  const record = byBase.get(basename) || {};
  const [author, title] = splitBase(basename);

  titleTxt.textContent = title || basename;
  authorTxt.textContent = author || '';
  klassTxt.textContent = record.klass || '';
  descTxt.textContent = record.desc || '';
  creatureLogo.src = CONFIG.CREATURES_SVG_URL;
  creatureLogo.decoding = 'async';
  creatureLogo.loading = 'lazy';

  infoPanel.hidden = false;

  /** === (5) 프리필 버튼 동작 ===
   * A ← TSV file (확장자 포함)
   * B ← TSV desc
   * 4개 슬라이더 값
   */
  function readSlider(id){ return document.getElementById(id).value; }

  function buildCurrentPrefillURL(){
    return buildPrefillURL({
      A: record.file || basename + '.png',
      B: record.desc || '',
      curiosity: readSlider('curiosity'),
      kindness:  readSlider('kindness'),
      bravery:   readSlider('bravery'),
      imagination: readSlider('imagination'),
    });
  }

  prefillBtn.addEventListener('click', ()=>{
    const url = buildCurrentPrefillURL();
    window.open(url, '_blank', 'noopener');
  });

  // (선택) 기존 테스트 버튼도 동일 프리필로 연결
  testBtn.addEventListener('click', ()=>{
    const url = buildCurrentPrefillURL();
    window.open(url, '_blank', 'noopener');
  });

} catch(e){ fail(e); }
</script>
</body>
</html>
