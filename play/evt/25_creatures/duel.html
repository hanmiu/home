<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>신기한 생물 미니 TCG — Kiosk</title>
  <style>
    :root{
      --bg:#0b0f16; --bg2:#0b0f16; --fg:#e7ecff; --muted:#97a2c1; --card:#111827; --border:#20283a; --accent:#7aa2f7;
      --ok:#22c55e; --warn:#f59e0b; --err:#ef4444; --win:#58d68d; --lose:#ec7063; --draw:#f7dc6f;
      --plus:#58d68d; --minus:#ec7063;
      --slotW: 540px;
      --centerW: 780px;
    }
    *{box-sizing:border-box}
    html,body{height:100%;overflow:hidden}
    body{margin:0;background:linear-gradient(180deg,#0b0f16,#0d1320 50%,#0b0f16);color:var(--fg);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,"Noto Sans KR"}

    body.idle{animation: idlePulse 12s ease-in-out 1}
    @keyframes idlePulse{
      0%{background:linear-gradient(180deg,#0b0f16,#0d1320 50%,#0b0f16)}
      50%{background:radial-gradient(1200px 600px at 50% 40%, #13213a 0%, #0b0f16 60%)}
      100%{background:linear-gradient(180deg,#0b0f16,#0d1320 50%,#0b0f16)}
    }

    .app{display:grid;grid-template-rows:auto 1fr;height:100vh}
    .toolbar{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--card);border-bottom:1px solid var(--border);font-size:14px}
    .toolbar .spacer{flex:1}
    .badge{padding:.3rem .7rem;border-radius:999px;border:1px solid var(--border);font-weight:700;font-size:13px;color:var(--fg)}
    .badge.ok{background:#102616;color:var(--ok);border-color:#1f3b26}
    .badge.warn{background:#2b2011;color:var(--warn);border-color:#4e3a20}
    .btn{appearance:none;border:1px solid var(--border);background:#0f172a;color:var(--fg);border-radius:8px;padding:7px 12px;font-weight:700;cursor:pointer;font-size:13px}
    .btn:hover{background:#0c1423}

    .stage{display:grid;grid-template-columns: var(--slotW) var(--centerW) var(--slotW);gap:10px;padding:10px;height:calc(100vh - 54px);overflow:hidden}
    .card{background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:0 6px 24px rgba(0,0,0,.35);display:flex;flex-direction:column;min-height:0}

    /* 플레이어 카드 */
    .player{display:grid;grid-template-rows:auto auto 1fr auto;gap:8px;height:100%;padding:12px}
    .p-header{display:flex;align-items:center;gap:10px;justify-content:center}
    .p-name{font-size:22px;font-weight:900;letter-spacing:.2px}
    .p-sub{color:var(--muted);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
    .p-badges{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
    .pill{border:1px solid var(--border);padding:6px 12px;border-radius:999px;font-size:14px;font-weight:700}
    .pill.age-only{width:16px;height:16px;padding:0;border-radius:50%;border-width:2px}

    .imgbox{position:relative;border-radius:8px;overflow:hidden;border:1px solid var(--border);background:#0b0f16;width:100%;max-width:420px;aspect-ratio:1/1;margin:0 auto}
    .imgbox img{width:100%;height:100%;object-fit:cover;display:block}
    .imgbox .fallback{position:absolute;inset:0;display:grid;place-items:center;color:#6b7280;font-size:14px}

    .attrs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:420px;margin:0 auto;width:100%}
    .a{background:#0e1527;border:1px solid var(--border);border-radius:8px;padding:8px;text-align:center;transition:all .3s ease}
    .a.highlight{background:rgba(122,162,247,.15);border:2px solid var(--accent);transform:scale(1.02)}
    .a .k{font-size:12px;color:var(--muted);font-weight:600}
    .a .v{font-size:22px;font-weight:900;color:var(--accent)}

    /* 중앙 패널 */
    .center{display:grid;grid-template-rows:auto auto 1fr;gap:8px;height:100%}
    .roulette{display:grid;place-items:center;padding:12px}
    .roulette-display{padding:16px;border-radius:12px;background:rgba(122,162,247,.08);border:2px solid rgba(122,162,247,.35);min-width:360px;text-align:center;transition:all .3s ease}
    .roulette-display.spinning{animation:roulettePulse .15s ease-in-out infinite;border-color:rgba(245,87,108,.5);background:rgba(245,87,108,.08)}
    @keyframes roulettePulse{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
    .roulette-display .emoji{font-size:40px;display:block;margin-bottom:6px}
    .roulette-display .name{font-size:20px;font-weight:900;color:var(--accent)}
    .roulette-display .formula{font-size:18px;font-weight:800;margin-top:4px}
    .formula .op-plus{color:var(--plus)}
    .formula .op-minus{color:var(--minus)}
    .desc{font-size:13px;color:var(--muted);margin-top:4px}

    .result{font-size:20px;text-align:center;margin:6px 0;font-weight:900;padding:10px;border-radius:8px;background:rgba(0,0,0,.25);opacity:0;animation:fadeIn .5s ease forwards}
    .win{color:var(--win);background:rgba(88,214,141,.1)}
    .lose{color:var(--lose);background:rgba(236,112,99,.1)}
    .draw{color:var(--draw);background:rgba(247,220,111,.1)}
    @keyframes fadeIn{to{opacity:1}}

    /* 전투 결과 영역 */
    .battle-results{border-top:1px solid var(--border);padding:12px;overflow-y:auto;max-height:calc(100vh - 500px)}
    .duel-grid{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:start}
    .player-battle{text-align:center}
    .score{font-size:36px;font-weight:900;color:var(--accent);margin:6px 0}
    .formula-breakdown{background:rgba(0,0,0,.3);padding:10px;border-radius:6px;margin-top:8px;font-size:15px}
    .formula-breakdown .calc{font-weight:700;font-family:monospace}
    .formula-breakdown .op-plus{color:var(--plus);font-size:1.3em;margin:0 4px}
    .formula-breakdown .op-minus{color:var(--minus);font-size:1.3em;margin:0 4px}
    .formula-breakdown .attr{color:var(--accent)}
    .vs-divider{font-size:18px;color:var(--muted);text-align:center;padding:0 10px;font-weight:900}

    /* 속성 바 */
    .bars{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}
    .bar{background:#0f1730;border:1px solid var(--border);border-radius:6px;padding:8px;transition:all .3s ease}
    .bar.highlight{background:rgba(122,162,247,.15);border:2px solid var(--accent);transform:scale(1.02)}
    .bar-label{display:flex;justify-content:space-between;font-size:12px;color:#a8b2d8;margin-bottom:6px;font-weight:700}
    .bar.highlight .bar-label{color:#fff}
    .bar-track{height:10px;background:#0b1330;border-radius:5px;overflow:hidden}
    .bar-fill{height:100%;width:0%;background:linear-gradient(90deg,#25a1ff,#7cd3ff);transition:width .6s cubic-bezier(0.4, 0, 0.2, 1);box-shadow:0 0 8px rgba(124,207,255,.3)}
    .bar.highlight .bar-fill{background:linear-gradient(90deg,#7cf,#25a1ff);box-shadow:0 0 12px rgba(124,207,255,.6)}

    /* 환경 설명 */
    .env-explain{background:rgba(122,162,247,.08);border:1px solid rgba(122,162,247,.2);border-radius:8px;padding:10px;margin:8px 0;text-align:center}
    .env-explain .title{font-size:13px;color:var(--accent);font-weight:700;margin-bottom:4px}
    .env-explain .detail{font-size:13px;color:var(--muted)}

    #scannerInput{position:fixed;left:-10000px;top:-10000px;width:1px;height:1px;opacity:0;pointer-events:none}
    .toast-wrap{position:fixed;left:50%;transform:translateX(-50%);bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:30}
    .toast{background:rgba(30,30,30,.95);border:1px solid var(--border);color:var(--fg);padding:.6rem .8rem;border-radius:.6rem;box-shadow:0 6px 24px rgba(0,0,0,.35);font-size:14px}

    .hidden{display:none !important}
  </style>
</head>
<body>

  <input id="scannerInput" lang="en" inputmode="none" autocomplete="off" autocapitalize="off" spellcheck="false" />
  <div class="toast-wrap" id="toastWrap"></div>

  <script>
  (function(){
    const SHEET_EXPORT = 'https://docs.google.com/spreadsheets/d/1nWl0HEX7jkLAmUPAFX-mdjA0Yhktu81_c4v_l76MrVQ/export?format=tsv&gid=613716146';
    const DATA_TSV = 'https://www.hanmiu.cc/play/evt/25_creatures/data/data.tsv';
    const ASSET_BASE = 'https://www.hanmiu.cc/play/evt/25_creatures/assets/';

    const ATTRS_EN = ['curiosity','kindness','bravery','imagination'];
    const ATTRS_KO = ['호기심','상냥함','용감함','상상력'];

    const AGE_COLORS = { 3: '#159D40', 4: '#72BFEA', 5: '#753F97' };
    function colorForAge(age){ return AGE_COLORS[age] || '#555'; }

    // 🔊 간단 호명 (브라우저 지원 시)
    function announce(text){
      try{
        if('speechSynthesis' in window){
          const u = new SpeechSynthesisUtterance(String(text||''));
          u.lang = 'ko-KR';
          u.rate = 1;
          speechSynthesis.cancel();
          speechSynthesis.speak(u);
        }
      }catch(e){}
    }

    const ENVS = [
      { name:'불타는 산', emoji:'\uD83C\uDF0B', desc:'모험심', attr1:'용감함', attr2:'호기심', op:'+' },
      { name:'꿈의 바다', emoji:'\uD83C\uDF0C', desc:'꿈꾸는 마음', attr1:'상상력', attr2:'상냥함', op:'+' },
      { name:'신비의 숲', emoji:'\uD83C\uDF32', desc:'탐구심', attr1:'호기심', attr2:'상냥함', op:'+' },
      { name:'얼어붙은 동굴', emoji:'❄️', desc:'위험 회피', attr1:'용감함', attr2:'호기심', op:'-' },
      { name:'어두운 늪', emoji:'\uD83C\uDF11', desc:'두려움', attr1:'용감함', attr2:'상상력', op:'-' },
      { name:'빛나는 초원', emoji:'✨', desc:'평화로움', attr1:'상냥함', attr2:'호기심', op:'+' },
      { name:'천둥의 계곡', emoji:'⚡', desc:'압박', attr1:'용감함', attr2:'상냥함', op:'-' },
      { name:'고요한 호수', emoji:'\uD83C\uDF4A', desc:'평온', attr1:'상냥함', attr2:'상상력', op:'+' },
      { name:'화산 지대', emoji:'\uD83D\uDD25', desc:'도전', attr1:'용감함', attr2:'상상력', op:'+' },
      { name:'달빛 정원', emoji:'\uD83C\uDF19', desc:'환상', attr1:'상상력', attr2:'호기심', op:'+' },
      { name:'거센 바람', emoji:'\uD83D\uDCA8', desc:'역경', attr1:'용감함', attr2:'상냥함', op:'-' },
      { name:'신성한 사원', emoji:'⛩️', desc:'경외', attr1:'상냥함', attr2:'용감함', op:'+' },
      { name:'마법의 샘', emoji:'\uD83D\uDC8E', desc:'발견', attr1:'호기심', attr2:'상상력', op:'+' },
      { name:'독버섯 숲', emoji:'\uD83C\uDF44', desc:'위험', attr1:'호기심', attr2:'상냥함', op:'-' },
      { name:'별빛 언덕', emoji:'⭐', desc:'희망', attr1:'상상력', attr2:'용감함', op:'+' },
      { name:'폭포수', emoji:'\uD83C\uDFDE️', desc:'자유', attr1:'용감함', attr2:'상상력', op:'+' },
      { name:'안개 낀 다리', emoji:'\uD83C\uDF81', desc:'불확실성', attr1:'호기심', attr2:'용감함', op:'-' },
      { name:'꽃밭', emoji:'\uD83C\uDF38', desc:'치유', attr1:'상냥함', attr2:'상상력', op:'+' },
      { name:'용암 폭포', emoji:'\uD83C\uDF0B', desc:'극한', attr1:'용감함', attr2:'호기심', op:'-' },
      { name:'수정 동굴', emoji:'\uD83D\uDD20', desc:'경이', attr1:'호기심', attr2:'상상력', op:'+' },
      { name:'지진 지대', emoji:'\uD83C\uDFD4️', desc:'불안정', attr1:'용감함', attr2:'호기심', op:'-' },
      { name:'무지개 폭포', emoji:'\uD83C\uDF08', desc:'행복', attr1:'상냥함', attr2:'상상력', op:'+' },
      { name:'심연', emoji:'\uD83D\uDD73️', desc:'공포', attr1:'용감함', attr2:'상상력', op:'-' },
      { name:'선물 상자', emoji:'\uD83C\uDF81', desc:'놀라움', attr1:'호기심', attr2:'상냥함', op:'+' },
      { name:'타임머신', emoji:'⏰', desc:'모험', attr1:'상상력', attr2:'용감함', op:'+' }
    ];

    const $ = s => document.querySelector(s);
    let players = [];
    let dataMap = new Map();
    let latestByFile = new Map();
    let codeIndex = new Map();
    let baseToFile = new Map();
    let allBases = [];

    const Toast = {
      show(msg, ms=3000){
        const wrap = $('#toastWrap');
        const t = document.createElement('div');
        t.className='toast'; t.textContent=msg; wrap.appendChild(t);
        setTimeout(()=>{ t.style.opacity='0'; setTimeout(()=>t.remove(),300); }, ms);
      }
    };

    let focusLost = false;
    const scanner = $('#scannerInput');
    const focusBadge = $('#focusBadge');
    const rouletteDisplay = $('#rouletteDisplay');
    const resultBox = $('#resultBox');
    const envExplain = $('#envExplain');
    const envDetail = $('#envDetail');
    const battleResults = $('#battleResults');
    const score1El = $('#p1Score');
    const score2El = $('#p2Score');

    // 🔤 유틸
    function prettyName(s){ return String(s||'').replace(/[_-]+/g,' ').trim(); }
    function parseLatLng(str){
      const m = String(str||'').match(/(-?\d+(?:\.\d+)?)[,\s]+(-?\d+(?:\.\d+)?)/);
      return m ? { lat: parseFloat(m[1]), lng: parseFloat(m[2]) } : null;
    }

    function focusScanner(){
      scanner.focus();
      focusLost=false;
      focusBadge.className='badge ok';
      focusBadge.textContent='focused';
    }

    let refocusTimer=null;
    function scheduleRefocus(){
      clearTimeout(refocusTimer);
      refocusTimer = setTimeout(()=>{
        if(focusLost && document.visibilityState==='visible'){
          focusScanner();
        }
      }, 3000); // 3초 후 자동 포커스 복구
    }

    scanner.addEventListener('blur', ()=>{
      focusLost=true;
      focusBadge.className='badge warn';
      focusBadge.textContent='not focused';
      scheduleRefocus();
    });

    document.addEventListener('visibilitychange', ()=>{
      if(document.visibilityState==='visible' && focusLost){
        focusScanner();
      }
    });

    $('#btnFullscreen').addEventListener('click', ()=>{
      if(!document.fullscreenElement){ document.documentElement.requestFullscreen().catch(e=>console.error(e)); }
      else { document.exitFullscreen(); }
      // 전체화면 전환 시에도 스캐너 포커스 유지 시도
      setTimeout(()=>{ if(focusLost || document.activeElement!==scanner) focusScanner(); }, 200);
    });

    let idleTimer;
    function resetIdleTimer(){
      clearTimeout(idleTimer);
      document.body.classList.remove('idle');
      idleTimer = setTimeout(()=>{ document.body.classList.add('idle'); }, 60000);
    }
    document.addEventListener('click', resetIdleTimer);
    document.addEventListener('keydown', resetIdleTimer);
    resetIdleTimer();

    async function sha256hex(str){
      const buf = new TextEncoder().encode(str);
      const hash = await crypto.subtle.digest('SHA-256', buf);
      return Array.from(new Uint8Array(hash)).map(b=>b.toString(16).padStart(2,'0')).join('');
    }

    async function loadTSV(url){
      const res = await fetch(url);
      const text = await res.text();
      const lines = text.trim().split('\n');
      const headers = lines[0].split('\t');
      return lines.slice(1).map(line=>{
        const vals = line.split('\t');
        const obj = {};
        headers.forEach((h,i)=>{ obj[h.trim()] = vals[i]?.trim() || ''; });
        return obj;
      });
    }

    async function preload(){
      try{
        const meta = await loadTSV(DATA_TSV);
        meta.forEach(row=>{
          if(row.file){ dataMap.set(row.file, row); }
        });
        const logs = await loadTSV(SHEET_EXPORT);
        logs.forEach(row=>{
          if(!row.file) return;
          const ts = Date.parse(row.timestamp) || 0;
          row._ts = ts;
          const prev = latestByFile.get(row.file);
          if(!prev || ts > prev._ts){ latestByFile.set(row.file, row); }
        });
        for(const [file, row] of latestByFile){
          const base = file.replace(/\.(png)$/i,'');
          
          // NFD와 NFC 양쪽 모두 인덱싱
          const baseNFD = base.normalize('NFD').trim();
          const baseNFC = base.normalize('NFC').trim();
          
          // NFD 해시
          const hNFD = await sha256hex(baseNFD);
          const code8NFD = hNFD.slice(0,8);
          codeIndex.set(code8NFD, file);
          
          // NFC 해시 (다를 경우에만)
          if(baseNFC !== baseNFD){
            const hNFC = await sha256hex(baseNFC);
            const code8NFC = hNFC.slice(0,8);
            codeIndex.set(code8NFC, file);
          }
          
          baseToFile.set(baseNFD, file);
          baseToFile.set(baseNFC, file);
          allBases.push(baseNFD);
          if(baseNFC !== baseNFD) allBases.push(baseNFC);
        }
      }catch(e){ console.error('Preload failed:', e); }
    }

    function normalizeScores(raw){
      const sum = raw.reduce((a,b)=>a+b,0);
      if(sum===0) return [3,3,3,3];
      const scaled = raw.map(v=> Math.max(1, Math.round((v / sum) * 12)));
      let total = scaled.reduce((a,b)=>a+b,0);
      while(total<12){ const i=scaled.indexOf(Math.min(...scaled)); scaled[i]++; total++; }
      while(total>12){ const i=scaled.indexOf(Math.max(...scaled)); scaled[i]--; total--; }
      return scaled;
    }

    function toDictKo(norm){ const d={}; ATTRS_KO.forEach((a,i)=>{d[a]=norm[i];}); return d; }
    function calcScore(dict, env){ return (env.op==='+')? dict[env.attr1]+dict[env.attr2] : dict[env.attr1]-dict[env.attr2]; }

    const PLAYERS_DATA = [
      {title:'#p1Title',badges:'#p1Badges',desc:'#p1Desc',img:'#p1Img',imgFb:'#p1ImgFallback',attrs:'#p1Attrs'},
      {title:'#p2Title',badges:'#p2Badges',desc:'#p2Desc',img:'#p2Img',imgFb:'#p2ImgFallback',attrs:'#p2Attrs'}
    ];

    function leftOutRightIn(){
      renderPlayers();
      focusScanner();
    }

    function renderPlayerCard(idx, p){
      const el = PLAYERS_DATA[idx];
      const titleEl = $(el.title);
      const badgesEl = $(el.badges);
      const descEl = $(el.desc);
      const imgEl = $(el.img);
      const imgFbEl = $(el.imgFb);
      const attrsEl = $(el.attrs);

      if(!p){
        titleEl.textContent = `플레이어 ${idx+1}`;
        badgesEl.innerHTML = '';
        descEl.textContent = '—';
        imgEl.style.display='none';
        imgFbEl.style.display='grid';
        attrsEl.innerHTML = '';
        return;
      }

      titleEl.textContent = p.name;
      
      badgesEl.innerHTML = '';
      if(p.class){
        const classPill = document.createElement('span');
        classPill.className='pill';
        classPill.textContent=p.class;
        badgesEl.appendChild(classPill);
      }
      if(p.age){
        const agePill = document.createElement('span');
        agePill.className='pill age-only';
        agePill.style.background = colorForAge(p.age);
        agePill.style.borderColor = colorForAge(p.age);
        agePill.title = `${p.age}세`;
        badgesEl.appendChild(agePill);
      }
      // 📍 최초 발견 좌표 표시
      if(p.lat!=null && p.lng!=null){
        const locPill = document.createElement('span');
        locPill.className='pill';
        locPill.textContent = `📍 ${p.lat.toFixed(4)}, ${p.lng.toFixed(4)}`;
        locPill.title = '최초 발견 위치 (위도, 경도)';
        badgesEl.appendChild(locPill);
      }

      // 🦄 생물명 강조 + 설명
      if(p.creatureName){
        descEl.textContent = `🦄 ${p.creatureName}` + (p.desc? ` · ${p.desc}` : '');
      } else {
        descEl.textContent = p.desc || '—';
      }

      attrsEl.innerHTML = '';
      ATTRS_KO.forEach((k,i)=>{
        const a = document.createElement('div');
        a.className='a';
        a.innerHTML = `<div class="k">${k}</div><div class="v">${p.norm[i]}</div>`;
        attrsEl.appendChild(a);
      });

      imgFbEl.style.display='grid';
      imgEl.style.display='none';
      imgEl.onerror = function(){
        if(!this._triedUpper){
          this._triedUpper=true;
          this.src = assetUrlForFile(p.file, true);
        } else {
          this.style.display='none';
          imgFbEl.style.display='grid';
        }
      };
      imgEl.onload = function(){
        this.style.display='block';
        imgFbEl.style.display='none';
      };
      imgEl.src = assetUrlForFile(p.file, false);
    }

    function renderPlayers(){
      renderPlayerCard(0, players[players.length-2] || null);
      renderPlayerCard(1, players[players.length-1] || null);
    }

    function assetUrlForFile(file, tryUpper){
      // 서버는 NFC(조합형)를 선호하므로 NFC로 정규화
      const normalized = file.normalize('NFC');
      const base = tryUpper ? normalized.replace(/\.png$/i, '.PNG') : normalized;
      return ASSET_BASE + encodeURIComponent(base);
    }

    function nameFromFile(file){
      const base = file.replace(/\.(png)$/i, '');
      const parts = base.split('_');
      const name = parts[0] || base;
      const creature = parts.slice(1).join('_') || '';
      return { name, creature };
    }

    function getLatestRowForFile(file){
      return latestByFile.get(file) || null;
    }

    function descFor(file, row){
      if(row && row.desc && row.desc.trim()) return row.desc;
      const d = dataMap.get(file); return d && d.desc ? d.desc : '';
    }

    async function resolveFileByShortCode(code){
      if(!code) return null;
      const norm = String(code).trim().toLowerCase();

      // 8자리 고속 경로 (이미 양쪽 형식이 인덱싱되어 있음)
      if(norm.length === 8 && codeIndex.has(norm)) return codeIndex.get(norm);

      // prefix 스캔
      let foundBase = null;
      for(const base of allBases){
        // 이미 NFD/NFC 양쪽이 allBases에 들어있으므로 그대로 해시
        const h = await sha256hex(base.trim());
        if(h.slice(0, norm.length) === norm){
          if(foundBase && foundBase !== base){
            return { _ambiguous: true };
          }
          foundBase = base;
        }
      }
      return foundBase ? baseToFile.get(foundBase) : null;
    }

    async function registerByCodeOrUrl(raw){
      let code = null;
      try{
        const u = new URL(raw);
        code = u.searchParams.get('code') || u.searchParams.get('c');
      }catch{ /* not a URL */ }
      if(!code){
        const m = String(raw).trim().match(/^[0-9a-f]{6,64}$/i);
        if(m) code = m[0];
      }
      if(!code){ Toast.show('등록되지 않은 코드입니다.'); return; }

      let file = await resolveFileByShortCode(code);
      if(file && file._ambiguous){ Toast.show('코드가 모호해요. 더 긴 코드를 사용해 주세요.'); return; }
      if(!file){
        try{ await preload(); file = await resolveFileByShortCode(code); }catch(e){ console.error(e); }
      }
      if(!file){ Toast.show('등록되지 않은 코드입니다.'); return; }

      const row = getLatestRowForFile(file);
      if(!row){ Toast.show('점수 데이터가 없습니다.'); return; }

      const rawStats = [row.curiosity,row.kindness,row.bravery,row.imagination].map(v=> Math.max(1, Math.min(9, v|0)));
      const norm = normalizeScores(rawStats);
      const dictKo = toDictKo(norm);
      const meta = dataMap.get(file) || {};

      const {name, creature} = nameFromFile(file);
      const ll = parseLatLng(meta.latlng || '');
      const creatureName = prettyName(meta.creature || creature);

      const player = {
        file, code, name, creature: creature.replace(/\.(png)$/i,''),
        creatureName: creatureName || '',
        imgUrl: assetUrlForFile(file, false),
        desc: descFor(file, row),
        class: meta.class || '',
        age: meta.age || null,
        lat: ll? ll.lat : null,
        lng: ll? ll.lng : null,
        raw: rawStats, norm, dictKo, ts: row._ts
      };

      players.push(player);
      while(players.length>2) players.shift();
      leftOutRightIn();
    }

    let selectedEnv = null;
    function displayEnv(env, spinning){
      rouletteDisplay.className = 'roulette-display' + (spinning ? ' spinning' : '');
      const opClass = env.op==='+'? 'op-plus' : 'op-minus';
      const opSymbol = env.op==='+'? '➕' : '➖';
      rouletteDisplay.innerHTML = `
        <span class="emoji">${env.emoji}</span>
        <div class="name">${env.name}</div>
        <div class="formula"><span>${env.attr1}</span> <span class="${opClass}">${opSymbol}</span> <span>${env.attr2}</span></div>
        <div class="desc">${env.desc}</div>
      `;
    }

    function runRoulette(){
      const steps = 5 + Math.floor(Math.random()*3);
      const seq = [];
      const tmp = [...ENVS];
      for(let i=0;i<steps;i++) seq.push(tmp.splice(Math.floor(Math.random()*tmp.length),1)[0]);
      let i=0, delay=120;
      
      battleResults.style.display='none';
      resultBox.style.display='none';
      envExplain.style.display='none';
      
      function spin(){
        if(i<seq.length){
          displayEnv(seq[i], true);
          i++;
          delay += 60 + i*20;
          setTimeout(spin, delay);
        } else {
          selectedEnv = seq[seq.length-1];
          displayEnv(selectedEnv, false);
        }
      }
      spin();
    }

    function ensureTwo(){ return !!(players[players.length-2] && players[players.length-1]); }

    function updateBars(container, dict, env){
      container.innerHTML = '';
      ATTRS_KO.forEach(k=>{
        const isHighlight = (k === env.attr1 || k === env.attr2);
        const bar = document.createElement('div');
        bar.className = 'bar' + (isHighlight ? ' highlight' : '');
        const label = document.createElement('div');
        label.className = 'bar-label';
        label.innerHTML = `<span>${k}</span><span>${dict[k]}</span>`;
        const track = document.createElement('div');
        track.className = 'bar-track';
        const fill = document.createElement('div');
        fill.className = 'bar-fill';
        fill.style.width = '0%';
        track.appendChild(fill);
        bar.appendChild(label);
        bar.appendChild(track);
        container.appendChild(bar);
        setTimeout(() => { fill.style.width = `${(dict[k] / 12) * 100}%`; }, 100);
      });
    }

    function highlightAttrs(container, env){
      const attrs = container.querySelectorAll('.a');
      attrs.forEach((a, i) => {
        const attrName = ATTRS_KO[i];
        if(attrName === env.attr1 || attrName === env.attr2){
          a.classList.add('highlight');
        } else {
          a.classList.remove('highlight');
        }
      });
    }

    function duel(){
      if(!ensureTwo()){ Toast.show('두 플레이어가 필요합니다.'); return; }
      if(!selectedEnv){ Toast.show('먼저 roll 로 환경을 뽑아주세요.'); return; }
      
      const p1 = players[players.length-2];
      const p2 = players[players.length-1];
      const s1 = calcScore(p1.dictKo, selectedEnv);
      const s2 = calcScore(p2.dictKo, selectedEnv);
      
      score1El.textContent = s1;
      score2El.textContent = s2;

      // 미니 타이틀: 생물명 우선 표시
      $('#p1Mini').textContent = p1.creatureName || p1.name;
      $('#p2Mini').textContent = p2.creatureName || p2.name;

      const opClass = selectedEnv.op === '+' ? 'op-plus' : 'op-minus';
      $('#p1Breakdown').innerHTML = `
        <span class="calc">
          <span class="attr">${p1.dictKo[selectedEnv.attr1]}</span>
          <span class="${opClass}">${selectedEnv.op}</span>
          <span class="attr">${p1.dictKo[selectedEnv.attr2]}</span>
          = ${s1}
        </span>
      `;
      $('#p2Breakdown').innerHTML = `
        <span class="calc">
          <span class="attr">${p2.dictKo[selectedEnv.attr1]}</span>
          <span class="${opClass}">${selectedEnv.op}</span>
          <span class="attr">${p2.dictKo[selectedEnv.attr2]}</span>
          = ${s2}
        </span>
      `;

      updateBars($('#p1Bars'), p1.dictKo, selectedEnv);
      updateBars($('#p2Bars'), p2.dictKo, selectedEnv);

      highlightAttrs($('#p1Attrs'), selectedEnv);
      highlightAttrs($('#p2Attrs'), selectedEnv);

      envExplain.style.display='block';
      envDetail.innerHTML = `
        <strong>${selectedEnv.name}</strong> (${selectedEnv.desc})<br>
        공식: ${selectedEnv.attr1} ${selectedEnv.op} ${selectedEnv.attr2}
      `;

      let outcomeText, outcomeCls;
      if(s1 > s2){
        outcomeText = `🏆 ${p1.name}의 ${p1.creatureName || '생물'} 승리!`;
        outcomeCls = 'win';
        announce(`${p1.name}의 ${p1.creatureName || '생물'} 승리!`);
      } else if(s1 < s2){
        outcomeText = `🏆 ${p2.name}의 ${p2.creatureName || '생물'} 승리!`;
        outcomeCls = 'win';
        announce(`${p2.name}의 ${p2.creatureName || '생물'} 승리!`);
      } else {
        outcomeText = '⚖️ 무승부!';
        outcomeCls = 'draw';
        announce('무승부!');
      }

      resultBox.className = 'result ' + outcomeCls;
      resultBox.textContent = `${outcomeText} (${s1} vs ${s2})`;
      resultBox.style.display='block';
      resultBox.style.animation = 'none';
      setTimeout(() => resultBox.style.animation = 'fadeIn .5s ease forwards', 10);

      battleResults.style.display='block';
    }

    function processScan(raw){
      const v = String(raw||'').trim(); if(!v) return;
      if(v.toLowerCase() === 'roll') { runRoulette(); return; }
      if(v.toLowerCase() === 'duel') { duel(); return; }
      registerByCodeOrUrl(v).catch(err=>{ console.error(err); Toast.show('등록 실패'); });
    }

    scanner.addEventListener('keydown', (e)=>{
      if(e.key==='Enter'){
        e.preventDefault();
        const raw = scanner.value; scanner.value='';
        processScan(raw);
        setTimeout(focusScanner, 30);
      }
    });
    scanner.addEventListener('paste', (e)=>{
      const text = (e.clipboardData && e.clipboardData.getData('text')) || '';
      if(text){ e.preventDefault(); processScan(text); setTimeout(focusScanner, 30); }
    });

    $('#btnRoll').addEventListener('click', ()=>{ runRoulette(); focusScanner(); });
    $('#btnDuel').addEventListener('click', ()=>{ duel(); focusScanner(); });

    preload().then(()=>{
      // Ready
    }).catch(err=> console.error(err));

    renderPlayers();
    focusScanner();
  })();
  </script>
</body>
</html>
