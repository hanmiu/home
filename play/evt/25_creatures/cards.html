<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Creatures Card</title>
<style>
  body{margin:0;background:#f2f2f2;font-family:"Noto Sans KR",system-ui,sans-serif}
  .wrap{max-width:420px;margin:0 auto;padding:16px}
  canvas{width:100%;height:auto;background:#fff;box-shadow:0 8px 24px rgba(0,0,0,.12);}
  .err{color:#c00;padding:12px}
</style>
</head>
<body>
<div class="wrap">
  <canvas id="card"></canvas>
  <div id="msg" class="err" hidden></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script type="module">
import { CONFIG, parseTSV, b64urlDecode, drawCard } from './layout.js';

// 설정(필요시 쿼리로 오버라이드)
const params = new URLSearchParams(location.search);
const code = params.get('code');
const dataUrl = params.get('data') || CONFIG.TSV_URL;
const assetsBase = params.get('assets') || CONFIG.ASSETS_BASE;

const msg = document.getElementById('msg');
function fail(e){ msg.hidden=false; msg.textContent = e instanceof Error? e.message : e; throw e; }
if(!code) fail('code 파라미터가 필요합니다.');

let basename;
try { basename = b64urlDecode(code); } catch(e){ fail('code 디코드 실패'); }

try{
  // TSV 로드 → basename 리스트
  const tsv = await (await fetch(dataUrl, {cache:'reload'})).text();
  const bases = parseTSV(tsv);
  if(!bases.includes(basename)) console.warn('주의: TSV에 현재 basename이 없거나 파일명이 변경되었을 수 있습니다.');

  // 캔버스 렌더
  const canvas = document.getElementById('card');
  const qrBase = params.get('qrBase');
  const selfUrl = (qrBase ? qrBase.replace(/\/$/, '') : (location.origin + location.pathname)) + '?code=' + encodeURIComponent(code);
  await drawCard({canvas, basename, allBasenames:bases, assetsBase, drawQR:true, qrUrl:selfUrl});
} catch(e){ fail(e); }
</script>
</body>
</html>
