                            pass.setBindGroup(2, stepBG_A);
                            pass.dispatchWorkgroups(Math.ceil(simParams.num / 128));
                            pass.end();
                        }
                        device.queue.submit([enc.finish()]);
                    } catch (e) {}
                    const err = await device.popErrorScope();
                    results.push(['compute_chain', err === null]);
                    elPerf.textContent = (results.every( ([_,v]) => v) ? '✓ SelfTest OK' : '✗ SelfTest FAIL') + ' • ' + results.map( ([k,v]) => `${k}:${v ? 'ok' : 'fail'}`).join(', ');
                }
                elSelf.onclick = () => {
                    selfTest();
                }
                ;

                // Frame loop
                let tPrev = performance.now();
                let ping = true;
                let frames = 0
                  , accTime = 0;
                let dtCap = 0.033;
                function frame() {
                    resize();
                    const t = performance.now();
                    let dt = Math.min(dtCap, (t - tPrev) / 1000);
                    tPrev = t;
                    dt = Math.max(0.001, dt);
                    updateCameraUBO();
                    writeSimUBO(paused ? 0.0 : dt);

                    const encoder = device.createCommandEncoder();
                    if (!paused) {
                        {
                            const cpass = encoder.beginComputePass();
                            cpass.setPipeline(clearPipeline);
                            cpass.setBindGroup(0, clearBG);
                            cpass.dispatchWorkgroups(Math.ceil(simParams.gridCount / 128));
                            cpass.end();
                        }
                        {
                            const cpass = encoder.beginComputePass();
                            cpass.setPipeline(buildPipeline);
                            cpass.setBindGroup(1, ping ? buildBG_A : buildBG_B);
                            cpass.dispatchWorkgroups(Math.ceil(simParams.num / 128));
                            cpass.end();
                        }
                        {
                            const cpass = encoder.beginComputePass();
                            cpass.setPipeline(stepPipeline);
                            cpass.setBindGroup(2, ping ? stepBG_A : stepBG_B);
                            cpass.dispatchWorkgroups(Math.ceil(simParams.num / 128));
                            cpass.end();
                        }
                    }

                    const colorView = context.getCurrentTexture().createView();
                    const depthView = depthTex.createView();
                    const rpass = encoder.beginRenderPass({
                        colorAttachments: [{
                            view: colorView,
                            clearValue: {
                                r: 0.05,
                                g: 0.07,
                                b: 0.10,
                                a: 1
                            },
                            loadOp: 'clear',
                            storeOp: 'store'
                        }],
                        depthStencilAttachment: {
                            view: depthView,
                            depthClearValue: 1.0,
                            depthLoadOp: 'clear',
                            depthStoreOp: 'store'
                        },
                    });

                    // world box faces + edges + particles
                    rpass.setPipeline(boxPipeline);
                    rpass.setBindGroup(0, boxBG);
                    rpass.setVertexBuffer(0, cubePosBuf);
                    rpass.setVertexBuffer(1, cubeNrmBuf);
                    rpass.draw(36, 1, 0, 0);
                    rpass.setPipeline(linePipeline);
                    rpass.setBindGroup(0, lineBG);
                    rpass.setVertexBuffer(0, cubeEdgeBuf);
                    rpass.draw(24, 1, 0, 0);
                    rpass.setPipeline(particlePipeline);
                    rpass.setVertexBuffer(0, quadVB);
                    rpass.setBindGroup(0, ping ? particleBG_A : particleBG_B);
                    rpass.draw(4, simParams.num, 0, 0);
                    rpass.end();

                    device.queue.submit([encoder.finish()]);
                    if (!paused)
                        ping = !ping;

                    frames++;
                    accTime += dt;
                    if (accTime > 1.0) {
                        elPerf.textContent = `${simParams.num}p @ grid ${simParams.gridDim}³  •  ${(frames / accTime).toFixed(0)} FPS`;
                        frames = 0;
                        accTime = 0;
                    }
                    requestAnimationFrame(frame);
                }
                requestAnimationFrame(frame);
            }
            )();
        </script>
    </body>
