<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIXEL</title>
    <style>
        body { margin: 0; overflow: hidden; }
        #canvas { display: block; }
        #bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }
    </style>
</head>
<body>
    <img id="bg" src="./assets/pixelart/bg.svg">
    <canvas id="canvas"></canvas>
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const GROUND_HEIGHT = 150;
        const GRAVITY = 0.5;
        // 키 입력 상태를 추적하기 위한 객체
        const keys = {
            ArrowLeft: false,
            ArrowRight: false,
            ArrowUp: false,
            KeyW: false,
            KeyA: false,
            KeyD: false
        };

        const sprites = [];
        let animationId = null;
        let lastInputTime = Date.now();

        class Sprite {
            constructor(ctx, x, y, size, isPlayer = false) {
                this.img = ctx.canvas;
                this.imageData = ctx.getImageData(0, 0, size, size).data;
                this.x = x;
                this.y = y;
                this.size = size;
                this.width = size;
                this.height = size;
                this.vx = 0;
                this.vy = 0;
                this.jumpForce = -10;
                this.onGround = false;
                this.boundingBox = this.calculateBoundingBox();
                this.isPlayer = isPlayer;
                this.isControlled = false;
                this.moveSpeed = 5;
            }

            calculateBoundingBox() {
                let left = this.size, right = 0, top = this.size, bottom = 0;
                for (let y = 0; y < this.size; y++) {
                    for (let x = 0; x < this.size; x++) {
                        const i = (y * this.size + x) * 4;
                        if (this.imageData[i + 3] > 0) {
                            left = Math.min(left, x);
                            right = Math.max(right, x);
                            top = Math.min(top, y);
                            bottom = Math.max(bottom, y);
                        }
                    }
                }
                return {
                    left: left,
                    right: right,
                    top: top,
                    bottom: bottom
                };
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.drawImage(this.img, 0, 0);
                ctx.restore();
            }

            update() {
                if (!this.isPlayer || (this.isPlayer && !this.isControlled)) {
                    if (this.onGround) {
                        this.vx = 0;
                        if (Math.random() < 0.02) {
                            this.jump();
                        }
                    }
                }
                
                if (!this.onGround) {
                    this.vy += GRAVITY;
                }

                this.x += this.vx;
                this.y += this.vy;

                // 바닥 충돌 체크
                if (this.y + this.height > canvas.height - GROUND_HEIGHT) {
                    this.y = canvas.height - GROUND_HEIGHT - this.height;
                    this.vy = 0;
                    this.onGround = true;
                } else {
                    this.onGround = false;
                }

                // 벽 충돌 체크
                if (this.x < 0) {
                    this.x = 0;
                    this.vx = this.isControlled ? 0 : Math.abs(this.vx);
                } else if (this.x + this.width > canvas.width) {
                    this.x = canvas.width - this.width;
                    this.vx = this.isControlled ? 0 : -Math.abs(this.vx);
                }
            }

            jump() {
                this.vy = this.jumpForce * (Math.random() * 0.5 + 0.75);  // 75% ~ 125% of jumpForce
                this.vx = (Math.random() - 0.5) * 10;  // Random horizontal velocity
                this.onGround = false;
            }

            collidesWith(other) {
                return !(this.x + this.boundingBox.right < other.x + other.boundingBox.left ||
                         this.x + this.boundingBox.left > other.x + other.boundingBox.right ||
                         this.y + this.boundingBox.bottom < other.y + other.boundingBox.top ||
                         this.y + this.boundingBox.top > other.y + other.boundingBox.bottom);
            }

            resolveCollision(other) {
                // 충돌 방향 계산
                const dx = (this.x + this.width / 2) - (other.x + other.width / 2);
                const dy = (this.y + this.height / 2) - (other.y + other.height / 2);

                // 겹침 방지
                const overlapX = (this.width + other.width) / 2 - Math.abs(dx);
                const overlapY = (this.height + other.height) / 2 - Math.abs(dy);

                if (overlapX > 0 && overlapY > 0) {
                    if (overlapX < overlapY) {
                        // 수평 방향으로 밀어냄
                        if (dx > 0) {
                            this.x += overlapX / 2;
                            other.x -= overlapX / 2;
                        } else {
                            this.x -= overlapX / 2;
                            other.x += overlapX / 2;
                        }
                        // 수평 속도 반전
                        this.vx *= -1;
                        other.vx *= -1;
                    } else {
                        // 수직 방향으로 밀어냄
                        if (dy > 0) {
                            this.y += overlapY / 2;
                            other.y -= overlapY / 2;
                        } else {
                            this.y -= overlapY / 2;
                            other.y += overlapY / 2;
                        }
                        // 수직 속도 반전
                        this.vy *= -0.5;
                        other.vy *= -0.5;
                    }
                }
            }
        }

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        // 키 이벤트 리스너 추가
        window.addEventListener('keydown', (e) => {
            keys[e.code] = true;
            lastInputTime = Date.now();
            if (sprites.length > 0) {
                sprites[sprites.length - 1].isControlled = true;
                if (sprites.length > 1) {
                    sprites[sprites.length - 2].isControlled = true;
                }
            }
        });

        window.addEventListener('keyup', (e) => {
            keys[e.code] = false;
        });

        function updatePlayers() {
            const currentTime = Date.now();
            const timeSinceLastInput = currentTime - lastInputTime;
            
            if (sprites.length > 0) {
                const player1 = sprites[sprites.length - 1];
                
                // 30초 이상 입력이 없으면 자동 모드로 전환
                if (timeSinceLastInput > 30000) {
                    player1.isControlled = false;
                    if (sprites.length > 1) {
                        sprites[sprites.length - 2].isControlled = false;
                    }
                    return;
                }

                if (player1.isControlled) {
                    // Player 1 controls (arrow keys)
                    player1.vx = 0;
                    if (keys.ArrowLeft) player1.vx = -player1.moveSpeed;
                    if (keys.ArrowRight) player1.vx = player1.moveSpeed;
                    if (keys.ArrowUp && player1.onGround) {
                        player1.vy = player1.jumpForce;
                        player1.onGround = false;
                    }
                }

                // Player 2 controls (WAD keys)
                if (sprites.length > 1) {
                    const player2 = sprites[sprites.length - 2];
                    if (player2.isControlled) {
                        player2.vx = 0;
                        if (keys.KeyA) player2.vx = -player2.moveSpeed;
                        if (keys.KeyD) player2.vx = player2.moveSpeed;
                        if (keys.KeyW && player2.onGround) {
                            player2.vy = player2.jumpForce;
                            player2.onGround = false;
                        }
                    }
                }
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            updatePlayers();
            
            sprites.forEach(sprite => {
                sprite.update();
                sprite.draw();
            });

            for (let i = 0; i < sprites.length; i++) {
                for (let j = i + 1; j < sprites.length; j++) {
                    if (sprites[i].collidesWith(sprites[j])) {
                        sprites[i].resolveCollision(sprites[j]);
                    }
                }
            }

            animationId = requestAnimationFrame(animate);
        }

        function init() {
            const sketchCanvas = document.createElement('canvas');
            const sketchCtx = sketchCanvas.getContext('2d');
            const pixelarts = JSON.parse(localStorage.getItem('pixelarts'));
            
            let bg_id = Math.floor(Math.random() * 5) + 1;
            let bg_filename = `BG${String(bg_id).padStart(2, '0')}.jpg`;
            document.getElementById('bg').src = `./assets/pixelart/${bg_filename}`; 

            if (pixelarts) {
                for(let i = 0; i < pixelarts.length; i++) {
                    const pixelart = pixelarts[i];
                    sketchCanvas.width = Number(pixelart.size);
                    sketchCanvas.height = Number(pixelart.size);
                    
                    for (let j = 0; j < pixelart.pixels.length; j++) {
                        const color = pixelart.pixels[j];
                        if (color !== 'transparent') {
                            sketchCtx.fillStyle = color;
                            sketchCtx.fillRect(j % pixelart.size, Math.floor(j / pixelart.size), 1, 1);
                        }
                    }
                    
                    const tempCanvas = document.createElement('canvas');
                    const tempCtx = tempCanvas.getContext('2d');
                    tempCtx.imageSmoothingEnabled = false;
                    let size = 128;
                    tempCtx.drawImage(sketchCanvas, 0, 0, size, size);
                    const x = Math.random() * (canvas.width - size * 2);
                    const y = Math.random() * (canvas.height - GROUND_HEIGHT - size * 2);
                    
                    // 마지막 두 스프라이트는 플레이어로 설정
                    const isPlayer = (i >= pixelarts.length - 2);
                    sprites.push(new Sprite(tempCtx, x, y, size, isPlayer));
                }
                animate();
            }
        }

        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
        init();
    </script>
</body>
</html>
