<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Adaptive Color Quantization with Cell Size Control</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; margin: 0; }
        .container { display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .canvas-container { display: flex; gap: 20px; margin-top: 20px; }
        #quantizedCanvas { image-rendering: pixelated; }
        .palette { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 10px; }
        .color-input { width: 30px; height: 30px; padding: 0; border: none; cursor: pointer; }
        #dropZone { border: 2px dashed #ccc; padding: 20px; text-align: center; cursor: pointer; }
        #dropZone.drag-over { background-color: #f0f0f0; }
        .control-group { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
        #cellSizeValue, #paletteSizeValue { width: 50px; }
        #svgButtons {
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="dropZone">
            Drag and drop an image here or click to select
            <input type="file" id="fileInput" accept="image/*" style="display: none;">
        </div>
        <div class="control-group">
            <label for="paletteSize">Palette Size: </label>
            <input type="range" id="paletteSize" min="2" max="32" value="8">
            <span id="paletteSizeValue">8</span>
        </div>
        <div class="control-group">
            <label for="cellSize">Cell Size: </label>
            <input type="range" id="cellSize" min="2" max="32" value="8">
            <input type="number" id="cellSizeValue" min="2" max="32" value="8">
        </div>
        <div class="canvas-container">
            <canvas id="originalCanvas"></canvas>
            <canvas id="quantizedCanvas"></canvas>
        </div>
        <div id="palette" class="palette"></div>
        <div id="svgButtons">
            <button id="savePixelatedSvg">Save Pixelated SVG</button>
            <button id="makeSvg">Make SVG</button>
            <button id="saveSvg">Save SVG</button>
        </div>
        <div id="svgPreview"></div>
    </div>
    <script>
        class Point {
            constructor(x = 0, y = 0) {
                this.x = x;
                this.y = y;
            }

            copy() {
                return new Point(this.x, this.y);
            }
        }

        class Bitmap {
            constructor(w, h) {
                this.w = w;
                this.h = h;
                this.size = w * h;
                this.arraybuffer = new ArrayBuffer(this.size);
                this.data = new Int8Array(this.arraybuffer);
            }

            at(x, y) {
                return (x >= 0 && x < this.w && y >=0 && y < this.h) && 
                    this.data[this.w * y + x] === 1;
            }

            index(i) {
                const point = new Point();
                point.y = Math.floor(i / this.w);
                point.x = i - point.y * this.w;
                return point;
            }

            flip(x, y) {
                if (this.at(x, y)) {
                    this.data[this.w * y + x] = 0;
                } else {
                    this.data[this.w * y + x] = 1;
                }
            }

            copy() {
                let bm = new Bitmap(this.w, this.h), i;
                for (i = 0; i < this.size; i++) {
                    bm.data[i] = this.data[i];
                }
                return bm;
            }
        }

        class Path {
            constructor() {
                this.area = 0;
                this.len = 0;
                this.curve = {};
                this.pt = [];
                this.minX = 100000;
                this.minY = 100000;
                this.maxX = -1;
                this.maxY = -1;
            }
        }

        class Curve {
            constructor(n) {
                this.n = n;
                this.tag = new Array(n);
                this.c = new Array(n * 3);
                this.alphaCurve = 0;
                this.vertex = new Array(n);
                this.alpha = new Array(n);
                this.alpha0 = new Array(n);
                this.beta = new Array(n);
            }
        }

        class Quad {
            constructor() {
                this.data = [0,0,0,0,0,0,0,0,0];
            }

            at(x, y) {
                return this.data[x * 3 + y];
            }
        }

        class Sum {
            constructor(x, y, xy, x2, y2) {
                this.x = x;
                this.y = y;
                this.xy = xy;
                this.x2 = x2;
                this.y2 = y2;
            }
        }

        class Opti {
            constructor() {
                this.pen = 0;
                this.c = [new Point(), new Point()];
                this.t = 0;
                this.s = 0;
                this.alpha = 0;
            }
        }

        let bm = null,
            pathlist = [],
            callback,
            info = {
                isReady: false,
                turnpolicy: "minority", 
                turdsize: 2,
                optcurve: true,
                alphamax: 1,
                opttolerance: 0.2
            };

        function setParameter(obj) {
            let key;
            for (key in obj) {
                if (obj.hasOwnProperty(key)) {
                    info[key] = obj[key];
                }
            }
        }

        function loadBm(imgdataobj) {
            if (info.isReady) {
                clear();
            }
            bm = new Bitmap(imgdataobj.width, imgdataobj.height);
            let l = imgdataobj.data.length, i, j, color;
            for (i = 0, j = 0; i < l; i += 4, j++) {
                color = 0.2126 * imgdataobj.data[i] + 0.7153 * imgdataobj.data[i + 1] +
                    0.0721 * imgdataobj.data[i + 2];
                bm.data[j] = (color < 128 ? 1 : 0);
            }
            info.isReady = true;
        }

        function bmToPathlist() {

            let bm1 = bm.copy(),
                currentPoint = new Point(0, 0),
                path;
            
            function findNext(point) {
                let i = bm1.w * point.y + point.x;
                while (i < bm1.size && bm1.data[i] !== 1) {
                    i++;
                }
                return i < bm1.size && bm1.index(i);
            }
            
            function majority(x, y) {
                let i, a, ct;
                for (i = 2; i < 5; i++) {
                    ct = 0;
                    for (a = -i + 1; a <= i - 1; a++) {
                    ct += bm1.at(x + a, y + i - 1) ? 1 : -1;
                    ct += bm1.at(x + i - 1, y + a - 1) ? 1 : -1;
                    ct += bm1.at(x + a - 1, y - i) ? 1 : -1;
                    ct += bm1.at(x - i, y + a) ? 1 : -1;
                    }
                    if (ct > 0) {
                    return 1;
                    } else if (ct < 0) {
                    return 0;
                    }
                }
                return 0;
            }
            
            function findPath(point) {
                let path = new Path(),
                    x = point.x, y = point.y,
                    dirx = 0, diry = 1, tmp;
            
                path.sign = bm.at(point.x, point.y) ? "+" : "-";
            
                while (1) {
                    path.pt.push(new Point(x, y));
                    if (x > path.maxX)
                    path.maxX = x;
                    if (x < path.minX)
                    path.minX = x;
                    if (y > path.maxY)
                    path.maxY = y;
                    if (y < path.minY)
                    path.minY = y;
                    path.len++;
                    
                    x += dirx;
                    y += diry;
                    path.area -= x * diry;
                    
                    if (x === point.x && y === point.y)
                    break;
                    
                    let l = bm1.at(x + (dirx + diry - 1 ) / 2, y + (diry - dirx - 1) / 2);
                    let r = bm1.at(x + (dirx - diry - 1) / 2, y + (diry + dirx - 1) / 2);
                    
                    if (r && !l) {
                    if (info.turnpolicy === "right" ||
                    (info.turnpolicy === "black" && path.sign === '+') ||
                    (info.turnpolicy === "white" && path.sign === '-') ||
                    (info.turnpolicy === "majority" && majority(x, y)) ||
                    (info.turnpolicy === "minority" && !majority(x, y))) {
                        tmp = dirx;
                        dirx = -diry;
                        diry = tmp;
                    } else {
                        tmp = dirx;
                        dirx = diry;
                        diry = -tmp;
                    }
                    } else if (r) {
                        tmp = dirx;
                        dirx = -diry;
                        diry = tmp;
                    } else if (!l) {
                        tmp = dirx;
                        dirx = diry;
                        diry = -tmp;
                    }
                }
                return path;
            }
            
            function xorPath(path){
                let y1 = path.pt[0].y,
                    len = path.len,
                    x, y, maxX, minY, i, j;
                for (i = 1; i < len; i++) {
                    x = path.pt[i].x;
                    y = path.pt[i].y;
                    
                    if (y !== y1) {
                        minY = y1 < y ? y1 : y;
                        maxX = path.maxX;
                        for (j = x; j < maxX; j++) {
                            bm1.flip(j, minY);
                        }
                        y1 = y;
                    }
                }
            }
            
            while (currentPoint = findNext(currentPoint)) {
                path = findPath(currentPoint);
                
                xorPath(path);
                
                if (path.area > info.turdsize) {
                    pathlist.push(path);
                }
            }
            
        }


        function processPath() {
            
            function mod(a, n) {
                return a >= n ? a % n : a>=0 ? a : n-1-(-1-a) % n;
            }

            function xprod(p1, p2) {
                return p1.x * p2.y - p1.y * p2.x;
            }
            
            function cyclic(a, b, c) {
                if (a <= c) {
                    return (a <= b && b < c);
                } else {
                    return (a <= b || b < c);
                }
            }
            
            function sign(i) {
                return i > 0 ? 1 : i < 0 ? -1 : 0;
            }
            
            function quadform(Q, w) {
                let v = new Array(3), i, j, sum;
            
                v[0] = w.x;
                v[1] = w.y;
                v[2] = 1;
                sum = 0.0;
                
                for (i=0; i<3; i++) {
                    for (j=0; j<3; j++) {
                    sum += v[i] * Q.at(i, j) * v[j];
                    }
                }
                return sum;
            }

            function interval(lambda, a, b) {
                let res = new Point();
                
                res.x = a.x + lambda * (b.x - a.x);
                res.y = a.y + lambda * (b.y - a.y);
                return res;
            }
            
            function dorth_infty(p0, p2) {
                let r = new Point();
                
                r.y = sign(p2.x - p0.x);
                r.x = -sign(p2.y - p0.y);
                
                return r;
            }
            
            function ddenom(p0, p2) {
                let r = dorth_infty(p0, p2);
                
                return r.y * (p2.x - p0.x) - r.x * (p2.y - p0.y);
            }
            
            function dpara(p0, p1, p2) {
                let x1, y1, x2, y2;
            
                x1 = p1.x - p0.x;
                y1 = p1.y - p0.y;
                x2 = p2.x - p0.x;
                y2 = p2.y - p0.y;
            
                return x1 * y2 - x2 * y1;
            }
            
            function cprod(p0, p1, p2, p3) {
                let x1, y1, x2, y2;
                
                x1 = p1.x - p0.x;
                y1 = p1.y - p0.y;
                x2 = p3.x - p2.x;
                y2 = p3.y - p2.y;
                
                return x1 * y2 - x2 * y1;
            }
            
            function iprod(p0, p1, p2) {
                let x1, y1, x2, y2;
                
                x1 = p1.x - p0.x;
                y1 = p1.y - p0.y;
                x2 = p2.x - p0.x;
                y2 = p2.y - p0.y;
                
                return x1*x2 + y1*y2;
            }
            
            function iprod1(p0, p1, p2, p3) {
                let x1, y1, x2, y2;
                
                x1 = p1.x - p0.x;
                y1 = p1.y - p0.y;
                x2 = p3.x - p2.x;
                y2 = p3.y - p2.y;
                
                return x1 * x2 + y1 * y2;
            }
            
            function ddist(p, q) {
                return Math.sqrt((p.x - q.x) * (p.x - q.x) + (p.y - q.y) * (p.y - q.y));
            }
            
            function bezier(t, p0, p1, p2, p3) {
                let s = 1 - t, res = new Point();
                
                res.x = s*s*s*p0.x + 3*(s*s*t)*p1.x + 3*(t*t*s)*p2.x + t*t*t*p3.x;
                res.y = s*s*s*p0.y + 3*(s*s*t)*p1.y + 3*(t*t*s)*p2.y + t*t*t*p3.y;
                
                return res;
            }

            function tangent(p0, p1, p2, p3, q0, q1) {
                let A, B, C, a, b, c, d, s, r1, r2;
                
                A = cprod(p0, p1, q0, q1);
                B = cprod(p1, p2, q0, q1);
                C = cprod(p2, p3, q0, q1);
                
                a = A - 2 * B + C;
                b = -2 * A + 2 * B;
                c = A;
                
                d = b * b - 4 * a * c;
                
                if (a===0 || d<0) {
                    return -1.0;
                }
                
                s = Math.sqrt(d);
                
                r1 = (-b + s) / (2 * a);
                r2 = (-b - s) / (2 * a);
                
                if (r1 >= 0 && r1 <= 1) {
                    return r1;
                } else if (r2 >= 0 && r2 <= 1) {
                    return r2;
                } else {
                    return -1.0;
                }
            }
                
            function calcSums(path) {
                let i, x, y;
                path.x0 = path.pt[0].x;
                path.y0 = path.pt[0].y;
                
                path.sums = [];
                let s = path.sums;
                s.push(new Sum(0, 0, 0, 0, 0));
                for(i = 0; i < path.len; i++){
                    x = path.pt[i].x - path.x0;
                    y = path.pt[i].y - path.y0;
                    s.push(new Sum(s[i].x + x, s[i].y + y, s[i].xy + x * y,
                        s[i].x2 + x * x, s[i].y2 + y * y));
                }
            }
            
            function calcLon(path) {
            
                let n = path.len, pt = path.pt, dir,
                    pivk = new Array(n),
                    nc = new Array(n),
                    ct = new Array(4);
                    path.lon = new Array(n);
            
                let constraint = [new Point(), new Point()],
                    cur = new Point(),
                    off = new Point(),
                    dk = new Point(),
                    foundk;
            
                let i, j, k1, a, b, c, d, k = 0;
                for(i = n - 1; i >= 0; i--){
                    if (pt[i].x != pt[k].x && pt[i].y != pt[k].y) {
                    k = i + 1;
                    }
                    nc[i] = k;
                }
            
                for (i = n - 1; i >= 0; i--) {
                    ct[0] = ct[1] = ct[2] = ct[3] = 0;
                    dir = (3 + 3 * (pt[mod(i + 1, n)].x - pt[i].x) + 
                        (pt[mod(i + 1, n)].y - pt[i].y)) / 2;
                    ct[dir]++;
                    
                    constraint[0].x = 0;
                    constraint[0].y = 0;
                    constraint[1].x = 0;
                    constraint[1].y = 0;
                    
                    k = nc[i];
                    k1 = i;
                    while (1) {
                    foundk = 0;
                    dir =  (3 + 3 * sign(pt[k].x - pt[k1].x) + 
                        sign(pt[k].y - pt[k1].y)) / 2;
                    ct[dir]++;
                    
                    if (ct[0] && ct[1] && ct[2] && ct[3]) {
                        pivk[i] = k1;
                        foundk = 1;
                        break;
                    }
                    
                    cur.x = pt[k].x - pt[i].x;
                    cur.y = pt[k].y - pt[i].y;
                    
                    if (xprod(constraint[0], cur) < 0 || xprod(constraint[1], cur) > 0) {
                        break;
                    }
                        
                    if (Math.abs(cur.x) <= 1 && Math.abs(cur.y) <= 1) {
                    
                    } else {
                        off.x = cur.x + ((cur.y >= 0 && (cur.y > 0 || cur.x < 0)) ? 1 : -1);
                        off.y = cur.y + ((cur.x <= 0 && (cur.x < 0 || cur.y < 0)) ? 1 : -1);
                        if (xprod(constraint[0], off) >= 0) {
                        constraint[0].x = off.x;
                        constraint[0].y = off.y;
                        }
                        off.x = cur.x + ((cur.y <= 0 && (cur.y < 0 || cur.x < 0)) ? 1 : -1);
                        off.y = cur.y + ((cur.x >= 0 && (cur.x > 0 || cur.y < 0)) ? 1 : -1);
                        if (xprod(constraint[1], off) <= 0) {
                        constraint[1].x = off.x;
                        constraint[1].y = off.y;
                        }
                    }
                    k1 = k;
                    k = nc[k1];
                    if (!cyclic(k, i, k1)) {
                        break;
                    }
                    }
                    if (foundk === 0) {
                    dk.x = sign(pt[k].x-pt[k1].x);
                    dk.y = sign(pt[k].y-pt[k1].y);
                    cur.x = pt[k1].x - pt[i].x;
                    cur.y = pt[k1].y - pt[i].y;

                    a = xprod(constraint[0], cur);
                    b = xprod(constraint[0], dk);
                    c = xprod(constraint[1], cur);
                    d = xprod(constraint[1], dk);

                    j = 10000000;
                    if (b < 0) {
                        j = Math.floor(a / -b);
                    }
                    if (d > 0) {
                        j = Math.min(j, Math.floor(-c / d));
                    }
                    pivk[i] = mod(k1+j,n);
                    }
                }
            
                j=pivk[n-1];
                path.lon[n-1]=j;
                for (i=n-2; i>=0; i--) {
                    if (cyclic(i+1,pivk[i],j)) {
                    j=pivk[i];
                    }
                    path.lon[i]=j;
                }

                for (i=n-1; cyclic(mod(i+1,n),j,path.lon[i]); i--) {
                    path.lon[i] = j;
                }
            }
            
            function bestPolygon(path) {
            
                function penalty3(path, i, j) {
                    
                    let n = path.len, pt = path.pt, sums = path.sums;
                    let x, y, xy, x2, y2,
                    k, a, b, c, s,
                    px, py, ex, ey,
                    r = 0;
                    if (j>=n) {
                    j -= n;
                    r = 1;
                    }
                    
                    if (r === 0) {
                    x = sums[j+1].x - sums[i].x;
                    y = sums[j+1].y - sums[i].y;
                    x2 = sums[j+1].x2 - sums[i].x2;
                    xy = sums[j+1].xy - sums[i].xy;
                    y2 = sums[j+1].y2 - sums[i].y2;
                    k = j+1 - i;
                    } else {
                    x = sums[j+1].x - sums[i].x + sums[n].x;
                    y = sums[j+1].y - sums[i].y + sums[n].y;
                    x2 = sums[j+1].x2 - sums[i].x2 + sums[n].x2;
                    xy = sums[j+1].xy - sums[i].xy + sums[n].xy;
                    y2 = sums[j+1].y2 - sums[i].y2 + sums[n].y2;
                    k = j+1 - i + n;
                    } 
                
                    px = (pt[i].x + pt[j].x) / 2.0 - pt[0].x;
                    py = (pt[i].y + pt[j].y) / 2.0 - pt[0].y;
                    ey = (pt[j].x - pt[i].x);
                    ex = -(pt[j].y - pt[i].y);
                
                    a = ((x2 - 2*x*px) / k + px*px);
                    b = ((xy - x*py - y*px) / k + px*py);
                    c = ((y2 - 2*y*py) / k + py*py);
                    
                    s = ex*ex*a + 2*ex*ey*b + ey*ey*c;
                
                    return Math.sqrt(s);
                }
            
                let i, j, m, k,    
                    n = path.len,
                    pen = new Array(n + 1),
                    prev = new Array(n + 1),
                    clip0 = new Array(n),
                    clip1 = new Array(n + 1),
                    seg0 = new Array (n + 1),
                    seg1 = new Array(n + 1),
                    thispen, best, c;
            
                for (i=0; i<n; i++) {
                    c = mod(path.lon[mod(i-1,n)]-1,n);
                    if (c == i) {
                    c = mod(i+1,n);
                    }
                    if (c < i) {
                    clip0[i] = n;
                    } else {
                    clip0[i] = c;
                    }
                }
            
                j = 1;
                for (i=0; i<n; i++) {
                    while (j <= clip0[i]) {
                    clip1[j] = i;
                    j++;
                    }
                }
                
                i = 0;
                for (j=0; i<n; j++) {
                    seg0[j] = i;
                    i = clip0[i];
                }
                seg0[j] = n;
                m = j;
                
                i = n;
                for (j=m; j>0; j--) {
                    seg1[j] = i;
                    i = clip1[i];
                }
                seg1[0] = 0;
            
                pen[0]=0;
                for (j=1; j<=m; j++) {
                    for (i=seg1[j]; i<=seg0[j]; i++) {
                    best = -1;
                    for (k=seg0[j-1]; k>=clip1[i]; k--) {
                        thispen = penalty3(path, k, i) + pen[k];
                        if (best < 0 || thispen < best) {
                        prev[i] = k;
                        best = thispen;
                        }
                    }
                    pen[i] = best;
                    }
                }
                path.m = m;
                path.po = new Array(m);
                
                for (i=n, j=m-1; i>0; j--) {
                    i = prev[i];
                    path.po[j] = i;
                }
            }
            
            function adjustVertices(path) {
            
                function pointslope(path, i, j, ctr, dir) {
                
                    let n = path.len, sums = path.sums,
                        x, y, x2, xy, y2,
                        k, a, b, c, lambda2, l, r=0;
                
                    while (j>=n) {
                        j-=n;
                        r+=1;
                    }
                    while (i>=n) {
                        i-=n;
                        r-=1;
                    }
                    while (j<0) {
                        j+=n;
                        r-=1;
                    }
                    while (i<0) {
                        i+=n;
                        r+=1;
                    }
                    
                    x = sums[j+1].x-sums[i].x+r*sums[n].x;
                    y = sums[j+1].y-sums[i].y+r*sums[n].y;
                    x2 = sums[j+1].x2-sums[i].x2+r*sums[n].x2;
                    xy = sums[j+1].xy-sums[i].xy+r*sums[n].xy;
                    y2 = sums[j+1].y2-sums[i].y2+r*sums[n].y2;
                    k = j+1-i+r*n;
                    
                    ctr.x = x/k;
                    ctr.y = y/k;
                
                    a = (x2-x*x/k)/k;
                    b = (xy-x*y/k)/k;
                    c = (y2-y*y/k)/k;
                    
                    lambda2 = (a+c+Math.sqrt((a-c)*(a-c)+4*b*b))/2;
                
                    a -= lambda2;
                    c -= lambda2;
                
                    if (Math.abs(a) >= Math.abs(c)) {
                        l = Math.sqrt(a*a+b*b);

                        for (l=0; l<3; l++) {

                    }
                
                    min = quadform(Q, s);
                    xmin = s.x;
                    ymin = s.y;
                
                    if (Q.at(0, 0) !== 0.0) {
                        for (z=0; z<2; z++) {
                            w.y = s.y-0.5+z;
                            w.x = - (Q.at(0, 1) * w.y + Q.at(0, 2)) / Q.at(0, 0);
                            dx = Math.abs(w.x-s.x);
                            cand = quadform(Q, w);
                            if (dx <= 0.5 && cand < min) {

                    if (Q.at(1, 1) !== 0.0) {
                        for (z=0; z<2; z++) {
                            w.x = s.x-0.5+z;

                            dy = Math.abs(w.y-s.y);
                            cand = quadform(Q, w);
                            if (dy <= 0.5 && cand < min) {
                            min = cand;
                            xmin = w.x;
                            ymin = w.y;
                            }
                        }

                    for (l=0; l<2; l++) {
                        for (k=0; k<2; k++) {
                            w.x = s.x-0.5+l;
                            w.y = s.y-0.5+k;
                            cand = quadform(Q, w);
                            if (cand < min) {

            function path(curve) {
            
                function bezier(i) {
                    let b = 'C ' + (curve.c[i * 3 + 0].x * size).toFixed(3) + ' ' +
                        (curve.c[i * 3 + 0].y * size).toFixed(3) + ',';
                    b += (curve.c[i * 3 + 1].x * size).toFixed(3) + ' ' +
                        (curve.c[i * 3 + 1].y * size).toFixed(3) + ',';

                        (curve.c[i * 3 + 2].y * size).toFixed(3) + ' ';

                function segment(i) {
                    let s = 'L ' + (curve.c[i * 3 + 1].x * size).toFixed(3) + ' ' +
                        (curve.c[i * 3 + 1].y * size).toFixed(3) + ' ';
                    s += (curve.c[i * 3 + 2].x * size).toFixed(3) + ' ' +
                        (curve.c[i * 3 + 2].y * size).toFixed(3) + ' ';

                let p = 'M' + (curve.c[(n - 1) * 3 + 2].x * size).toFixed(3) +
                    ' ' + (curve.c[(n - 1) * 3 + 2].y * size).toFixed(3) + ' ';
                for (i = 0; i < n; i++) {
                    if (curve.tag[i] === "CURVE") {
                        p += bezier(i);

                        p += segment(i);
                    }

                return p;

            let path_string = '';
            for (i = 0; i < len; i++) {
                c = pathlist[i].curve;
                path_string += path(c);
            }

                    ctx.drawImage(img, 0, 0, width, height);
                    originalImageData = ctx.getImageData(0, 0, width, height);

                    // Set cell size range
                    const minDimension = Math.min(width, height);
                    const maxCellSize = Math.floor(minDimension / 16);
                    const minCellSize = Math.max(2, Math.floor(minDimension / 32));
                    cellSizeInput.min = minCellSize;
                    cellSizeInput.max = maxCellSize;
                    cellSizeValue.min = minCellSize;
                    cellSizeValue.max = maxCellSize;
                    cellSize = Math.floor((minCellSize + maxCellSize) / 2);
                    cellSizeInput.value = cellSize;
                    cellSizeValue.value = cellSize;

                    updateQuantizedImage(true);
                }
                img.src = event.target.result;
            }
            reader.readAsDataURL(file);
        }

        // Event listeners
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('drag-over');
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('drag-over');
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('drag-over');
            const file = e.dataTransfer.files[0];
            if (file && file.type.startsWith('image/')) {
                handleFile(file);
            }
        });

        dropZone.addEventListener('click', () => {
            fileInput.click();
        });

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                handleFile(file);
            }
        });

        // 클립보드 붙여넣기 이벤트
        document.addEventListener('paste', (e) => {
            e.preventDefault();
            const items = e.clipboardData.items;
            for (let item of items) {
                // 이미지 타입인 경우만 처리
                if (item.type.startsWith('image/')) {
                    const file = item.getAsFile();
                    if (file) {
                        handleFile(file);
                        break;  // 첫 번째 이미지만 처리
                    }
                }
            }
        });

        paletteSizeInput.addEventListener('input', () => {
            paletteSizeValue.textContent = paletteSizeInput.value;
            updateQuantizedImage(true);
        });

        cellSizeInput.addEventListener('input', () => {
            cellSize = parseInt(cellSizeInput.value);
            cellSizeValue.value = cellSize;
            updateQuantizedImage();
        });

        cellSizeValue.addEventListener('input', () => {
            cellSize = parseInt(cellSizeValue.value);
            cellSizeInput.value = cellSize;
            updateQuantizedImage();
        });

        function adaptiveColorClustering(colors, k) {
            // Step 1: Initial division using Median Cut
            let boxes = [{ colors: colors, volume: calculateColorVolume(colors) }];
            while (boxes.length < k) {
                boxes.sort((a, b) => b.volume - a.volume);
                const boxToSplit = boxes.shift();
                const [box1, box2] = splitBox(boxToSplit.colors);
                boxes.push({ colors: box1, volume: calculateColorVolume(box1) });
                boxes.push({ colors: box2, volume: calculateColorVolume(box2) });
            }

            // Step 2: Refine centroids using K-means-like approach
            let centroids = boxes.map(box => calculateAverageColor(box.colors));
            let assignments = new Array(colors.length);

            for (let iteration = 0; iteration < 5; iteration++) {
                // Assign colors to nearest centroid
                for (let i = 0; i < colors.length; i++) {
                    assignments[i] = findClosestCentroidIndex(colors[i], centroids);
                }

                // Update centroids
                let newCentroids = new Array(k).fill().map(() => [0, 0, 0]);
                let counts = new Array(k).fill(0);
                for (let i = 0; i < colors.length; i++) {
                    const centroidIndex = assignments[i];
                    newCentroids[centroidIndex][0] += colors[i][0];
                    newCentroids[centroidIndex][1] += colors[i][1];
                    newCentroids[centroidIndex][2] += colors[i][2];
                    counts[centroidIndex]++;
                }

                for (let i = 0; i < k; i++) {
                    if (counts[i] > 0) {
                        centroids[i] = [
                            Math.round(newCentroids[i][0] / counts[i]),
                            Math.round(newCentroids[i][1] / counts[i]),
                            Math.round(newCentroids[i][2] / counts[i])
                        ];
                    }
                }
            }

            // Step 3: Ensure minimum distance between centroids
            centroids = ensureMinimumDistance(centroids);

            return centroids;
        }

        function calculateColorVolume(colors) {
            let rMin = 255, rMax = 0, gMin = 255, gMax = 0, bMin = 255, bMax = 0;
            for (const color of colors) {
                rMin = Math.min(rMin, color[0]);
                rMax = Math.max(rMax, color[0]);
                gMin = Math.min(gMin, color[1]);
                gMax = Math.max(gMax, color[1]);
                bMin = Math.min(bMin, color[2]);
                bMax = Math.max(bMax, color[2]);
            }
            return (rMax - rMin) * (gMax - gMin) * (bMax - bMin);
        }

        function splitBox(colors) {
            let rRange = 0, gRange = 0, bRange = 0;
            for (const color of colors) {
                rRange = Math.max(rRange, color[0]) - Math.min(rRange, color[0]);
                gRange = Math.max(gRange, color[1]) - Math.min(gRange, color[1]);
                bRange = Math.max(bRange, color[2]) - Math.min(bRange, color[2]);
            }

            const channelToSplit = rRange > gRange ? (rRange > bRange ? 0 : 2) : (gRange > bRange ? 1 : 2);
            colors.sort((a, b) => a[channelToSplit] - b[channelToSplit]);
            const mid = Math.floor(colors.length / 2);
            return [colors.slice(0, mid), colors.slice(mid)];
        }

        function calculateAverageColor(colors) {
            let r = 0, g = 0, b = 0;
            for (const color of colors) {
                r += color[0];
                g += color[1];
                b += color[2];
            }
            return [
                Math.round(r / colors.length),
                Math.round(g / colors.length),
                Math.round(b / colors.length)
            ];
        }

        function ensureMinimumDistance(centroids) {
            const minDistance = 30; // Minimum Euclidean distance between centroids
            for (let i = 0; i < centroids.length; i++) {
                for (let j = i + 1; j < centroids.length; j++) {
                    const dist = colorDistance(centroids[i], centroids[j]);
                    if (dist < minDistance) {
                        const direction = [
                            centroids[j][0] - centroids[i][0],
                            centroids[j][1] - centroids[i][1],
                            centroids[j][2] - centroids[i][2]
                        ];
                        const magnitude = Math.sqrt(direction[0]**2 + direction[1]**2 + direction[2]**2);
                        const normalizedDirection = direction.map(d => d / magnitude);
                        const adjustment = normalizedDirection.map(d => d * (minDistance - dist) / 2);

                        centroids[i] = centroids[i].map((v, idx) => Math.max(0, Math.min(255, Math.round(v - adjustment[idx]))));
                        centroids[j] = centroids[j].map((v, idx) => Math.max(0, Math.min(255, Math.round(v + adjustment[idx]))));
                    }
                }
            }
            return centroids;
        }

        function updateQuantizedImage(recomputePalette = false) {
            if (!originalImageData) return;

            const { data, width, height } = originalImageData;
            const paletteSize = parseInt(paletteSizeInput.value);

            quantizedWidth = Math.floor(width / cellSize);
            quantizedHeight = Math.floor(height / cellSize);

            if (recomputePalette) {
                // Extract colors from the image with alpha values
                pixelColors = [];
                for (let y = 0; y < height; y += cellSize) {
                    for (let x = 0; x < width; x += cellSize) {
                        const i = (y * width + x) * 4;
                        // 알파값이 매우 낮은 경우(거의 투명한 경우) RGB 값은 무시
                        if (data[i + 3] < 10) {
                            pixelColors.push([0, 0, 0, 0]); // 완전 투명
                        } else {
                            pixelColors.push([data[i], data[i + 1], data[i + 2], data[i + 3]]);
                        }
                    }
                }

                // 투명하지 않은 색상만 클러스터링에 사용
                const opaqueColors = pixelColors.filter(color => color[3] >= 10).map(color => color.slice(0, 3));
                if (opaqueColors.length > 0) {
                    // Apply the Adaptive Color Clustering algorithm only to opaque colors
                    palette = adaptiveColorClustering(opaqueColors, paletteSize);
                } else {
                    palette = [[0, 0, 0]]; // 모든 픽셀이 투명한 경우의 기본값
                }
                updatePaletteUI();
            }

            // Quantize the image
            quantizedCanvas.width = quantizedWidth;
            quantizedCanvas.height = quantizedHeight;
            quantizedCanvas.style.width = `${width}px`;
            quantizedCanvas.style.height = `${height}px`;

            quantized_ctx = quantizedCanvas.getContext('2d');
            quantized = quantized_ctx.createImageData(quantizedWidth, quantizedHeight);

            colorIndexMap = new Array(quantizedWidth * quantizedHeight);
            for (let y = 0; y < quantizedHeight; y++) {
                for (let x = 0; x < quantizedWidth; x++) {
                    const i = (y * quantizedWidth + x) * 4;
                    const sourceX = x * cellSize;
                    const sourceY = y * cellSize;
                    const sourceI = (sourceY * width + sourceX) * 4;
                    
                    // 소스 픽셀의 알파값 확인
                    const sourceAlpha = data[sourceI + 3];
                    if (sourceAlpha < 10) {
                        // 거의 투명한 경우
                        colorIndexMap[y * quantizedWidth + x] = -1; // -1은 투명을 의미
                        quantized.data[i] = 0;
                        quantized.data[i + 1] = 0;
                        quantized.data[i + 2] = 0;
                        quantized.data[i + 3] = 0;
                    } else {
                        const sourceColor = [data[sourceI], data[sourceI + 1], data[sourceI + 2]];
                        const paletteIndex = findClosestPaletteColor(sourceColor);
                        const color = palette[paletteIndex];

                        colorIndexMap[y * quantizedWidth + x] = paletteIndex;
                        quantized.data[i] = color[0];
                        quantized.data[i + 1] = color[1];
                        quantized.data[i + 2] = color[2];
                        quantized.data[i + 3] = sourceAlpha; // 원본 알파값 유지
                    }
                }
            }

            quantized_ctx.putImageData(quantized, 0, 0);
        }

        function findClosestPaletteColor(color) {
            if (palette.length === 0) return 0;  // 팔레트가 비어있을 경우 처리
            let minDist = Infinity;
            let closestIndex = 0;
            for (let i = 0; i < palette.length; i++) {
                const dist = colorDistance(color, palette[i]);
                if (dist < minDist) {
                    minDist = dist;
                    closestIndex = i;
                }
            }
            return closestIndex;
        }

        function colorDistance(c1, c2) {
            return Math.sqrt(
                Math.pow(c1[0] - c2[0], 2) +
                Math.pow(c1[1] - c2[1], 2) +
                Math.pow(c1[2] - c2[2], 2)
            );
        }

        function updatePaletteUI() {
            paletteContainer.innerHTML = '';
            palette.forEach((color, index) => {
                const input = document.createElement('input');
                input.type = 'color';
                input.className = 'color-input';
                input.value = `#${color[0].toString(16).padStart(2, '0')}${color[1].toString(16).padStart(2, '0')}${color[2].toString(16).padStart(2, '0')}`;
                input.addEventListener('input', (e) => handlePaletteChange(index, e.target.value));
                paletteContainer.appendChild(input);
            });
        }

        function handlePaletteChange(index, newColor) {
            palette[index] = newColor.slice(1).match(/.{2}/g).map(x => parseInt(x, 16));
            const color = palette[index];
            clearTimeout(timeoutId);
            timeoutId = setTimeout(() => {
                for (let y = 0; y < quantizedHeight; y++) {
                    for (let x = 0; x < quantizedWidth; x++) {
                        const i = (y * quantizedWidth + x) * 4;
                        const paletteIdx = colorIndexMap[y * quantizedWidth + x];
                        if (paletteIdx === index) {
                            quantized.data[i] = color[0];
                            quantized.data[i + 1] = color[1];
                            quantized.data[i + 2] = color[2];
                            // 알파값은 변경하지 않음 (원본 유지)
                        }
                        // 투명 픽셀(-1)은 건드리지 않음
                    }
                }

                quantized_ctx.putImageData(quantized, 0, 0);
            }, 200);
        }

        function findClosestCentroidIndex(color, centroids) {
            let minDist = Infinity;
            let closestIndex = 0;
            for (let i = 0; i < centroids.length; i++) {
                const dist = colorDistance(color, centroids[i]);
                if (dist < minDist) {
                    minDist = dist;
                    closestIndex = i;
                }
            }
            return closestIndex;
        }

        function make_svg() {
            let im = quantized_ctx.createImageData(quantizedWidth, quantizedHeight);
            window.paths = [];
            for(let j = 0; j < palette.length; j++) {
                for (let i = 0; i < im.data.length; i++) {
                    if(colorIndexMap[i] == j) {
                        im.data[4 * i + 0] = 0;
                        im.data[4 * i + 1] = 0;
                        im.data[4 * i + 2] = 0;
                        im.data[4 * i + 3] = 255;
                    }
                    else {
                        im.data[4 * i + 0] = 255;
                        im.data[4 * i + 1] = 255;
                        im.data[4 * i + 2] = 255;
                        im.data[4 * i + 3] = 255;
                    }
                }
                Potrace.loadBm(im);
                Potrace.process();
                let path_string = Potrace.getPathString();
                paths.push({ d: path_string, color: palette[j] });
            }
            
            let svg_string = `
                <svg id="svg-path" width="100%" height="100%" viewBox="0 0 ${quantizedWidth} ${quantizedHeight}" version="1.1" xmlns="http://www.w3.org/2000/svg" style="">
                    ${paths.map(p => `<path d="${p.d}" style="stroke: none; fill: rgb(${p.color.join(',')});"></path>`).join('')}
                </svg>`.trim();
            // document.getElementById('svg-container').innerHTML = svg_string;
            return svg_string;
        }

        // Initialize the UI
        updatePaletteUI();
    </script>
</body>
</html>
