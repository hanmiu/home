<!DOCTYPE html>

    <title>한미로</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap');

        body {
            font-family: 'Gowun Dodum', sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f0f0f0;
        }

        #title {
            height: 60px;
        }

        .container {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .player-select, .game-board, .riddle-section, .character-section {
            margin-bottom: 20px;
        }
        .player-status {
            margin-bottom: 2px;
        }
        .player-name {
            font-size: 1.5em;
            margin-left: 5px;
            padding: 2px 5px;
            border-radius: 5px;
        }
        .player-name.current {
            background-color: #9fe8a1;
        }
        .hidden {
            display: none;
        }
        button {
            padding: 10px 20px;
            margin: 5px;
            border: none;
            border-radius: 5px;
            background-color: #4CAF50;
            color: white;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
        .restart-btn {
            background-color: #000000;
        }
        .collected-characters {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 1px;
            margin-bottom: 5px;
            padding-left: 5px;
            border-radius: 5px;
        }
        /*
        .collected-characters span {
            font-size: 1.5em;
            cursor: help;
        }
        */
        #gameControls {
            margin-top: 10px;
        }
        .collected-character {
            background-color: #f8f9fa;
            border-radius: 5px;
            margin-top: 3px;
            padding: 3px;
        }
        .character-card {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            background-color: #f9f9f9;
        }
        .character-emoji {
            font-size: 2em;
        }
        .character-name {
            font-size: 1.2em;
            background: linear-gradient(90deg, green, blue, indigo, violet);
            -webkit-background-clip: text; /* 텍스트에만 배경 클립 */
            -webkit-text-fill-color: transparent; /* 텍스트 색상 투명 처리 */
        }
        .message {
            margin: 10px 0;
            padding: 10px;
            border-radius: 5px;
            background-color: #f8f9fa;
        }
        .options {
            display: flex;
            gap: 10px;
            margin: 10px 0;
        }

        @keyframes bounce {
            0% {
                transform: translateY(0);
            }
            30% {
                transform: translateY(-50px); /* 점프 높이 */
            }
            60% {
                transform: translateY(0);
            }
            100% {
                transform: translateY(0);
            }
        }

        @keyframes run {
            0% {
                transform: translateX(0);
                opacity: 1;
            }
            100% {
                transform: translateX(-100px);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    const initialCharacters = tsvCharacterData.split('\n').slice(1).map(line => {
        const [name, effect, creator, type, target, value] = line.split('\t').map(x => x.trim());
        return { '캐릭터 이름': name, '캐릭터 효과': effect, '만든이': creator, '타입': type, '대상': target, '값': value };
    });

    const player_emojis = ['1️⃣', '2️⃣', '3️⃣', '4️⃣'];

    class Game {
        constructor() {
            this.riddles = [];
            this.characters = [];
            this.players = [];
            this.currentPlayerIndex = 0;
            this.currentRiddle = null;
            this.currentCharacter = null;
            this.isGameStarted = false;
            
            // DOM 요소 참조 저장
            this.elements = {
                gameBoard: null,
                playerStatus: null,
                gameControls: null,
                riddleSection: null,
                characterSection: null
            };
        }

        initializeDOM() {
            this.elements.gameBoard = document.getElementById('gameBoard');
            this.elements.gameBoard.innerHTML = `
                <div id="playerStatus" class="player-status"></div>
                <div id="gameControls" class="game-controls">
                    <button onclick="game.rollDice()" id="rollDiceBtn">🎲 주사위 굴리기</button>
                </div>
                <div id="characterSection" class="character-section hidden"></div>
                <div id="riddleSection" class="riddle-section hidden"></div>
            `;

            this.elements.playerStatus = document.getElementById('playerStatus');
            this.elements.gameControls = document.getElementById('gameControls');
            this.elements.riddleSection = document.getElementById('riddleSection');
            this.elements.characterSection = document.getElementById('characterSection');
        }

        init() {
            this.riddles = this.shuffle([...initialRiddles]);
            this.characters = this.shuffle([...initialCharacters]);
        }

        shuffle(array) {
            let currentIndex = array.length;
            let temporaryValue, randomIndex;

            while (currentIndex !== 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex -= 1;
                temporaryValue = array[currentIndex];
                array[currentIndex] = array[randomIndex];
                array[randomIndex] = temporaryValue;
            }

            return array;
        }

        selectPlayers(count) {
            this.initializeDOM();
            this.players = Array.from({length: count}, (_, i) => ({
                id: i + 1,
                floor: 0,
                coins: 0,
                skipTurns: 0,
                extraTurns: 0,
                collectedCharacters: []
            }));
            
            this.isGameStarted = true;
            document.querySelector('.player-select').classList.add('hidden');
            this.elements.gameBoard.classList.remove('hidden');
            this.updatePlayerStatus();
        }

        updatePlayerStatus() {
            this.elements.playerStatus.innerHTML = this.players.map((player, index) => `
                <div class="player-status">
                    <div><span class="player-name ${index === this.currentPlayerIndex ? 'current' : ''}">
                    ${player.skipTurns > 0 ? '😴 ' : ''} ${player_emojis[player.id - 1]} 💎: ${player.coins || 0}
                    </span></div>
                    <div class="collected-characters">
                        ${player.collectedCharacters.map(char => 
                            `<span class="collected-character"><img 
                                src="./assets/infinite_stairs/${char['캐릭터 이름']}.png"
                                alt="${char['캐릭터 이름']}"
                                title="${char['캐릭터 효과']}"
                                style="image-rendering: pixelated; width: auto; height: auto; max-width: 32px; max-height: 32px; object-fit: contain;"
                            ></span>`
                        ).join('')}
                    </div>
                </div>
            `).join('');
        }

        rollDice() {
            const diceValue = Math.floor(Math.random() * 6) + 1;
            const currentPlayer = this.players[this.currentPlayerIndex];
            currentPlayer.floor += diceValue;
            
            document.querySelector('#rollDiceBtn').style.display = 'none';

            this.updatePlayerStatus();
            this.showRiddleAndCharacter();
        }

        showRiddleAndCharacter() {
            if (this.riddles.length === 0) {
                this.endGame();
                return;
            }

            if (this.characters.length === 0) {
                this.endGame();
                return;
            }

            this.currentRiddle = this.riddles.pop();
            this.currentCharacter = this.characters.pop();
            
            if (this.characters.length === 0) {
                this.characters = this.shuffle([...this.characters]);
            }

            this.elements.riddleSection.innerHTML = `
                <h3>수수께끼</h3>
                <p>${this.currentRiddle['수수께끼']}</p>
                <div class="options">
                    ${this.shuffle([
                        this.currentRiddle['정답'],
                        this.currentRiddle['보기1'],
                        this.currentRiddle['보기2']
                    ]).map(option => 
                        `<button onclick="game.checkAnswer('${option}')">${option}</button>`
                    ).join('')}
                </div>
            `;

            let hidden_name = '';
            this.currentCharacter['캐릭터 이름'].split('').forEach((char) => {
                if (char === ' ') {
                    hidden_name += ' ';
                } else {
                    hidden_name += '❓';
                }
            });
            this.elements.characterSection.innerHTML = `
                <h3 class="notify">나왔다!</h3>
                <div class="character-card">
                    <img class="character-image" 
                        src="./assets/infinite_stairs/${this.currentCharacter['캐릭터 이름']}.png"
                        alt="${this.currentCharacter['캐릭터 이름']}"
                        style="image-rendering: pixelated; width: auto; height: auto; width: 96px; max-width: 96px; max-height: 96px; object-fit: contain; filter: brightness(0.0); transition: filter 0.5s;"
                    >
                    <div class="character-info">
                        <p class="character-name">${hidden_name}</p>
                        <p>✨ 문제를 맞추면 이름과 효과가 공개됩니다. ⚡️</p>
                    </div>
                </div>
            `;

            this.elements.riddleSection.classList.remove('hidden');
            this.elements.characterSection.classList.remove('hidden');
        }

        checkAnswer(answer) {
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message';
            const character_image = document.querySelector('.character-image');

            if (answer === this.currentRiddle['정답']) {
                document.querySelector('.notify').textContent = '잡았다! 🎉';
                character_image.style.filter = 'brightness(1.0)';
                character_image.style.animation = 'bounce 0.3s ease-out 2';
                messageDiv.textContent = '정답입니다!'; 
                messageDiv.style.color = 'green';
                this.elements.characterSection.querySelector('.character-info').innerHTML = `
                    <p class="character-name">${this.currentCharacter['캐릭터 이름']}</p>
                    <p>${this.currentCharacter['캐릭터 효과']}</p>
                `;
                this.applyCharacterEffect();
            } else {
                document.querySelector('.notify').textContent = '놓쳤다...💨';
                character_image.style.animation = 'run 0.3s ease-out forwards';
                messageDiv.textContent = '틀렸습니다.';
                messageDiv.style.color = 'red';
            }

            document.querySelector('.riddle-section').innerHTML = '';
            document.querySelector('.riddle-section').appendChild(messageDiv);

            // 다음 차례 버튼 추가
            const nextTurnBtn = document.createElement('button');
            nextTurnBtn.textContent = '다음 차례';
            nextTurnBtn.onclick = () => this.nextTurn();
            document.querySelector('.riddle-section').appendChild(nextTurnBtn);
        }

        applyCharacterEffect() {
            const currentPlayer = this.players[this.currentPlayerIndex];
            const character = this.currentCharacter;
            let targetPlayer;

            // 대상 플레이어 결정
            switch (character['대상']) {
                case '자신':
                    targetPlayer = currentPlayer;
                    break;
                case '앞사람':
                    targetPlayer = this.players[(this.currentPlayerIndex - 1 + this.players.length) % this.players.length];
                    break;
                case '뒷사람':
                    targetPlayer = this.players[(this.currentPlayerIndex + 1) % this.players.length];
                    break;
                case '나외모두':
                    this.players.forEach((player, index) => {
                        if (index !== this.currentPlayerIndex) {
                            this.applyEffect(player, character);
                        }
                    });
                    return;
            }

            this.applyEffect(targetPlayer, character);
            currentPlayer.collectedCharacters.push(character);
            this.updatePlayerStatus();
        }

        applyEffect(player, character) {
            const value = parseInt(character['값']);
            
            switch (character['타입']) {
                case '코인':
                    player.coins += value;
                    break;
                case '이동':
                    player.floor += value;
                    break;
                case '처음으로':
                    player.floor = 0;
                    break;
                case '쉬기':
                    player.skipTurns += value;
                    break;
                case '한번더':
                    player.extraTurns += value;
                    break;
            }

            const messageDiv = document.createElement('div');
            messageDiv.className = 'message';
            messageDiv.textContent = `${player.id}번 플레이어에게 "${character['캐릭터 효과']}" 효과가 적용되었습니다.`;
            document.querySelector('.character-section').appendChild(messageDiv);
        }

        nextTurn() {
            this.elements.riddleSection.classList.add('hidden');
            this.elements.characterSection.classList.add('hidden');
            
            const currentPlayer = this.players[this.currentPlayerIndex];
            
            // 현재 플레이어의 추가 턴이 있는지 확인
            if (currentPlayer.extraTurns > 0) {
                currentPlayer.extraTurns--;
                this.elements.gameControls.innerHTML = `
                    <div class="message">플레이어 ${currentPlayer.id}의 추가 턴입니다!</div>
                    <button id="rollDiceBtn" onclick="game.rollDice()">🎲 주사위 굴리기</button>
                `;
                return;
            }

            // 다음 플레이어 결정
            do {
                this.currentPlayerIndex = (this.currentPlayerIndex + 1) % this.players.length;
                const nextPlayer = this.players[this.currentPlayerIndex];
                
                if (nextPlayer.skipTurns > 0) {
                    nextPlayer.skipTurns--;
                    // this.elements.gameControls.innerHTML = `
                    //     <div class="message">플레이어 ${nextPlayer.id}는 쉬는 중입니다. (남은 턴: ${nextPlayer.skipTurns})</div>
                    // `;
                    continue;
                }
                break;
            } while (true);
            
            this.elements.gameControls.innerHTML = `
                <button id="rollDiceBtn" onclick="game.rollDice()">🎲 주사위 굴리기</button>
            `;
            document.querySelector('#rollDiceBtn').style.display = 'block';
            
            this.updatePlayerStatus();
        }

        endGame() {
            // 점수 계산: 층수 + (코인 × 0.1)
            const rankings = this.players
                .map(player => ({
                    id: player.id,
                    score: player.floor + ((player.coins || 0) * 0.1),
                    characters: player.collectedCharacters.length
                }))
                .sort((a, b) => b.score - a.score);

            const gameBoard = document.querySelector('.game-board');
            gameBoard.innerHTML = `
                <h2>🎊 게임 종료! 🎊</h2>
                <div class="rankings">
                    ${rankings.map((player, index) => `
                        <div class="rank">
                            ${index + 1}등: 플레이어 ${player.id}
                            (점수: ${player.score.toFixed(1)}, 수집한 캐릭터: ${player.characters}개)
                        </div>
                    `).join('')}
                </div>
            `;
        }

        restart() {
            // 게임 상태 초기화
            this.init();
            this.isGameStarted = false;
            this.currentPlayerIndex = 0;
            this.currentRiddle = null;
            this.currentCharacter = null;
            
            // DOM 초기화
            this.initializeDOM();  // DOM 요소 참조 다시 가져오기
            
            // UI 초기화
            document.querySelector('.player-select').classList.remove('hidden');
            this.elements.gameBoard.classList.add('hidden');
            this.elements.riddleSection.classList.add('hidden');
            this.elements.characterSection.classList.add('hidden');
        }

        confirmRestart() {
            if (confirm('정말 새로 시작할까요?')) {
                this.restart();
            }
        }
    }

    const game = new Game();
    game.init();
    </script>
</body>
</html>
