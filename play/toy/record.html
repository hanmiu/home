<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>한미 이야기 녹음</title>
  <style>
    :root {
      --paper: #fffaf2;
      --surface: rgba(255, 255, 255, 0.84);
      --surface-strong: #ffffff;
      --ink: #26322f;
      --muted: #66736f;
      --line: #dfe7e0;
      --sage: #7fb39b;
      --sage-dark: #3e705f;
      --peach: #f0a68c;
      --peach-soft: #fff0e8;
      --blue: #8eb5d8;
      --blue-soft: #edf6ff;
      --lavender: #aaa0d7;
      --lavender-soft: #f1effb;
      --coral: #de6f63;
      --green: #5e9c78;
      --shadow: 0 20px 60px rgba(55, 72, 65, 0.12);
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: #f8f2e8;
    }

    body {
      margin: 0;
      min-height: 100dvh;
      color: var(--ink);
      background:
        radial-gradient(circle at 8% 12%, rgba(240, 166, 140, 0.16), transparent 26%),
        radial-gradient(circle at 90% 10%, rgba(142, 181, 216, 0.16), transparent 25%),
        linear-gradient(135deg, #fff8ed 0%, #f3f8f2 50%, #f7f3fb 100%);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
      letter-spacing: 0;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.44;
    }

    .app {
      width: min(1440px, calc(100vw - 40px));
      height: 100dvh;
      margin: 0 auto;
      padding: 18px 0;
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr) auto;
      gap: 12px;
    }

    .topbar,
    .setbar,
    .bottombar,
    .panel {
      border: 1px solid rgba(223, 231, 224, 0.9);
      background: var(--surface);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
    }

    .topbar {
      min-height: 74px;
      border-radius: var(--radius);
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand {
      display: flex;
      flex-direction: column;
      gap: 3px;
      min-width: 0;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.45rem, 2.6vw, 2.7rem);
      line-height: 1;
      letter-spacing: 0;
      color: #24332e;
    }

    .brand small {
      color: var(--muted);
      font-weight: 650;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 9px;
      color: var(--muted);
      white-space: nowrap;
    }

    .time-chip,
    .icon-button,
    .status-pill,
    .version-chip {
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.72);
      border-radius: 999px;
    }

    .time-chip {
      padding: 9px 12px;
      font-size: 0.86rem;
      font-weight: 750;
    }

    .icon-button {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      color: var(--ink);
      transition: transform 160ms ease, background 160ms ease;
    }

    .icon-button:hover {
      background: #fff;
      transform: translateY(-1px);
    }

    .setbar {
      border-radius: var(--radius);
      padding: 12px;
      display: grid;
      grid-template-columns: minmax(240px, 1fr) auto minmax(240px, 0.86fr);
      gap: 10px;
      align-items: center;
    }

    .input-wrap {
      display: grid;
    }

    .mini-label {
      color: var(--muted);
      font-size: 0.75rem;
      font-weight: 800;
    }

    .group-input {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff;
      color: var(--ink);
      padding: 12px 13px;
      outline: none;
      font-size: 1rem;
      font-weight: 800;
    }

    .group-input:focus {
      border-color: rgba(127, 179, 155, 0.86);
      box-shadow: 0 0 0 4px rgba(127, 179, 155, 0.18);
    }

    .set-summary {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px 12px;
      border-radius: 10px;
      background: #fff;
      border: 1px solid var(--line);
      font-weight: 900;
      white-space: nowrap;
    }

    .message {
      min-width: 0;
      color: var(--muted);
      font-weight: 700;
      line-height: 1.34;
      text-align: right;
    }

    .recorders {
      min-height: 0;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      overflow: hidden;
    }

    .panel {
      min-height: 0;
      border-radius: var(--radius);
      padding: 14px;
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr) auto auto;
      gap: 11px;
      overflow: hidden;
    }

    .panel[data-section="discussion"] {
      --accent: var(--peach);
      --accent-soft: var(--peach-soft);
    }

    .panel[data-section="story"] {
      --accent: var(--blue);
      --accent-soft: var(--blue-soft);
    }

    .panel-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
    }

    .panel-title {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
    }

    .panel-title h2 {
      margin: 0;
      font-size: clamp(1.25rem, 2vw, 2.1rem);
      line-height: 1;
      letter-spacing: 0;
    }

    .section-index {
      color: var(--muted);
      font-size: 0.8rem;
      font-weight: 800;
    }

    .status-pill {
      padding: 8px 12px;
      color: var(--sage-dark);
      font-size: 0.86rem;
      font-weight: 900;
      white-space: nowrap;
    }

    .status-pill.is-recording {
      border-color: rgba(222, 111, 99, 0.26);
      background: #fff0ec;
      color: #a7473e;
    }

    .status-pill.is-paused {
      border-color: rgba(170, 160, 215, 0.38);
      background: var(--lavender-soft);
      color: #68609a;
    }

    .status-pill.is-saved {
      border-color: rgba(94, 156, 120, 0.28);
      background: #edf8f0;
      color: #426f55;
    }

    .meter-row {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      gap: 12px;
      align-items: center;
      border-radius: 12px;
      background: var(--accent-soft);
      border: 1px solid rgba(255, 255, 255, 0.9);
      padding: 11px;
    }

    .timer {
      min-width: 96px;
      padding: 8px 10px;
      border-radius: 9px;
      background: #fff;
      color: var(--ink);
      font-size: clamp(1.35rem, 3vw, 2.6rem);
      line-height: 1;
      font-variant-numeric: tabular-nums;
      font-weight: 950;
      text-align: center;
    }

    .limit {
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 800;
      text-align: right;
      white-space: nowrap;
    }

    .wave-wrap {
      min-height: 0;
      border: 1px solid var(--line);
      border-radius: 12px;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.74), rgba(255, 255, 255, 0.92)),
        repeating-linear-gradient(90deg, transparent 0, transparent 31px, rgba(38, 50, 47, 0.045) 32px);
      display: grid;
      grid-template-rows: minmax(0, 1fr) auto;
      overflow: hidden;
    }

    .wave-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .wave-caption {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 12px;
      padding: 0 11px 9px;
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 800;
    }

    .wave-caption span:first-child {
      display: none;
    }

    .controls {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
    }

    .control-button,
    .action-button,
    .small-button {
      border-radius: 10px;
      min-width: 0;
      color: var(--ink);
      font-weight: 950;
      transition: transform 160ms ease, box-shadow 160ms ease, background 160ms ease;
    }

    .control-button {
      min-height: 62px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      border: 1px solid var(--line);
      background: #fff;
      font-size: 0.9rem;
    }

    .control-button span:first-child {
      width: 26px;
      height: 22px;
      display: grid;
      place-items: center;
      font-size: 1.1rem;
      line-height: 1;
    }

    .control-button:hover:not(:disabled),
    .action-button:hover:not(:disabled),
    .small-button:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 12px 28px rgba(55, 72, 65, 0.12);
    }

    .control-button.primary {
      background: #26322f;
      color: #fff;
      border-color: #26322f;
    }

    .control-button.pause {
      background: #fff8ed;
      color: #8f5940;
    }

    .control-button.resume {
      background: var(--lavender-soft);
      color: #5c568b;
    }

    .control-button.finish {
      background: #edf8f0;
      color: #3f7657;
    }

    .version-area {
      min-height: 80px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.64);
      padding: 10px;
      display: grid;
      gap: 8px;
    }

    .latest-row,
    .bottom-section {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-width: 0;
    }

    .latest-title {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .latest-title strong {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 0.92rem;
    }

    .latest-title small,
    .empty {
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 750;
    }

    .version-chip {
      padding: 4px 8px;
      background: var(--accent-soft);
      border-color: rgba(255, 255, 255, 0.9);
      font-size: 0.76rem;
      font-weight: 950;
    }

    .latest-buttons {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-shrink: 0;
    }

    .small-button {
      border: 1px solid var(--line);
      background: #fff;
      padding: 9px 10px;
      font-size: 0.82rem;
      white-space: nowrap;
    }

    .small-button.listen,
    .small-button.dark {
      background: #26322f;
      border-color: #26322f;
      color: #fff;
    }

    .listen-drawer {
      display: none;
      grid-template-columns: 1fr;
      gap: 8px;
      align-items: stretch;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
      padding: 9px;
    }

    .listen-drawer.is-open {
      display: grid;
    }

    .listen-drawer.is-single {
      grid-template-columns: auto minmax(0, 1fr);
      align-items: center;
    }

    .listen-drawer.is-single .pattern {
      width: 64px;
    }

    .pattern {
      width: 100%;
      height: 64px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: #ffffff;
      display: block;
      image-rendering: pixelated;
    }

    .audio-box {
      min-width: 0;
      display: grid;
      gap: 6px;
    }

    audio {
      width: 100%;
      height: 34px;
    }

    .bottombar {
      border-radius: var(--radius);
      padding: 12px;
      display: grid;
      grid-template-columns: auto auto minmax(0, 1fr);
      gap: 9px;
      align-items: center;
    }

    .action-button {
      min-height: 48px;
      padding: 0 16px;
      border: 1px solid var(--line);
      background: #fff;
      white-space: nowrap;
    }

    .action-button.complete {
      background: var(--green);
      border-color: var(--green);
      color: #fff;
    }

    .action-button.zip {
      background: #26322f;
      border-color: #26322f;
      color: #fff;
    }

    .saved-strip {
      min-width: 0;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 8px;
      overflow: hidden;
    }

    .saved-chip {
      min-width: 0;
      max-width: 180px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.76);
      color: var(--muted);
      font-size: 0.8rem;
      font-weight: 800;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    dialog {
      width: min(520px, calc(100vw - 32px));
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: 0 24px 80px rgba(38, 50, 47, 0.22);
      color: var(--ink);
      padding: 0;
    }

    dialog::backdrop {
      background: rgba(38, 50, 47, 0.28);
      backdrop-filter: blur(4px);
    }

    .dialog-inner {
      padding: 18px;
      display: grid;
      gap: 14px;
    }

    .dialog-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .dialog-head h2 {
      margin: 0;
      font-size: 1.2rem;
    }

    .setting-grid {
      display: grid;
      grid-template-columns: 1fr 120px;
      gap: 10px;
      align-items: center;
    }

    .setting-grid input,
    .setting-grid select {
      border: 1px solid var(--line);
      border-radius: 9px;
      padding: 10px;
      outline: none;
      background: #fff;
      color: var(--ink);
      font-weight: 800;
    }

    .dialog-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .is-hidden {
      display: none !important;
    }

    @media (max-width: 980px) {
      .app {
        width: min(760px, calc(100vw - 28px));
        height: auto;
        min-height: 100dvh;
      }

      .setbar,
      .recorders,
      .bottombar {
        grid-template-columns: 1fr;
      }

      .message {
        text-align: left;
      }

      .saved-strip {
        justify-content: flex-start;
        flex-wrap: wrap;
      }
    }

    @media (max-height: 760px) and (min-width: 981px) {
      .app {
        gap: 8px;
        padding: 10px 0;
      }

      .panel {
        gap: 8px;
        padding: 12px;
      }

      .topbar {
        min-height: 64px;
      }

      .control-button {
        min-height: 46px;
        font-size: 0.78rem;
      }

      .version-area {
        min-height: 54px;
        padding: 8px;
      }

      .wave-wrap {
        min-height: 0;
      }

      .pattern {
        width: 94px;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">
        <h1>한미 이야기 녹음</h1>
        <small>의논하기와 이야기 만들기를 따로 녹음합니다.</small>
      </div>
      <div class="top-actions">
        <div class="time-chip" id="nowChip">--</div>
        <button class="icon-button" id="fullscreenButton" type="button" aria-label="전체화면">⛶</button>
        <button class="icon-button" id="settingsButton" type="button" aria-label="설정">⚙</button>
      </div>
    </header>

    <section class="setbar" aria-label="현재 녹음 세트">
      <div class="input-wrap">
        <input class="group-input" id="groupName" type="text" autocomplete="off" placeholder="모둠 이름 예: 하늘팀" aria-label="모둠 이름">
      </div>
      <div class="set-summary">
        <span id="setLabel">세트 1</span>
        <span class="version-chip" id="dirtyChip">저장 전</span>
      </div>
      <div class="message" id="message">모둠 이름을 적고 녹음을 시작해 주세요.</div>
    </section>

    <section class="recorders" aria-label="녹음 영역">
      <article class="panel" data-section="discussion">
        <div class="panel-head">
          <div class="panel-title">
            <span class="section-index">01</span>
            <h2>의논하기</h2>
          </div>
          <span class="status-pill" data-role="status">대기</span>
        </div>
        <div class="meter-row">
          <div class="timer" data-role="timer">00:00</div>
          <div>
            <div class="mini-label">총 녹음 시간</div>
            <strong data-role="format">m4a/webm 자동</strong>
          </div>
          <div class="limit" data-role="limit">최대 10분</div>
        </div>
        <div class="wave-wrap">
          <canvas class="wave-canvas" data-role="wave"></canvas>
          <div class="wave-caption">
            <span data-role="waveLabel">녹음되면 파형이 채워집니다.</span>
            <span data-role="chunkLabel">구간 0</span>
          </div>
        </div>
        <div class="controls">
          <button class="control-button primary" type="button" data-action="start"><span>●</span><span>녹음</span></button>
          <button class="control-button pause" type="button" data-action="pause"><span>Ⅱ</span><span>잠깐 멈춤</span></button>
          <button class="control-button resume" type="button" data-action="resume"><span>↻</span><span>이어 녹음</span></button>
          <button class="control-button finish" type="button" data-action="finish"><span>✓</span><span>끝냄</span></button>
        </div>
        <div class="version-area" data-role="versions"></div>
      </article>

      <article class="panel" data-section="story">
        <div class="panel-head">
          <div class="panel-title">
            <span class="section-index">02</span>
            <h2>이야기 만들기</h2>
          </div>
          <span class="status-pill" data-role="status">대기</span>
        </div>
        <div class="meter-row">
          <div class="timer" data-role="timer">00:00</div>
          <div>
            <div class="mini-label">총 녹음 시간</div>
            <strong data-role="format">m4a/webm 자동</strong>
          </div>
          <div class="limit" data-role="limit">최대 10분</div>
        </div>
        <div class="wave-wrap">
          <canvas class="wave-canvas" data-role="wave"></canvas>
          <div class="wave-caption">
            <span data-role="waveLabel">녹음되면 파형이 채워집니다.</span>
            <span data-role="chunkLabel">구간 0</span>
          </div>
        </div>
        <div class="controls">
          <button class="control-button primary" type="button" data-action="start"><span>●</span><span>녹음</span></button>
          <button class="control-button pause" type="button" data-action="pause"><span>Ⅱ</span><span>잠깐 멈춤</span></button>
          <button class="control-button resume" type="button" data-action="resume"><span>↻</span><span>이어 녹음</span></button>
          <button class="control-button finish" type="button" data-action="finish"><span>✓</span><span>끝냄</span></button>
        </div>
        <div class="version-area" data-role="versions"></div>
      </article>
    </section>

    <footer class="bottombar">
      <button class="action-button complete" id="completeButton" type="button">모두 완성</button>
      <button class="action-button" id="newSetButton" type="button">새로 시작</button>
      <div class="saved-strip" id="savedStrip" aria-label="완성된 세트"></div>
    </footer>
  </main>

  <dialog id="settingsDialog">
    <form class="dialog-inner" method="dialog">
      <div class="dialog-head">
        <h2>설정</h2>
        <button class="icon-button" value="cancel" type="submit" aria-label="닫기">×</button>
      </div>
      <div class="setting-grid">
        <label for="discussionLimit">의논하기 최대 시간</label>
        <input id="discussionLimit" type="number" min="1" max="60" step="1">
        <label for="storyLimit">이야기 만들기 최대 시간</label>
        <input id="storyLimit" type="number" min="1" max="60" step="1">
        <label for="formatPreference">파일 형식</label>
        <select id="formatPreference">
          <option value="auto">자동: m4a 가능하면 m4a</option>
          <option value="m4a">m4a 우선</option>
          <option value="webm">webm 우선</option>
        </select>
        <label for="spectrogramSpeed">스크롤 속도</label>
        <select id="spectrogramSpeed">
          <option value="0.5">천천히</option>
          <option value="1">보통</option>
          <option value="1.5">조금 빠르게</option>
          <option value="2">빠르게</option>
        </select>
        <label for="glyphMode">글리프 표시</label>
        <select id="glyphMode">
          <option value="strip">흐르는 띠</option>
          <option value="single">한 글리프</option>
        </select>
      </div>
      <div class="dialog-actions">
        <button class="small-button" value="cancel" type="submit">취소</button>
        <button class="small-button dark" id="saveSettings" value="default" type="submit">저장</button>
      </div>
    </form>
  </dialog>

  <script>
    const SECTION_META = {
      discussion: { title: "의논하기", order: "01" },
      story: { title: "이야기 만들기", order: "02" }
    };

    const DEFAULT_SETTINGS = {
      discussionLimit: 10,
      storyLimit: 10,
      formatPreference: "auto",
      spectrogramSpeed: 1,
      glyphMode: "strip"
    };

    const WAVE_SAMPLE_INTERVAL_MS = 32;
    const SPECTROGRAM_BINS = 72;
    const SPECTROGRAM_VISIBLE_COLUMNS = 1400;
    const GLYPH_SOURCE_INTERVAL_MS = 80;
    const GLYPH_SINGLE_INTERVAL_MS = 240;
    const GLYPH_STRIP_INTERVAL_MS = 720;
    const GLYPH_SILENCE_HOLD_MS = 320;
    const GLYPH_LIVE_RMS_FLOOR = 0.014;
    const GLYPH_LIVE_RMS_SOFT_FLOOR = 0.01;
    const SPECTROGRAM_PALETTE = [
      "rgba(69, 38, 118, 0.26)",
      "#6044b5",
      "#2368c9",
      "#1597c1",
      "#10a994",
      "#78bf42",
      "#e0c43b",
      "#df7b4f"
    ];

    const elements = {
      nowChip: document.getElementById("nowChip"),
      fullscreenButton: document.getElementById("fullscreenButton"),
      settingsButton: document.getElementById("settingsButton"),
      settingsDialog: document.getElementById("settingsDialog"),
      discussionLimit: document.getElementById("discussionLimit"),
      storyLimit: document.getElementById("storyLimit"),
      formatPreference: document.getElementById("formatPreference"),
      spectrogramSpeed: document.getElementById("spectrogramSpeed"),
      glyphMode: document.getElementById("glyphMode"),
      saveSettings: document.getElementById("saveSettings"),
      groupName: document.getElementById("groupName"),
      setLabel: document.getElementById("setLabel"),
      dirtyChip: document.getElementById("dirtyChip"),
      message: document.getElementById("message"),
      completeButton: document.getElementById("completeButton"),
      newSetButton: document.getElementById("newSetButton"),
      savedStrip: document.getElementById("savedStrip")
    };

    const panels = new Map([...document.querySelectorAll(".panel")].map((panel) => {
      const section = panel.dataset.section;
      return [section, {
        root: panel,
        status: panel.querySelector('[data-role="status"]'),
        timer: panel.querySelector('[data-role="timer"]'),
        format: panel.querySelector('[data-role="format"]'),
        limit: panel.querySelector('[data-role="limit"]'),
        wave: panel.querySelector('[data-role="wave"]'),
        waveLabel: panel.querySelector('[data-role="waveLabel"]'),
        chunkLabel: panel.querySelector('[data-role="chunkLabel"]'),
        versions: panel.querySelector('[data-role="versions"]'),
        buttons: {
          start: panel.querySelector('[data-action="start"]'),
          pause: panel.querySelector('[data-action="pause"]'),
          resume: panel.querySelector('[data-action="resume"]'),
          finish: panel.querySelector('[data-action="finish"]')
        }
      }];
    }));

    const state = {
      settings: loadSettings(),
      activeSet: createSet(1),
      completedSets: [],
      current: null,
      playback: null,
      savedDownloadKeys: new Set()
    };

    let recorder = null;
    let stream = null;
    let audioContext = null;
    let analyser = null;
    let sampleData = null;
    let frequencyData = null;
    let tickHandle = null;
    let renderHandle = null;

    function createSet(number) {
      return {
        id: Date.now() + Math.random(),
        number,
        groupName: "",
        discussion: [],
        story: [],
        completedAt: null
      };
    }

    function loadSettings() {
      try {
        return { ...DEFAULT_SETTINGS, ...JSON.parse(localStorage.getItem("storyRecorderSettings") || "{}") };
      } catch {
        return { ...DEFAULT_SETTINGS };
      }
    }

    function saveSettingsToStorage() {
      localStorage.setItem("storyRecorderSettings", JSON.stringify(state.settings));
    }

    function sanitizeName(value) {
      const clean = value.trim()
        .replace(/[\\/:*?"<>|]/g, "")
        .replace(/\s+/g, "_")
        .replace(/_+/g, "_");
      return clean || "set";
    }

    function getGroupLabel() {
      return state.activeSet.groupName.trim() || `세트_${state.activeSet.number}`;
    }

    function compactStamp(date = new Date()) {
      const year = String(date.getFullYear()).slice(2);
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");
      const hour = String(date.getHours()).padStart(2, "0");
      const minute = String(date.getMinutes()).padStart(2, "0");
      return `${year}${month}${day}-${hour}${minute}`;
    }

    function formatClock(date = new Date()) {
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");
      const hour = String(date.getHours()).padStart(2, "0");
      const minute = String(date.getMinutes()).padStart(2, "0");
      return `${month}.${day} ${hour}:${minute}`;
    }

    function formatDuration(ms) {
      const total = Math.max(0, Math.floor(ms / 1000));
      const minutes = Math.floor(total / 60);
      const seconds = total % 60;
      return `${String(minutes).padStart(2, "0")}:${String(seconds).padStart(2, "0")}`;
    }

    function getLimitMs(section) {
      const minutes = section === "discussion" ? state.settings.discussionLimit : state.settings.storyLimit;
      return Math.max(1, minutes) * 60 * 1000;
    }

    function getSupportedAudioType() {
      const pref = state.settings.formatPreference;
      const m4aTypes = ["audio/mp4;codecs=mp4a.40.2", "audio/mp4"];
      const webmTypes = ["audio/webm;codecs=opus", "audio/webm"];
      const order = pref === "webm" ? [...webmTypes, ...m4aTypes] : [...m4aTypes, ...webmTypes];
      const mimeType = order.find((type) => window.MediaRecorder && MediaRecorder.isTypeSupported(type)) || "";
      const extension = mimeType.includes("mp4") ? "m4a" : "webm";
      const blobType = mimeType || "audio/webm";
      return { mimeType, blobType, extension };
    }

    function buildFileName(section, versionNumber, extension, date = new Date()) {
      const label = sanitizeName(getGroupLabel());
      const meta = SECTION_META[section];
      const title = meta.title.replace(/\s+/g, "");
      const version = `v${String(versionNumber).padStart(2, "0")}`;
      return `${compactStamp(date)}_${label}_${meta.order}-${title}_${version}.${extension}`;
    }

    function setMessage(text) {
      elements.message.textContent = text;
    }

    function getLatest(section) {
      const list = state.activeSet[section];
      return list.length ? list[list.length - 1] : null;
    }

    function hasUnfinishedRecording() {
      return Boolean(state.current);
    }

    function hasUndownloadedRecordings() {
      return ["discussion", "story"].some((section) => {
        const latest = getLatest(section);
        return latest && !state.savedDownloadKeys.has(latest.key);
      });
    }

    function isDirty() {
      return hasUnfinishedRecording() || hasUndownloadedRecordings();
    }

    function markDownloaded(recording) {
      state.savedDownloadKeys.add(recording.key);
      render();
    }

    function requestDownload(blob, fileName, afterDownload) {
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = fileName;
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 30000);
      if (afterDownload) afterDownload();
    }

    function getFullscreenElement() {
      return document.fullscreenElement || document.webkitFullscreenElement || null;
    }

    function requestFullscreen() {
      const target = document.documentElement;
      if (target.requestFullscreen) return target.requestFullscreen();
      if (target.webkitRequestFullscreen) return target.webkitRequestFullscreen();
      return Promise.reject(new Error("Fullscreen is not available"));
    }

    function exitFullscreen() {
      if (document.exitFullscreen) return document.exitFullscreen();
      if (document.webkitExitFullscreen) return document.webkitExitFullscreen();
      return Promise.reject(new Error("Fullscreen exit is not available"));
    }

    async function startRecording(section) {
      if (state.current) {
        setMessage("이미 녹음 중입니다. 먼저 끝냄을 눌러 주세요.");
        return;
      }

      try {
        closePlayback();
        const audioType = getSupportedAudioType();
        stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        const source = audioContext.createMediaStreamSource(stream);
        analyser = audioContext.createAnalyser();
        analyser.fftSize = 2048;
        analyser.smoothingTimeConstant = 0.28;
        source.connect(analyser);
        sampleData = new Uint8Array(analyser.fftSize);
        frequencyData = new Uint8Array(analyser.frequencyBinCount);

        const chunks = [];
        recorder = new MediaRecorder(stream, audioType.mimeType ? { mimeType: audioType.mimeType } : undefined);
        const now = new Date();
        const versionNumber = state.activeSet[section].length + 1;
        state.current = {
          section,
          chunks,
          audioType,
          versionNumber,
          startedAt: now,
          resumeAt: performance.now(),
          recordedMs: 0,
          segments: [createWaveSegment()],
          visualFrames: [],
          isPaused: false
        };

        recorder.addEventListener("dataavailable", (event) => {
          if (event.data.size > 0) chunks.push(event.data);
        });
        recorder.addEventListener("stop", () => finalizeRecording(section));
        recorder.start(1000);
        startLoops();
        setMessage(`${SECTION_META[section].title} 녹음이 시작되었습니다.`);
        render();
      } catch (error) {
        console.error(error);
        stopStream();
        state.current = null;
        setMessage("마이크를 사용할 수 없습니다. Chrome에서 마이크 권한을 허용해 주세요.");
        render();
      }
    }

    function pauseRecording(section) {
      if (!state.current || state.current.section !== section || !recorder) {
        setMessage(`${SECTION_META[section].title}에서 일시 정지할 녹음이 없습니다.`);
        return;
      }
      if (recorder.state !== "recording") return;

      state.current.recordedMs += performance.now() - state.current.resumeAt;
      const activeSegment = getActiveSegment(state.current);
      if (activeSegment) {
        activeSegment.durationMs += performance.now() - state.current.resumeAt;
      }
      state.current.isPaused = true;
      recorder.pause();
      setMessage(`${SECTION_META[section].title} 녹음을 잠깐 멈췄습니다.`);
      render();
    }

    function resumeRecording(section) {
      if (!state.current || state.current.section !== section || !recorder) {
        setMessage(`${SECTION_META[section].title}에서 이어 녹음할 내용이 없습니다.`);
        return;
      }
      if (recorder.state !== "paused") return;

      state.current.resumeAt = performance.now();
      state.current.segments.push(createWaveSegment());
      state.current.isPaused = false;
      recorder.resume();
      setMessage(`${SECTION_META[section].title} 녹음을 이어갑니다.`);
      render();
    }

    function finishRecording(section) {
      if (!state.current || state.current.section !== section || !recorder) {
        setMessage(`${SECTION_META[section].title}에서 끝낼 녹음이 없습니다.`);
        return;
      }
      if (recorder.state === "recording") {
        state.current.recordedMs += performance.now() - state.current.resumeAt;
        const activeSegment = getActiveSegment(state.current);
        if (activeSegment) {
          activeSegment.durationMs += performance.now() - state.current.resumeAt;
        }
      }
      recorder.stop();
      stopLoops();
    }

    function finalizeRecording(section) {
      const current = state.current;
      if (!current || current.section !== section) return;

      const createdAt = new Date();
      const blob = new Blob(current.chunks, { type: current.audioType.blobType });
      const url = URL.createObjectURL(blob);
      const fileName = buildFileName(section, current.versionNumber, current.audioType.extension, createdAt);
      const segments = normalizeSegments(current.segments);
      const visualFrames = current.visualFrames.slice();
      const glyphTrack = createGlyphTrack(visualFrames);
      const recording = {
        key: `${state.activeSet.id}-${section}-${current.versionNumber}`,
        section,
        versionNumber: current.versionNumber,
        blob,
        url,
        fileName,
        createdAt,
        durationMs: current.recordedMs,
        segments,
        visualFrames,
        glyphFrames: glyphTrack.map((entry) => entry.glyph),
        glyphTrack,
        glyphFrameInterval: GLYPH_SOURCE_INTERVAL_MS,
        extension: current.audioType.extension
      };

      state.activeSet[section].push(recording);
      state.current = null;
      recorder = null;
      stopStream();
      setMessage(`${SECTION_META[section].title} ${String(recording.versionNumber).padStart(2, "0")}번째 녹음을 저장했습니다.`);
      render();
    }

    function stopStream() {
      if (stream) {
        stream.getTracks().forEach((track) => track.stop());
        stream = null;
      }
      if (audioContext) {
        audioContext.close().catch(() => {});
        audioContext = null;
      }
      analyser = null;
      sampleData = null;
      frequencyData = null;
    }

    function startLoops() {
      stopLoops();
      tickHandle = window.setInterval(sampleRecording, WAVE_SAMPLE_INTERVAL_MS);
      renderHandle = window.setInterval(render, 120);
    }

    function stopLoops() {
      if (tickHandle) window.clearInterval(tickHandle);
      if (renderHandle) window.clearInterval(renderHandle);
      tickHandle = null;
      renderHandle = null;
    }

    function sampleRecording() {
      if (!state.current || state.current.isPaused || !analyser || !sampleData || !frequencyData) return;
      analyser.getByteTimeDomainData(sampleData);
      analyser.getByteFrequencyData(frequencyData);
      let sum = 0;
      let peak = 0;
      for (let i = 0; i < sampleData.length; i += 1) {
        const centered = Math.abs(sampleData[i] - 128) / 128;
        sum += centered * centered;
        if (centered > peak) peak = centered;
      }
      const rms = Math.sqrt(sum / sampleData.length);
      const value = Math.min(1, Math.max(rms * 4.2, peak * 0.85, 0.035));
      const segment = getActiveSegment(state.current);
      if (segment) {
        const frame = compressFrequencyFrame(frequencyData);
        segment.samples.push(value);
        segment.frames.push(frame);
        state.current.visualFrames.push({
          frame: Array.from(frame),
          segmentIndex: Math.max(0, state.current.segments.length - 1)
        });
        if (state.current.visualFrames.length > SPECTROGRAM_VISIBLE_COLUMNS) {
          state.current.visualFrames.splice(0, state.current.visualFrames.length - SPECTROGRAM_VISIBLE_COLUMNS);
        }
      }
      if (state.current.recordedMs + performance.now() - state.current.resumeAt >= getLimitMs(state.current.section)) {
        finishRecording(state.current.section);
      }
    }

    function createWaveSegment() {
      return { samples: [], frames: [], durationMs: 0 };
    }

    function getActiveSegment(current) {
      return current && current.segments[current.segments.length - 1];
    }

    function normalizeSegments(segments) {
      return segments
        .filter((segment) => segment.frames.length || segment.samples.length || segment.durationMs > 0)
        .map((segment) => ({
          samples: segment.samples.slice(),
          frames: segment.frames.map((frame) => Array.from(frame)),
          durationMs: Math.max(0, segment.durationMs)
        }));
    }

    function getDisplaySegments(section) {
      if (state.current && state.current.section === section) {
        return {
          segments: normalizeSegments(state.current.segments),
          visualFrames: state.current.visualFrames,
          active: true,
          paused: state.current.isPaused
        };
      }
      const latest = getLatest(section);
      return {
        segments: latest ? latest.segments : [],
        visualFrames: latest ? latest.visualFrames || [] : [],
        active: false,
        paused: false
      };
    }

    function downsample(values, targetCount) {
      if (!values.length || targetCount <= 0) return [];
      if (values.length === targetCount) return values.slice();
      const result = [];
      const bucket = values.length / targetCount;
      for (let i = 0; i < targetCount; i += 1) {
        const start = Math.floor(i * bucket);
        const end = Math.max(start + 1, Math.floor((i + 1) * bucket));
        let max = 0;
        for (let j = start; j < end && j < values.length; j += 1) {
          if (values[j] > max) max = values[j];
        }
        result.push(max);
      }
      return result;
    }

    function compressFrequencyFrame(source) {
      const result = new Uint8Array(SPECTROGRAM_BINS);
      const usableBins = Math.max(8, Math.floor(source.length * 0.62));
      for (let i = 0; i < SPECTROGRAM_BINS; i += 1) {
        const startRatio = Math.pow(i / SPECTROGRAM_BINS, 1.72);
        const endRatio = Math.pow((i + 1) / SPECTROGRAM_BINS, 1.72);
        const start = Math.min(usableBins - 1, 1 + Math.floor(startRatio * usableBins));
        const end = Math.max(start + 1, Math.min(usableBins, 1 + Math.floor(endRatio * usableBins)));
        let peak = 0;
        let sum = 0;
        for (let j = start; j < end; j += 1) {
          const value = source[j];
          sum += value;
          if (value > peak) peak = value;
        }
        const avg = sum / (end - start);
        const mixed = Math.max(peak * 0.82, avg * 1.2);
        result[i] = Math.max(0, Math.min(255, Math.round(mixed)));
      }
      return result;
    }

    function downsampleFrames(frames, targetCount) {
      if (!frames.length || targetCount <= 0) return [];
      const result = [];
      const bucket = frames.length / targetCount;
      for (let i = 0; i < targetCount; i += 1) {
        const start = Math.floor(i * bucket);
        const end = Math.max(start + 1, Math.floor((i + 1) * bucket));
        const merged = new Uint8Array(SPECTROGRAM_BINS);
        let count = 0;
        for (let j = start; j < end && j < frames.length; j += 1) {
          const frame = frames[j];
          count += 1;
          for (let bin = 0; bin < SPECTROGRAM_BINS; bin += 1) {
            if (frame[bin] > merged[bin]) merged[bin] = frame[bin];
          }
        }
        if (count > 0) result.push(merged);
      }
      return result;
    }

    function downsampleVisualFrames(entries, targetCount) {
      if (!entries.length || targetCount <= 0) return [];
      return entries.slice(-targetCount);
    }

    function spectrogramColor(value) {
      if (value < 12) return null;
      const boosted = Math.pow(value / 255, 0.72);
      const index = Math.max(0, Math.min(SPECTROGRAM_PALETTE.length - 1, Math.floor(boosted * SPECTROGRAM_PALETTE.length)));
      return SPECTROGRAM_PALETTE[index];
    }

    function createGlyphTrack(visualFrames) {
      if (!visualFrames.length) return [];
      const framesPerGlyph = Math.max(1, Math.round(GLYPH_SOURCE_INTERVAL_MS / WAVE_SAMPLE_INTERVAL_MS));
      const glyphTrack = [];
      let previousEnergy = 0;
      for (let start = 0; start < visualFrames.length; start += framesPerGlyph) {
        const chunk = visualFrames.slice(start, start + framesPerGlyph);
        const features = extractGlyphFeaturesFromVisualFrames(chunk);
        const energy = Math.min(1, features.volume * 0.64 + features.peak * 0.48 + features.roughness * 0.16);
        const onset = Math.max(0, energy - previousEnergy * 0.78);
        const silent = features.volume <= 0.055 && features.peak <= 0.11 && energy <= 0.075;
        glyphTrack.push({
          glyph: silent ? null : createSoundGlyph(features, glyphTrack.length),
          energy,
          onset,
          silent
        });
        previousEnergy = energy;
      }
      return glyphTrack;
    }

    function createGlyphFrames(visualFrames) {
      return createGlyphTrack(visualFrames).map((entry) => entry.glyph);
    }

    function extractGlyphFeaturesFromVisualFrames(entries) {
      const bins = new Array(SPECTROGRAM_BINS).fill(0);
      entries.forEach((entry) => {
        const frame = entry.frame || [];
        for (let i = 0; i < SPECTROGRAM_BINS; i += 1) {
          const value = frame[i] || 0;
          if (value > bins[i]) bins[i] = value;
        }
      });

      const bandValues = [0, 0, 0, 0];
      const bandCounts = [0, 0, 0, 0];
      let total = 0;
      let weighted = 0;
      let peak = 0;
      for (let i = 0; i < bins.length; i += 1) {
        const value = bins[i] / 255;
        const band = Math.min(3, Math.floor(i / (bins.length / 4)));
        bandValues[band] += value;
        bandCounts[band] += 1;
        total += value;
        weighted += value * i;
        if (value > peak) peak = value;
      }

      for (let i = 0; i < bandValues.length; i += 1) {
        bandValues[i] = bandValues[i] / Math.max(1, bandCounts[i]);
      }

      let changes = 0;
      for (let i = 1; i < bins.length; i += 1) {
        changes += Math.abs(bins[i] - bins[i - 1]) / 255;
      }

      const volume = Math.min(1, total / bins.length * 2.4);
      const brightness = bandValues[2] + bandValues[3];
      const warmth = bandValues[0] + bandValues[1] * 0.5;
      const centroid = weighted / Math.max(1, total) / bins.length;
      const roughness = Math.min(1, changes / 18);
      const seed = Math.floor((volume * 1009) + (brightness * 917) + (warmth * 619) + (centroid * 1223) + (roughness * 421) + (peak * 811));
      return { bandValues, volume, brightness, warmth, centroid, roughness, peak, seed };
    }

    function calculateRms(timeValues) {
      if (!timeValues || !timeValues.length) return 0;
      let sum = 0;
      for (let i = 0; i < timeValues.length; i += 1) {
        const centered = (timeValues[i] - 128) / 128;
        sum += centered * centered;
      }
      return Math.sqrt(sum / timeValues.length);
    }

    function drawWave(section) {
      const panel = panels.get(section);
      const canvas = panel.wave;
      const rect = canvas.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      const width = Math.max(1, Math.floor(rect.width * dpr));
      const height = Math.max(1, Math.floor(rect.height * dpr));
      if (canvas.width !== width || canvas.height !== height) {
        canvas.width = width;
        canvas.height = height;
      }

      const ctx = canvas.getContext("2d");
      ctx.clearRect(0, 0, width, height);
      const display = getDisplaySegments(section);
      const visualFrames = display.visualFrames;
      const hasSpectrogram = visualFrames.length > 0;
      const columnWidth = Math.max(1, Number(state.settings.spectrogramSpeed || DEFAULT_SETTINGS.spectrogramSpeed) * dpr);
      const step = columnWidth;
      const bgA = "#ffffff";
      const bgB = "rgba(0, 0, 0, 0.88)";
      const verticalPadding = Math.max(18 * dpr, height * 0.16);
      const spectrumTop = verticalPadding;
      const spectrumHeight = Math.max(1, height - verticalPadding * 2);

      if (!hasSpectrogram) {
        return;
      }

      const targetColumns = Math.floor(width / step);
      const frames = downsampleVisualFrames(visualFrames, targetColumns);
      const startX = Math.max(0, width - frames.length * step);
      const binHeight = spectrumHeight / SPECTROGRAM_BINS;

      frames.forEach((entry, index) => {
        const x = Math.floor(startX + index * step);
        ctx.fillStyle = entry.segmentIndex % 2 === 0 ? bgA : bgB;
        ctx.fillRect(x, 0, columnWidth, height);
        for (let bin = 0; bin < SPECTROGRAM_BINS; bin += 1) {
          const value = entry.frame[bin];
          const color = spectrogramColor(value);
          if (!color) continue;
          const y = Math.floor(spectrumTop + spectrumHeight - (bin + 1) * binHeight);
          ctx.fillStyle = color;
          ctx.fillRect(x, y, columnWidth, Math.ceil(binHeight) + 1);
        }
      });

    }

    function getSegmentCount(section) {
      if (state.current && state.current.section === section) {
        return normalizeSegments(state.current.segments).length;
      }
      const latest = getLatest(section);
      return latest ? latest.segments.length : 0;
    }

    function roundRect(ctx, x, y, width, height, radius) {
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.arcTo(x + width, y, x + width, y + height, radius);
      ctx.arcTo(x + width, y + height, x, y + height, radius);
      ctx.arcTo(x, y + height, x, y, radius);
      ctx.arcTo(x, y, x + width, y, radius);
      ctx.closePath();
    }

    function renderPanel(section) {
      const panel = panels.get(section);
      const isCurrent = state.current && state.current.section === section;
      const latest = getLatest(section);
      const list = state.activeSet[section];
      const currentMs = isCurrent
        ? state.current.recordedMs + (state.current.isPaused ? 0 : performance.now() - state.current.resumeAt)
        : latest ? latest.durationMs : 0;
      const statusText = isCurrent ? (state.current.isPaused ? "잠깐 멈춤" : "녹음 중") : latest ? "저장됨" : "대기";
      panel.status.textContent = statusText;
      panel.status.className = "status-pill";
      if (isCurrent && state.current.isPaused) panel.status.classList.add("is-paused");
      else if (isCurrent) panel.status.classList.add("is-recording");
      else if (latest) panel.status.classList.add("is-saved");

      panel.timer.textContent = formatDuration(currentMs);
      const audioType = getSupportedAudioType();
      panel.format.textContent = `${audioType.extension.toUpperCase()} 저장`;
      panel.limit.textContent = `최대 ${section === "discussion" ? state.settings.discussionLimit : state.settings.storyLimit}분`;
      panel.waveLabel.textContent = isCurrent
        ? state.current.isPaused ? "멈춘 상태입니다. 이어 녹음을 누르면 계속됩니다." : "녹음 중인 소리가 누적됩니다."
        : latest ? `${latest.fileName}` : "녹음되면 파형이 채워집니다.";
      const chunks = getSegmentCount(section);
      panel.chunkLabel.textContent = `구간 ${chunks}`;
      panel.buttons.start.disabled = Boolean(state.current);
      panel.buttons.pause.disabled = !isCurrent || state.current.isPaused;
      panel.buttons.resume.disabled = !isCurrent || !state.current.isPaused;
      panel.buttons.finish.disabled = !isCurrent;
      panel.versions.innerHTML = renderVersions(section, list);
      drawWave(section);
    }

    function renderVersions(section, list) {
      if (!list.length) {
        return `<p class="empty">아직 저장된 녹음이 없습니다.</p>`;
      }
      const latest = list[list.length - 1];
      const duration = formatDuration(latest.durationMs);
      const canListen = section === "story";
      const glyphMode = state.settings.glyphMode || DEFAULT_SETTINGS.glyphMode;
      const listenModeClass = glyphMode === "single" ? "is-single" : "is-strip";
      return `
        <div class="latest-row">
          <div class="latest-title">
            <strong>${escapeHtml(SECTION_META[section].title)} 최신 <span class="version-chip">v${String(latest.versionNumber).padStart(2, "0")}</span></strong>
            <small>${duration} · ${escapeHtml(latest.fileName)}</small>
          </div>
          <div class="latest-buttons">
            <button class="small-button listen ${canListen ? "" : "is-hidden"}" type="button" data-listen="${section}" data-version="${latest.versionNumber}" ${canListen ? "" : "tabindex=\"-1\" aria-hidden=\"true\""}>듣기</button>
            <button class="small-button" type="button" data-download="${section}" data-version="${latest.versionNumber}">내려받기</button>
          </div>
        </div>
        <div class="listen-drawer ${listenModeClass} ${canListen && state.playback && state.playback.section === section ? "is-open" : ""} ${canListen ? "" : "is-hidden"}" data-listen-drawer="${section}">
          <canvas class="pattern" width="760" height="64" data-pattern="${section}" aria-label="소리 글리프 패턴"></canvas>
          <div class="audio-box">
            <strong id="${section}ListenTitle">${escapeHtml(SECTION_META[section].title)} 듣기</strong>
            <audio controls src="${latest.url}" data-audio="${section}"></audio>
          </div>
        </div>
      `;
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function renderSavedStrip() {
      elements.savedStrip.innerHTML = "";
      if (!state.completedSets.length) {
        const chip = document.createElement("span");
        chip.className = "saved-chip";
        chip.textContent = "완성된 세트 없음";
        elements.savedStrip.appendChild(chip);
        return;
      }
      state.completedSets.slice(-4).reverse().forEach((set) => {
        const chip = document.createElement("span");
        chip.className = "saved-chip";
        chip.textContent = `${set.groupName || `세트 ${set.number}`} · ${formatClock(set.completedAt)}`;
        elements.savedStrip.appendChild(chip);
      });
    }

    function render() {
      elements.nowChip.textContent = formatClock();
      const fullscreen = Boolean(getFullscreenElement());
      elements.fullscreenButton.textContent = fullscreen ? "↙" : "⛶";
      elements.fullscreenButton.setAttribute("aria-label", fullscreen ? "전체화면 나가기" : "전체화면");
      elements.setLabel.textContent = getGroupLabel().replace(/_/g, " ");
      elements.dirtyChip.textContent = isDirty() ? "저장 전" : "저장됨";
      elements.dirtyChip.style.background = isDirty() ? "#fff0e8" : "#edf8f0";
      elements.completeButton.disabled = Boolean(state.current);
      elements.newSetButton.disabled = Boolean(state.current);
      renderPanel("discussion");
      renderPanel("story");
      renderSavedStrip();
    }

    async function completeSet() {
      if (state.current) {
        setMessage("녹음 중입니다. 먼저 끝냄을 눌러 주세요.");
        return;
      }
      if (!getLatest("discussion") && !getLatest("story")) {
        setMessage("완성할 녹음이 아직 없습니다.");
        return;
      }
      const completed = {
        ...state.activeSet,
        groupName: state.activeSet.groupName.trim() || `세트 ${state.activeSet.number}`,
        completedAt: new Date()
      };
      state.completedSets.push(completed);
      await downloadZip();
      setMessage(`${completed.groupName} 세트를 완성 목록에 넣고 최신 버전을 ZIP으로 저장했습니다.`);
      render();
    }

    function startNewSet() {
      if (state.current) {
        setMessage("녹음 중입니다. 먼저 끝냄을 눌러 주세요.");
        return;
      }
      if (isDirty() && !window.confirm("아직 내려받지 않은 녹음이 있습니다. 새 세트를 시작할까요?")) {
        return;
      }
      ["discussion", "story"].forEach((section) => {
        state.activeSet[section].forEach((item) => URL.revokeObjectURL(item.url));
      });
      state.activeSet = createSet(state.completedSets.length + 1);
      state.savedDownloadKeys.clear();
      elements.groupName.value = "";
      state.playback = null;
      setMessage("새 세트를 시작합니다.");
      render();
    }

    async function downloadZip() {
      const latest = ["discussion", "story"].map((section) => getLatest(section)).filter(Boolean);
      if (!latest.length) {
        setMessage("ZIP으로 저장할 녹음이 없습니다.");
        return;
      }
      const zipName = `${compactStamp()}_${sanitizeName(getGroupLabel())}_녹음.zip`;
      const blob = await createZipBlob(latest.map((item) => ({ name: item.fileName, blob: item.blob, date: item.createdAt })));
      requestDownload(blob, zipName, () => {
        latest.forEach(markDownloaded);
        setMessage("최신 버전만 ZIP으로 저장했습니다.");
      });
    }

    const crcTable = (() => {
      const table = new Uint32Array(256);
      for (let i = 0; i < 256; i += 1) {
        let c = i;
        for (let k = 0; k < 8; k += 1) {
          c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1;
        }
        table[i] = c >>> 0;
      }
      return table;
    })();

    function crc32(bytes) {
      let crc = 0xffffffff;
      for (let i = 0; i < bytes.length; i += 1) {
        crc = crcTable[(crc ^ bytes[i]) & 0xff] ^ (crc >>> 8);
      }
      return (crc ^ 0xffffffff) >>> 0;
    }

    function dateToDos(date) {
      const safeDate = date instanceof Date ? date : new Date();
      const year = Math.max(1980, safeDate.getFullYear());
      const dosTime = (safeDate.getHours() << 11) | (safeDate.getMinutes() << 5) | Math.floor(safeDate.getSeconds() / 2);
      const dosDate = ((year - 1980) << 9) | ((safeDate.getMonth() + 1) << 5) | safeDate.getDate();
      return { dosTime, dosDate };
    }

    function u16(value) {
      return [value & 0xff, (value >>> 8) & 0xff];
    }

    function u32(value) {
      return [value & 0xff, (value >>> 8) & 0xff, (value >>> 16) & 0xff, (value >>> 24) & 0xff];
    }

    async function createZipBlob(files) {
      const encoder = new TextEncoder();
      const localParts = [];
      const centralParts = [];
      let offset = 0;

      for (const file of files) {
        const nameBytes = encoder.encode(file.name);
        const data = new Uint8Array(await file.blob.arrayBuffer());
        const crc = crc32(data);
        const { dosTime, dosDate } = dateToDos(file.date);
        const localHeader = new Uint8Array([
          ...u32(0x04034b50),
          ...u16(20),
          ...u16(0x0800),
          ...u16(0),
          ...u16(dosTime),
          ...u16(dosDate),
          ...u32(crc),
          ...u32(data.length),
          ...u32(data.length),
          ...u16(nameBytes.length),
          ...u16(0)
        ]);
        const centralHeader = new Uint8Array([
          ...u32(0x02014b50),
          ...u16(20),
          ...u16(20),
          ...u16(0x0800),
          ...u16(0),
          ...u16(dosTime),
          ...u16(dosDate),
          ...u32(crc),
          ...u32(data.length),
          ...u32(data.length),
          ...u16(nameBytes.length),
          ...u16(0),
          ...u16(0),
          ...u16(0),
          ...u16(0),
          ...u32(0),
          ...u32(offset)
        ]);

        localParts.push(localHeader, nameBytes, data);
        centralParts.push(centralHeader, nameBytes);
        offset += localHeader.length + nameBytes.length + data.length;
      }

      const centralSize = centralParts.reduce((sum, part) => sum + part.length, 0);
      const endRecord = new Uint8Array([
        ...u32(0x06054b50),
        ...u16(0),
        ...u16(0),
        ...u16(files.length),
        ...u16(files.length),
        ...u32(centralSize),
        ...u32(offset),
        ...u16(0)
      ]);

      return new Blob([...localParts, ...centralParts, endRecord], { type: "application/zip" });
    }

    function findRecording(section, versionNumber) {
      return state.activeSet[section].find((item) => item.versionNumber === Number(versionNumber));
    }

    function handleVersionClick(event) {
      const listenButton = event.target.closest("[data-listen]");
      const downloadButton = event.target.closest("[data-download]");

      if (listenButton) {
        const section = listenButton.dataset.listen;
        const recording = findRecording(section, listenButton.dataset.version);
        if (recording) openListen(section, recording);
        return;
      }

      if (downloadButton) {
        const section = downloadButton.dataset.download;
        const recording = findRecording(section, downloadButton.dataset.version);
        if (recording) {
          requestDownload(recording.blob, recording.fileName, () => {
            markDownloaded(recording);
            setMessage(`${recording.fileName} 내려받기를 시작했습니다.`);
          });
        }
        return;
      }
    }

    function openListen(section, recording) {
      if (section !== "story") return;
      stopPlaybackVisualizer();
      state.playback = { section, recording };
      render();
      const drawer = panels.get(section).versions.querySelector(`[data-listen-drawer="${section}"]`);
      const audio = drawer.querySelector("audio");
      const canvas = drawer.querySelector("canvas");
      startPlaybackVisualizer(audio, canvas, section);
      audio.play().catch(() => {});
      setMessage(`${SECTION_META[section].title} 최신 녹음을 듣습니다.`);
    }

    function stopPlaybackVisualizer() {
      if (!state.playback || !state.playback.cleanup) return;
      state.playback.cleanup();
      state.playback.cleanup = null;
    }

    function closePlayback() {
      stopPlaybackVisualizer();
      state.playback = null;
    }

    function refreshActivePlayback() {
      if (!state.playback || state.playback.section !== "story") return;
      const section = state.playback.section;
      const audio = panels.get(section).versions.querySelector(`[data-listen-drawer="${section}"] audio`);
      const currentTime = audio ? audio.currentTime : 0;
      const wasPaused = audio ? audio.paused : true;
      stopPlaybackVisualizer();
      render();
      const drawer = panels.get(section).versions.querySelector(`[data-listen-drawer="${section}"]`);
      if (!drawer) return;
      const nextAudio = drawer.querySelector("audio");
      const canvas = drawer.querySelector("canvas");
      nextAudio.currentTime = currentTime;
      startPlaybackVisualizer(nextAudio, canvas, section);
      if (!wasPaused) nextAudio.play().catch(() => {});
    }

    function startPlaybackVisualizer(audio, canvas, section) {
      const recording = state.playback && state.playback.recording;
      if (!recording) return;
      if (!recording.glyphTrack || recording.glyphFrameInterval !== GLYPH_SOURCE_INTERVAL_MS) {
        recording.glyphTrack = createGlyphTrack(recording.visualFrames || []);
        recording.glyphFrames = recording.glyphTrack.map((entry) => entry.glyph);
        recording.glyphFrameInterval = GLYPH_SOURCE_INTERVAL_MS;
      }
      const glyphMode = state.settings.glyphMode || DEFAULT_SETTINGS.glyphMode;
      const glyphSize = 16;
      const pixel = 4;
      const gap = 4;
      const glyphLimit = glyphMode === "single" ? 1 : 10;
      const glyphInterval = glyphMode === "single" ? GLYPH_SINGLE_INTERVAL_MS : GLYPH_STRIP_INTERVAL_MS;
      const canvasCtx = canvas.getContext("2d");
      canvasCtx.imageSmoothingEnabled = false;
      let raf = null;
      let isCleanedUp = false;
      let displayedSingleIndex = null;
      let playbackContext = null;
      let playbackSource = null;
      let playbackAnalyser = null;
      let playbackFrequency = null;
      let playbackTime = null;
      let liveGlyph = null;
      let liveGlyphStamp = -Infinity;
      let liveSoundStamp = -Infinity;
      let previousLiveEnergy = 0;
      let lastPositionMs = 0;

      if (glyphMode === "single" && (window.AudioContext || window.webkitAudioContext)) {
        try {
          playbackContext = new (window.AudioContext || window.webkitAudioContext)();
          playbackSource = playbackContext.createMediaElementSource(audio);
          playbackAnalyser = playbackContext.createAnalyser();
          playbackAnalyser.fftSize = 2048;
          playbackAnalyser.smoothingTimeConstant = 0.12;
          playbackSource.connect(playbackAnalyser);
          playbackAnalyser.connect(playbackContext.destination);
          playbackFrequency = new Uint8Array(playbackAnalyser.frequencyBinCount);
          playbackTime = new Uint8Array(playbackAnalyser.fftSize);
        } catch (error) {
          console.warn("Playback analyzer is not available.", error);
          playbackContext = null;
          playbackSource = null;
          playbackAnalyser = null;
          playbackFrequency = null;
          playbackTime = null;
        }
      }

      function getGlyphEntryAtTime(positionMs) {
        const index = Math.max(0, Math.floor(positionMs / GLYPH_SOURCE_INTERVAL_MS));
        return recording.glyphTrack[index] || null;
      }

      function getGlyphAtTime(positionMs) {
        const entry = getGlyphEntryAtTime(positionMs);
        return entry ? entry.glyph : null;
      }

      function resetLiveGlyph() {
        liveGlyph = null;
        liveGlyphStamp = -Infinity;
        liveSoundStamp = -Infinity;
        previousLiveEnergy = 0;
        displayedSingleIndex = null;
        lastPositionMs = 0;
      }

      function readGlyphs(positionMs) {
        if (glyphMode === "single") {
          if (positionMs + 120 < lastPositionMs) {
            resetLiveGlyph();
          }
          lastPositionMs = positionMs;

          if (playbackAnalyser && playbackFrequency && playbackTime) {
            playbackAnalyser.getByteFrequencyData(playbackFrequency);
            playbackAnalyser.getByteTimeDomainData(playbackTime);
            const frame = compressFrequencyFrame(playbackFrequency);
            const features = extractGlyphFeaturesFromVisualFrames([{ frame }]);
            const rms = calculateRms(playbackTime);
            const amplitude = Math.min(1, rms * 5.2);
            const spectralEnergy = Math.min(1, features.volume * 0.55 + features.peak * 0.35);
            const hasAmplitude = rms >= GLYPH_LIVE_RMS_FLOOR
              || (rms >= GLYPH_LIVE_RMS_SOFT_FLOOR && features.peak > 0.14);
            const energy = hasAmplitude ? Math.min(1, amplitude * 0.72 + spectralEnergy * 0.45) : 0;
            const onset = Math.max(0, energy - previousLiveEnergy * 0.72);
            const isSilent = !hasAmplitude || spectralEnergy < 0.035;
            previousLiveEnergy = energy;

            if (!isSilent) {
              liveSoundStamp = positionMs;
              const elapsed = positionMs - liveGlyphStamp;
              const onsetCooldown = Math.max(150, glyphInterval * 0.62);
              const hasFreshOnset = onset > 0.11 && elapsed >= onsetCooldown;
              const hasSustainedEnergy = energy > 0.24 && elapsed >= glyphInterval;
              const hasLongHold = elapsed >= glyphInterval * 2.1;
              const shouldChangeGlyph = !liveGlyph
                || hasFreshOnset
                || hasSustainedEnergy
                || hasLongHold;
              if (shouldChangeGlyph) {
                liveGlyph = createSoundGlyph(features, Math.floor(positionMs / glyphInterval));
                liveGlyphStamp = positionMs;
              }
            } else if (positionMs - liveSoundStamp > 140) {
              liveGlyph = null;
            }

            return {
              glyphs: [liveGlyph],
              scrollProgress: 0
            };
          }

          const sourceIndex = Math.max(0, Math.floor(positionMs / GLYPH_SOURCE_INTERVAL_MS));
          const entry = recording.glyphTrack[sourceIndex] || null;
          if (!entry || entry.silent) {
            const silenceHoldFrames = Math.max(1, Math.round(GLYPH_SILENCE_HOLD_MS / GLYPH_SOURCE_INTERVAL_MS));
            const recentStart = Math.max(0, sourceIndex - silenceHoldFrames + 1);
            const hasRecentSound = recording.glyphTrack
              .slice(recentStart, sourceIndex + 1)
              .some((item) => item && !item.silent && item.glyph);
            if (displayedSingleIndex !== null && hasRecentSound) {
              return {
                glyphs: [(recording.glyphTrack[displayedSingleIndex] || {}).glyph || null],
                scrollProgress: 0
              };
            }
            displayedSingleIndex = null;
            return { glyphs: [null], scrollProgress: 0 };
          }
          const minFrames = Math.max(1, Math.round(glyphInterval / GLYPH_SOURCE_INTERVAL_MS));
          const isSeekBack = displayedSingleIndex !== null && sourceIndex < displayedSingleIndex;
          const isFreshOnset = entry.onset > 0.16;
          const isStale = displayedSingleIndex === null || sourceIndex - displayedSingleIndex >= minFrames;
          if (isSeekBack || isFreshOnset || isStale) {
            displayedSingleIndex = sourceIndex;
          }
          return {
            glyphs: [(recording.glyphTrack[displayedSingleIndex] || entry).glyph],
            scrollProgress: 0
          };
        }

        const displayIndex = Math.max(0, Math.floor(positionMs / glyphInterval));
        const glyphs = [];
        for (let index = Math.max(0, displayIndex - glyphLimit + 1); index <= displayIndex; index += 1) {
          glyphs.push(getGlyphAtTime(index * glyphInterval));
        }
        return {
          glyphs,
          scrollProgress: Math.min(1, (positionMs % glyphInterval) / glyphInterval)
        };
      }

      function paint(keepGoing = true) {
        if (isCleanedUp) return;
        const canvasSize = syncPatternCanvas(canvas, canvasCtx);
        const positionMs = audio.currentTime * 1000;
        const { glyphs, scrollProgress } = readGlyphs(positionMs);
        drawGlyphStrip(canvasCtx, glyphs, { glyphMode, glyphSize, pixel, gap, scrollProgress, width: canvasSize.width, height: canvasSize.height });
        if (keepGoing && !audio.paused && !audio.ended) {
          raf = requestAnimationFrame(() => paint(true));
        } else {
          raf = null;
        }
      }

      paint(false);

      audio.addEventListener("play", () => {
        if (audio.currentTime < 0.12) resetLiveGlyph();
        if (playbackContext) playbackContext.resume().catch(() => {});
        if (!raf) paint(true);
      });
      audio.addEventListener("seeking", () => {
        resetLiveGlyph();
      });
      audio.addEventListener("pause", () => {
        if (raf) cancelAnimationFrame(raf);
        raf = null;
        paint(false);
      });
      audio.addEventListener("ended", () => {
        if (raf) cancelAnimationFrame(raf);
        raf = null;
        resetLiveGlyph();
        paint(false);
      });

      state.playback.cleanup = () => {
        isCleanedUp = true;
        if (raf) cancelAnimationFrame(raf);
        if (playbackSource) playbackSource.disconnect();
        if (playbackAnalyser) playbackAnalyser.disconnect();
        if (playbackContext) playbackContext.close().catch(() => {});
      };
    }

    function seededRandom(seed) {
      let value = seed >>> 0;
      return () => {
        value = (value * 1664525 + 1013904223) >>> 0;
        return value / 4294967296;
      };
    }

    function createSoundGlyph(features, index) {
      const size = 16;
      const grid = Array.from({ length: size }, () => Array(size).fill(false));
      const rand = seededRandom(features.seed + index * 104729);
      const symmetry = features.brightness > features.warmth ? "quad" : "vertical";
      const module = 2 + Math.floor(features.roughness * 3);
      const threshold = 0.68 - features.volume * 0.12;
      const ringRadius = 3 + Math.floor(features.peak * 5);
      const centerA = 5 + Math.floor(features.bandValues[0] * 5);
      const centerB = 5 + Math.floor(features.bandValues[2] * 5);

      function setPixel(x, y, value = true) {
        if (x < 0 || y < 0 || x >= size || y >= size) return;
        grid[y][x] = value || grid[y][x];
        grid[y][size - 1 - x] = value || grid[y][size - 1 - x];
        if (symmetry === "quad") {
          grid[size - 1 - y][x] = value || grid[size - 1 - y][x];
          grid[size - 1 - y][size - 1 - x] = value || grid[size - 1 - y][size - 1 - x];
        }
      }

      for (let y = 0; y < size; y += 1) {
        for (let x = 0; x < 8; x += 1) {
          const wave = Math.sin((x + features.seed % 9) * 0.9) + Math.cos((y + index) * (0.45 + features.centroid));
          const lattice = ((x * centerA + y * centerB + features.seed) % (3 + module)) === 0;
          const diagonal = Math.abs((x + y + features.seed) % (5 + module) - module) < 1;
          const ring = Math.abs(Math.hypot(x - 7.5, y - 7.5) - ringRadius) < 0.72 + features.peak * 0.6;
          const noise = rand();
          if (wave * 0.12 + noise * 0.42 + features.bandValues[(x + y) % 4] > threshold || (lattice && noise > 0.42) || (diagonal && features.roughness > 0.28) || ring) {
            setPixel(x, y);
          }
        }
      }

      const bars = 1 + Math.floor(features.volume * 4);
      for (let i = 0; i < bars; i += 1) {
        const y = 2 + ((features.seed + i * 5) % 12);
        const divisor = 2 + Math.floor(features.brightness * 3);
        for (let x = 2; x < 14; x += 1) {
          if ((x + i + index) % divisor === 0) setPixel(x, y);
        }
      }

      for (let i = 0; i < 4 + Math.floor(features.roughness * 10); i += 1) {
        const x = Math.floor(rand() * 8);
        const y = Math.floor(rand() * 16);
        if (rand() > 0.52) setPixel(x, y);
      }

      grid[7][7] = true;
      grid[7][8] = true;
      grid[8][7] = true;
      grid[8][8] = features.peak > 0.28;
      return grid;
    }

    function syncPatternCanvas(canvas, ctx) {
      const rect = canvas.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      const width = Math.max(1, Math.round(rect.width));
      const height = Math.max(1, Math.round(rect.height));
      const backingWidth = Math.max(1, Math.round(width * dpr));
      const backingHeight = Math.max(1, Math.round(height * dpr));
      if (canvas.width !== backingWidth || canvas.height !== backingHeight) {
        canvas.width = backingWidth;
        canvas.height = backingHeight;
      }
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.imageSmoothingEnabled = false;
      return { width, height };
    }

    function drawGlyphStrip(ctx, glyphs, options) {
      const { glyphMode, glyphSize, pixel, gap, scrollProgress, width, height } = options;
      const glyphPixelSize = glyphSize * pixel;
      const glyphStep = glyphPixelSize + gap;
      const totalWidth = glyphs.length * glyphPixelSize + Math.max(0, glyphs.length - 1) * gap;
      const startX = glyphMode === "single"
        ? 0
        : width - totalWidth + glyphStep - scrollProgress * glyphStep;
      const startY = Math.floor((height - glyphPixelSize) / 2);
      ctx.clearRect(0, 0, width, height);
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, width, height);

      glyphs.forEach((glyph, glyphIndex) => {
        const originX = glyphMode === "single" ? 0 : startX + glyphIndex * (glyphPixelSize + gap);
        if (!glyph) return;
        ctx.fillStyle = "#151918";
        for (let y = 0; y < glyphSize; y += 1) {
          for (let x = 0; x < glyphSize; x += 1) {
            if (!glyph[y][x]) continue;
            ctx.fillRect(originX + x * pixel, startY + y * pixel, pixel, pixel);
          }
        }
      });
    }

    elements.groupName.addEventListener("input", (event) => {
      state.activeSet.groupName = event.target.value;
      render();
    });

    panels.forEach((panel, section) => {
      panel.root.addEventListener("click", (event) => {
        const actionButton = event.target.closest("[data-action]");
        if (actionButton) {
          const action = actionButton.dataset.action;
          if (action === "start") startRecording(section);
          if (action === "pause") pauseRecording(section);
          if (action === "resume") resumeRecording(section);
          if (action === "finish") finishRecording(section);
          return;
        }
        handleVersionClick(event);
      });
    });

    elements.completeButton.addEventListener("click", completeSet);
    elements.newSetButton.addEventListener("click", startNewSet);
    elements.fullscreenButton.addEventListener("click", async () => {
      try {
        if (getFullscreenElement()) {
          await exitFullscreen();
        } else {
          await requestFullscreen();
        }
        render();
      } catch {
        setMessage("이 브라우저에서 전체화면을 시작할 수 없습니다.");
      }
    });
    document.addEventListener("fullscreenchange", render);
    document.addEventListener("webkitfullscreenchange", render);
    elements.settingsButton.addEventListener("click", () => {
      elements.discussionLimit.value = state.settings.discussionLimit;
      elements.storyLimit.value = state.settings.storyLimit;
      elements.formatPreference.value = state.settings.formatPreference;
      elements.spectrogramSpeed.value = String(state.settings.spectrogramSpeed || DEFAULT_SETTINGS.spectrogramSpeed);
      elements.glyphMode.value = state.settings.glyphMode || DEFAULT_SETTINGS.glyphMode;
      elements.settingsDialog.showModal();
    });
    elements.saveSettings.addEventListener("click", () => {
      state.settings.discussionLimit = Number(elements.discussionLimit.value) || DEFAULT_SETTINGS.discussionLimit;
      state.settings.storyLimit = Number(elements.storyLimit.value) || DEFAULT_SETTINGS.storyLimit;
      state.settings.formatPreference = elements.formatPreference.value;
      state.settings.spectrogramSpeed = Number(elements.spectrogramSpeed.value) || DEFAULT_SETTINGS.spectrogramSpeed;
      state.settings.glyphMode = elements.glyphMode.value || DEFAULT_SETTINGS.glyphMode;
      saveSettingsToStorage();
      setMessage("설정을 저장했습니다.");
      if (state.playback && state.playback.section === "story") {
        refreshActivePlayback();
      } else {
        render();
      }
    });

    window.addEventListener("beforeunload", (event) => {
      if (!isDirty()) return;
      event.preventDefault();
      event.returnValue = "";
    });

    window.addEventListener("resize", () => {
      drawWave("discussion");
      drawWave("story");
    });

    window.setInterval(() => {
      elements.nowChip.textContent = formatClock();
    }, 1000);

    render();
  </script>
</body>
</html>
