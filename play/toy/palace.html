        }

            margin-bottom: 1.5rem;

            border-radius: 0.75rem;
            margin-bottom: 1.5rem;
            font-size: 1rem;

            border-color: #60a5fa;
        }

            width: 100%;
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 0.75rem;
            font-weight: 600;
            color: white;
            cursor: pointer;
            transition: background-color 0.2s;
        }

            background-color: #3b82f6;
        }

        .button-check:hover {
            background-color: #2563eb;
        }

        .button-next {
            background-color: #10b981;
        }

        .button-next:hover {
            background-color: #059669;
        }

        .button-reset {
            background-color: #8b5cf6;
        }

        .button-reset:hover {
            background-color: #7c3aed;
        }

        .feedback {
            margin-top: 1rem;
            padding: 1rem;
            border-radius: 0.75rem;
            text-align: center;
        }

        .feedback.success {
            background-color: #d1fae5;
            color: #065f46;
        }

        .feedback.error {
            background-color: #fee2e2;
            color: #991b1b;
        }

        .celebration-text {
            text-align: center;
            color: #059669;
            font-size: 1.5rem;
            font-weight: bold;
            margin-top: -6rem;
            animation: bounce 1s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(-25%); }
            50% { transform: translateY(0); }
        }

        @keyframes confetti {
            0% { transform: translateY(0) rotateZ(0deg); opacity: 1; }
            100% { transform: translateY(1000px) rotateZ(720deg); opacity: 0; }
        }

        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            pointer-events: none;
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

            position: relative;
            background-color: white;
            width: 90%;
            height: 90%;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);

            left: 20px;
            top: 10px;
            font-size: 30px;
            font-weight: bold;
            color: #666;
            cursor: pointer;
            z-index: 1001;

        .close-button:hover {
            color: #000;
        }

        #modal-iframe {
            width: 100%;
            height: calc(100% - 20px);
            border: none;
        }

        function parseTSVToQuizData(tsvString) {
            // 줄바꿈으로 분리하고 첫 번째 줄(헤더) 제거
            const lines = tsvString.trim().split('\n').slice(1);
            
            // 각 줄을 객체로 변환
            const quizData = lines.map(line => {
                const [answer, question] = line.split('\t');
                return {
                    question: question,
                    answer: answer
                };
            });
            
            return quizData;
        }

        const getPasswordFromURL = () => {
            const params = new URLSearchParams(window.location.search);
            const pwParam = params.get('pw');
            
            if (pwParam && /^\d{4}$/.test(pwParam)) {
                // 4자리 숫자인 경우 각 숫자를 배열로 변환
                return pwParam.split('').map(Number);
            }
            // 유효하지 않은 경우 기본값 반환
            return [0, 1, 2, 3];
        };

        function getRandomQuestions() {
            const shuffled = shuffle([...quizData]);
            return shuffled.slice(0, 10); // 섞은 후 앞에서 10개만 선택
        }

        const finalPassword = getPasswordFromURL();
        let questions = getRandomQuestions();
        let currentIndex = 0;
        let correctCount = 0;
        let isCompleted = false;
        let spinTimeout;

        // Elements
        const questionElement = document.getElementById('question');
        const answerInput = document.getElementById('answer-input');
        const checkButton = document.getElementById('check-button');
        const buttonContainer = document.getElementById('button-container');
        const feedbackElement = document.getElementById('feedback');
        const scoreElement = document.getElementById('score');
        const numberBoxes = document.querySelectorAll('.number-box');

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function showQuestion() {
            questionElement.textContent = questions[currentIndex].question;
        }

        function createConfetti() {
            const colors = ['#FFD700', '#FF69B4', '#4169E1', '#98FB98'];
            for (let i = 0; i < 50; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * 100 + '%';
                confetti.style.top = '-10px';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.animation = `confetti ${2 + Math.random() * 3}s linear forwards`;
                confetti.style.animationDelay = `${Math.random() * 3}s`;
                document.querySelector('.quiz-card').appendChild(confetti);
                
                confetti.addEventListener('animationend', () => {
                    confetti.remove();
                });
            }
        }

        function startSpinAnimation() {
            numberBoxes.forEach(box => box.classList.add('spinning'));
            
            const duration = 3000;
            const startTime = Date.now();

            function animate() {
                const now = Date.now();
                const elapsed = now - startTime;

                if (elapsed < duration) {
                    numberBoxes.forEach(box => {
                        box.textContent = Math.floor(Math.random() * 10);
                    });
                    spinTimeout = setTimeout(animate, 50);
                } else {
                    numberBoxes.forEach((box, index) => {
                        box.textContent = finalPassword[index];
                        box.classList.remove('spinning');
                        box.classList.add('revealed');
                    });
                    
                    const celebrationText = document.createElement('div');
                    celebrationText.className = 'celebration-text';
                    celebrationText.textContent = '🎉 축하합니다! 비밀번호를 모두 획득하셨습니다! 🎉';
                    document.querySelector('.quiz-card').insertBefore(
                        celebrationText,
                        document.querySelector('.score-display')
                    );
                    
                    createConfetti();
                    isCompleted = true;
                    showResetButton();
                }
            }

            animate();
        }

        function showResetButton() {
            buttonContainer.innerHTML = `
                <button class="button button-reset">처음부터 다시하기</button>
            `;
            
            buttonContainer.querySelector('.button-reset').addEventListener('click', resetQuiz);
        }

        function showNextButton() {
            buttonContainer.innerHTML = `
                <button class="button button-next">다음 문제!</button>
            `;
            
            buttonContainer.querySelector('.button-next').addEventListener('click', nextQuestion);
        }

        function showCheckButton() {
            buttonContainer.innerHTML = `
                <button class="button button-check">정답 확인하기</button>
            `;
            
            buttonContainer.querySelector('.button-check').addEventListener('click', checkAnswer);
        }

        // 모달 관련 함수들 추가
        function openModal(url) {
            // 모바일 기기 체크
            if (/Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent)) {
                // 모바일에서는 새 창으로 열기
                window.open(url, '_blank');
            } else {
                // 데스크톱에서는 기존 모달로 열기
                const modal = document.getElementById('modal');
                const iframe = document.getElementById('modal-iframe');
                iframe.src = url;
                modal.style.display = 'flex';
            }
        }

        function closeModal() {
            const modal = document.getElementById('modal');
            const iframe = document.getElementById('modal-iframe');
            iframe.src = '';  // iframe 내용 클리어
            modal.style.display = 'none';
        }

        function checkAnswer() {
            const userAnswer = answerInput.value.trim().toLowerCase();
            const correctAnswer = questions[currentIndex].answer.toLowerCase();
            const isCorrect = userAnswer === correctAnswer;
            
            if (isCorrect) {
                feedbackElement.innerHTML = `문제를 맞춘 당신은 경복궁 똑똑이 !<br><br>
                    <div>🔎
                    <a href="#" onclick="openModal('${questions[currentIndex].link}'); return false;" style="color: #059669; text-decoration: underline;">
                    ${questions[currentIndex].explain}</a>
                    </div>`;
                feedbackElement.className = 'feedback success';
                correctCount++;
                scoreElement.textContent = correctCount;
                
                if (correctCount === 10) {
                    startSpinAnimation();
                } else {
                    showNextButton();
                }
            } else {
                feedbackElement.textContent = '실수하셨나봐용~ 테이프 정육면체를 만들면서 생각해보세요!';
                feedbackElement.className = 'feedback error';
            }
            
            feedbackElement.style.display = 'block';
        }

        function nextQuestion() {
            if (currentIndex >= questions.length - 1) {
                questions = getRandomQuestions();
                currentIndex = 0;
            } else {
                currentIndex++;
            }
            
            answerInput.value = '';
            feedbackElement.style.display = 'none';
            showQuestion();
            showCheckButton();
        }

        function resetQuiz() {
            if (spinTimeout) {
                clearTimeout(spinTimeout);
            }
            
            // Reset all state
            questions = getRandomQuestions();
            currentIndex = 0;
            correctCount = 0;
            isCompleted = false;
            
            // Reset UI
            answerInput.value = '';
            answerInput.disabled = false;
            feedbackElement.style.display = 'none';
            scoreElement.textContent = '0';
            
            // Reset number boxes
            numberBoxes.forEach(box => {
                box.textContent = '?';
                box.classList.remove('spinning', 'revealed');
            });
            
            // Remove celebration elements
            const celebrationText = document.querySelector('.celebration-text');
            if (celebrationText) {
                celebrationText.remove();
            }
            
            // Remove any remaining confetti
            document.querySelectorAll('.confetti').forEach(confetti => confetti.remove());
            
            showQuestion();
            showCheckButton();
        }

        // Event Listeners
        answerInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !isCompleted) {
                checkAnswer();
            }
        });

        // 이벤트 리스너 추가
        document.querySelector('.close-button').addEventListener('click', closeModal);

        // 모달 바깥 클릭시 닫기
        document.getElementById('modal').addEventListener('click', function(event) {
            if (event.target === this) {
                closeModal();
            }
        });

        // ESC 키로 모달 닫기
        document.addEventListener('keydown', function(event) {
            if (event.key === 'Escape') {
                closeModal();
            }
        });

        // Initialize
        questions = shuffle(questions);
        showQuestion();
        showCheckButton();
    </script>
