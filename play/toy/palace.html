        * {

        }

            padding: 2rem;
        }

        .number-display {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .number-box {
            width: 4rem;
            height: 4rem;
            border: 4px solid #ccc;
            border-radius: 0.75rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.875rem;
            font-weight: bold;
            background-color: #f3f4f6;
            transition: all 0.3s;
        }

        .number-box.spinning {
            background-color: #fef3c7;
            border-color: #fbbf24;
            transform: scale(1.1);
        }

        .number-box.revealed {
            background-color: #d1fae5;
            border-color: #10b981;
        }

        .score-display {
            text-align: center;
            margin: 1rem 0;
        }

        .score-pill {
            display: inline-block;
            background-color: #dbeafe;
            color: #1e40af;
            padding: 0.5rem 1rem;
            border-radius: 9999px;
            font-size: 0.875rem;
        }

        .quiz-title {
            font-size: 2.25rem;
            font-weight: bold;
            color: #1f2937;
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .question-box {
            background-color: #eff6ff;
            padding: 1.5rem;
            border-radius: 0.75rem;
            margin-bottom: 1.5rem;
        }

        .question-text {
            color: #374151;
            line-height: 1.625;
        }

        .answer-input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 2px solid #bfdbfe;
            border-radius: 0.75rem;
            margin-bottom: 1.5rem;
            font-size: 1rem;
            transition: border-color 0.2s;
        }

        .answer-input:focus {
            outline: none;
            border-color: #60a5fa;
        }

        .button {
            width: 100%;
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 0.75rem;
            font-weight: 600;
            color: white;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .button-check {
            background-color: #3b82f6;
        }

        .button-check:hover {
            background-color: #2563eb;
        }

        .button-next {
            background-color: #10b981;
        }

        .button-next:hover {
            background-color: #059669;
        }

        .button-reset {
            background-color: #8b5cf6;
        }

        .button-reset:hover {
            background-color: #7c3aed;
        }

        .feedback {
            margin-top: 1rem;
            padding: 1rem;
            border-radius: 0.75rem;
            text-align: center;
        }

        .feedback.success {
            background-color: #d1fae5;
            color: #065f46;
        }

        .feedback.error {
            background-color: #fee2e2;
            color: #991b1b;
        }

        .celebration-text {
            text-align: center;
            color: #059669;
            font-size: 1.5rem;
            font-weight: bold;
            margin-top: -6rem;
            animation: bounce 1s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(-25%); }
            50% { transform: translateY(0); }
        }

        @keyframes confetti {
            0% { transform: translateY(0) rotateZ(0deg); opacity: 1; }
            100% { transform: translateY(1000px) rotateZ(720deg); opacity: 0; }
        }

        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            pointer-events: none;
        }

            // 줄바꿈으로 분리하고 첫 번째 줄(헤더) 제거
            const lines = tsvString.trim().split('\n').slice(1);
            
            // 각 줄을 객체로 변환
            const quizData = lines.map(line => {
                const [answer, question] = line.split('\t');
                return {
                    question: question,
                    answer: answer
                };
            });
            
            return quizData;
        }

        const getPasswordFromURL = () => {
            const params = new URLSearchParams(window.location.search);
            const pwParam = params.get('pw');
            
            if (pwParam && /^\d{4}$/.test(pwParam)) {
                // 4자리 숫자인 경우 각 숫자를 배열로 변환
                return pwParam.split('').map(Number);
            }
            // 유효하지 않은 경우 기본값 반환
            return [0, 1, 2, 3];
        };

        function getRandomQuestions() {
            const shuffled = shuffle([...quizData]);
            return shuffled.slice(0, 10); // 섞은 후 앞에서 10개만 선택
        }

        const finalPassword = getPasswordFromURL();
        let questions = getRandomQuestions();
        let currentIndex = 0;
        let correctCount = 0;
        let isCompleted = false;
        let spinTimeout;

        // Elements
        const questionElement = document.getElementById('question');
        const answerInput = document.getElementById('answer-input');
        const checkButton = document.getElementById('check-button');
        const buttonContainer = document.getElementById('button-container');
        const feedbackElement = document.getElementById('feedback');
        const scoreElement = document.getElementById('score');
        const numberBoxes = document.querySelectorAll('.number-box');

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function showQuestion() {
            questionElement.textContent = questions[currentIndex].question;
        }

        function createConfetti() {
            const colors = ['#FFD700', '#FF69B4', '#4169E1', '#98FB98'];
            for (let i = 0; i < 50; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * 100 + '%';
                confetti.style.top = '-10px';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.animation = `confetti ${2 + Math.random() * 3}s linear forwards`;
                confetti.style.animationDelay = `${Math.random() * 3}s`;
                document.querySelector('.quiz-card').appendChild(confetti);
                
                confetti.addEventListener('animationend', () => {
                    confetti.remove();
                });
            }
        }

        function startSpinAnimation() {
            numberBoxes.forEach(box => box.classList.add('spinning'));
            
            const duration = 3000;
            const startTime = Date.now();

            function animate() {
                const now = Date.now();
                const elapsed = now - startTime;

                if (elapsed < duration) {
                    numberBoxes.forEach(box => {
                        box.textContent = Math.floor(Math.random() * 10);
                    });
                    spinTimeout = setTimeout(animate, 50);
                } else {
                    numberBoxes.forEach((box, index) => {
                        box.textContent = finalPassword[index];
                        box.classList.remove('spinning');
                        box.classList.add('revealed');
                    });
                    
                    const celebrationText = document.createElement('div');
                    celebrationText.className = 'celebration-text';
                    celebrationText.textContent = '🎉 축하합니다! 비밀번호를 모두 획득하셨습니다! 🎉';
                    document.querySelector('.quiz-card').insertBefore(
                        celebrationText,
                        document.querySelector('.score-display')
                    );
                    
                    createConfetti();
                    isCompleted = true;
                    showResetButton();
                }
            }

            animate();
        }

        function showResetButton() {
            buttonContainer.innerHTML = `
                <button class="button button-reset">처음부터 다시하기</button>
            `;
            
            buttonContainer.querySelector('.button-reset').addEventListener('click', resetQuiz);
        }

        function showNextButton() {
            buttonContainer.innerHTML = `
                <button class="button button-next">다음 문제!</button>
            `;
            
            buttonContainer.querySelector('.button-next').addEventListener('click', nextQuestion);
        }

        function showCheckButton() {
            buttonContainer.innerHTML = `
                <button class="button button-check">정답 확인하기</button>
            `;
            
            buttonContainer.querySelector('.button-check').addEventListener('click', checkAnswer);
        }

        function checkAnswer() {
            const userAnswer = answerInput.value.trim().toLowerCase();
            const correctAnswer = questions[currentIndex].answer.toLowerCase();
            const isCorrect = userAnswer === correctAnswer;
            
            if (isCorrect) {
                feedbackElement.textContent = '문제를 맞춘 당신은 경복궁 똑똑이 !';
                feedbackElement.className = 'feedback success';
                correctCount++;
                scoreElement.textContent = correctCount;
                
                if (correctCount === 10) {
                    startSpinAnimation();
                } else {
                    showNextButton();
                }
            } else {
                feedbackElement.textContent = '실수하셨나봐용~ 테이프 정육면체를 만들면서 생각해보세요!';
                feedbackElement.className = 'feedback error';
            }
            
            feedbackElement.style.display = 'block';
        }

        function nextQuestion() {
            if (currentIndex >= questions.length - 1) {
                questions = getRandomQuestions();
                currentIndex = 0;
            } else {
                currentIndex++;
            }
            
            answerInput.value = '';
            feedbackElement.style.display = 'none';
            showQuestion();
            showCheckButton();
        }

        function resetQuiz() {
            if (spinTimeout) {
                clearTimeout(spinTimeout);
            }
            
            // Reset all state
            questions = getRandomQuestions();
            currentIndex = 0;
            correctCount = 0;
            isCompleted = false;
            
            // Reset UI
            answerInput.value = '';
            answerInput.disabled = false;
            feedbackElement.style.display = 'none';
            scoreElement.textContent = '0';
            
            // Reset number boxes
            numberBoxes.forEach(box => {
                box.textContent = '?';
                box.classList.remove('spinning', 'revealed');
            });
            
            // Remove celebration elements
            const celebrationText = document.querySelector('.celebration-text');
            if (celebrationText) {
                celebrationText.remove();
            }
            
            // Remove any remaining confetti
            document.querySelectorAll('.confetti').forEach(confetti => confetti.remove());
            
            showQuestion();
            showCheckButton();
        }

        // Event Listeners
        answerInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !isCompleted) {
                checkAnswer();
            }
        });

        // Initialize
        questions = shuffle(questions);
        showQuestion();
        showCheckButton();
    </script>
</body>
</html>
