<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나만의 찰흙 그릇 음식 자판기</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            overscroll-behavior: none; /* Prevent pull-to-refresh */
        }
        /* Custom scrollbar for food items */
        .food-items-container::-webkit-scrollbar {
            width: 8px;
        }
        .food-items-container::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }
        .food-items-container::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 10px;
        }
        .food-items-container::-webkit-scrollbar-thumb:hover {
            background: #555;
        }
        canvas {
            touch-action: none; /* Prevent default touch actions like scrolling when interacting with canvas */
        }
        .modal {
            display: none; /* Hidden by default */
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0,0,0,0.5);
            align-items: center;
            justify-content: center;
        }
        .modal-content {
            background-color: #fefefe;
            margin: auto;
            padding: 20px;
            border: 1px solid #888;
            width: 80%;
            max-width: 600px;
            border-radius: 10px;
            box-shadow: 0 4px 8px 0 rgba(0,0,0,0.2);
        }
        .modal-close-button {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
        }
        .modal-close-button:hover,
        .modal-close-button:focus {
            color: black;
            text-decoration: none;
            cursor: pointer;
        }
        .smooth-transition {
            transition: all 0.1s ease-out;
        }
        #loadingIndicator {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(255, 255, 255, 0.9);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
            z-index: 2000; /* Ensure it's on top of modals */
            display: none; /* Hidden by default */
        }
        .food-item-button img {
            width: 64px; /* Fixed width for consistency */
            height: 64px; /* Fixed height for consistency */
            object-fit: contain; /* Ensure aspect ratio is maintained */
        }
        /* Custom modal for confirmation */
        .confirm-modal {
            display: none;
            position: fixed;
            z-index: 1050; /* Higher than other modals if needed */
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0,0,0,0.6);
            align-items: center;
            justify-content: center;
        }
        .confirm-modal-content {
            background-color: #fff;
            margin: auto;
            padding: 25px;
            border-radius: 10px;
            width: 90%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        .confirm-modal-buttons button {
            margin: 0 10px;
        }
        .highlight {
            background-color: yellow;
            font-weight: bold;
        }

        /* Improved Print-specific styles for A4 portrait */
        @media print {
            * {
                -webkit-print-color-adjust: exact !important;
                color-adjust: exact !important;
            }
            
            @page {
                size: A4 portrait;
                margin: 15mm;
            }
            
            body {
                margin: 0;
                padding: 0;
            }
            
            body * {
                visibility: hidden;
            }
            
            #printArea, #printArea * {
                visibility: visible;
            }
            
            #printArea {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                height: 100vh;
                margin: 0;
                padding: 0;
                display: block !important;
            }
            
            #printArea svg {
                width: 100% !important;
                height: auto !important;
                max-width: 180mm !important; /* A4 width minus margins */
                max-height: 267mm !important; /* A4 height minus margins */
                display: block;
                margin: 0 auto;
            }
            
            /* Hide everything else during print */
            #appContainer {
                display: none !important;
            }
        }
        
        #printArea {
            display: none; /* Hidden by default, only shown for printing */
        }

        /* API key drop indicator */
        .api-drop-indicator {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(59, 130, 246, 0.95);
            color: white;
            padding: 20px 40px;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            z-index: 3000;
            display: none;
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.5);
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
</head>
<body class="bg-pink-100 flex flex-col items-center justify-center min-h-screen p-4 selection:bg-pink-300 selection:text-pink-800">

    <div id="appContainer" class="w-full max-w-5xl bg-white rounded-xl shadow-2xl p-2 sm:p-6">
        <header class="text-center mb-4">
            <h1 class="text-3xl sm:text-4xl font-bold text-pink-600" style="font-family: 'Gaegu', cursive;">나만의 찰흙 그릇 음식 자판기</h1>
        </header>

        <div id="webcamStage" class="flex flex-col items-center">
            <p class="text-lg text-gray-700 mb-2">먼저 그릇을 놓을 배경을 찍어주세요!</p>
            <div class="w-full max-w-md bg-gray-200 rounded-lg overflow-hidden shadow-md">
                <video id="webcamFeed" autoplay playsinline class="w-full h-auto"></video>
            </div>
            <button id="captureButton" class="mt-4 bg-pink-500 hover:bg-pink-600 text-white font-semibold py-2 px-6 rounded-lg shadow-md focus:outline-none focus:ring-2 focus:ring-pink-400 focus:ring-opacity-75 transition duration-150 ease-in-out">
                찰칵! 그릇 찍기
            </button>
        </div>

        <div id="foodStage" class="hidden">
            <div class="flex flex-col lg:flex-row gap-4">
                <div class="flex-grow flex flex-col items-center">
                    <p class="text-lg text-gray-700 mb-2 text-center">음식을 올려보세요! (선택 후 화살표 키로 크기/회전 조절)</p>
                    <div class="w-full aspect-[4/3] max-w-2xl bg-gray-100 rounded-lg shadow-inner overflow-hidden border-2 border-pink-300">
                        <canvas id="foodCanvas" class="w-full h-full"></canvas>
                    </div>
                    <div class="w-full max-w-2xl mt-3 text-center">
                        <h3 class="text-lg font-semibold text-pink-500" style="font-family: 'Gaegu', cursive;">현재 재료</h3>
                        <p id="currentIngredientsList" class="text-gray-600 min-h-[1.5em]">재료를 추가해주세요!</p>
                    </div>
                </div>

                <div class="lg:w-1/3 xl:w-1/4 flex flex-col">
                    <h2 class="text-xl font-semibold text-pink-500 mb-2 text-center lg:text-left" style="font-family: 'Gaegu', cursive;">음식 고르기</h2>
                    <div id="foodItemsContainer" class="food-items-container bg-pink-50 p-3 rounded-lg shadow-md overflow-y-auto h-64 lg:h-[calc(100%-140px)] grid grid-cols-3 sm:grid-cols-4 lg:grid-cols-3 gap-2">
                        </div>
                </div>
            </div>

            <div class="mt-6 flex flex-col sm:flex-row justify-center items-center gap-3 sm:gap-4 flex-wrap">
                <button id="printCanvasButton" class="bg-purple-500 hover:bg-purple-600 text-white font-semibold py-2 px-6 rounded-lg shadow-md focus:outline-none focus:ring-2 focus:ring-purple-400 focus:ring-opacity-75 transition duration-150 ease-in-out">
                    작품 인쇄
                </button>
                <button id="downloadCanvasButton" class="bg-green-500 hover:bg-green-600 text-white font-semibold py-2 px-6 rounded-lg shadow-md focus:outline-none focus:ring-2 focus:ring-green-400 focus:ring-opacity-75 transition duration-150 ease-in-out">
                    작품 다운로드
                </button>
                <button id="getRecipeButton" class="bg-blue-500 hover:bg-blue-600 text-white font-semibold py-2 px-6 rounded-lg shadow-md focus:outline-none focus:ring-2 focus:ring-blue-400 focus:ring-opacity-75 transition duration-150 ease-in-out hidden">
                    레시피 생성
                </button>
                 <button id="resetCanvasButton" class="bg-red-500 hover:bg-red-600 text-white font-semibold py-2 px-4 rounded-lg shadow-md focus:outline-none focus:ring-red-400 focus:ring-opacity-75 transition duration-150 ease-in-out">
                    다시 시작
                </button>
            </div>
        </div>
    </div>

    <div id="canvasInfoModal" class="modal">
        <div class="modal-content">
            <span class="modal-close-button" onclick="closeModal('canvasInfoModal')">&times;</span>
            <h3 id="canvasInfoModalTitle" class="text-xl font-semibold mb-4 text-pink-600" style="font-family: 'Gaegu', cursive;">내 작품 정보 입력</h3>
            <label for="canvasDishName" class="block text-sm font-medium text-gray-700">요리 이름:</label>
            <input type="text" id="canvasDishName" class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-pink-500 focus:border-pink-500 sm:text-sm">
            
            <label for="canvasChefName" class="block text-sm font-medium text-gray-700 mt-4">셰프 이름:</label>
            <input type="text" id="canvasChefName" class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-pink-500 focus:border-pink-500 sm:text-sm">
            
            <button id="confirmCanvasActionButton" class="mt-6 w-full bg-green-500 hover:bg-green-600 text-white font-semibold py-2 px-4 rounded-lg shadow-md focus:outline-none focus:ring-2 focus:ring-green-400 focus:ring-opacity-75 transition duration-150 ease-in-out">
                SVG 다운로드
            </button>
        </div>
    </div>

    <div id="recipeModal" class="modal">
        <div class="modal-content max-h-[90vh] overflow-y-auto">
            <span class="modal-close-button" onclick="closeModal('recipeModal')">&times;</span>
            <h3 class="text-xl font-semibold mb-4 text-blue-600" style="font-family: 'Gaegu', cursive;">AI 셰프의 추천 레시피!</h3>
            <div id="recipeOutput" class="space-y-3 text-sm text-gray-700">
                <p>레시피를 생성 중입니다... 잠시만 기다려주세요!</p>
            </div>
            <div id="recipeModalInputs" class="mt-4">
                 <label for="recipeChefName" class="block text-sm font-medium text-gray-700 mt-4">셰프 이름:</label>
                 <input type="text" id="recipeChefName" class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
            </div>
            <div class="mt-6 flex gap-4">
                <button id="printRecipeButton" class="flex-1 bg-purple-500 hover:bg-purple-600 text-white font-semibold py-2 px-4 rounded-lg shadow-md focus:outline-none focus:ring-2 focus:ring-purple-400 focus:ring-opacity-75 transition duration-150 ease-in-out hidden">
                    레시피 인쇄
                </button>
                <button id="confirmRecipeDownloadButton" class="flex-1 bg-blue-500 hover:bg-blue-600 text-white font-semibold py-2 px-4 rounded-lg shadow-md focus:outline-none focus:ring-2 focus:ring-blue-400 focus:ring-opacity-75 transition duration-150 ease-in-out hidden">
                    레시피 SVG 다운로드
                </button>
            </div>
        </div>
    </div>
    
    <div id="loadingIndicator">
        <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-pink-500"></div>
        <p class="mt-2 text-pink-500">처리 중...</p>
    </div>

    <div id="customConfirmModal" class="confirm-modal">
        <div class="confirm-modal-content">
            <p id="customConfirmMessage" class="text-lg text-gray-700 mb-6">정말로 초기화하시겠습니까?</p>
            <div class="confirm-modal-buttons">
                <button id="customConfirmOkButton" class="bg-red-500 hover:bg-red-600 text-white font-semibold py-2 px-6 rounded-lg shadow-md">예</button>
                <button id="customConfirmCancelButton" class="bg-gray-300 hover:bg-gray-400 text-gray-800 font-semibold py-2 px-6 rounded-lg shadow-md">아니오</button>
            </div>
        </div>
    </div>
    
    <div id="printArea"></div>
    
    <div id="apiDropIndicator" class="api-drop-indicator">
        API 키 파일을 드롭하세요
    </div>

    <script>
        // --- Global Variables and Configuration ---
        const webcamFeed = document.getElementById('webcamFeed');
        const captureButton = document.getElementById('captureButton');
        const foodCanvas = document.getElementById('foodCanvas');
        const ctx = foodCanvas.getContext('2d');
        const foodItemsContainer = document.getElementById('foodItemsContainer');
        const currentIngredientsList = document.getElementById('currentIngredientsList'); 
        
        const webcamStage = document.getElementById('webcamStage');
        const foodStage = document.getElementById('foodStage');
        const resetCanvasButton = document.getElementById('resetCanvasButton');

        const printCanvasButton = document.getElementById('printCanvasButton');
        const downloadCanvasButton = document.getElementById('downloadCanvasButton');
        const getRecipeButton = document.getElementById('getRecipeButton');

        const canvasInfoModal = document.getElementById('canvasInfoModal');
        const canvasInfoModalTitle = document.getElementById('canvasInfoModalTitle');
        const confirmCanvasActionButton = document.getElementById('confirmCanvasActionButton');
        const canvasDishNameInput = document.getElementById('canvasDishName');
        const canvasChefNameInput = document.getElementById('canvasChefName');
        let currentCanvasAction = 'download'; // 'download' or 'print'

        const recipeModal = document.getElementById('recipeModal');
        const recipeOutput = document.getElementById('recipeOutput');
        const recipeChefNameInput = document.getElementById('recipeChefName');
        const printRecipeButton = document.getElementById('printRecipeButton');
        const confirmRecipeDownloadButton = document.getElementById('confirmRecipeDownloadButton');
        const recipeModalInputs = document.getElementById('recipeModalInputs');

        const loadingIndicator = document.getElementById('loadingIndicator');
        const printArea = document.getElementById('printArea');

        // API Key Handling - Hidden mode
        const apiDropIndicator = document.getElementById('apiDropIndicator');
        let userApiKey = ""; // Store user-provided API key
        let dragCounter = 0; // To handle drag enter/leave properly

        // Custom Confirm Modal Elements
        const customConfirmModal = document.getElementById('customConfirmModal');
        const customConfirmMessage = document.getElementById('customConfirmMessage');
        const customConfirmOkButton = document.getElementById('customConfirmOkButton');
        const customConfirmCancelButton = document.getElementById('customConfirmCancelButton');
        let confirmCallback = null;

        let backgroundImage = null; 
        let foodOnCanvas = []; 
        const MAX_FOOD_ITEMS = 10; // Reduced for easier testing, was 30
        let selectedFoodItem = null; 
        let isDragging = false;
        let dragOffsetX, dragOffsetY;

        const foodImageFiles = [
            'apple.png', 'blueberry_1.png', 'blueberry_2.png', 'cake_1.png', 'cake_2.png',
            'candy.png', 'cereal.png', 'cherry_1.png', 'cherry_2.png', 'chocolate.png',
            'cookie.png', 'fried-egg.png', 'gimbap.png', 'hotdog.png', 'jelly.png',
            'kkakdugi.png', 'orange.png', 'pizza.png', 'spicy-ramen.png', 'strawberry.png',
            'watermelon.png'
        ];
        const foodImageBaseUrl = 'https://www.hanmiu.cc/play/toy/assets/cook/';

        const foodNameMapping = {
            'apple': '사과', 'blueberry': '블루베리', 'cake': '케이크', 'candy': '사탕',
            'cereal': '시리얼', 'cherry': '체리', 'chocolate': '초콜릿', 'cookie': '쿠키',
            'fried-egg': '계란후라이', 'gimbap': '김밥', 'hotdog': '핫도그', 'jelly': '젤리',
            'kkakdugi': '깍두기', 'orange': '오렌지', 'pizza': '피자', 
            'spicy-ramen': '매운라면', 'strawberry': '딸기', 'watermelon': '수박'
        };

        // --- API Key Drag and Drop (Hidden Mode) ---
        window.addEventListener('dragenter', (event) => {
            event.preventDefault();
            dragCounter++;
            if (dragCounter === 1) {
                apiDropIndicator.style.display = 'block';
            }
        });

        window.addEventListener('dragleave', (event) => {
            event.preventDefault();
            dragCounter--;
            if (dragCounter === 0) {
                apiDropIndicator.style.display = 'none';
            }
        });

        window.addEventListener('dragover', (event) => {
            event.preventDefault();
        });

        window.addEventListener('drop', (event) => {
            event.preventDefault();
            dragCounter = 0;
            apiDropIndicator.style.display = 'none';
            
            const files = event.dataTransfer.files;
            if (files.length > 0) {
                const file = files[0];
                // Check if it's a text file (basic check)
                if (file.type === 'text/plain' || file.name.endsWith('.txt') || file.name.endsWith('.key')) {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        const content = e.target.result.trim();
                        if (content && content.length > 20) { // Basic validation for API key length
                            userApiKey = content;
                            getRecipeButton.style.display = 'inline-block'; // Show recipe button
                            console.log('API key loaded successfully');
                        }
                    };
                    reader.onerror = () => {
                        console.error('Failed to read API key file');
                    };
                    reader.readAsText(file);
                }
            }
        });

        // --- Utility Functions ---
        function showLoading(show) {
            loadingIndicator.style.display = show ? 'flex' : 'none';
        }

        function openModal(modalId) {
            document.getElementById(modalId).style.display = 'flex';
        }

        function closeModal(modalId) {
            document.getElementById(modalId).style.display = 'none';
        }

        function showCustomConfirm(message, callback) {
            customConfirmMessage.textContent = message;
            confirmCallback = callback;
            customConfirmModal.style.display = 'flex';
        }

        customConfirmOkButton.addEventListener('click', () => {
            if (confirmCallback) {
                confirmCallback(true);
            }
            customConfirmModal.style.display = 'none';
            confirmCallback = null;
        });

        customConfirmCancelButton.addEventListener('click', () => {
            if (confirmCallback) {
                confirmCallback(false);
            }
            customConfirmModal.style.display = 'none';
            confirmCallback = null;
        });

        function getCurrentDate() {
            const today = new Date();
            const year = today.getFullYear();
            const month = String(today.getMonth() + 1).padStart(2, '0');
            const day = String(today.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        function updateIngredientsDisplay() {
            if (foodOnCanvas.length === 0) {
                currentIngredientsList.innerHTML = '재료를 추가해주세요!';
                return;
            }

            const ingredientCounts = {};
            foodOnCanvas.forEach(item => {
                const baseAltText = item.alt.replace(/_\d+$/, ''); 
                const koreanName = foodNameMapping[baseAltText] || baseAltText; 
                ingredientCounts[koreanName] = (ingredientCounts[koreanName] || 0) + 1;
            });

            let displayText = "";
            Object.entries(ingredientCounts).forEach(([name, count], index, arr) => {
                let highlightedName = name;
                if (selectedFoodItem) {
                    const selectedBaseAlt = selectedFoodItem.alt.replace(/_\d+$/, '');
                    const selectedKoreanName = foodNameMapping[selectedBaseAlt] || selectedBaseAlt;
                    if (name === selectedKoreanName) {
                        highlightedName = `<span class="highlight">${name}</span>`;
                    }
                }
                displayText += `${highlightedName} ${count}개`;
                if (index < arr.length - 1) {
                    displayText += ', ';
                }
            });
            
            currentIngredientsList.innerHTML = displayText;
        }

        // --- Webcam Logic ---
        async function setupWebcam() {
            try {
                if (webcamFeed.srcObject) {
                    webcamFeed.srcObject.getTracks().forEach(track => track.stop());
                    webcamFeed.srcObject = null; 
                }
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                webcamFeed.srcObject = stream;
            } catch (err) {
                console.error("Error accessing webcam: ", err);
                webcamStage.innerHTML = "<p class='text-red-500'>웹캠을 사용할 수 없습니다. 페이지를 새로고침하거나 권한을 확인해주세요.</p>";
            }
        }

        captureButton.addEventListener('click', () => {
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = webcamFeed.videoWidth;
            tempCanvas.height = webcamFeed.videoHeight;
            const tempCtx = tempCanvas.getContext('2d');
            tempCtx.drawImage(webcamFeed, 0, 0, tempCanvas.width, tempCanvas.height);
            
            backgroundImage = new Image();
            backgroundImage.onload = () => {
                resizeCanvas(); 
                drawCanvas(); 
            };
            backgroundImage.src = tempCanvas.toDataURL('image/png');

            webcamStage.style.display = 'none';
            foodStage.style.display = 'block';
            
            if (webcamFeed.srcObject) {
                webcamFeed.srcObject.getTracks().forEach(track => track.stop());
            }
            resizeCanvas(); 
            updateIngredientsDisplay(); 
        });
        
        resetCanvasButton.addEventListener('click', () => {
            showCustomConfirm("정말로 현재 작업을 초기화하고 배경부터 다시 찍으시겠습니까?", (confirmed) => {
                if (confirmed) {
                    foodOnCanvas = [];
                    backgroundImage = null;
                    selectedFoodItem = null;
                    isDragging = false;
                    
                    if (foodCanvas.parentElement) {
                         foodCanvas.width = foodCanvas.parentElement.clientWidth;
                         foodCanvas.height = foodCanvas.parentElement.clientHeight;
                    }
                    ctx.clearRect(0, 0, foodCanvas.width, foodCanvas.height);
                    drawCanvas(); 
                    
                    foodStage.style.display = 'none';
                    webcamStage.style.display = 'flex';
                    
                    if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                        setupWebcam(); 
                    }
                    updateIngredientsDisplay(); 
                }
            });
        });

        // --- Food Item Population ---
        function populateFoodItems() {
            foodItemsContainer.innerHTML = ''; 
            foodImageFiles.forEach(fileName => {
                const button = document.createElement('button');
                button.className = 'food-item-button p-1 bg-white rounded-md shadow hover:shadow-lg transform hover:scale-105 transition-all duration-150 ease-in-out focus:outline-none focus:ring-2 focus:ring-pink-400';
                const img = document.createElement('img');
                const fullUrl = foodImageBaseUrl + fileName;
                img.src = fullUrl;
                const altText = fileName.split('.')[0]; 
                img.alt = altText; 
                img.draggable = false; 
                img.className = "w-16 h-16 object-contain mx-auto"; 

                button.appendChild(img);
                button.addEventListener('click', () => addFoodToCanvas(fullUrl, altText));
                foodItemsContainer.appendChild(button);
            });
        }

        // --- Canvas Logic ---
        function resizeCanvas() {
            const container = foodCanvas.parentElement;
            if (container) {
                const newWidth = container.clientWidth;
                const newHeight = container.clientHeight;
                if (foodCanvas.width !== newWidth || foodCanvas.height !== newHeight) {
                    foodCanvas.width = newWidth;
                    foodCanvas.height = newHeight;
                }
                drawCanvas(); 
            }
        }

        window.addEventListener('resize', resizeCanvas);

        function addFoodToCanvas(imgSrc, altText) { 
            if (foodOnCanvas.length >= MAX_FOOD_ITEMS) {
                foodOnCanvas.shift(); 
            }

            const img = new Image();
            img.crossOrigin = "Anonymous"; 
            img.src = imgSrc;
            img.onload = () => {
                const scaleVariation = 0.8 + Math.random() * 0.4; 
                const itemWidth = img.width * 0.2 * scaleVariation; 
                const itemHeight = img.height * 0.2 * scaleVariation;

                const foodItem = {
                    id: Date.now() + Math.random(),
                    img: img,
                    alt: altText, 
                    x: foodCanvas.width / 2 - itemWidth / 2 + (Math.random() - 0.5) * 50,
                    y: foodCanvas.height / 2 - itemHeight / 2 + (Math.random() - 0.5) * 50,
                    width: itemWidth,
                    height: itemHeight,
                    targetX: foodCanvas.width / 2 - itemWidth / 2,
                    targetY: foodCanvas.height / 2 - itemHeight / 2,
                    scale: 1,
                    targetScale: 1,
                    angle: (Math.random() - 0.5) * Math.PI / 4, 
                    targetAngle: (Math.random() - 0.5) * Math.PI / 4,
                    vx: (Math.random() - 0.5) * 1, 
                    vy: (Math.random() - 0.5) * 1,
                    radius: Math.max(itemWidth, itemHeight) * 0.4
                };
                foodOnCanvas.push(foodItem);
                selectedFoodItem = foodItem; 
                updateIngredientsDisplay(); 
            };
            img.onerror = () => {
                console.error(`Error loading image: ${imgSrc}. Using placeholder.`);
                const placeholderSize = 50; 
                 const foodItem = {
                    id: Date.now() + Math.random(),
                    img: null, 
                    alt: altText, 
                    x: foodCanvas.width / 2 - placeholderSize / 2 + (Math.random() - 0.5) * 50,
                    y: foodCanvas.height / 2 - placeholderSize / 2 + (Math.random() - 0.5) * 50,
                    width: placeholderSize,
                    height: placeholderSize,
                    targetX: foodCanvas.width / 2 - placeholderSize / 2,
                    targetY: foodCanvas.height / 2 - placeholderSize / 2,
                    scale: 1,
                    targetScale: 1,
                    angle: (Math.random() - 0.5) * Math.PI / 4,
                    targetAngle: (Math.random() - 0.5) * Math.PI / 4,
                    vx: (Math.random() - 0.5) * 1,
                    vy: (Math.random() - 0.5) * 1,
                    radius: placeholderSize / 2,
                    isPlaceholder: true 
                };
                foodOnCanvas.push(foodItem);
                selectedFoodItem = foodItem;
                updateIngredientsDisplay(); 
            };
        }
        
        function drawCanvas() {
            if (!ctx) return; 
            ctx.clearRect(0, 0, foodCanvas.width, foodCanvas.height);

            if (backgroundImage) {
                const canvasAspect = foodCanvas.width / foodCanvas.height;
                const bgAspect = backgroundImage.width / backgroundImage.height;
                let drawWidth, drawHeight, offsetX, offsetY;

                if (canvasAspect > bgAspect) { 
                    drawWidth = foodCanvas.width;
                    drawHeight = foodCanvas.width / bgAspect;
                    offsetX = 0;
                    offsetY = (foodCanvas.height - drawHeight) / 2;
                } else { 
                    drawHeight = foodCanvas.height;
                    drawWidth = foodCanvas.height * bgAspect;
                    offsetY = 0;
                    offsetX = (foodCanvas.width - drawWidth) / 2;
                }
                ctx.drawImage(backgroundImage, offsetX, offsetY, drawWidth, drawHeight);
            } else {
                ctx.fillStyle = '#f0f0f0'; 
                ctx.fillRect(0, 0, foodCanvas.width, foodCanvas.height);
            }

            foodOnCanvas.forEach(item => {
                ctx.save();
                ctx.translate(item.x + (item.width * item.scale) / 2, item.y + (item.height * item.scale) / 2);
                ctx.rotate(item.angle);
                ctx.scale(item.scale, item.scale);
                
                if (item.isPlaceholder || !item.img) { 
                    ctx.fillStyle = "#cccccc";
                    ctx.fillRect(-item.width / 2, -item.height / 2, item.width, item.height);
                    ctx.fillStyle = "#555555";
                    ctx.textAlign = "center";
                    ctx.textBaseline = "middle";
                    const baseAltText = item.alt.replace(/_\d+$/, '');
                    const displayName = foodNameMapping[baseAltText] || baseAltText;
                    ctx.font = `${Math.max(10, item.width * 0.2)}px Gaegu`; 
                    ctx.fillText(displayName.split(' ')[0], 0, 0);
                } else {
                    ctx.drawImage(item.img, -item.width / 2, -item.height / 2, item.width, item.height);
                }
                
                if (item === selectedFoodItem) {
                    ctx.strokeStyle = 'rgba(236, 72, 153, 0.7)'; 
                    ctx.lineWidth = Math.max(1, 3 / item.scale); 
                    ctx.strokeRect(-item.width / 2, -item.height / 2, item.width, item.height);
                }
                ctx.restore();
            });
        }

        function updateFoodItems() {
            const damping = 0.95; 
            const repulsionStrength = 0.5; 
            let itemsRemoved = false;

            foodOnCanvas.forEach((item, index) => {
                if (item !== selectedFoodItem || !isDragging) { 
                    item.x += (item.targetX - item.x) * 0.1;
                    item.y += (item.targetY - item.y) * 0.1;
                }

                item.scale += (item.targetScale - item.scale) * 0.1;
                item.angle += (item.targetAngle - item.angle) * 0.1;
                
                item.x += item.vx;
                item.y += item.vy;
                item.vx *= damping;
                item.vy *= damping;

                for (let i = index + 1; i < foodOnCanvas.length; i++) {
                    const otherItem = foodOnCanvas[i];
                    const dx = (otherItem.x + otherItem.width * otherItem.scale / 2) - (item.x + item.width * item.scale / 2);
                    const dy = (otherItem.y + otherItem.height * otherItem.scale / 2) - (item.y + item.height * item.scale / 2);
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    const minDistance = (item.radius * item.scale) + (otherItem.radius * otherItem.scale);

                    if (distance < minDistance && distance > 0) {
                        const overlap = minDistance - distance;
                        const angleVal = Math.atan2(dy, dx);
                        const moveX = Math.cos(angleVal) * overlap * repulsionStrength;
                        const moveY = Math.sin(angleVal) * overlap * repulsionStrength;

                        item.vx -= moveX;
                        item.vy -= moveY;
                        otherItem.vx += moveX;
                        otherItem.vy += moveY;
                        
                        item.targetX -= moveX;
                        item.targetY -= moveY;
                        otherItem.targetX += moveX;
                        otherItem.targetY += moveY;
                    }
                }
                
                const itemCurrentWidth = item.width * item.scale;
                const itemCurrentHeight = item.height * item.scale;

                if (item.targetX < -itemCurrentWidth * 0.8) item.targetX = -itemCurrentWidth * 0.8;
                if (item.targetY < -itemCurrentHeight * 0.8) item.targetY = -itemCurrentHeight * 0.8;
                if (item.targetX > foodCanvas.width - itemCurrentWidth * 0.2) item.targetX = foodCanvas.width - itemCurrentWidth * 0.2;
                if (item.targetY > foodCanvas.height - itemCurrentHeight * 0.2) item.targetY = foodCanvas.height - itemCurrentHeight * 0.2;
            });

            const originalLength = foodOnCanvas.length;
            foodOnCanvas = foodOnCanvas.filter(item => {
                const itemCurrentWidth = item.width * item.scale;
                const itemCurrentHeight = item.height * item.scale;
                return !(item.x > foodCanvas.width || item.x + itemCurrentWidth < 0 ||
                         item.y > foodCanvas.height || item.y + itemCurrentHeight < 0);
            });
            if (originalLength !== foodOnCanvas.length) {
                itemsRemoved = true;
            }

            if (itemsRemoved) {
                updateIngredientsDisplay(); 
            }
        }

        function gameLoop() {
            updateFoodItems();
            drawCanvas();
            requestAnimationFrame(gameLoop);
        }

        function getMousePos(canvas, evt) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const clientX = evt.clientX || (evt.touches && evt.touches[0].clientX);
            const clientY = evt.clientY || (evt.touches && evt.touches[0].clientY);
            return {
                x: (clientX - rect.left) * scaleX,
                y: (clientY - rect.top) * scaleY
            };
        }

        foodCanvas.addEventListener('mousedown', (e) => handleInteractionStart(e));
        foodCanvas.addEventListener('touchstart', (e) => {
            e.preventDefault(); 
            handleInteractionStart(e);
        }, { passive: false });

        function handleInteractionStart(e) {
            const pos = getMousePos(foodCanvas, e);
            let itemFound = false;
            for (let i = foodOnCanvas.length - 1; i >= 0; i--) {
                const item = foodOnCanvas[i];
                const itemCenterX = item.x + (item.width * item.scale) / 2;
                const itemCenterY = item.y + (item.height * item.scale) / 2;
                const dx = pos.x - itemCenterX;
                const dy = pos.y - itemCenterY;
                
                const rotatedX = dx * Math.cos(-item.angle) - dy * Math.sin(-item.angle);
                const rotatedY = dx * Math.sin(-item.angle) + dy * Math.cos(-item.angle);

                if (Math.abs(rotatedX) < (item.width * item.scale) / 2 && Math.abs(rotatedY) < (item.height * item.scale) / 2) {
                    selectedFoodItem = item;
                    isDragging = true;
                    dragOffsetX = pos.x - item.x;
                    dragOffsetY = pos.y - item.y;
                    itemFound = true;
                    break; 
                }
            }
            if (!itemFound) {
                selectedFoodItem = null; 
            }
            updateIngredientsDisplay();
        }

        foodCanvas.addEventListener('mousemove', (e) => handleInteractionMove(e));
        foodCanvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            handleInteractionMove(e);
        }, { passive: false });

        function handleInteractionMove(e) {
            if (!isDragging || !selectedFoodItem) return;
            const pos = getMousePos(foodCanvas, e);
            selectedFoodItem.targetX = pos.x - dragOffsetX;
            selectedFoodItem.targetY = pos.y - dragOffsetY;
            selectedFoodItem.x = selectedFoodItem.targetX;
            selectedFoodItem.y = selectedFoodItem.targetY;
        }

        foodCanvas.addEventListener('mouseup', () => handleInteractionEnd());
        foodCanvas.addEventListener('touchend', () => handleInteractionEnd());
        foodCanvas.addEventListener('mouseleave', () => handleInteractionEnd()); 

        function handleInteractionEnd() {
            isDragging = false;
        }

        document.addEventListener('keydown', (e) => {
            if (!selectedFoodItem || foodStage.style.display === 'none') return;

            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) {
                 if (document.activeElement === foodCanvas || 
                    canvasInfoModal.style.display === 'flex' || 
                    recipeModal.style.display === 'flex') {
                    if (!(document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'TEXTAREA')) {
                         e.preventDefault();
                    }
                }
            }

            const scaleStep = 0.1;
            const angleStep = Math.PI / 18; 

            switch (e.key) {
                case 'ArrowUp':
                    const newScaleUp = Math.min(2, selectedFoodItem.targetScale + scaleStep);
                    const scaleChangeUp = selectedFoodItem.targetScale - newScaleUp;
                    selectedFoodItem.targetX += (selectedFoodItem.width * scaleChangeUp) / 2;
                    selectedFoodItem.targetY += (selectedFoodItem.height * scaleChangeUp) / 2;
                    selectedFoodItem.targetScale = newScaleUp;
                    break;
                case 'ArrowDown':
                    const newScaleDown = Math.max(0.25, selectedFoodItem.targetScale - scaleStep);
                    const scaleChangeDown = selectedFoodItem.targetScale - newScaleDown;
                    selectedFoodItem.targetX += (selectedFoodItem.width * scaleChangeDown) / 2;
                    selectedFoodItem.targetY += (selectedFoodItem.height * scaleChangeDown) / 2;
                    selectedFoodItem.targetScale = newScaleDown;
                    break;
                case 'ArrowLeft':
                    selectedFoodItem.targetAngle -= angleStep;
                    break;
                case 'ArrowRight':
                    selectedFoodItem.targetAngle += angleStep;
                    break;
                case 'Delete': 
                case 'Backspace':
                    if (selectedFoodItem) {
                        foodOnCanvas = foodOnCanvas.filter(item => item.id !== selectedFoodItem.id);
                        selectedFoodItem = null;
                        updateIngredientsDisplay(); 
                    }
                    break;
            }
        });

        function generateSVG(canvasImageBase64, dishName, chefName, date, generatedImageBase64 = null, recipeText = null) {
            const svgWidthMM = 210;
            const svgHeightMM = 297;
            const viewBoxWidth = 595; 
            const viewBoxHeight = 842; 

            let svgContent = `<svg width="${svgWidthMM}mm" height="${svgHeightMM}mm" viewBox="0 0 ${viewBoxWidth} ${viewBoxHeight}" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" style="font-family: 'Gaegu', cursive, sans-serif;">`;
            svgContent += `<rect x="0" y="0" width="${viewBoxWidth}" height="${viewBoxHeight}" fill="#FFFFFF" />`;

            svgContent += `<text x="${viewBoxWidth / 2}" y="40" font-size="24" text-anchor="middle" fill="${generatedImageBase64 ? '#007bff' : '#dc3545'}">${dishName || ''}</text>`; 
            
            const commonTextStyle = `font-size="12" fill="#333"`;
            let textYPosition = 70;

            if (generatedImageBase64) { 
                svgContent += `<image x="30" y="${textYPosition}" width="250" height="187.5" xlink:href="${canvasImageBase64}" />`; 
                svgContent += `<image x="315" y="${textYPosition}" width="250" height="187.5" xlink:href="${generatedImageBase64}" />`;
                textYPosition += 187.5 + 20; 

                svgContent += `<text x="30" y="${textYPosition}" ${commonTextStyle}>만든 사람: ${chefName || ''}</text>`;
                textYPosition += 20;
                svgContent += `<text x="30" y="${textYPosition}" ${commonTextStyle}>날짜: ${date}</text>`;
                textYPosition += 30;

                svgContent += `<text x="30" y="${textYPosition}" font-size="14" fill="#333" font-weight="bold">레시피:</text>`;
                textYPosition += 20;
                if (recipeText) {
                    const recipeLines = recipeText.split('\n');
                    recipeLines.forEach(line => {
                        if (line.trim() !== "") {
                            const words = line.split(' ');
                            let currentLine = '';
                            for (const word of words) {
                                const testLine = currentLine + (currentLine ? ' ' : '') + word;
                                if (testLine.length > 70 && currentLine) { 
                                    svgContent += `<text x="40" y="${textYPosition}" ${commonTextStyle}>${currentLine}</text>`;
                                    textYPosition += 15;
                                    currentLine = word;
                                } else {
                                    currentLine = testLine;
                                }
                            }
                            if (currentLine) {
                                svgContent += `<text x="40" y="${textYPosition}" ${commonTextStyle}>${currentLine}</text>`;
                                textYPosition += 15;
                            }
                        }
                    });
                }

            } else { 
                svgContent += `<image x="50" y="${textYPosition}" width="495" height="371.25" xlink:href="${canvasImageBase64}" />`; 
                textYPosition += 371.25 + 30; 

                svgContent += `<text x="50" y="${textYPosition}" ${commonTextStyle}>만든 사람: ${chefName || ''}</text>`;
                textYPosition += 20;
                svgContent += `<text x="50" y="${textYPosition}" ${commonTextStyle}>날짜: ${date}</text>`;
            }

            svgContent += `<rect x="10" y="10" width="${viewBoxWidth - 20}" height="${viewBoxHeight - 20}" fill="none" stroke="${generatedImageBase64 ? '#007bff' : '#dc3545'}" stroke-width="2" rx="10" ry="10"/>`;
            svgContent += `<text x="${viewBoxWidth - 30}" y="${viewBoxHeight - 20}" font-size="8" text-anchor="end" fill="#777">찰흙 그릇 자판기</text>`;
            svgContent += `</svg>`;
            return svgContent;
        }

        function downloadSVG(svgString, fileName) {
            const blob = new Blob([svgString], { type: 'image/svg+xml' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = fileName;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function printSVG(svgString) {
            printArea.innerHTML = svgString;
            
            // Force reflow before printing
            setTimeout(() => {
                window.print();
                setTimeout(() => {
                    printArea.innerHTML = ''; // Clear after printing
                }, 100);
            }, 100);
        }

                    <p class="font-semibold mt-2">만드는 방법:</p>
                    <ol class="list-decimal list-inside space-y-1">
                        ${recipeData.recipe.map(step => `<li>${step}</li>`).join('')}
                    </ol>
                `;
                recipeModalInputs.style.display = 'block'; 
                confirmRecipeDownloadButton.style.display = 'inline-block';
                printRecipeButton.style.display = 'inline-block';

            } catch (error) {
                console.error("레시피 생성 중 오류:", error);
                recipeOutput.innerHTML = `<p class="text-red-500">죄송합니다, 레시피를 가져오는 중 오류가 발생했습니다. <br>세부 정보: ${error.message}</p>`;
            } finally {
                showLoading(false);
            }
        });
        
        confirmRecipeDownloadButton.addEventListener('click', () => {
            const chefName = recipeChefNameInput.value; 
            const date = getCurrentDate();

            const previouslySelected = selectedFoodItem;
            selectedFoodItem = null;
            drawCanvas(); 
            const canvasImageBase64 = foodCanvas.toDataURL('image/png');
            selectedFoodItem = previouslySelected;
            drawCanvas();

            const svgString = generateSVG(
                canvasImageBase64,
                currentGeneratedRecipe.name,
                chefName,
                date,
                currentGeneratedRecipe.imageUrl,
                currentGeneratedRecipe.recipeText
            );
            downloadSVG(svgString, `${currentGeneratedRecipe.name.replace(/\s+/g, '_') || 'Gemini레시피'}_${date}.svg`);
            closeModal('recipeModal');
        });

        printRecipeButton.addEventListener('click', () => {
            const chefName = recipeChefNameInput.value;
            const date = getCurrentDate();
            const previouslySelected = selectedFoodItem;
            selectedFoodItem = null;
            drawCanvas();
            const canvasImageBase64 = foodCanvas.toDataURL('image/png');
            selectedFoodItem = previouslySelected;
            drawCanvas();

            const svgString = generateSVG(
                canvasImageBase64,
                currentGeneratedRecipe.name,
                chefName,
                date,
                currentGeneratedRecipe.imageUrl,
                currentGeneratedRecipe.recipeText
            );
            printSVG(svgString);
        });

        function init() {
            if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                setupWebcam();
            } else {
                 webcamStage.innerHTML = "<p class='text-red-500'>죄송합니다, 브라우저가 웹캠을 지원하지 않습니다.</p>";
            }
            populateFoodItems();
            resizeCanvas(); 
            gameLoop(); 
            updateIngredientsDisplay(); 
            getRecipeButton.style.display = 'none'; // Initially hide recipe button
        }

        init();
    </script>
</body>
</html>
