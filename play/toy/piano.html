        <script>
            // =========================
            // 상수 & 유틸
            // =========================
            const SVG_NS = 'http://www.w3.org/2000/svg';
            const STAFF = document.getElementById('staff');
            const sheetWrapper = document.getElementById('sheetWrapper');
            const toastEl = document.getElementById('toast');

            const LINE_SPACING = 20;
            // staff line gap
            const STEP = LINE_SPACING / 2;
            // 한 계단(줄/칸)
            const STAFF_HEIGHT = 220;
            // 한 시스템 높이
            const SYSTEM_GAP = 24;
            // 시스템 간 간격
            const START_X = 110;
            // G-클레프 여유
            const STAFF_WIDTH = 1280;
            // 화면 폭 확장

            const ITEMS_PER_BEAT = 1;
            // 4분 단위
            const BEATS_PER_MEASURE = 4;
            // 4/4
            const ITEMS_PER_MEASURE = 4;
            const MEASURES_PER_SYSTEM = 4;
            // 4마디/시스템
            const ITEMS_PER_SYSTEM = 16;
            // 16 아이템/시스템

            const SYSTEMS_PER_PAGE = 3;
            // 화면에 항상 2줄
            const MEASURES_PER_PAGE = MEASURES_PER_SYSTEM * SYSTEMS_PER_PAGE;
            // 8마디
            const ITEMS_PER_PAGE = ITEMS_PER_SYSTEM * SYSTEMS_PER_PAGE;
            // 32아이템
            const MAX_ITEMS_SCREEN = ITEMS_PER_SYSTEM * SYSTEMS_PER_PAGE;

            const SYSTEMS_PER_PRINT_PAGE = 5;
            // 인쇄 안전치(세로)
            const PAGES_LIMIT_PRINT = 2;
            // 인쇄 최대 2페이지
            const MAX_SYSTEMS_PRINT = SYSTEMS_PER_PRINT_PAGE * PAGES_LIMIT_PRINT;
            // 10
            const MAX_ITEMS_PRINT = MAX_SYSTEMS_PRINT * ITEMS_PER_SYSTEM;
            // 160

            const NOTE_NAMES_KR = {
                C: '도',
                D: '레',
                E: '미',
                F: '파',
                G: '솔',
                A: '라',
                B: '시'
            };
            const NOTE_COLORS = {
                C: '#FF6B6B',
                D: '#FFC048',
                E: '#F9F871',
                F: '#84D2C5',
                G: '#6AABF3',
                A: '#4A69BD',
                B: '#8A2BE2'
            };
            const MIDI_RANGE = {
                min: 60,
                max: 84
            };
            // C4..C6 (최저 C는 C4)

            // 사용자 제공 경로
            const GCLEF_MAIN = 'M 39.708934,63.678683 C 39.317094,65.77065 41.499606,70.115061 45.890584,70.256984 C 51.19892,70.428558 54.590321,66.367906 53.010333,59.740875 L 45.086538,23.171517 C 44.143281,18.81826 44.851281,16.457097 45.354941,15.049945 C 46.698676,11.295749 50.055822,9.7473042 50.873134,10.949208 C 51.339763,11.635413 52.468042,14.844006 49.256275,20.590821 C 46.751378,25.072835 35.096985,30.950138 34.2417,41.468011 C 33.501282,50.614249 43.075689,57.369301 51.339266,54.71374 C 56.825686,52.950639 59.653965,44.62402 56.258057,40.328987 C 47.29624,28.994371 32.923702,46.341263 46.846564,51.0935 C 45.332604,49.90238 44.300646,48.980054 44.1085,47.852721 C 42.237755,36.876941 58.741182,39.774741 54.294493,50.18735 C 52.466001,54.469045 45.080341,55.297323 40.874269,51.477433 C 37.350853,48.277521 35.787387,42.113231 39.708327,37.687888 C 45.018831,31.694223 51.288782,26.31366 52.954064,18.108736 C 54.923313,8.4061491 48.493821,0.84188926 44.429027,10.385835 C 43.065093,13.588288 42.557016,16.803074 43.863006,22.963534 L 51.780549,60.311215 C 52.347386,62.985028 51.967911,66.664419 49.472374,68.355474 C 48.236187,69.193154 43.861784,69.769668 42.791575,67.770092';
            const GCLEF_DOT = 'M 48.24903 64.584198 A 3.439605 3.4987047 0 1 1  41.36982,64.584198 A 3.439605 3.4987047 0 1 1  48.24903 64.584198 z';
            const QUARTER_REST_PATH = 'M254.4 20.8c1.5 1.6 13 15.7 13 15.7s-6.4 6.1-6.4 12.5c0 7.5 8.6 14.3 8.6 14.3l-.9 1.1c-3.3-1.9-8.9-2.1-11.4.8-3.1 3.6 3.9 9.1 3.9 9.1l-.8 1.1c-2.4-1.8-12.6-11.4-8.3-16.1 2.6-2.9 5.8-3.8 10.3-1.4l-12.1-12.5c7-8.6 8.2-11.1 8.2-13.4 0-4.8-3.4-8.2-5.1-10.4-.6-.9-1.7-1.6-1-2.2.7-.5 1.1.3 2 1.4z';

            // =========================
            // 상태
            // =========================
            const state = {
                schemaVersion: 1,
                title: '솔바람 악보',
                student: '',
                timeSig: [4, 4],
                tempoBPM: 120,
                range: 'C4-C6',
                items: [],
                // 4n 단위 시퀀스 — 초기엔 빈 배열
                selectedIndex: null,
                undoStack: [],
                redoStack: [],
                pageIndex: 0,
                // 현재 화면 페이지(0기반)
                printMode: false,
                exportAfterPrint: false,
                // ✅ 인쇄 닫힌 후 자동 내보내기 여부
                lastAIFull: null,
                // AI가 만든 4성부 전체(ATB 필터 적용 전)
                lastAIFiltered: null,
                // 마지막으로 재생한 상태(필터 적용 후) - 참고용
            };

            // === Magenta 전역 플레이어들 ===
            // 하나의 사운드폰트(피아노 세트)
            const SF_URL = 'https://storage.googleapis.com/magentadata/js/soundfonts/sgm_plus';

            // ✅ 하이라이트 콜백은 5번째 인자에 넣습니다.
            const mainPlayer = new mm.SoundFontPlayer(SF_URL,/*output*/
            undefined,/*programOutputs*/
            undefined,/*drumOutputs*/
            undefined,{
                run: (note) => {
                    // 시간→스텝 변환(stepsPerQuarter=4)
                    const sps = (mainPlayer._qpm * 4) / 60;
                    const startStep = Math.round((note.startTime || 0) * sps);
                    const localIdx = Math.floor(startStep / 4);
                    const idx = (mainPlayer._startIndex || 0) + localIdx;

                    const pageNeeded = Math.floor(idx / ITEMS_PER_PAGE);
                    if (!state.printMode && pageNeeded !== state.pageIndex) {
                        state.pageIndex = pageNeeded;
                        renderAll();
                    }
                    const it = state.items[idx];
                    if (it && it.elementId)
                        highlightOnce(it.elementId);
                }
                ,
                stop: () => {}
            });

            const previewPlayer = new mm.SoundFontPlayer(SF_URL);
            // 단음 미리듣기
            let aiPlayer = new mm.SoundFontPlayer(SF_URL);
            // AI 연주

            // =========================
            // 유틸 함수
            // =========================
            function uid() {
                return Math.random().toString(36).slice(2, 9);
            }
            function clamp(v, min, max) {
                return Math.max(min, Math.min(max, v));
            }
            function midiToLetterOct(midi) {
                const names = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
                return {
                    letter: names[midi % 12],
                    oct: Math.floor(midi / 12) - 1
                };
            }
            function isNaturalMidi(midi) {
                return [0, 2, 4, 5, 7, 9, 11].includes(midi % 12);
            }
            function snapToNatural(midi) {
                midi = clamp(midi, MIDI_RANGE.min, MIDI_RANGE.max);
                if (isNaturalMidi(midi))
                    return midi;
                let up = midi + 1
                  , down = midi - 1;
                while (up <= MIDI_RANGE.max || down >= MIDI_RANGE.min) {
                    if (down >= MIDI_RANGE.min && isNaturalMidi(down))
                        return down;
                    if (up <= MIDI_RANGE.max && isNaturalMidi(up))
                        return up;
                    up++;
                    down--;
                }
                return clamp(midi, MIDI_RANGE.min, MIDI_RANGE.max);
            }
            function midiToNoteNameKR(midi) {
                const {letter} = midiToLetterOct(midi);
                return NOTE_NAMES_KR[letter.replace('#', '')] || '';
            }
            function midiToColor(midi) {
                const {letter} = midiToLetterOct(midi);
                return NOTE_COLORS[letter.replace('#', '')] || '#000';
            }
            function getContrastColor(hex) {
                // hex -> #rrggbb, 정규식 없이 파싱
                const clean = (hex || '').replace('#', '');
                if (clean.length !== 6)
                    return '#000';
                const r = parseInt(clean.slice(0, 2), 16);
                const g = parseInt(clean.slice(2, 4), 16);
                const b = parseInt(clean.slice(4, 6), 16);
                const yiq = (r * 299 + g * 587 + b * 114) / 1000;
                return yiq >= 170 ? '#000' : '#fff';
            }
            function midiToFreq(midi) {
                return 440 * Math.pow(2, (midi - 69) / 12);
            }

            // E4 기준(맨 아래 줄). E4=64, 최저는 C4
            const stepMap = {
                'C4': -2,
                'D4': -1,
                'E4': 0,
                'F4': 1,
                'G4': 2,
                'A5': 10,
                'B5': 11,
                'A4': 3,
                'B4': 4,
                'C5': 5,
                'D5': 6,
                'E5': 7,
                'F5': 8,
                'G5': 9,
                'C6': 12
            };
            // 정렬 보정
            const reverseStep = {
                '-2': 60,
                '-1': 62,
                '0': 64,
                '1': 65,
                '2': 67,
                '3': 69,
                '4': 71,
                '5': 72,
                '6': 74,
                '7': 76,
                '8': 77,
                '9': 79,
                '10': 81,
                '11': 83,
                '12': 84
            };
            function midiToStepFromE4(midi) {
                const {letter, oct} = midiToLetterOct(midi);
                const key = `${letter.replace('#', '')}${oct}`;
                return stepMap[key] ?? 0;
            }
            function stepToMidi(step) {
                return reverseStep[String(step)] ?? 64;
            }

            function showToast(msg) {
                toastEl.textContent = msg;
                toastEl.classList.remove('hidden');
                clearTimeout(showToast.timer);
                showToast.timer = setTimeout( () => toastEl.classList.add('hidden'), 2200);
            }
            function snapshot() {
                return JSON.stringify({
                    items: state.items,
                    selectedIndex: state.selectedIndex,
                    pageIndex: state.pageIndex
                });
            }
            function applySnapshot(j) {
                const s = JSON.parse(j);
                state.items = s.items.map(x => ({
                    ...x
                }));
                state.selectedIndex = s.selectedIndex;
                state.pageIndex = s.pageIndex;
                renderAll();
            }
            function pushUndo(clearRedo=true) {
                state.undoStack.push(snapshot());
                if (state.undoStack.length > 200)
                    state.undoStack.shift();
                if (clearRedo)
                    state.redoStack = [];
            }
            function undo() {
                if (state.undoStack.length <= 1)
                    return;
                const cur = state.undoStack.pop();
                state.redoStack.push(cur);
                const prev = state.undoStack[state.undoStack.length - 1];
                applySnapshot(prev);
            }
            function redo() {
                if (state.redoStack.length === 0)
                    return;
                const next = state.redoStack.pop();
                state.undoStack.push(next);
                applySnapshot(next);
            }

            // URL의 queryString 처리로 config
            function getQueryParams() {
                const qs = new URLSearchParams(window.location.search);
                const out = {};
                qs.forEach((v, k) => {
                    out[k] = /^-?\d+(\.\d+)?$/.test(v) ? Number(v) : v; // 숫자면 숫자, 아니면 문자열
                });
                return out;
            }

            function applyConfigFromQuery() {
                const q = getQueryParams();

                if ('hw_input_range_min' in q) HW_INPUT_RANGE.min = Math.max(0, Math.min(127, q.hw_input_range_min));
                if ('hw_input_range_max' in q) HW_INPUT_RANGE.max = Math.max(0, Math.min(127, q.hw_input_range_max));

                // 순서 무관 + 잘못된 범위 보정
                if (HW_INPUT_RANGE.max < HW_INPUT_RANGE.min) {
                    [HW_INPUT_RANGE.min, HW_INPUT_RANGE.max] = [HW_INPUT_RANGE.max, HW_INPUT_RANGE.min];
                }
            }


            // =========================
            // 렌더링
            // =========================
            function renderAll() {
                const totalSystems = Math.max(1, Math.ceil(state.items.length / ITEMS_PER_SYSTEM));
                const systemsToDraw = state.printMode ? Math.min(totalSystems, MAX_SYSTEMS_PRINT) : SYSTEMS_PER_PAGE;
                const startSystemIndex = state.printMode ? 0 : state.pageIndex * SYSTEMS_PER_PAGE;

                const height = systemsToDraw * STAFF_HEIGHT + (systemsToDraw - 1) * SYSTEM_GAP;

                // 내부 좌표계(도형 배치)는 width/height + viewBox로 계산
                STAFF.setAttribute('width', STAFF_WIDTH);
                STAFF.setAttribute('height', height);
                STAFF.setAttribute('viewBox', `0 0 ${STAFF_WIDTH} ${height}`);

                // 화면에서는 래퍼 폭에 맞춰 축소 표시
                STAFF.style.width = '100%';
                STAFF.style.height = 'auto';
                STAFF.setAttribute('preserveAspectRatio', 'xMinYMin meet');
                // 좌측 정렬로 축소
                STAFF.innerHTML = '';

                // 페이지 인디케이터
                const totalPages = Math.max(1, Math.ceil(totalSystems / SYSTEMS_PER_PAGE));
                document.getElementById('pageIndicator').textContent = `${state.pageIndex + 1} / ${totalPages}`;
                const pageInfo = document.getElementById('pageInfo');
                pageInfo.textContent = `현재 페이지 ${state.pageIndex + 1}, 전체 아이템 ${state.items.length}`;

                // 시스템 렌더
                for (let s = 0; s < systemsToDraw; s++) {
                    const sysIndex = startSystemIndex + s;
                    const yOffset = s * (STAFF_HEIGHT + SYSTEM_GAP);
                    drawStaffLines(yOffset);
                    drawClef(yOffset);
                    // 4마디 바라인
                    for (let m = 0; m < MEASURES_PER_SYSTEM; m++) {
                        const barX = START_X + (m + 1) * ((STAFF_WIDTH - START_X - 20) / MEASURES_PER_SYSTEM);
                        drawBarline(barX, yOffset);
                    }

                    const startX = START_X + 10;
                    const usableWidth = STAFF_WIDTH - startX - 30;
                    const stepX = usableWidth / ITEMS_PER_SYSTEM;

                    for (let i = 0; i < ITEMS_PER_SYSTEM; i++) {
                        const globalIdx = sysIndex * ITEMS_PER_SYSTEM + i;
                        if (globalIdx >= state.items.length)
                            continue;
                        // 비어있으면 그리기 생략
                        let x = startX + i * stepX + stepX / 2;
                        const item = state.items[globalIdx];
                        item.elementId = `item-${globalIdx}`;
                        // 마디의 마지막 칸 + 쉼표면 살짝 왼쪽으로
                        const isLastInMeasure = ((i + 1) % ITEMS_PER_MEASURE === 0);
                        if (isLastInMeasure && item.type === 'rest') {
                            x -= 20;
                            // 기본 10px
                        }
                        // 절대 인덱스 기반
                        if (item.type === 'note')
                            drawNote(item, x, yOffset, globalIdx);
                        else
                            drawRest(item, x, yOffset, globalIdx);
                        if (s === 0 && (i % ITEMS_PER_MEASURE === 0))
                            drawMeasureNumber(Math.floor(globalIdx / ITEMS_PER_MEASURE) + 1, startX + i * stepX + 4, yOffset);
                    }
                }
            }

            function drawStaffLines(yOffset) {
                for (let i = 0; i < 5; i++) {
                    const line = document.createElementNS(SVG_NS, 'line');
                    line.setAttribute('x1', '10');
                    line.setAttribute('y1', String(yOffset + 70 + i * LINE_SPACING));
                    line.setAttribute('x2', String(STAFF_WIDTH - 10));
                    line.setAttribute('y2', String(yOffset + 70 + i * LINE_SPACING));
                    line.setAttribute('stroke', '#232323');
                    line.setAttribute('stroke-width', '1.5');
                    STAFF.appendChild(line);
                }
            }

            function drawClef(yOffset) {
                const g = document.createElementNS(SVG_NS, 'g');
                // 둘째 줄(y2)을 기준으로 고정 배치
                const y2 = yOffset + 80 + 1 * LINE_SPACING;
                // 둘째 줄
                const targetHeight = LINE_SPACING * 5.5;
                // 오선보다 조금 크게
                const srcHeight = 75;
                // 원본 경로 기준 높이
                const scale = targetHeight / srcHeight * 1.4;
                const tx = -20;
                // 좌측 여백 내 배치
                const ty = y2 - (scale * 38) + 15;
                g.setAttribute('transform', `translate(${tx}, ${ty}) scale(${scale})`);

                const main = document.createElementNS(SVG_NS, 'path');
                main.setAttribute('d', GCLEF_MAIN);
                main.setAttribute('fill', 'black');
                main.setAttribute('stroke', 'black');
                main.setAttribute('stroke-width', '0.6');

                const dot = document.createElementNS(SVG_NS, 'path');
                dot.setAttribute('d', GCLEF_DOT);
                dot.setAttribute('transform', 'matrix(-1.08512,-0.02036848,0.02036848,-1.08512,90.68868,135.0572)');
                dot.setAttribute('fill', 'black');
                dot.setAttribute('stroke', 'black');
                dot.setAttribute('stroke-width', '0.6');

                g.appendChild(main);
                g.appendChild(dot);
                STAFF.appendChild(g);
            }

            function drawBarline(x, yOffset) {
                const bar = document.createElementNS(SVG_NS, 'line');
                bar.setAttribute('x1', x);
                bar.setAttribute('x2', x);
                bar.setAttribute('y1', yOffset + 70);
                bar.setAttribute('y2', yOffset + 70 + 4 * LINE_SPACING);
                bar.setAttribute('stroke', '#111');
                bar.setAttribute('stroke-width', '1.5');
                STAFF.appendChild(bar);
            }
            function drawMeasureNumber(num, x, yOffset) {
                const t = document.createElementNS(SVG_NS, 'text');
                t.setAttribute('x', x);
                t.setAttribute('y', yOffset + 60);
                t.setAttribute('font-size', '12');
                t.setAttribute('fill', '#64748b');
                t.textContent = num;
                STAFF.appendChild(t);
            }
            function baseY(yOffset) {
                return yOffset + 70 + 8 * STEP;
            }

            function drawNote(item, x, yOffset, absIndex) {
                const step = midiToStepFromE4(item.midi);
                const y = baseY(yOffset) - step * STEP;
                const g = document.createElementNS(SVG_NS, 'g');
                g.setAttribute('id', item.elementId);
                g.dataset.index = absIndex;
                g.setAttribute('tabindex', '0');

                // ledger: C4(-2)와 B5(11) 근처
                if (step <= -2) {
                    const l = lineAt(x, baseY(yOffset) - (-2) * STEP);
                    g.appendChild(l);
                }
                if (step >= 10) {
                    const l = lineAt(x, baseY(yOffset) - (10) * STEP);
                    g.appendChild(l);
                }

                const ellipse = document.createElementNS(SVG_NS, 'ellipse');
                ellipse.setAttribute('cx', x);
                ellipse.setAttribute('cy', y);
                ellipse.setAttribute('rx', '12');
                ellipse.setAttribute('ry', '9');
                ellipse.setAttribute('transform', `rotate(-18 ${x} ${y})`);
                const fill = midiToColor(item.midi);
                ellipse.setAttribute('fill', fill);
                ellipse.setAttribute('stroke', 'black');
                ellipse.setAttribute('stroke-width', '1');
                g.appendChild(ellipse);

                const text = document.createElementNS(SVG_NS, 'text');
                text.setAttribute('x', x);
                text.setAttribute('y', y + 4);
                text.setAttribute('text-anchor', 'middle');
                text.setAttribute('font-size', '13');
                text.setAttribute('font-weight', '800');
                text.setAttribute('fill', getContrastColor(fill));
                text.setAttribute('class', 'note-text');
                text.textContent = midiToNoteNameKR(item.midi);
                g.appendChild(text);

                const stemDown = step >= 4;
                const stem = document.createElementNS(SVG_NS, 'line');
                if (stemDown) {
                    stem.setAttribute('x1', x - 12);
                    stem.setAttribute('y1', y);
                    stem.setAttribute('x2', x - 12);
                    stem.setAttribute('y2', y + 3.5 * LINE_SPACING);
                } else {
                    stem.setAttribute('x1', x + 12);
                    stem.setAttribute('y1', y);
                    stem.setAttribute('x2', x + 12);
                    stem.setAttribute('y2', y - 3.5 * LINE_SPACING);
                }
                stem.setAttribute('stroke', '#000');
                stem.setAttribute('stroke-width', '1.5');
                g.appendChild(stem);

                attachItemHandlers(g, absIndex);
                if (state.selectedIndex === absIndex)
                    g.classList.add('selected');
                STAFF.appendChild(g);
            }
            function lineAt(x, y) {
                const l = document.createElementNS(SVG_NS, 'line');
                l.setAttribute('x1', x - 16);
                l.setAttribute('x2', x + 16);
                l.setAttribute('y1', y);
                l.setAttribute('y2', y);
                l.setAttribute('stroke', '#222');
                l.setAttribute('stroke-width', '1.5');
                return l;
            }

            function drawRest(item, x, yOffset, absIndex) {
                const g = document.createElementNS(SVG_NS, 'g');
                g.setAttribute('id', item.elementId);
                g.dataset.index = absIndex;
                g.setAttribute('tabindex', '0');
                const path = document.createElementNS(SVG_NS, 'path');
                path.setAttribute('d', QUARTER_REST_PATH);
                // 오선 중앙 정렬: 세 번째 줄 부근을 중심
                const staffMidY = yOffset + 70 + 2 * LINE_SPACING;
                const srcH = 108.2;
                // 제공된 샘플 SVG 높이 근사
                const targetH = LINE_SPACING * 3.6;
                // 약간 작게
                const scale = targetH / srcH;
                const offsetY = staffMidY - (scale * 54);
                // 대략 중앙(54)
                path.setAttribute('transform', `translate(${x - 145}, ${offsetY}) scale(${scale})`);
                path.setAttribute('fill', 'black');
                path.setAttribute('stroke', 'black');
                path.setAttribute('stroke-width', '0.6');
                g.appendChild(path);
                attachItemHandlers(g, absIndex);
                if (state.selectedIndex === absIndex)
                    g.classList.add('selected');
                STAFF.appendChild(g);
            }

            function attachItemHandlers(g, index) {
                g.addEventListener('click', (e) => {
                    e.stopPropagation();
                    state.selectedIndex = (state.selectedIndex === index) ? null : index;
                    // 선택 미리듣기
                    const it = state.items[index];
                    if (it && it.type === 'note')
                        previewNote(it.midi);
                    renderAll();
                }
                );
            }
            STAFF.addEventListener('click', () => {
                state.selectedIndex = null;
                renderAll();
            }
            );

            // =========================
            // 입력/편집
            // =========================
            function insertItem(newItem) {
                // 한 시스템에 들어가는 아이템 수(예: 16) * 3줄 = 전체 허용량
                const MAX_ITEMS_3LINES = ITEMS_PER_SYSTEM * 3;
                // ex) 16 * 3 = 48

                // 지금 추가하려는 경우의 전체 개수
                const nextCount = state.items.length + 1;

                // ✅ 곡 전체를 3줄만 허용: 화면/페이지와 무관하게 총 개수 제한
                if (nextCount > MAX_ITEMS_3LINES) {
                    showToast('이 악보는 최대 3줄까지만 만들 수 있어요. 일부를 지우고 다시 추가해 주세요.');
                    return false;
                }

                // 삽입 위치: 선택 아이템 다음(없으면 맨 뒤)
                const pos = (state.selectedIndex == null) ? state.items.length : state.selectedIndex + 1;

                // 실제 삽입
                state.items.splice(pos, 0, newItem);

                // 선택 해제 및 되돌리기 스냅샷
                state.selectedIndex = null;
                pushUndo();

                // 새 아이템이 보이도록 페이지 이동
                state.pageIndex = Math.floor(pos / ITEMS_PER_PAGE);

                // 다시 그리기
                renderAll();

                // 음표면 미리듣기
                if (newItem.type === 'note') {
                    previewNote(newItem.midi);
                }

                return true;
            }

            function replaceNoteWithRest(index) {
                if (index == null || index < 0 || index >= state.items.length)
                    return;
                const it = state.items[index];
                if (it.type === 'note') {
                    state.items[index] = {
                        id: uid(),
                        type: 'rest',
                        duration: '4n'
                    };
                    pushUndo();
                    renderAll();
                }
            }
            function deleteItem(index) {
                if (index == null || index < 0 || index >= state.items.length)
                    return;

                // ✅ 선택된 아이템을 종류와 무관하게 완전히 삭제
                state.items.splice(index, 1);

                // 선택 인덱스 보정
                if (state.items.length === 0) {
                    state.selectedIndex = null;
                } else {
                    state.selectedIndex = clamp(index, 0, state.items.length - 1);
                }

                pushUndo();
                renderAll();
            }

            // 화살표로 피치 이동(자연음 스텝) + 미리듣기
            function movePitch(delta) {
                const i = state.selectedIndex;
                if (i == null)
                    return;

                const it = state.items[i];
                if (!it || it.type !== 'note')
                    return;

                const step = midiToStepFromE4(it.midi);
                const MAX_STEP_UP = midiToStepFromE4(72);
                // C5 기준 스텝(= 5)

                let nextStep;

                if (delta > 0) {
                    // ↑: 이미 C5 이상이면 그대로 유지(undo 스택 증가 방지)
                    if (step >= MAX_STEP_UP) {
                        previewNote(it.midi);
                        return;
                    }
                    // C5를 넘지 않도록 상한 고정
                    nextStep = Math.min(step + delta, MAX_STEP_UP);
                } else {
                    // ↓: 기존 범위(-2..12) 내에서만 이동 (C4..C6 범위 유지)
                    nextStep = clamp(step + delta, -2, 12);
                }

                const nextMidi = snapToNatural(stepToMidi(nextStep));

                if (nextMidi === it.midi) {
                    // 변화가 없으면 조용히 종료
                    previewNote(it.midi);
                    return;
                }

                it.midi = nextMidi;
                pushUndo();
                renderAll();
                previewNote(nextMidi);
            }

            function moveSelection(delta, preview=true) {
                const n = state.items.length;
                if (n === 0)
                    return;

                let idx = state.selectedIndex;
                if (idx == null) {
                    // 선택이 없으면: → 는 첫 아이템, ← 는 마지막 아이템
                    idx = delta > 0 ? 0 : n - 1;
                } else {
                    // 경계에서 멈춤(랩 없음)
                    idx = clamp(idx + delta, 0, n - 1);
                }

                if (idx === state.selectedIndex)
                    return;

                state.selectedIndex = idx;

                // 선택이 다른 페이지에 있으면 그 페이지로 보여주기(가시성 향상)
                const pageNeeded = Math.floor(idx / ITEMS_PER_PAGE);
                if (!state.printMode && pageNeeded !== state.pageIndex) {
                    state.pageIndex = pageNeeded;
                }

                renderAll();

                // 새 선택이 음표면 미리듣기
                const it = state.items[idx];
                if (preview && it && it.type === 'note') {
                    previewNote(it.midi);
                }
            }

            // =========================
            // 재생
            // =========================
            function buildSeqFromItems(startIndex=0) {
                const stepsPerQuarter = 4;
                const seq = {
                    notes: [],
                    quantizationInfo: {
                        stepsPerQuarter
                    },
                    totalQuantizedSteps: Math.max(0, (state.items.length - startIndex) * 4),
                    tempos: [{
                        time: 0,
                        qpm: state.tempoBPM
                    }],
                    timeSignatures: [{
                        time: 0,
                        numerator: state.timeSig[0],
                        denominator: state.timeSig[1]
                    }]
                };
                let step = 0;
                for (let i = startIndex; i < state.items.length; i++) {
                    const it = state.items[i];
                    if (it.type === 'note') {
                        seq.notes.push({
                            pitch: it.midi,
                            instrument: 0,
                            // 소프라노
                            velocity: 80,
                            quantizedStartStep: step,
                            quantizedEndStep: step + 4
                        });
                    }
                    step += 4;
                    // 4분음표 1칸
                }
                return seq;
            }

            async function play() {
                if (!state.items.length)
                    return;

                await mainPlayer.resumeContext();
                // 오디오 컨텍스트 깨우기
                const startIdx = (state.selectedIndex != null) ? state.selectedIndex : 0;
                const seq = buildSeqFromItems(startIdx);

                mainPlayer._startIndex = startIdx;
                // 하이라이트 계산용
                mainPlayer._qpm = state.tempoBPM;

                // ⏳ 처음 한 번은 샘플 로딩 때문에 딜레이가 있을 수 있음
                await mainPlayer.loadSamples(seq);
                // 필요 샘플만 선로딩
                mainPlayer.stop();
                previewPlayer.stop();
                await mainPlayer.start(seq, state.tempoBPM);
            }

            document.getElementById('playBtn').addEventListener('click', () => {
                if (mainPlayer.isPlaying())
                    mainPlayer.stop();
                play();
            }
            );

            document.getElementById('stopBtn').addEventListener('click', () => {
                mainPlayer.stop();
                previewPlayer.stop();
                aiPlayer && aiPlayer.stop();
            }
            );

            // 템포 슬라이더: 앞으로의 start() 호출에 반영
            document.getElementById('tempo').addEventListener('input', (e) => {
                state.tempoBPM = Number(e.target.value);
                document.getElementById('tempoLabel').textContent = state.tempoBPM;
            }
            );

            function highlightOnce(id) {
                const el = document.getElementById(id);
                if (!el)
                    return;
                el.classList.add('highlight');
                setTimeout( () => el.classList.remove('highlight'), 250);
            }

            function previewNote(midi) {
                const seq = {
                    notes: [{
                        pitch: midi,
                        instrument: 0,
                        quantizedStartStep: 0,
                        quantizedEndStep: 2
                    }],
                    quantizationInfo: {
                        stepsPerQuarter: 4
                    },
                    totalQuantizedSteps: 2,
                    tempos: [{
                        time: 0,
                        qpm: state.tempoBPM
                    }]
                };
                previewPlayer.stop();
                previewPlayer.resumeContext();
                // 선택: 한 번만 로딩해두면 다음부터 지연이 거의 없음
                previewPlayer.loadSamples(seq).then( () => previewPlayer.start(seq, state.tempoBPM));
            }

            // =========================
            // Export / Import (SVG + metadata JSON)
            // =========================
            function exportSVG() {
                try {
                    // ===== 기본 상수(프로젝트 전역 값 재사용) =====
                    const svgNS = 'http://www.w3.org/2000/svg';

                    // 여백/높이 — 기존 코드에 TOP_MARGIN/BOTTOM_MARGIN가 없을 수도 있어 기본값 보강
                    const TOP_MARGIN = (typeof window.TOP_MARGIN !== 'undefined') ? window.TOP_MARGIN : 70;
                    const BOTTOM_MARGIN = (typeof window.BOTTOM_MARGIN !== 'undefined') ? window.BOTTOM_MARGIN : 50;

                    const lineGap = LINE_SPACING;
                    // 20
                    const step = STEP;
                    // lineGap / 2
                    const staffWidth = STAFF_WIDTH;
                    // 1280
                    const systemGap = SYSTEM_GAP;
                    // 24
                    const startXClef = START_X;
                    // 110 (좌측 클레프 여유)
                    const measuresPerSystem = MEASURES_PER_SYSTEM;
                    // 4
                    const itemsPerSystem = ITEMS_PER_SYSTEM;
                    // 16
                    const itemsPerMeasure = ITEMS_PER_MEASURE;
                    // 4

                    // 한 시스템의 높이 = 위여백 + 5줄 + 아래여백
                    const systemHeight = TOP_MARGIN + 5 * lineGap + BOTTOM_MARGIN;

                    // 총 시스템 수(최소 1)
                    const totalSystems = Math.max(1, Math.ceil(state.items.length / itemsPerSystem));

                    // 전체 SVG 높이
                    const totalHeight = totalSystems * systemHeight + (totalSystems - 1) * systemGap;

                    // ===== 오프스크린 SVG 생성 =====
                    const svg = document.createElementNS(svgNS, 'svg');
                    svg.setAttribute('xmlns', svgNS);
                    svg.setAttribute('width', String(staffWidth));
                    svg.setAttribute('height', String(totalHeight));
                    svg.setAttribute('viewBox', `0 0 ${staffWidth} ${totalHeight}`);
                    svg.setAttribute('role', 'img');
                    svg.setAttribute('aria-label', state.title || '악보');

                    // 접근성/식별용 제목(선택)
                    const titleEl = document.createElementNS(svgNS, 'title');
                    titleEl.textContent = state.title || '솔바람 악보';
                    svg.appendChild(titleEl);

                    // ===== 내부 유틸(내보내기 전용, 화면 렌더와 동일한 지오메트리) =====
                    const baseY = (yOffset) => yOffset + TOP_MARGIN + 4 * lineGap;
                    // E4(맨 아랫줄)
                    const drawStaffLines = (yOffset) => {
                        for (let i = 0; i < 5; i++) {
                            const line = document.createElementNS(svgNS, 'line');
                            line.setAttribute('x1', '10');
                            line.setAttribute('y1', String(yOffset + TOP_MARGIN + i * lineGap));
                            line.setAttribute('x2', String(staffWidth - 10));
                            line.setAttribute('y2', String(yOffset + TOP_MARGIN + i * lineGap));
                            line.setAttribute('stroke', '#232323');
                            line.setAttribute('stroke-width', '1.5');
                            svg.appendChild(line);
                        }
                    }
                    ;
                    const drawClef = (yOffset) => {
                        const g = document.createElementNS(svgNS, 'g');
                        const y2 = yOffset + TOP_MARGIN + 1 * lineGap;
                        // 둘째 줄 기준
                        const targetHeight = lineGap * 5.5;
                        const srcHeight = 75;
                        const scale = targetHeight / srcHeight;
                        const tx = 34;
                        const ty = y2 - (scale * 38);

                        g.setAttribute('transform', `translate(${tx}, ${ty}) scale(${scale})`);

                        const main = document.createElementNS(svgNS, 'path');
                        main.setAttribute('d', GCLEF_MAIN);
                        main.setAttribute('fill', 'black');
                        main.setAttribute('stroke', 'black');
                        main.setAttribute('stroke-width', '0.6');

                        const dot = document.createElementNS(svgNS, 'path');
                        dot.setAttribute('d', GCLEF_DOT);
                        dot.setAttribute('transform', 'matrix(-1.08512,-0.02036848,0.02036848,-1.08512,90.68868,135.0572)');
                        dot.setAttribute('fill', 'black');
                        dot.setAttribute('stroke', 'black');
                        dot.setAttribute('stroke-width', '0.6');

                        g.appendChild(main);
                        g.appendChild(dot);
                        svg.appendChild(g);
                    }
                    ;
                    const drawBarline = (x, yOffset) => {
                        const bar = document.createElementNS(svgNS, 'line');
                        bar.setAttribute('x1', String(x));
                        bar.setAttribute('x2', String(x));
                        bar.setAttribute('y1', String(yOffset + TOP_MARGIN));
                        bar.setAttribute('y2', String(yOffset + TOP_MARGIN + 4 * lineGap));
                        bar.setAttribute('stroke', '#111');
                        bar.setAttribute('stroke-width', '1.5');
                        svg.appendChild(bar);
                    }
                    ;
                    const drawMeasureNumber = (num, x, yOffset) => {
                        const t = document.createElementNS(svgNS, 'text');
                        t.setAttribute('x', String(x));
                        t.setAttribute('y', String(yOffset + (TOP_MARGIN - 10)));
                        t.setAttribute('font-size', '12');
                        t.setAttribute('fill', '#64748b');
                        t.textContent = String(num);
                        svg.appendChild(t);
                    }
                    ;
                    const ledgerLineAt = (x, y) => {
                        const l = document.createElementNS(svgNS, 'line');
                        l.setAttribute('x1', String(x - 16));
                        l.setAttribute('x2', String(x + 16));
                        l.setAttribute('y1', String(y));
                        l.setAttribute('y2', String(y));
                        l.setAttribute('stroke', '#222');
                        l.setAttribute('stroke-width', '1.5');
                        return l;
                    }
                    ;

                    const drawNote = (item, x, yOffset) => {
                        const stepFromE4 = midiToStepFromE4(item.midi);
                        const y = baseY(yOffset) - stepFromE4 * step;

                        const g = document.createElementNS(svgNS, 'g');

                        // 아래/위 보조선
                        if (stepFromE4 <= -2) {
                            g.appendChild(ledgerLineAt(x, baseY(yOffset) - (-2) * step));
                        }
                        if (stepFromE4 >= 10) {
                            g.appendChild(ledgerLineAt(x, baseY(yOffset) - (10) * step));
                        }

                        // 음표 헤드
                        const ellipse = document.createElementNS(svgNS, 'ellipse');
                        ellipse.setAttribute('cx', String(x));
                        ellipse.setAttribute('cy', String(y));
                        ellipse.setAttribute('rx', '12');
                        ellipse.setAttribute('ry', '9');
                        ellipse.setAttribute('transform', `rotate(-18 ${x} ${y})`);
                        const fill = midiToColor(item.midi);
                        ellipse.setAttribute('fill', fill);
                        ellipse.setAttribute('stroke', 'black');
                        ellipse.setAttribute('stroke-width', '1');
                        g.appendChild(ellipse);

                        // 음명 텍스트(대비 적용)
                        const text = document.createElementNS(svgNS, 'text');
                        text.setAttribute('x', String(x));
                        text.setAttribute('y', String(y + 4));
                        text.setAttribute('text-anchor', 'middle');
                        text.setAttribute('font-size', '13');
                        text.setAttribute('font-weight', '800');
                        text.setAttribute('fill', getContrastColor(fill));
                        text.textContent = midiToNoteNameKR(item.midi);
                        g.appendChild(text);

                        // 기둥 방향
                        const stemDown = stepFromE4 >= 4;
                        const stem = document.createElementNS(svgNS, 'line');
                        if (stemDown) {
                            stem.setAttribute('x1', String(x - 12));
                            stem.setAttribute('y1', String(y));
                            stem.setAttribute('x2', String(x - 12));
                            stem.setAttribute('y2', String(y + 3.5 * lineGap));
                        } else {
                            stem.setAttribute('x1', String(x + 12));
                            stem.setAttribute('y1', String(y));
                            stem.setAttribute('x2', String(x + 12));
                            stem.setAttribute('y2', String(y - 3.5 * lineGap));
                        }
                        stem.setAttribute('stroke', '#000');
                        stem.setAttribute('stroke-width', '1.5');
                        g.appendChild(stem);

                        svg.appendChild(g);
                    }
                    ;

                    const drawRest = (item, x, yOffset) => {
                        const g = document.createElementNS(svgNS, 'g');
                        const path = document.createElementNS(svgNS, 'path');

                        // 오선 중앙 기반 배치
                        const staffMidY = yOffset + TOP_MARGIN + 2 * lineGap;
                        const srcH = 108.2;
                        const targetH = lineGap * 3.6;
                        const scale = targetH / srcH;
                        const offsetY = staffMidY - (scale * 54);

                        path.setAttribute('d', QUARTER_REST_PATH);
                        path.setAttribute('transform', `translate(${x - 145}, ${offsetY}) scale(${scale})`);
                        path.setAttribute('fill', 'black');
                        path.setAttribute('stroke', 'black');
                        path.setAttribute('stroke-width', '0.6');

                        g.appendChild(path);
                        svg.appendChild(g);
                    }
                    ;

                    // ===== 전체 시스템/마디/아이템 렌더 =====
                    for (let s = 0; s < totalSystems; s++) {
                        const yOffset = s * (systemHeight + systemGap);

                        drawStaffLines(yOffset);
                        drawClef(yOffset);

                        // 마디선
                        for (let m = 0; m < measuresPerSystem; m++) {
                            const barX = startXClef + (m + 1) * ((staffWidth - startXClef - 20) / measuresPerSystem);
                            drawBarline(barX, yOffset);
                        }

                        // 아이템 위치 계산
                        const startX = startXClef + 10;
                        const usableWidth = staffWidth - startX - 30;
                        const stepX = usableWidth / itemsPerSystem;

                        for (let i = 0; i < itemsPerSystem; i++) {
                            const globalIdx = s * itemsPerSystem + i;
                            if (globalIdx >= state.items.length)
                                break;

                            const x = startX + i * stepX + stepX / 2;
                            const item = state.items[globalIdx];

                            if (item.type === 'note')
                                drawNote(item, x, yOffset);
                            else
                                drawRest(item, x, yOffset);

                            // (선택) 마디 번호: 첫 시스템 상단에만 표시(원래 화면 로직과 동일)
                            if (s === 0 && (i % itemsPerMeasure === 0)) {
                                drawMeasureNumber(Math.floor(globalIdx / itemsPerMeasure) + 1, startX + i * stepX + 4, yOffset);
                            }
                        }
                    }

                    // ===== 메타데이터(JSON) 삽입 =====
                    const meta = document.createElementNS(svgNS, 'metadata');
                    meta.setAttribute('id', 'score-json');
                    const payload = {
                        schemaVersion: state.schemaVersion,
                        title: state.title,
                        student: state.student,
                        timeSig: state.timeSig,
                        tempoBPM: state.tempoBPM,
                        range: state.range,
                        items: state.items
                    };
                    meta.textContent = JSON.stringify(payload);
                    svg.appendChild(meta);

                    // ===== 직렬화 & 다운로드 =====
                    const serializer = new XMLSerializer();
                    const svgStr = serializer.serializeToString(svg);
                    const blob = new Blob([svgStr],{
                        type: 'image/svg+xml'
                    });
                    const url = URL.createObjectURL(blob);

                    const a = document.createElement('a');
                    const now = new Date();
                    const y = now.getFullYear();
                    const m = String(now.getMonth() + 1).padStart(2, '0');
                    const d = String(now.getDate()).padStart(2, '0');
                    const ymd = `${y}${m}${d}`;
                    a.href = url;
                    a.download = `${state.title || 'score'}-${ymd}.svg`;
                    document.body.appendChild(a);
                    a.click();
                    a.remove();
                    URL.revokeObjectURL(url);

                    showToast('전체 악보를 하나의 SVG로 저장했어요 ⬇️');
                } catch (err) {
                    console.error(err);
                    showToast('내보내기에 실패했어요 😿');
                }
            }

            function importFromSVGText(text) {
                try {
                    const doc = new DOMParser().parseFromString(text, 'image/svg+xml');
                    const meta = doc.getElementById('score-json');
                    if (!meta)
                        throw new Error('score-json metadata not found');
                    const json = JSON.parse(meta.textContent || '{}');
                    if (json.schemaVersion !== 1)
                        throw new Error('unsupported schema');
                    if (!Array.isArray(json.items))
                        throw new Error('items missing');
                    if (json.items.length > MAX_ITEMS_PRINT) {
                        showToast('두 장 제한을 넘는 악보예요 🌲 일부를 지우고 다시 시도해요.');
                        return;
                    }
                    state.title = json.title || '솔바람 악보';
                    state.student = json.student || '';
                    state.timeSig = json.timeSig || [4, 4];
                    state.tempoBPM = json.tempoBPM || 90;
                    state.range = json.range || 'C4-C6';
                    state.items = json.items.map(it => ({
                        ...it,
                        id: it.id || uid()
                    }));
                    state.selectedIndex = null;
                    state.pageIndex = 0;
                    pushUndo();
                    renderAll();
                    showToast('불러왔어요 ⬆️');
                } catch (err) {
                    console.error(err);
                    showToast('불러오기에 실패했어요 😿 SVG 안에 score-json이 없어요');
                }
            }

            function exportMIDI() {
                try {
                    // 1) 시퀀스 선택 (AI 있으면 ATB 필터 반영, 없으면 멜로디)
                    let seq = state.lastAIFull ? filterVoices(state.lastAIFull, getSelectedVoices()) : buildSeqFromItems(0);

                    if (!seq.notes || seq.notes.length === 0) {
                        showToast('내보낼 노트가 없어요 😿');
                        return;
                    }

                    // 2) 메타 보강
                    const stepsPerQuarter = 4;
                    seq.quantizationInfo = {
                        stepsPerQuarter
                    };
                    seq.totalQuantizedSteps = seq.totalQuantizedSteps ?? (state.items.length * 4);
                    seq.tempos = [{
                        time: 0,
                        qpm: state.tempoBPM
                    }];
                    seq.timeSignatures = [{
                        time: 0,
                        numerator: state.timeSig[0],
                        denominator: state.timeSig[1]
                    }];
                    seq.ticksPerQuarter = 480;

                    // 3) 벨로시티/프로그램 지정 (S/A/T/B → Piano/Viola/Cello/Bass 예시)
                    const progMap = {
                        0: 0,
                        1: 41,
                        2: 42,
                        3: 32
                    };
                    for (const n of seq.notes) {
                        if (!n.velocity || n.velocity <= 0)
                            n.velocity = 80;
                        n.isDrum = false;
                        n.program = progMap[n.instrument ?? 0] ?? 0;
                    }

                    // 4) (옵션) 단일 트랙로 합치기 — 일부 플레이어 호환 ↑
                    const singleTrack = false;
                    // 필요시 true로
                    if (singleTrack) {
                        for (const n of seq.notes) {
                            n.instrument = 0;
                            n.program = 0;
                        }
                    }

                    // 5) 언퀀타이즈 후 MIDI 변환
                    const unq = mm.sequences.isQuantizedSequence(seq) ? mm.sequences.unquantizeSequence(seq, state.tempoBPM) : seq;

                    const bytes = mm.sequenceProtoToMidi(unq);

                    // 6) 라운드트립 검사 (디버그용)
                    const ns = mm.midiToSequenceProto(bytes);
                    // ← Uint8Array 직접 전달
                    console.log('midi note count:', ns.notes?.length);

                    // 7) 저장
                    const now = new Date();
                    const y = now.getFullYear()
                      , m = String(now.getMonth() + 1).padStart(2, '0')
                      , d = String(now.getDate()).padStart(2, '0');
                    const a = document.createElement('a');
                    a.href = URL.createObjectURL(new Blob([bytes],{
                        type: 'audio/midi'
                    }));
                    a.download = `${state.title || 'score'}-${y}${m}${d}.mid`;
                    document.body.appendChild(a);
                    a.click();
                    a.remove();

                    showToast('MIDI 파일을 저장했어요 🎹');
                } catch (err) {
                    console.error(err);
                    showToast('MIDI 내보내기에 실패했어요 😿');
                }
            }

            // 드래그&드롭 불러오기
            sheetWrapper.addEventListener('dragover', (e) => {
                e.preventDefault();
                sheetWrapper.classList.add('drop-target');
            }
            );
            sheetWrapper.addEventListener('dragleave', () => sheetWrapper.classList.remove('drop-target'));
            sheetWrapper.addEventListener('drop', (e) => {
                e.preventDefault();
                sheetWrapper.classList.remove('drop-target');
                const file = e.dataTransfer.files && e.dataTransfer.files[0];
                if (!file)
                    return;
                const reader = new FileReader();
                reader.onload = () => importFromSVGText(reader.result);
                reader.readAsText(file);
            }
            );

            // =========================
            // MIDI 입력(선택사항). 브라우저 정책상 사용자 액션 후 호출 권장
            // =========================
            // 하드웨어 입력 범위(C3~C5)를 내부 체계(C4~C6)로 매핑
            const HW_INPUT_RANGE = {
                min: 48,
                // max: 72
                max: 60 // max를 C4로 한정 
            };
            // C3..C4

            function mapHardwareMidiToScore(midiIn) {
                // 지정 범위 밖이면 무시
                if (midiIn < HW_INPUT_RANGE.min || midiIn > HW_INPUT_RANGE.max)
                    return null;
                // 내부 체계에 맞게 1옥타브 올림
                const transposed = midiIn + 12;
                // 48..72 -> 60..84
                // 기존 규칙과 동일: 자연음으로 스냅 (C/D/E/F/G/A/B)
                return snapToNatural(transposed);
            }

            async function initMIDI() {
                if (!navigator.requestMIDIAccess) {
                    showToast('이 브라우저는 Web MIDI를 지원하지 않아요');
                    return;
                }
                try {
                    const access = await navigator.requestMIDIAccess();
                    // sysex 불필요
                    const bindInputs = () => {
                        // 모든 입력에 핸들러 바인딩 (연결/해제 변화도 반영)
                        for (const input of access.inputs.values()) {
                            input.onmidimessage = (msg) => {
                                const [status,note,velocity] = msg.data;
                                // Note On(0x90) + vel>0 만 처리 (벨로시티 값 자체는 무시)
                                const isNoteOn = (status & 0xf0) === 0x90 && velocity > 0;
                                if (!isNoteOn)
                                    return;

                                const mapped = mapHardwareMidiToScore(note);
                                if (mapped == null)
                                    return;
                                // 범위 밖이면 무시

                                insertItem({
                                    id: uid(),
                                    type: 'note',
                                    midi: mapped,
                                    duration: '4n',
                                });
                            }
                            ;
                        }
                    }
                    ;

                    bindInputs();
                    access.onstatechange = () => bindInputs();
                    // 장비 연결/해제 시 재바인딩
                    showToast('MIDI 자동 연결 완료 🎹');
                } catch (e) {
                    showToast('MIDI 연결 실패');
                }
            }

            // =========================

                }, {

                }, {

            // =========================
            // 키보드 입력
            // =========================
            document.addEventListener('keydown', (e) => {
                if (['INPUT', 'TEXTAREA'].includes(e.target.tagName))
                    return;
                if (e.target.closest('[contenteditable="true"]'))
                    return;
                const key = e.key.toLowerCase();
                if (e.key === 'Delete' || e.key === 'Backspace') {
                    deleteItem(state.selectedIndex);
                    return;
                }
                if ((e.metaKey || e.ctrlKey) && key === 'z') {
                    e.preventDefault();
                    if (e.shiftKey)
                        redo();
                    else
                        undo();
                    return;
                }
                if ((e.metaKey || e.ctrlKey) && (key === 'y')) {
                    e.preventDefault();
                    redo();
                    return;
                }
                if (e.key === 'ArrowUp') {
                    e.preventDefault();
                    movePitch(+1);
                    return;
                }
                if (e.key === 'ArrowDown') {
                    e.preventDefault();
                    movePitch(-1);
                    return;
                }
                if (e.key === 'ArrowLeft') {
                    e.preventDefault();
                    moveSelection(-1, true);
                    return;
                }
                if (e.key === 'ArrowRight') {
                    e.preventDefault();
                    moveSelection(+1, true);
                    return;
                }
                const map = {
                    a: 60,
                    s: 62,
                    d: 64,
                    f: 65,
                    g: 67,
                    h: 69,
                    j: 71,
                    k: 72
                };
                if (map[key]) {
                    e.preventDefault();
                    insertItem({
                        id: uid(),
                        type: 'note',
                        midi: map[key],
                        duration: '4n'
                    });
                    return;
                }
                if (e.code === 'Space') {
                    e.preventDefault();
                    insertItem({
                        id: uid(),
                        type: 'rest',
                        duration: '4n'
                    });
                    return;
                }
            }
            );

            // 오른쪽 마우스 버튼 클릭시 컨텍스트 윈도우 막기
            document.addEventListener('contextmenu', (e) => e.preventDefault());
            // =========================

            // =========================
            document.getElementById('undoBtn').addEventListener('click', undo);
            document.getElementById('redoBtn').addEventListener('click', redo);
            document.getElementById('clearBtn').addEventListener('click', () => {
                if (confirm('모두 지울까요?')) {

                    state.pageIndex = 0;

                    renderAll();

            }
            );
            document.getElementById('printBtn').addEventListener('click', () => {

            );

            );

            );

            );
            document.getElementById('nextPage').addEventListener('click', () => {
                const totalSystems = Math.max(1, Math.ceil(state.items.length / ITEMS_PER_SYSTEM));

            );

            // =========================
            // 자동 저장 + 타이틀/이름/날짜
            // =========================
            const titleField = document.getElementById('titleField');
            const nameField = document.getElementById('nameField');
            const dateField = document.getElementById('dateField');
            function updateMetaFromFields() {
                state.title = titleField.textContent.trim() || '';
                state.student = nameField.textContent.trim();
            }
            titleField.addEventListener('input', updateMetaFromFields);
            nameField.addEventListener('input', updateMetaFromFields);
            function saveLocal() {
                try {
                    localStorage.setItem('solbaram-score', JSON.stringify({
                        ...state,
                        undoStack: [],
                        redoStack: [],
                        printMode: false
                    }));
                } catch (_) {}
            }
            function loadLocal() {
                try {
                    const raw = localStorage.getItem('solbaram-score');
                    if (!raw)
                        return false;
                    const obj = JSON.parse(raw);
                    if (obj.schemaVersion !== 1)
                        return false;
                    Object.assign(state, {
                        title: obj.title || '솔바람 악보',
                        student: obj.student || '',
                        timeSig: obj.timeSig || [4, 4],
                        tempoBPM: obj.tempoBPM || 90,
                        range: obj.range || 'C4-C6',
                        items: (obj.items || []).map(it => ({
                            ...it,
                            id: it.id || uid()
                        })),
                        selectedIndex: null,
                        pageIndex: 0,
                        undoStack: [],
                        redoStack: [],
                        printMode: false
                    });
                    pushUndo(false);
                    return true;
                } catch (_) {
                    return false;
                }
            }
            window.addEventListener('beforeunload', () => {
                saveLocal();
                saveVoicePrefs();
            }
            );

            // AI 연주
            const AI_CHECKPOINT = 'https://storage.googleapis.com/magentadata/js/checkpoints/coconet/bach';
            let aiModel = null;
            let aiBusy = false;

            function buildCoconetSeedFromItems() {
                const seed = {
                    notes: [],
                    quantizationInfo: {
                        stepsPerQuarter: 4
                    },
                    totalQuantizedSteps: state.items.length * 4,
                    tempos: [{
                        time: 0,
                        qpm: state.tempoBPM
                    }],
                    timeSignatures: [{
                        time: 0,
                        numerator: state.timeSig[0],
                        denominator: state.timeSig[1]
                    }]
                };
                let step = 0;
                for (const it of state.items) {
                    if (it.type === 'note') {
                        seed.notes.push({
                            pitch: it.midi,
                            instrument: 0,
                            // 0=S, 1=A, 2=T, 3=B (Coconet 규칙)
                            velocity: 80,
                            quantizedStartStep: step,
                            quantizedEndStep: step + 4
                        });
                    }
                    step += 4;
                }
                return seed;
            }

            // === ATB 성부 토글 헬퍼 ===
            // Soprano(0)는 항상 포함
            function getSelectedVoices() {
                const voices = [0];
                if (document.getElementById('chkAlto')?.checked)
                    voices.push(1);
                if (document.getElementById('chkTenor')?.checked)
                    voices.push(2);
                if (document.getElementById('chkBass')?.checked)
                    voices.push(3);
                return voices;
            }

            // AI 동작 중 체크박스 잠금/해제
            function toggleVoiceToggles(disabled) {
                ['chkAlto', 'chkTenor', 'chkBass'].forEach(id => {
                    const el = document.getElementById(id);
                    if (el)
                        el.disabled = disabled;
                }
                );
            }

            // 성부 선택 저장/복원
            function loadVoicePrefs() {
                try {
                    const v = JSON.parse(localStorage.getItem('solbaram-voices') || '{}');
                    if ('alto'in v)
                        document.getElementById('chkAlto').checked = !!v.alto;
                    if ('tenor'in v)
                        document.getElementById('chkTenor').checked = !!v.tenor;
                    if ('bass'in v)
                        document.getElementById('chkBass').checked = !!v.bass;
                } catch (_) {}
            }
            function saveVoicePrefs() {
                try {
                    localStorage.setItem('solbaram-voices', JSON.stringify({
                        alto: !!document.getElementById('chkAlto')?.checked,
                        tenor: !!document.getElementById('chkTenor')?.checked,
                        bass: !!document.getElementById('chkBass')?.checked,
                    }));
                } catch (_) {}
            }

            // === 유틸: 원하는 성부만 남기기 ===
            // voices 는 [0,1,2,3] 중 원하는 목록 (0=S,1=A,2=T,3=B)
            function filterVoices(ns, voices=[0, 1]) {
                const keep = new Set(voices);
                const out = mm.sequences.clone(ns);
                out.notes = (ns.notes || []).filter(n => keep.has(n.instrument ?? 0));
                // 전체 길이는 유지
                out.totalQuantizedSteps = ns.totalQuantizedSteps;
                return out;
            }
            async function aiPlay() {
                // 1) 입력 검증
                if (!state.items.some(it => it.type === 'note')) {
                    showToast('먼저 멜로디(음표)를 한두 개 넣어 주세요 🎵');
                    return;
                }

                const btn = document.getElementById('aiPlayBtn');
                try {
                    // 2) 버튼 잠금
                    if (btn) {
                        btn.disabled = true;
                        btn.textContent = '모델 준비 중…';
                    }
                    toggleVoiceToggles(true);

                    // 3) Coconet 로드/초기화 (한 번만)
                    if (!aiModel) {
                        // 공식 Bach 체크포인트
                        aiModel = new mm.Coconet('https://storage.googleapis.com/magentadata/js/checkpoints/coconet/bach');
                    }
                    if (!aiModel.isInitialized())
                        await aiModel.initialize();

                    // 4) Seed(우리 멜로디=Soprano, instrument=0) 만들기
                    const stepsPerQuarter = 4;
                    // 4n 단위
                    const seed = {
                        notes: [],
                        quantizationInfo: {
                            stepsPerQuarter
                        },
                        totalQuantizedSteps: state.items.length * 4,
                        tempos: [{
                            time: 0,
                            qpm: state.tempoBPM
                        }],
                        timeSignatures: [{
                            time: 0,
                            numerator: state.timeSig[0],
                            denominator: state.timeSig[1]
                        }]
                    };
                    let step = 0;
                    for (const it of state.items) {
                        if (it.type === 'note') {
                            seed.notes.push({
                                pitch: it.midi,
                                instrument: 0,
                                // Soprano 고정
                                quantizedStartStep: step,
                                quantizedEndStep: step + 4 // 4분음표
                            });
                        }
                        step += 4;
                    }

                    if (btn)
                        btn.textContent = '하모니 생성 중…';

                    // 5) 인필 실행
                    let out = await aiModel.infill(seed);
                    // 결과는 모든 노트가 1-step 길이로 나옴(모델 특성) :contentReference[oaicite:0]{index=0}

                    // 6) 후처리: 1-step 노트 병합 → 지속음으로
                    //    (버전에 따라 이름이 `mergeHeldNotes` 또는 `mergeConsecutiveNotes`)
                    if (mm.sequences.mergeHeldNotes) {
                        out = mm.sequences.mergeHeldNotes(out);
                        // 권장: 모델 문서에서 안내 :contentReference[oaicite:1]{index=1}
                    } else if (mm.sequences.mergeConsecutiveNotes) {
                        out = mm.sequences.mergeConsecutiveNotes(out);
                        // 동등 기능(연속 노트 병합) :contentReference[oaicite:2]{index=2}
                    }

                    // 7) 소프라노(voice=instrument 0) 보존: 결과에서 instrument=0 파트를 seed로 치환
                    //    replaceInstruments(original, replace) → replace에 있는 악기 번호만 갈아낍니다.
                    out = mm.sequences.replaceInstruments(out, seed);
                    // :contentReference[oaicite:3]{index=3}

                    state.lastAIFull = mm.sequences.clone(out);

                    // (0=S,1=A,2=T,3=B)
                    let voices = getSelectedVoices();
                    out = filterVoices(out, voices);
                    state.lastAIFiltered = mm.sequences.clone(out);

                    // 8) 다른 플레이어 중지 & AI 플레이
                    try {
                        mainPlayer.stop();
                    } catch (_) {}
                    try {
                        previewPlayer.stop();
                    } catch (_) {}
                    try {
                        aiPlayer.stop();
                    } catch (_) {}

                    await aiPlayer.resumeContext();
                    // 오디오 컨텍스트 깨우기
                    await aiPlayer.loadSamples(out);
                    // 필요한 샘플 선로딩 → 시작 지연 최소화 :contentReference[oaicite:4]{index=4}
                    if (btn)
                        btn.textContent = '연주 중…';
                    await aiPlayer.start(out, state.tempoBPM);
                    // QPM으로 템포 전달

                } catch (err) {
                    console.error(err);
                    showToast('AI 연주에 실패했어요 😿');
                } finally {
                    if (btn) {
                        btn.disabled = false;
                        btn.textContent = '✨ AI 연주';
                    }
                    toggleVoiceToggles(false);
                }
            }

            document.getElementById('aiPlayBtn').addEventListener('click', aiPlay);

            // "중지" 버튼이 AI 연주도 멈추도록 보강
            const _origStopHandler = document.getElementById('stopBtn').onclick;
            document.getElementById('stopBtn').addEventListener('click', () => {
                try {
                    aiPlayer && aiPlayer.stop();
                } catch (_) {}
            }
            );

            // =========================
            // 시작
            // =========================
            function start() {
                // 날짜 표시
                const now = new Date();
                dateField.textContent = now.toLocaleDateString('ko-KR');

                applyConfigFromQuery();

                // 노트 패드 만들기
                buildNotePad();

                // 로컬 저장 불러오기 (없으면 초기화)
                if (!loadLocal()) {
                    state.items = [];
                    state.selectedIndex = null;
                    state.pageIndex = 0;
                    pushUndo(false);
                }

                // 템포 UI 동기화
                const tempoEl = document.getElementById('tempo');
                tempoEl.value = state.tempoBPM;
                document.getElementById('tempoLabel').textContent = state.tempoBPM;

                // 첫 렌더
                renderAll();
                // ATB 체크박스 저장/복원
                loadVoicePrefs();
                ['chkAlto', 'chkTenor', 'chkBass'].forEach(id => {
                    const el = document.getElementById(id);
                    if (el)
                        el.addEventListener('change', saveVoicePrefs);
                }
                );

                // 사용자가 처음 상호작용할 때 MIDI 초기화
                if ('requestMIDIAccess'in navigator) {
                    const trigger = () => {
                        initMIDI();
                        window.removeEventListener('pointerdown', trigger);
                        window.removeEventListener('keydown', trigger);
                    }
                    ;
                    window.addEventListener('pointerdown', trigger, {
                        once: true
                    });
                    window.addEventListener('keydown', trigger, {
                        once: true
                    });
                }
            }

            start();
        </script>
    </body>
