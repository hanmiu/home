<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>조선 왕조 퀴즈</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #3CB371;
        }

        .quiz-container {
            width: 100%;
            max-width: 42rem;
            padding: 2rem;
            position: relative;
            background-color: #3CB371;
            border: 4px solid #2E8B57;
            border-radius: 0.5rem;
        }

        .progress {
            position: absolute;
            top: 1rem;
            right: 1rem;
            color: white;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .title {
            font-size: 2rem;
            font-weight: bold;
            text-align: center;
            margin-bottom: 2rem;
            color: #FFF700;
        }

        .question-box {
            padding: 1.5rem;
            border: 4px solid #2E8B57;
            border-radius: 0.5rem;
            margin-bottom: 1.5rem;
        }

        .question {
            font-size: 1.5rem;
            font-weight: bold;
            text-align: center;
            color: white;
        }

        .answer-input {
            width: 100%;
            padding: 0.75rem;
            font-size: 1.25rem;
            text-align: center;
            border: 2px solid #2E8B57;
            border-radius: 0.375rem;
            margin-bottom: 1rem;
        }

        .info-box, .hint-box {
            padding: 1rem;
            background-color: #3CB371;
            border: 2px solid #2E8B57;
            border-radius: 0.375rem;
            margin-bottom: 1rem;
            color: white;
            text-align: center;
        }

        .feedback {
            text-align: center;
            font-weight: bold;
            color: white;
            margin-bottom: 1rem;
        }

        .check-button {
            width: 100%;
            padding: 0.75rem;
            font-size: 1.125rem;
            font-weight: bold;
            background-color: #2E8B57;
            border: 2px solid #006400;
            color: white;
            border-radius: 0.375rem;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .check-button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        @keyframes fall {
            0% { transform: translateY(-20px) rotate(0deg); }
            100% { transform: translateY(100vh) rotate(360deg); }
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        .celebration {
            position: absolute;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 10;
        }

        .confetti {
            position: absolute;
            width: 8px;
            height: 8px;
            animation: fall linear infinite;
        }

        .crown {
            font-size: 2.5rem;
            animation: bounce 1s infinite;
        }

        .crowns-container {
            position: absolute;
            top: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 1rem;
        }
    </style>
</head>

        class Quiz {
            constructor() {
                this.questions = [];
                this.currentQuestion = 0;
                this.hintCount = 0;
                this.correctCount = 0;
                this.isChecking = false;
                this.isCompleted = false;

                this.elements = {
                    question: document.getElementById('question'),
                    answerInput: document.getElementById('answer-input'),
                    checkButton: document.getElementById('check-button'),
                    infoBox: document.getElementById('info-box'),
                    hintBox: document.getElementById('hint-box'),
                    feedback: document.getElementById('feedback'),
                    progressText: document.getElementById('progress-text')
                };

                this.initializeQuiz();
                this.bindEvents();
            }

            initializeQuiz() {
                this.questions = [...allQuestions].sort(() => Math.random() - 0.5);
                this.currentQuestion = 0;
                this.hintCount = 0;
                this.correctCount = 0;
                this.isChecking = false;
                this.isCompleted = false;
                this.updateUI();
                this.removeCelebration();
            }

            bindEvents() {
                this.elements.checkButton.addEventListener('click', () => this.checkAnswer());
                this.elements.answerInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') this.checkAnswer();
                });
            }

            updateUI() {
                const currentQ = this.questions[this.currentQuestion];
                this.elements.question.textContent = currentQ.question;
                this.elements.progressText.textContent = `${this.currentQuestion + 1} / 10`;
                this.elements.infoBox.style.display = 'none';
                this.elements.hintBox.style.display = 'none';
                this.elements.feedback.textContent = '';
                this.elements.answerInput.value = '';
                this.elements.checkButton.textContent = this.isCompleted ? '처음부터 다시하기' : '정답 확인';
            }

            showCelebration() {
                const celebration = document.createElement('div');
                celebration.className = 'celebration';
                
                // Add confetti
                for (let i = 0; i < 50; i++) {
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti';
                    confetti.style.left = `${Math.random() * 100}%`;
                    confetti.style.animationDuration = `${2 + Math.random() * 2}s`;
                    confetti.style.animationDelay = `${Math.random() * 3}s`;
                    confetti.style.backgroundColor = ['#FFD700', '#FF69B4', '#00CED1', '#FFA500', '#98FB98'][Math.floor(Math.random() * 5)];
                    celebration.appendChild(confetti);
                }

                // Add crowns
                const crownsContainer = document.createElement('div');
                crownsContainer.className = 'crowns-container';
                for (let i = 0; i < 3; i++) {
                    const crown = document.createElement('span');
                    crown.className = 'crown';
                    crown.textContent = '👑';
                    crown.style.animationDelay = `${i * 0.2}s`;
                    crownsContainer.appendChild(crown);
                }
                celebration.appendChild(crownsContainer);

                document.body.appendChild(celebration);
            }

            removeCelebration() {
                const celebration = document.querySelector('.celebration');
                if (celebration) celebration.remove();
            }

            checkAnswer() {
                if (this.isChecking || this.isCompleted) {
                    if (this.isCompleted) this.initializeQuiz();
                    return;
                }

                const userAnswer = this.elements.answerInput.value.trim();
                if (!userAnswer) {
                    this.elements.feedback.textContent = '답을 입력해주세요!';
                    return;
                }

                this.isChecking = true;
                const correct = userAnswer === this.questions[this.currentQuestion].answer;

                if (correct) {
                    this.correctCount++;
                    this.elements.feedback.textContent = '정답! 당신은 조선의 왕 똑똑이!';
                    this.elements.infoBox.textContent = this.questions[this.currentQuestion].additionalInfo;
                    this.elements.infoBox.style.display = 'block';

                    if (this.correctCount === 10) {
                        this.isCompleted = true;
                        this.elements.feedback.textContent = "다 맞추다니..! 역사 마일리지를 채우러 가세요!";
                        this.showCelebration();
                        this.isChecking = false;
                    } else {
                        setTimeout(() => {
                            this.currentQuestion++;
                            this.hintCount = 0;
                            this.isChecking = false;
                            this.updateUI();
                        }, 4000);
                    }
                } else {
                    this.elements.feedback.textContent = '틀렸습니다. 다시 시도해보세요.';
                    if (this.hintCount < 3) {
                        this.hintCount++;
                        this.elements.hintBox.textContent = this.questions[this.currentQuestion].hints[this.hintCount - 1];
                        this.elements.hintBox.style.display = 'block';
                    }
                    this.isChecking = false;
                }
            }
        }

        // Initialize the quiz when the page loads
        new Quiz();
