  let meter = null;
  function renderMeter() {
    const fill = h('i'), mark = h('b'), txt = h('div', { class: 'status', style: 'margin-top:8px' });
    meter = h('div', null,
      h('div', { class: 'desc' }, '카메라 앞의 움직임 양입니다. 노란 선(아무도 없음 기준)보다 낮은 상태가 정해진 시간 이어지면 좌하단에 로고가 나타납니다. 이 화면을 보는 동안은 로고가 항상 보입니다.'),
      h('div', { class: 'meter' }, fill, mark), txt);
    const full = 0.1;
    meter._upd = (lv, idleFor) => {
      fill.style.width = Math.min(100, lv / full * 100) + '%';
      mark.style.left = Math.min(100, Settings.s.logo.idleLevel / full * 100) + '%';
      const still = lv <= Settings.s.logo.idleLevel;
      txt.textContent = `움직임 ${(lv * 100).toFixed(1)}% · ` + (still ? `조용함 ${idleFor.toFixed(0)}초째` : '움직임 있음');
    };
    meter._upd(Engine.motionLevel, 0);
    return meter;
  }
  let ppBox = null;
  function renderPrintBox() {
    ppBox = h('div', { class: 'pp' });
    const cap = h('div', { class: 'pp-cap' });
    return h('div', null,
      h('div', { class: 'grp' }, '미리보기 · A4 가로'),
      h('div', { class: 'p-row', style: 'margin-top:10px' }, cap, h('div', { class: 'sp' }), h('button', { class: 'btn primary', onclick: () => Print.print() }, '인쇄하기')),
      h('div', { class: 'ctl-help' }, '인쇄 창에서 용지 A4 · 가로 · 배율 100% · 여백 없음으로 맞추세요. 켜진 작품만 목록 순서대로 들어갑니다. 바코드 리더로 실제로 찍어 확인해 보세요.'),
      ppBox, (renderPrintBox.cap = cap, null));
  }
  function renderPrintPreview() {
    if (!ppBox || !ppBox.isConnected) return;
    const pages = Print.build();
    const n = Print.items().length;
    renderPrintBox.cap.textContent = `작품 ${n}개 · ${pages.length}장 · 한 장에 ${Settings.s.print.cols * Settings.s.print.rows}개 · QR ${Print.qrSize()}mm`;
    const W = ppBox.clientWidth || 400, mm = 96 / 25.4, scale = W / (297 * mm);
    ppBox.replaceChildren(...pages.map(sh => { sh.style.transform = `scale(${scale})`; return h('div', { class: 'pp-page', style: `width:${W}px;height:${210 * mm * scale}px` }, sh); }));
  }

  function renderBackup() {
    const ta = h('textarea', { class: 'txt', spellcheck: false, style: 'min-height:260px;font:12px var(--mono)' });
    ta.value = Settings.exportJSON();
    const msg = h('div', { class: 'status' });
    const applyAll = () => { App.reloadSettings(); render(); };
    return h('div', null,
      h('div', { class: 'desc' }, '설정은 이 브라우저에 자동 저장됩니다. 서버에 fluxcam.settings.json 파일을 함께 올려두면, 저장된 설정이 없는 새 브라우저에서 그 파일을 기본값으로 불러옵니다.'),
      h('div', { class: 'p-row', style: 'margin:14px 0 10px;gap:8px;flex-wrap:wrap' },
        h('button', { class: 'btn small', onclick: () => { const a = h('a', { href: URL.createObjectURL(new Blob([Settings.exportJSON()], { type: 'application/json' })), download: 'fluxcam.settings.json' }); a.click(); } }, '파일로 내보내기'),
        h('button', { class: 'btn small', onclick: () => { const i = h('input', { type: 'file', accept: '.json,application/json' }); i.onchange = () => { const r = new FileReader(); r.onload = () => { ta.value = r.result; }; r.readAsText(i.files[0]); }; i.click(); } }, '파일 불러오기'),
        h('div', { class: 'sp' }),
        h('button', { class: 'btn small', onclick: () => { if (confirmReset()) { Settings.resetAll(); applyAll(); } } }, '전체 초기화')),
      ta,
      h('div', { class: 'p-row', style: 'margin-top:10px' }, msg, h('div', { class: 'sp' }), h('button', { class: 'btn primary small', onclick: () => {
        try { Settings.importJSON(ta.value); applyAll(); } catch (e) { msg.style.color = 'var(--bad)'; msg.textContent = 'JSON 형식 오류: ' + e.message; }
      } }, '이 내용 적용')));
  }
  let resetArm = 0;
  function confirmReset() { const t = now(); if (t - resetArm < 3000) return true; resetArm = t; App.flash('한 번 더 누르면 모든 설정이 초기화됩니다.'); return false; }

  // ---------------- header / footer ----------------
  function syncSectionSelect() {
    const s = Settings.s;
    selSection.replaceChildren(
      h('option', { value: 'work' }, '◆ 현재 작품 · ' + WorkById(s.current).ko + ' 설정'),
      h('optgroup', { label: '전체 설정' }, ...GLOBAL.map(g => h('option', { value: g.id }, g.title))));
    selSection.value = section;
  }
  function syncWorkSelect() {
    const s = Settings.s;
    selWork.replaceChildren(...s.works.order.map(id => h('option', { value: id }, WorkById(id).ko + ' · ' + WorkById(id).title + (s.works.enabled[id] ? '' : '  · 꺼짐'))));
    selWork.value = s.current;
    syncSectionSelect();
    $('#tagWork').textContent = WorkById(s.current).ko + ' · ' + WorkById(s.current).title;
  }
  selWork.addEventListener('change', () => { App.setWork(selWork.value, 'ui'); selWork.blur(); });
  selSection.addEventListener('change', () => { go(selSection.value); selSection.blur(); });
  function go(id) {
    if (id.startsWith('work:')) { if (Settings.s.current !== id.slice(5)) App.setWork(id.slice(5), 'ui'); id = 'work'; }
    if (id !== 'work') lastGlobal = id;
    section = id;
    selSection.value = id;
    render();
  }
  $('#btnWorkSet').addEventListener('click', () => go('work'));

  let flashMsg = '', flashT = 0;
  function tickStatus() {
    const E = Engine, cam = Camera, H = E.hist;
    const parts = [];
    if (cam.state === 'running' && cam.actual) parts.push(h('span', { class: 'ok' }, `● ${cam.actual.w}×${cam.actual.h} ${cam.fps ? cam.fps.toFixed(0) : '–'}fps`));
    else parts.push(h('span', { class: 'bad' }, '● 카메라 ' + (cam.state === 'starting' ? '연결 중' : '없음')));
    parts.push(h('span', null, `렌더 ${E.renderW}×${E.renderH} ${E.stats.fps.toFixed(0)}fps`));
    if (H) parts.push(h('span', null, `버퍼 ${H.seconds.toFixed(1)}초 ${H.w}×${H.h} ${H.mb.toFixed(0)}MB`));
    if (now() - flashT < 3500) parts.push(h('span', { style: 'color:var(--warn)' }, flashMsg));
    foot.replaceChildren(...parts);
    if (statusEl) {
      const sec = secById(section);
      if (sec.work && sec.work.status) statusEl.textContent = sec.work.status(Settings.s.params[sec.work.id]);
      else if (sec.id === 'camera') statusEl.textContent = cam.state === 'running' ? `${cam.actual?.label || '카메라'} · ${cam.actual?.w}×${cam.actual?.h}` + (cam.msg ? ' · ' + cam.msg : '') : cam.msg;
      else if (sec.id === 'history' && H) statusEl.textContent = `${H.layers}장 × ${H.w}×${H.h} = 약 ${H.mb.toFixed(0)}MB (그래픽 메모리)`;
    }
    $('#tagSize').textContent = `${E.renderW}×${E.renderH}`;
  }
  setInterval(() => { if (app.classList.contains('edit')) tickStatus(); }, 500);

  // ---------------- open / close ----------------
  function open() { app.classList.add('edit'); app.classList.remove('show'); document.body.classList.remove('cursor-hidden'); syncWorkSelect(); render(); Engine.relayout(); }
  function close() { app.classList.remove('edit'); app.classList.add('show'); document.activeElement && document.activeElement.blur && document.activeElement.blur(); Engine.relayout(); App.kickCursor(); }
  function toggle() { app.classList.contains('edit') ? close() : open(); }
  $('#btnClose').addEventListener('click', close);
  $('#gear').addEventListener('click', open);
  $('#stageWrap').addEventListener('dblclick', toggle);
  $('#btnFs').addEventListener('click', () => { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen().catch(() => {}); });
  document.addEventListener('fullscreenchange', () => { $('#btnFs').textContent = document.fullscreenElement ? '전체화면 해제' : '전체화면'; Engine.relayout(); });
  document.addEventListener('keydown', e => {
    if (e.code === 'Backquote' && !e.ctrlKey && !e.metaKey && !e.altKey) {
      const t = e.target;
      if (t && (t.tagName === 'TEXTAREA' || (t.tagName === 'INPUT' && t.type === 'text'))) return;
      e.preventDefault(); toggle();
    }
  });
  window.addEventListener('resize', () => { if (section === 'print') renderPrintPreview(); });

  return {
    open, close, render, syncWorkSelect, refreshAll, tickStatus,
    get isOpen() { return app.classList.contains('edit'); },
    get section() { return section; },
    onMotion(level, idleFor) { if (meter && meter.isConnected) meter._upd(level, idleFor); },
    onWorkChanged() {
      syncWorkSelect();
      if (section === 'work') render();
      else if (section === 'works') refreshAll();
    },
    onScan() { App._scanLogDraw && section === 'scanner' && App._scanLogDraw(); },
    onHistory() { if (section === 'work' || section === 'history') render(); },
    flash(m) { flashMsg = m; flashT = now(); tickStatus(); },
  };
})();

// ============================================================
// boot
// ============================================================
(() => {
  const app = $('#app'), notice = $('#notice');
  let lastSwitch = now(), cursorT = 0;

  App.setWork = (id, src) => {
    id = resolveId(id) || WORKS[0].id;
    const s = Settings.s;
    s.current = id; Settings.save();
    Engine.setWork(WorkById(id), s.params[id]);
    lastSwitch = now();
    UI.onWorkChanged();
  };
  App.onCamera = () => {
    const c = Camera;
    const show = c.state !== 'running' ? c.msg : '';
    notice.textContent = show; notice.classList.toggle('on', !!show);
    if (UI.isOpen) UI.tickStatus();
  };
  App.onDevices = () => { if (UI.isOpen) UI.refreshAll(); };
  App.onScan = () => UI.onScan();
  App.flash = m => UI.flash(m);
  App.reloadSettings = () => {
    Engine.allocHistory();
    Engine.relayout();
    Camera.restart();
    App.setWork(Settings.s.current);
  };
  Engine.onHistory = () => UI.onHistory();

  // cursor: hide after idle in fullscreen (panel open or not) and whenever only the work is showing
  App.kickCursor = () => {
    document.body.classList.remove('cursor-hidden');
    clearTimeout(cursorT);
    cursorT = setTimeout(() => {
      if (document.fullscreenElement || app.classList.contains('show')) document.body.classList.add('cursor-hidden');
    }, Settings.s.output.cursorHideMs);
  };
  window.addEventListener('mousemove', App.kickCursor);
  window.addEventListener('mousedown', App.kickCursor);
  window.addEventListener('wheel', App.kickCursor, { passive: true });
  document.addEventListener('fullscreenchange', App.kickCursor);

  // logo: shown at load, then whenever the camera has been still for a while
  const logo = $('#logo'), bootT = now();
  let lastActive = now(), stageH = 0;
  logo.append(logoSVG(1));
  App.isIdle = () => now() - lastActive > Settings.s.logo.idleSec * 1000;
  App.updateLogo = () => {
    const L = Settings.s.logo;
    logo.replaceChildren(logoSVG(L.weight));
    logo.style.color = L.color;
    logo.style.height = (stageH * L.height) + 'px';
    logo.style.left = logo.style.bottom = (stageH * L.margin) + 'px';
    logo.style.transitionDuration = L.fadeSec + 's';
    tickLogo();
  };
  function tickLogo() {
    const L = Settings.s.logo, t = now();
    const preview = UI.isOpen && UI.section === 'logo';
    const vis = L.show && (preview || t - bootT < L.bootSec * 1000 || App.isIdle());
    logo.style.opacity = vis ? L.opacity : 0;
  }
  Engine.onLayout = (w, hh) => { stageH = hh; App.updateLogo(); };
  Engine.onMotion = level => {
    const running = Camera.state === 'running';
    if (running && level > Settings.s.logo.idleLevel) lastActive = now();
    UI.onMotion(running ? level : 0, (now() - lastActive) / 1000);
  };
  setInterval(tickLogo, 200);

  // keep the screen awake
  let wake = null;
  async function keepAwake() { try { if (navigator.wakeLock && !wake && document.visibilityState === 'visible') { wake = await navigator.wakeLock.request('screen'); wake.addEventListener('release', () => { wake = null; }); } } catch {} }
  document.addEventListener('visibilitychange', keepAwake);
  window.addEventListener('pointerdown', keepAwake);

  function loop() {
    requestAnimationFrame(loop);
    const [video, fresh] = Camera.poll();
    try { Engine.frame(video, fresh); } catch (e) { console.error(e); }
    // idle cycling through enabled works
    const m = Settings.s.output.idleCycleMin;
    if (m > 0 && now() - lastSwitch > m * 60000 && (!Settings.s.output.idleCycleStill || App.isIdle())) {
      const s = Settings.s, on = s.works.order.filter(id => s.works.enabled[id]);
      if (on.length) App.setWork(on[(on.indexOf(s.current) + 1) % on.length], 'idle');
      else lastSwitch = now();
    }
  }

  async function boot() {
    Settings.load();
    if (!Settings.hasStored()) {
      try {
        const r = await fetch('fluxcam.settings.json', { cache: 'no-store' });
        if (r.ok) { Settings.load(await r.json()); Settings.save(); }
      } catch {}
    }
    Engine.init();
    App.setWork(Settings.s.current, 'boot');
    App.kickCursor();
    keepAwake();
    loop();
    await Camera.start();
    await Camera.refreshDevices();
    if (new URLSearchParams(location.search).has('settings')) UI.open();
  }
  window.FluxCam = { App, Settings, Engine, Camera, Scanner, Print, UI, Code, WORKS };
  boot();
})();

})();
</script>
</body>
</html>
