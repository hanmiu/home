<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>한미 극장 + MIDI</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: sans-serif;
            background-color: #222;
            color: #eee;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        header {
            padding: 10px;
            background-color: #333;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 10;
            position: relative;
        }
        .header-row {
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }
        header label {
            margin-right: 5px;
            display: inline-flex;
            align-items: center;
            cursor: pointer;
        }
        button, select, input {
            padding: 5px 10px;
            cursor: pointer;
            background-color: #555;
            color: #eee;
            border: 1px solid #777;
            border-radius: 3px;
        }
        button:hover:not(:disabled), select:hover, input:hover {
            background-color: #666;
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        input[type="checkbox"] {
            width: 16px;
            height: 16px;
            margin-right: 5px;
            cursor: pointer;
        }
        input[type="text"] {
            width: 300px;
            font-family: monospace;
        }
        input[type="range"] {
            width: 200px;
        }
        #container {
            flex-grow: 1;
            position: relative;
            min-height: 0;
            background-color: #000;
        }
        #webgl {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
        }
        #background-video {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            height: 100%;
            width: auto;
            z-index: 1;
            display: none;
        }
        #background-image {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            height: 100%;
            width: auto;
            z-index: 1;
            display: none;
            object-fit: contain;
        }
        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 3;
            pointer-events: none;
            overflow: visible;
        }
        #overlay polygon {
            fill: none;
            stroke: rgba(255, 0, 0, 0.7);
            stroke-width: 2;
            vector-effect: non-scaling-stroke;
        }
        #overlay circle {
            fill: rgba(255, 0, 0, 0.8);
            stroke: rgba(255, 255, 255, 0.9);
            stroke-width: 1;
            cursor: grab;
            pointer-events: all;
            vector-effect: non-scaling-stroke;
        }
        #overlay circle:active {
            cursor: grabbing;
            fill: rgba(255, 100, 100, 0.9);
        }
        #midi-effects {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 4;
            pointer-events: none;
            overflow: visible;
        }
        #webcam-video {
            position: absolute;
            top: 0px;
            left: 0px;
            width: 10px;
            height: 10px;
            opacity: 0;
            pointer-events: none;
            z-index: -1;
        }
        .hidden {
            display: none !important;
        }
        #drop-zone {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 100;
            background-color: rgba(0, 0, 0, 0.8);
            display: none;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            color: #fff;
            pointer-events: none;
        }
        #drop-zone.active {
            display: flex;
        }
        #time-display {
            margin: 0 10px;
            font-family: monospace;
            min-width: 100px;
        }
        #media-type-display {
            margin: 0 10px;
            font-family: monospace;
            color: #aaa;
            font-size: 12px;
        }
        #midi-status {
            font-size: 12px;
            color: #aaa;
            margin-left: 10px;
        }
        #midi-status.active {
            color: #2ecc71;
        }
        
        /* MIDI Effects Animations */
        .midi-effect {
            animation: midiPop 1.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
            transform-origin: center;
        }
        @keyframes midiPop {
            0% {
                transform: scale(0) rotate(0deg);
                opacity: 0;
            }
            20% {
                transform: scale(1.3) rotate(var(--rotate));
                opacity: 1;
            }
            40% {
                transform: scale(1) rotate(var(--rotate));
                opacity: 1;
            }
            80% {
                transform: scale(1) rotate(var(--rotate));
                opacity: 1;
            }
            100% {
                transform: scale(0.8) rotate(var(--rotate));
                opacity: 0;
            }
        }

        /* Fullscreen specific styles */
        body:fullscreen header {
            display: none;
        }
        body:-webkit-full-screen header {
            display: none;
        }
        body:-moz-full-screen header {
            display: none;
        }
        body:-ms-fullscreen header {
            display: none;
        }

        /* Loading indicator */
        .loading-indicator {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.8);
            padding: 20px 40px;
            border-radius: 8px;
            font-size: 14px;
            z-index: 1000;
            display: none;
        }
        .loading-indicator.show {
            display: block;
        }
    </style>
</head>
<body>

<header>
    <div class="header-row">

        <label for="flip-x">

<script type="module">
    import * as THREE from 'three';

    // --- Constants & Variables ---
    const GRID_SIZE = 10;
    const INITIAL_PADDING = 0.05;
    const CONTROL_POINT_RADIUS = 8;

    let scene, camera, renderer;
    let videoElement, videoTexture, videoDimensions = { width: 640, height: 480 };
    let planeGeometry, planeMaterial, planeMesh;
    let backgroundPlaneGeometry, backgroundPlaneMaterial, backgroundPlaneMesh;
    let svgOverlay, svgPolygon, svgCircles = [];
    let container;

    let currentResolution = { width: 0, height: 0 };
    let availableResolutions = [
        { width: 640, height: 480 },
        { width: 1280, height: 720 },
        { width: 1920, height: 1080 },
    ];
    let currentStream = null;
    let currentVideoTrack = null;

    let isDragging = false;
    let draggedControlPointIndex = -1;
    let mode = 'calibration';
    let targetAspectRatio = 16 / 9;
    let sourcePointsUV = [
        new THREE.Vector2(INITIAL_PADDING, 1 - INITIAL_PADDING),
        new THREE.Vector2(1 - INITIAL_PADDING, 1 - INITIAL_PADDING),
        new THREE.Vector2(1 - INITIAL_PADDING, INITIAL_PADDING),
        new THREE.Vector2(INITIAL_PADDING, INITIAL_PADDING)
    ];
    let isFlippedX = false;
    let isFlippedY = false;

    // Background media variables
    let backgroundVideoElement;
    let backgroundImageElement;
    let mediaFileURL = null;
    let isMediaVisible = false;
    let currentMediaType = null;
    let currentBlendMode = 'multiply';

    // MIDI variables
    let midiEffectsSvg;
    let midiInput = null;
    let toneSampler = null;
    let toneEnabled = true;
    let midiEnabled = false;
    let WebMidi = null;

    // PC Keyboard MIDI simulation
    let pcKeyboard = {
        octave: 4,
        velocity: 100,
        pressed: new Set()
    };

    // --- DOM Elements ---
    const modeToggleButton = document.getElementById('mode-toggle');
    const flipXCheckbox = document.getElementById('flip-x');
    const flipYCheckbox = document.getElementById('flip-y');
    const resolutionSelect = document.getElementById('resolution-select');
    const aspectRatioControl = document.getElementById('aspect-ratio-control');
    const aspectRatioWInput = document.getElementById('aspect-ratio-w');
    const aspectRatioHInput = document.getElementById('aspect-ratio-h');
    const fullscreenButton = document.getElementById('fullscreen');
    const canvasElement = document.getElementById('webgl');
    const webcamFilterInput = document.getElementById('webcam-filter');
    const videoFilterInput = document.getElementById('video-filter');
    const blendModeControl = document.getElementById('blend-mode-control');
    const blendModeSelect = document.getElementById('blend-mode-select');
    const videoControls = document.getElementById('video-controls');
    const loadRecentVideoButton = document.getElementById('load-recent-video');
    const toggleVideoButton = document.getElementById('toggle-video');
    const playPauseButton = document.getElementById('play-pause');
    const videoSeekSlider = document.getElementById('video-seek');
    const timeDisplay = document.getElementById('time-display');
    const videoLoopCheckbox = document.getElementById('video-loop');
    const videoOnlyControls = document.getElementById('video-only-controls');
    const mediaTypeDisplay = document.getElementById('media-type-display');
    const dropZone = document.getElementById('drop-zone');
    const midiInputSelect = document.getElementById('midi-input');
    const toneEnabledCheckbox = document.getElementById('tone-enabled');
    const midiStatus = document.getElementById('midi-status');
    const loadingIndicator = document.getElementById('loading');
    
    container = document.getElementById('container');
    videoElement = document.getElementById('webcam-video');
    backgroundVideoElement = document.getElementById('background-video');
    backgroundImageElement = document.getElementById('background-image');
    svgOverlay = document.getElementById('overlay');
    svgPolygon = document.getElementById('outline-polygon');
    midiEffectsSvg = document.getElementById('midi-effects');

    // --- LocalStorage Keys ---
    const STORAGE_KEYS = {
        calibration: 'webcam-unwarp-calibration-points',
        videoSettings: 'webcam-unwarp-video-settings',
        webcamFilter: 'webcam-unwarp-webcam-filter',
        videoFilter: 'webcam-unwarp-video-filter',
        blendMode: 'webcam-unwarp-blend-mode',
        midiDevice: 'theater-midi-device',
        toneEnabled: 'theater-tone-enabled'
    };

    // --- Utility Functions ---
    function gcd(a, b) {
        if (!b) {
            return a;
        }
        return gcd(b, a % b);
    }

    function formatTime(seconds) {
        const minutes = Math.floor(seconds / 60);
        const secs = Math.floor(seconds % 60);
        return `${minutes}:${secs.toString().padStart(2, '0')}`;
    }

    function updateMediaTypeDisplay() {
        if (currentMediaType === 'video') {
            mediaTypeDisplay.textContent = '[비디오]';
        } else if (currentMediaType === 'image') {
            mediaTypeDisplay.textContent = '[이미지]';
        } else {
            mediaTypeDisplay.textContent = '';
        }
    }

    function updateVideoOnlyControls() {
        if (currentMediaType === 'video') {
            videoOnlyControls.classList.remove('hidden');
        } else {
            videoOnlyControls.classList.add('hidden');
        }
    }

    function applyBlendMode() {
        if (isMediaVisible && currentMediaType) {
            canvasElement.style.mixBlendMode = currentBlendMode;
        } else {
            canvasElement.style.mixBlendMode = 'normal';
        }
    }

    function updateBackgroundImageSize() {
        if (!backgroundImageElement || currentMediaType !== 'image') return;
        
        const containerWidth = container.clientWidth;
        const containerHeight = container.clientHeight;
        
        backgroundImageElement.style.height = '100%';
        backgroundImageElement.style.width = 'auto';
        backgroundImageElement.style.objectFit = 'contain';
        backgroundImageElement.style.objectPosition = 'center';
    }

    // --- LocalStorage Functions ---
    function saveCalibrationPoints() {
        const points = sourcePointsUV.map(p => ({ x: p.x, y: p.y }));
        localStorage.setItem(STORAGE_KEYS.calibration, JSON.stringify(points));
    }

    function loadCalibrationPoints() {
        const saved = localStorage.getItem(STORAGE_KEYS.calibration);
        if (saved) {
            try {
                const points = JSON.parse(saved);
                if (Array.isArray(points) && points.length === 4) {
                    sourcePointsUV = points.map(p => new THREE.Vector2(p.x, p.y));
                    console.log('Loaded calibration points from localStorage');
                }
            } catch (e) {
                console.error('Failed to load calibration points:', e);
            }
        }
    }

    function saveMediaSettings() {
        const settings = {
            url: mediaFileURL,
            currentTime: backgroundVideoElement.currentTime,
            loop: backgroundVideoElement.loop,
            isVisible: isMediaVisible,
            mediaType: currentMediaType
        };
        localStorage.setItem(STORAGE_KEYS.videoSettings, JSON.stringify(settings));
    }

    function loadMediaSettings() {
        const saved = localStorage.getItem(STORAGE_KEYS.videoSettings);
        if (saved) {
            try {
                const settings = JSON.parse(saved);
                if (settings.url) {
                    fetch(settings.url, { method: 'HEAD' })
                        .then(() => {
                            mediaFileURL = settings.url;
                            loadRecentVideoButton.disabled = false;
                            return settings;
                        })
                        .catch(() => {
                            localStorage.removeItem(STORAGE_KEYS.videoSettings);
                            loadRecentVideoButton.disabled = true;
                        });
                }
            } catch (e) {
                console.error('Failed to load media settings:', e);
            }
        }
    }

    function saveFilters() {
        localStorage.setItem(STORAGE_KEYS.webcamFilter, webcamFilterInput.value);
        localStorage.setItem(STORAGE_KEYS.videoFilter, videoFilterInput.value);
        localStorage.setItem(STORAGE_KEYS.blendMode, currentBlendMode);
    }

    function loadFilters() {
        const webcamFilter = localStorage.getItem(STORAGE_KEYS.webcamFilter);
        const videoFilter = localStorage.getItem(STORAGE_KEYS.videoFilter);
        const blendMode = localStorage.getItem(STORAGE_KEYS.blendMode);
        
        if (webcamFilter) {
            webcamFilterInput.value = webcamFilter;
            canvasElement.style.filter = webcamFilter;
        }
        
        if (videoFilter) {
            videoFilterInput.value = videoFilter;
            backgroundVideoElement.style.filter = videoFilter;
            backgroundImageElement.style.filter = videoFilter;
        }
        
        if (blendMode) {
            currentBlendMode = blendMode;
            blendModeSelect.value = blendMode;
            applyBlendMode();
        }
    }

    function saveMidiSettings() {
        if (midiInput) {
            localStorage.setItem(STORAGE_KEYS.midiDevice, midiInput.id);
        }
        localStorage.setItem(STORAGE_KEYS.toneEnabled, toneEnabled.toString());
    }

    function loadMidiSettings() {
        const savedDevice = localStorage.getItem(STORAGE_KEYS.midiDevice);
        const savedTone = localStorage.getItem(STORAGE_KEYS.toneEnabled);
        
        if (savedTone !== null) {
            toneEnabled = savedTone === 'true';
            toneEnabledCheckbox.checked = toneEnabled;
        }
        
        return savedDevice;
    }

    // --- MIDI Visual Patterns ---
    // Launchpad 색상 매핑: MIDI note → HSL 색상
    function getMidiColor(midiNote, isLaunchpad = false) {
        if (isLaunchpad) {
            // Launchpad: MIDI note를 hue로 매핑 (0-127 → 0-360)
            const hue = (midiNote * 2.835) % 360; // 360/127 ≈ 2.835
            return `hsl(${hue}, 80%, 60%)`;
        } else {
            // 일반 키보드: 기존 패턴 색상 사용
            const patterns = [
                '#e74c3c', '#e67e22', '#f39c12', '#f1c40f', '#2ecc71',
                '#16a085', '#3498db', '#2980b9', '#9b59b6', '#8e44ad',
                '#e91e63', '#ff5722', '#ff9800', '#ffc107', '#cddc39',
                '#8bc34a', '#4caf50', '#009688', '#00bcd4', '#03a9f4',
                '#2196f3', '#3f51b5', '#673ab7', '#9c27b0', '#e91e63'
            ];
            return patterns[midiNote % patterns.length];
        }
    }

    function getMidiVisualPattern(midiNote, velocity) {
        // 드럼/패드 범위 감지 (일반적인 드럼 노트: 35-81)
        const isDrum = (midiNote >= 35 && midiNote <= 81) && (midiNote < 60 || midiNote > 71);
        const isLaunchpad = midiNote >= 0 && midiNote <= 127 && !isDrum;
        
        // 크기: velocity 기반 (0.8-1.5배)
        const velocityScale = 0.8 + (velocity / 127) * 0.7;
        
        // 기본 크기를 1.5-2배 증가
        const baseScale = 1.75;
        const finalScale = baseScale * velocityScale;
        
        const color = getMidiColor(midiNote, isLaunchpad);
        
        // 패턴 타입 결정
        const patternTypes = ['circle', 'square', 'star', 'hexagon', 'triangle', 'burst', 'ring', 'polygon'];
        const typeIndex = midiNote % patternTypes.length;
        const type = patternTypes[typeIndex];
        
        // 드럼은 더 강렬한 효과
        if (isDrum) {
            const drumPatterns = [
                { type: 'burst', rays: 12, radius: 60 * finalScale },
                { type: 'ring', radius: 55 * finalScale, thickness: 10 },
                { type: 'polygon', sides: 8, radius: 50 * finalScale },
                { type: 'burst', rays: 16, radius: 65 * finalScale },
                { type: 'ring', radius: 60 * finalScale, thickness: 12 },
                { type: 'polygon', sides: 6, radius: 55 * finalScale },
                { type: 'burst', rays: 20, radius: 58 * finalScale },
                { type: 'ring', radius: 52 * finalScale, thickness: 8 }
            ];
            const pattern = drumPatterns[midiNote % drumPatterns.length];
            pattern.color = color;
            return pattern;
        }
        
        // 일반 키보드/Launchpad
        switch (type) {
            case 'circle':
                return { type: 'circle', color, radius: 45 * finalScale };
            case 'square':
                return { type: 'square', color, size: 75 * finalScale };
            case 'star':
                return { type: 'star', color, points: 5 + (midiNote % 4), radius: 50 * finalScale };
            case 'hexagon':
                return { type: 'hexagon', color, radius: 45 * finalScale };
            case 'triangle':
                return { type: 'triangle', color, size: 75 * finalScale };
            case 'burst':
                return { type: 'burst', color, rays: 8 + (midiNote % 8), radius: 55 * finalScale };
            case 'ring':
                return { type: 'ring', color, radius: 50 * finalScale, thickness: 8 };
            case 'polygon':
                return { type: 'polygon', color, sides: 5 + (midiNote % 4), radius: 48 * finalScale };
            default:
                return { type: 'circle', color, radius: 45 * finalScale };
        }
    }

    function getRandomPosition() {
        const width = container.clientWidth;
        const height = container.clientHeight;
        
        // 50% 완전 무작위, 50% 중앙 집중
        if (Math.random() < 0.5) {
            // 완전 무작위
            return {
                x: Math.random() * width,
                y: Math.random() * height
            };
        } else {
            // 중앙 집중 (가우시안 분포)
            const centerX = width / 2;
            const centerY = height / 2;
            const spreadX = width * 0.3;
            const spreadY = height * 0.3;
            
            // Box-Muller 변환으로 정규분포 생성
            const u1 = Math.random();
            const u2 = Math.random();
            const z0 = Math.sqrt(-2 * Math.log(u1)) * Math.cos(2 * Math.PI * u2);
            const z1 = Math.sqrt(-2 * Math.log(u1)) * Math.sin(2 * Math.PI * u2);
            
            return {
                x: Math.max(0, Math.min(width, centerX + z0 * spreadX * 0.5)),
                y: Math.max(0, Math.min(height, centerY + z1 * spreadY * 0.5))
            };
        }
    }

    function createMidiEffect(pattern, x, y, velocity) {
        const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
        g.classList.add('midi-effect');
        
        // 무작위 회전
        const randomRotate = (Math.random() - 0.5) * 90;
        g.style.setProperty('--rotate', `${randomRotate}deg`);
        
        let element;
        
        switch (pattern.type) {
            case 'circle': {
                element = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                element.setAttribute('cx', x);
                element.setAttribute('cy', y);
                element.setAttribute('r', pattern.radius);
                element.setAttribute('fill', pattern.color);
                element.setAttribute('stroke', pattern.color);
                element.setAttribute('stroke-width', '2');
                break;
            }
            case 'square': {
                element = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
                element.setAttribute('x', x - pattern.size / 2);
                element.setAttribute('y', y - pattern.size / 2);
                element.setAttribute('width', pattern.size);
                element.setAttribute('height', pattern.size);
                element.setAttribute('fill', pattern.color);
                element.setAttribute('stroke', pattern.color);
                element.setAttribute('stroke-width', '2');
                break;
            }
            case 'star': {
                element = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                element.setAttribute('d', createStarPath(x, y, pattern.points, pattern.radius));
                element.setAttribute('fill', pattern.color);
                element.setAttribute('stroke', pattern.color);
                element.setAttribute('stroke-width', '2');
                break;
            }
            case 'hexagon':
            case 'triangle':
            case 'polygon': {
                element = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                const sides = pattern.type === 'hexagon' ? 6 : pattern.type === 'triangle' ? 3 : pattern.sides;
                const radius = pattern.radius || pattern.size / 2;
                element.setAttribute('d', createPolygonPath(x, y, sides, radius));
                element.setAttribute('fill', pattern.color);
                element.setAttribute('stroke', pattern.color);
                element.setAttribute('stroke-width', '2');
                break;
            }
            case 'burst': {
                element = document.createElementNS('http://www.w3.org/2000/svg', 'g');
                for (let i = 0; i < pattern.rays; i++) {
                    const angle = (i / pattern.rays) * Math.PI * 2;
                    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                    line.setAttribute('x1', x);
                    line.setAttribute('y1', y);
                    line.setAttribute('x2', x + Math.cos(angle) * pattern.radius);
                    line.setAttribute('y2', y + Math.sin(angle) * pattern.radius);
                    line.setAttribute('stroke', pattern.color);
                    line.setAttribute('stroke-width', '4');
                    line.setAttribute('stroke-linecap', 'round');
                    element.appendChild(line);
                }
                break;
            }
            case 'ring': {
                element = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                element.setAttribute('cx', x);
                element.setAttribute('cy', y);
                element.setAttribute('r', pattern.radius);
                element.setAttribute('fill', 'none');
                element.setAttribute('stroke', pattern.color);
                element.setAttribute('stroke-width', pattern.thickness);
                break;
            }
        }
        
        // 발광 효과
        element.style.filter = `drop-shadow(0 0 10px ${pattern.color})`;
        
        g.appendChild(element);
        return g;
    }

    function createStarPath(cx, cy, points, radius) {
        const innerRadius = radius * 0.4;
        let path = '';
        for (let i = 0; i < points * 2; i++) {
            const angle = (i * Math.PI) / points - Math.PI / 2;
            const r = i % 2 === 0 ? radius : innerRadius;
            const x = cx + r * Math.cos(angle);
            const y = cy + r * Math.sin(angle);
            path += (i === 0 ? 'M' : 'L') + x + ',' + y;
        }
        return path + 'Z';
    }

    function createPolygonPath(cx, cy, sides, radius) {
        let path = '';
        for (let i = 0; i < sides; i++) {
            const angle = (i * 2 * Math.PI) / sides - Math.PI / 2;
            const x = cx + radius * Math.cos(angle);
            const y = cy + radius * Math.sin(angle);
            path += (i === 0 ? 'M' : 'L') + x + ',' + y;
        }
        return path + 'Z';
    }

    // --- MIDI Handlers ---
    function handleMidiNote(midiNote, velocity) {
        // Unwarped 모드에서만 작동
        if (mode !== 'unwarped') return;
        if (!midiEnabled) return;
        
        console.log(`MIDI Note: ${midiNote}, Velocity: ${velocity}`);
        
        // 시각 효과 생성
        const pos = getRandomPosition();
        const pattern = getMidiVisualPattern(midiNote, velocity);
        const effect = createMidiEffect(pattern, pos.x, pos.y, velocity);
        
        midiEffectsSvg.appendChild(effect);
        
        // 1.5초 후 제거
        setTimeout(() => {
            if (effect.parentNode) {
                effect.remove();
            }
        }, 1500);
        
        // Tone.js 재생
        if (toneEnabled && toneSampler && Tone.context.state === 'running') {
            const noteNames = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
            const octave = Math.floor(midiNote / 12) - 1;
            const noteName = noteNames[midiNote % 12] + octave;
            
            try {
                toneSampler.triggerAttackRelease(noteName, '8n', undefined, velocity / 127);
            } catch (e) {
                console.error('Tone.js playback error:', e);
            }
        }
    }

    // --- PC Keyboard MIDI Simulation ---
    const PC_PIANO = {
        KeyA: 60, KeyW: 61, KeyS: 62, KeyE: 63, KeyD: 64, KeyF: 65,
        KeyT: 66, KeyG: 67, KeyY: 68, KeyH: 69, KeyU: 70, KeyJ: 71,
        KeyK: 72, KeyO: 73, KeyL: 74, KeyP: 75, Semicolon: 76, Quote: 77
    };
    const PC_DRUMS = {
        Digit1: 36, Digit2: 37, Digit3: 38, Digit4: 39,
        Digit5: 40, Digit6: 41, Digit7: 42, Digit8: 43
    };

    function isTypingTarget(el) {
        return ['INPUT', 'SELECT', 'TEXTAREA'].includes(el.tagName);
    }

    window.addEventListener('keydown', (e) => {
        if (isTypingTarget(e.target)) return;
        if (e.repeat) return;
        
        // 옥타브 조정
        if (e.code === 'KeyZ') {
            pcKeyboard.octave = Math.max(1, pcKeyboard.octave - 1);
            console.log('PC Octave:', pcKeyboard.octave);
            e.preventDefault();
            return;
        }
        if (e.code === 'KeyX') {
            pcKeyboard.octave = Math.min(7, pcKeyboard.octave + 1);
            console.log('PC Octave:', pcKeyboard.octave);
            e.preventDefault();
            return;
        }
        
        // 벨로시티 조정
        if (e.code === 'Minus') {
            pcKeyboard.velocity = Math.max(1, pcKeyboard.velocity - 8);
            console.log('PC Velocity:', pcKeyboard.velocity);
            e.preventDefault();
            return;
        }
        if (e.code === 'Equal') {
            pcKeyboard.velocity = Math.min(127, pcKeyboard.velocity + 8);
            console.log('PC Velocity:', pcKeyboard.velocity);
            e.preventDefault();
            return;
        }
        
        let midi = null;
        if (PC_PIANO[e.code] != null) {
            midi = PC_PIANO[e.code] + (pcKeyboard.octave - 4) * 12;
        } else if (PC_DRUMS[e.code] != null) {
            midi = PC_DRUMS[e.code];
        }
        
        if (midi == null) return;
        if (pcKeyboard.pressed.has(e.code)) return;
        
        pcKeyboard.pressed.add(e.code);
        
        const velocity = e.shiftKey ? 120 : (e.altKey ? 80 : pcKeyboard.velocity);
        handleMidiNote(midi, velocity);
        
        e.preventDefault();
    });

    window.addEventListener('keyup', (e) => {
        pcKeyboard.pressed.delete(e.code);
    });

    // --- MIDI Initialization ---
    async function initMIDI() {
        try {
            loadingIndicator.classList.add('show');
            loadingIndicator.textContent = 'MIDI 초기화 중...';
            
            // WebMIDI 동적 import
            const { WebMidi: WM } = await import('https://cdn.jsdelivr.net/npm/webmidi@3/dist/esm/webmidi.esm.min.js');
            WebMidi = WM;
            
            await WebMidi.enable();
            console.log('WebMIDI enabled');
            
            // MIDI 입력 장치 목록
            WebMidi.inputs.forEach(input => {
                const option = document.createElement('option');
                option.value = input.id;
                option.textContent = input.name;
                midiInputSelect.appendChild(option);
            });
            
            // 저장된 장치 또는 첫 번째 장치 자동 선택
            const savedDevice = loadMidiSettings();
            if (savedDevice && WebMidi.getInputById(savedDevice)) {
                midiInputSelect.value = savedDevice;
                selectMidiInput(savedDevice);
            } else if (WebMidi.inputs.length > 0) {
                const firstInput = WebMidi.inputs[0];
                midiInputSelect.value = firstInput.id;
                selectMidiInput(firstInput.id);
            }
            
            // Tone.js Sampler 초기화
            loadingIndicator.textContent = 'Tone.js 초기화 중...';
            toneSampler = new Tone.Sampler({
                urls: {
                    A0: "A0.mp3", C1: "C1.mp3", "D#1": "Ds1.mp3", "F#1": "Fs1.mp3",
                    A1: "A1.mp3", C2: "C2.mp3", "D#2": "Ds2.mp3", "F#2": "Fs2.mp3",
                    A2: "A2.mp3", C3: "C3.mp3", "D#3": "Ds3.mp3", "F#3": "Fs3.mp3",
                    A3: "A3.mp3", C4: "C4.mp3", "D#4": "Ds4.mp3", "F#4": "Fs4.mp3",
                    A4: "A4.mp3", C5: "C5.mp3", "D#5": "Ds5.mp3", "F#5": "Fs5.mp3",
                    A5: "A5.mp3", C6: "C6.mp3", "D#6": "Ds6.mp3", "F#6": "Fs6.mp3",
                    A6: "A6.mp3", C7: "C7.mp3", "D#7": "Ds7.mp3", "F#7": "Fs7.mp3",
                    A7: "A7.mp3", C8: "C8.mp3"
                },
                baseUrl: "https://tonejs.github.io/audio/salamander/"
            }).toDestination();
            
            await Tone.loaded();
            console.log('Tone.js ready');
            
            loadingIndicator.classList.remove('show');
            
        } catch (error) {
            console.error('MIDI initialization error:', error);

            setTimeout(() => {
                loadingIndicator.classList.remove('show');

        }
    }

    function selectMidiInput(inputId) {
        if (!WebMidi) return;
        
        if (midiInput) {
            midiInput.removeListener();
        }
        
        midiInput = WebMidi.getInputById(inputId);
        if (!midiInput) return;
        
        midiInput.addListener('noteon', e => {
            const note = e.note;
            const midiNote = note.number || note.identifier || 60;
            const velocity = Math.round((note.attack || 0.5) * 127);
            handleMidiNote(midiNote, velocity);
        });
        
        midiEnabled = true;
        midiStatus.textContent = `MIDI 활성: ${midiInput.name}`;
        midiStatus.classList.add('active');
        
        saveMidiSettings();
        console.log('MIDI Input selected:', midiInput.name);
    }

    function setupDragAndDrop() {
        let dragCounter = 0;

        container.addEventListener('dragenter', (e) => {
            e.preventDefault();
            dragCounter++;
            if (mode === 'unwarped') {
                dropZone.classList.add('active');
            }
        });

        container.addEventListener('dragleave', (e) => {
            e.preventDefault();
            dragCounter--;
            if (dragCounter === 0) {
                dropZone.classList.remove('active');
            }
        });

        container.addEventListener('dragover', (e) => {
            e.preventDefault();
        });

        container.addEventListener('drop', (e) => {
            e.preventDefault();
            dragCounter = 0;
            dropZone.classList.remove('active');

            if (mode !== 'unwarped') return;

            const files = e.dataTransfer.files;
            if (files.length > 0) {
                const file = files[0];
                const fileName = file.name.toLowerCase();
                
                if (file.type.startsWith('video/')) {
                    loadVideoFile(file);
                } else if (isImageFile(file, fileName)) {
                    loadImageFile(file);
                }
            }
        });

        function isImageFile(file, fileName) {
            if (file.type.startsWith('image/')) {
                return true;
            }
            
            if (file.type === 'image/svg+xml' || 
                file.type === 'text/xml' || 
                file.type === 'application/xml') {
                return fileName.endsWith('.svg');
            }
            
            const imageExtensions = ['.jpg', '.jpeg', '.png', '.gif', '.bmp', '.webp', '.svg'];
            return imageExtensions.some(ext => fileName.endsWith(ext));
        }
    }

    function loadVideoFile(file) {
        if (mediaFileURL) {
            URL.revokeObjectURL(mediaFileURL);
        }

        mediaFileURL = URL.createObjectURL(file);
        currentMediaType = 'video';
        
        backgroundVideoElement.src = mediaFileURL;
        backgroundVideoElement.load();
        
        backgroundImageElement.style.display = 'none';
        
        isMediaVisible = true;
        backgroundVideoElement.style.display = 'block';
        applyBlendMode();
        
        backgroundVideoElement.addEventListener('loadeddata', () => {
            try {
                backgroundVideoElement.play().catch(e => {
                    console.log('Auto play failed, user interaction required:', e);
                });
            } catch (e) {
                console.log('Auto play failed:', e);
            }
        }, { once: true });
        
        updateMediaTypeDisplay();
        updateVideoOnlyControls();
        saveMediaSettings();
    }

    function loadImageFile(file) {
        if (mediaFileURL) {
            URL.revokeObjectURL(mediaFileURL);
        }

        mediaFileURL = URL.createObjectURL(file);
        currentMediaType = 'image';
        
        backgroundImageElement.src = mediaFileURL;
        
        backgroundVideoElement.style.display = 'none';
        backgroundVideoElement.pause();
        
        isMediaVisible = true;
        backgroundImageElement.style.display = 'block';
        applyBlendMode();
        updateBackgroundImageSize();
        
        updateMediaTypeDisplay();
        updateVideoOnlyControls();
        saveMediaSettings();
    }

    function loadRecentMedia() {
        const saved = localStorage.getItem(STORAGE_KEYS.videoSettings);
        if (saved) {
            try {
                const settings = JSON.parse(saved);
                if (settings.url) {
                    if (settings.mediaType === 'image') {
                        currentMediaType = 'image';
                        backgroundImageElement.src = settings.url;
                        backgroundVideoElement.style.display = 'none';
                        isMediaVisible = settings.isVisible !== false;
                        
                        if (isMediaVisible) {
                            backgroundImageElement.style.display = 'block';
                            applyBlendMode();
                            updateBackgroundImageSize();
                        }
                    } else {
                        currentMediaType = 'video';
                        backgroundVideoElement.src = settings.url;
                        backgroundVideoElement.currentTime = settings.currentTime || 0;
                        backgroundVideoElement.loop = settings.loop !== false;
                        videoLoopCheckbox.checked = backgroundVideoElement.loop;
                        backgroundImageElement.style.display = 'none';
                        isMediaVisible = settings.isVisible !== false;
                        
                        if (isMediaVisible) {
                            backgroundVideoElement.style.display = 'block';
                            applyBlendMode();
                        }
                        
                        backgroundVideoElement.load();
                    }
                    
                    updateMediaTypeDisplay();
                    updateVideoOnlyControls();
                }
            } catch (e) {
                console.error('Failed to load recent media:', e);
            }
        }
    }

    function toggleMedia() {
        isMediaVisible = !isMediaVisible;
        if (isMediaVisible) {
            if (currentMediaType === 'video') {
                backgroundVideoElement.style.display = 'block';
            } else if (currentMediaType === 'image') {
                backgroundImageElement.style.display = 'block';
                updateBackgroundImageSize();
            }
            applyBlendMode();
        } else {
            backgroundVideoElement.style.display = 'none';
            backgroundImageElement.style.display = 'none';
            canvasElement.style.mixBlendMode = 'normal';
        }
        saveMediaSettings();
    }

    function togglePlayPause() {
        if (currentMediaType !== 'video') return;
        
        if (backgroundVideoElement.paused) {
            backgroundVideoElement.play();
            playPauseButton.textContent = '일시정지';
        } else {
            backgroundVideoElement.pause();
            playPauseButton.textContent = '재생';
        }
    }

    function seekVideo() {
        if (currentMediaType !== 'video') return;
        
        const seekTime = (videoSeekSlider.value / 100) * backgroundVideoElement.duration;
        backgroundVideoElement.currentTime = seekTime;
    }

    function updateVideoControls() {
        if (currentMediaType !== 'video') return;
        
        videoSeekSlider.max = 100;
        updateTimeDisplay();
    }

    function updateTimeDisplay() {
        if (currentMediaType !== 'video') return;
        
        const current = backgroundVideoElement.currentTime;
        const duration = backgroundVideoElement.duration;
        
        if (!isNaN(duration)) {
            const percent = (current / duration) * 100;
            videoSeekSlider.value = percent;
            timeDisplay.textContent = `${formatTime(current)} / ${formatTime(duration)}`;
        }
    }

    // --- Webcam & Resolution ---
    async function setupWebcam() {
        if (currentStream) {
            currentStream.getTracks().forEach(track => track.stop());
        }

        const selectedResolution = availableResolutions[resolutionSelect.selectedIndex];
        const constraints = {
            video: {
                width: { ideal: selectedResolution.width },
                height: { ideal: selectedResolution.height },
            }
        };

        try {
            currentStream = await navigator.mediaDevices.getUserMedia(constraints);
            videoElement.srcObject = currentStream;
            videoElement.onloadedmetadata = () => {
                videoDimensions.width = videoElement.videoWidth;
                videoDimensions.height = videoElement.videoHeight;
                console.log(`Webcam started: ${videoDimensions.width}x${videoDimensions.height}`);

                currentResolution.width = videoDimensions.width;
                currentResolution.height = videoDimensions.height;
                updateResolutionSelectValue(currentResolution.width, currentResolution.height);

                targetAspectRatio = videoDimensions.width / videoDimensions.height;
                const common = gcd(videoDimensions.width, videoDimensions.height);
                aspectRatioWInput.value = videoDimensions.width / common;
                aspectRatioHInput.value = videoDimensions.height / common;

                updateBackgroundPlaneSize();
                applyCurrentModeGeometry();
                if (backgroundPlaneMesh) {
                    backgroundPlaneMesh.visible = (mode === 'calibration');
                }
                onWindowResize();
            };

            const tracks = currentStream.getVideoTracks();
            if (tracks.length > 0) {
                currentVideoTrack = tracks[0];
            }

        } catch (err) {
            console.error("Error accessing webcam:", err);
            alert("웹캠에 접근할 수 없습니다. 권한을 확인하거나 다른 카메라를 선택해주세요.");
        }
    }

    function populateResolutionSelect() {
        resolutionSelect.innerHTML = '';
        availableResolutions.forEach((res, index) => {
            const option = document.createElement('option');
            option.value = index;
            option.textContent = `${res.width}x${res.height}`;
            resolutionSelect.appendChild(option);
        });
        updateResolutionSelectValue(1920, 1080);
    }

    function updateResolutionSelectValue(width, height) {
        for (let i = 0; i < resolutionSelect.options.length; i++) {
            const res = availableResolutions[i];
            if (res.width === width && res.height === height) {
                resolutionSelect.selectedIndex = i;
                return;
            }
        }
    }

    function changeResolution() {
        console.log(`Changing resolution to: ${availableResolutions[resolutionSelect.selectedIndex].width}x${availableResolutions[resolutionSelect.selectedIndex].height}`);
        setupWebcam();
    }

    // --- Control Points & Calibration ---
    function setupSVGControls() {
        svgCircles.forEach(circle => circle.remove());
        svgCircles = [];

        for (let i = 0; i < 4; i++) {
            const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
            circle.setAttribute('r', CONTROL_POINT_RADIUS);
            circle.setAttribute('data-index', i);
            circle.addEventListener('pointerdown', onPointerDown);
            svgOverlay.appendChild(circle);
            svgCircles.push(circle);
        }
        updateSVGOverlay();
    }

    function updateSVGOverlay() {
        if (!container || svgCircles.length !== 4 || !camera) return;

        const rect = container.getBoundingClientRect();
        if (rect.width === 0 || rect.height === 0) return;

        const points = [];
        const flippedUV = getFlippedSourcePoints();

        for (let i = 0; i < 4; i++) {
            const screenPos = uvToScreen(flippedUV[i]);
            if (screenPos && isFinite(screenPos.x) && isFinite(screenPos.y)) {
                const clampedX = Math.max(CONTROL_POINT_RADIUS, Math.min(rect.width - CONTROL_POINT_RADIUS, screenPos.x));
                const clampedY = Math.max(CONTROL_POINT_RADIUS, Math.min(rect.height - CONTROL_POINT_RADIUS, screenPos.y));

                svgCircles[i].setAttribute('cx', clampedX);
                svgCircles[i].setAttribute('cy', clampedY);
                points.push(`${clampedX},${clampedY}`);
            } else {
                svgCircles[i].setAttribute('cx', 0);
                svgCircles[i].setAttribute('cy', 0);
                points.push(`0,0`);
            }
        }
        svgPolygon.setAttribute('points', points.join(' '));
    }

    function onPointerDown(event) {
        if (mode !== 'calibration') return;
        isDragging = true;
        draggedControlPointIndex = parseInt(event.target.getAttribute('data-index'));
        event.target.style.cursor = 'grabbing';
        window.addEventListener('pointermove', onPointerMove);
        window.addEventListener('pointerup', onPointerUp);
        window.addEventListener('pointerleave', onPointerUp);
    }

    function onPointerMove(event) {
        if (!isDragging || draggedControlPointIndex < 0) return;
        event.preventDefault();

        const newUV = screenToUV(event.clientX, event.clientY);

        if (newUV) {
            let targetU = newUV.x;
            let targetV = newUV.y;
            
            if (isFlippedX) targetU = 1.0 - targetU;
            if (isFlippedY) targetV = 1.0 - targetV;

            sourcePointsUV[draggedControlPointIndex].set(
                Math.max(0, Math.min(1, targetU)),
                Math.max(0, Math.min(1, targetV))
            );

            updateGeometryCalibration();
            updateSVGOverlay();
            saveCalibrationPoints();
        }
    }

    function onPointerUp(event) {
        if (!isDragging) return;
        
        if (event.target && event.target.style && event.target.style.cursor === 'grabbing') {
            event.target.style.cursor = 'grab';
        } else if (draggedControlPointIndex >= 0 && svgCircles[draggedControlPointIndex]) {
            svgCircles[draggedControlPointIndex].style.cursor = 'grab';
        }

        isDragging = false;
        draggedControlPointIndex = -1;
        window.removeEventListener('pointermove', onPointerMove);
        window.removeEventListener('pointerup', onPointerUp);
        window.removeEventListener('pointerleave', onPointerUp);
    }

    // --- Coordinate Conversion ---
    function screenToUV(screenX, screenY) {
        if (!container) return null;
        const rect = container.getBoundingClientRect();
        if (rect.width === 0 || rect.height === 0) return null;

        const displayBounds = getVideoDisplayBounds();
        
        const containerX = screenX - rect.left;
        const containerY = screenY - rect.top;
        
        const relX = containerX - displayBounds.x;
        const relY = containerY - displayBounds.y;
        
        let u = relX / displayBounds.width;
        let v = 1.0 - (relY / displayBounds.height);
        
        u = Math.max(0, Math.min(1, u));
        v = Math.max(0, Math.min(1, v));

        return new THREE.Vector2(u, v);
    }

    function uvToScreen(uv) {
        if (!container) return null;
        const rect = container.getBoundingClientRect();
        if (rect.width === 0 || rect.height === 0) return null;
        
        const displayBounds = getVideoDisplayBounds();
        
        const containerX = displayBounds.x + (uv.x * displayBounds.width);
        const containerY = displayBounds.y + ((1.0 - uv.y) * displayBounds.height);

        return { x: containerX, y: containerY };
    }
    
    function getVideoDisplayBounds() {
        const width = container.clientWidth;
        const height = container.clientHeight;
        const containerAspect = width / height;
        const videoAspect = videoDimensions.width / videoDimensions.height;
        
        let displayWidth, displayHeight, offsetX, offsetY;
        
        if (containerAspect > videoAspect) {
            displayHeight = height;
            displayWidth = displayHeight * videoAspect;
            offsetX = (width - displayWidth) / 2;
            offsetY = 0;
        } else {
            displayWidth = width;
            displayHeight = displayWidth / videoAspect;
            offsetX = 0;
            offsetY = (height - displayHeight) / 2;
        }
        
        return {
            x: offsetX,
            y: offsetY,
            width: displayWidth,
            height: displayHeight
        };
    }

    // --- Geometry Update ---
    function updateGeometryCalibration() {
        if (!planeGeometry || !container || !camera) return;

        const positionAttribute = planeGeometry.attributes.position;
        const uvAttribute = planeGeometry.attributes.uv;
        const segmentsX = GRID_SIZE;
        const segmentsY = GRID_SIZE;

        const displayBounds = getVideoDisplayBounds();
        const width = container.clientWidth;
        const height = container.clientHeight;
        
        if (width === 0 || height === 0) return;

        const flippedUVs = getFlippedSourcePoints();
        
        const worldCorners = flippedUVs.map(uv => {
            const screenPos = uvToScreen(uv);
            if (!screenPos) return new THREE.Vector2(0, 0);
            
            const ndcX = (screenPos.x / width) * 2 - 1;
            const ndcY = -(screenPos.y / height) * 2 + 1;
            
            const viewWidth = camera.right - camera.left;
            const viewHeight = camera.top - camera.bottom;
            const worldX = ndcX * (viewWidth / 2);
            const worldY = ndcY * (viewHeight / 2);
            
            return new THREE.Vector2(worldX, worldY);
        });

        for (let j = 0; j <= segmentsY; j++) {
            const vFrac = j / segmentsY;
            const posLeft = worldCorners[3].clone().lerp(worldCorners[0], vFrac);
            const posRight = worldCorners[2].clone().lerp(worldCorners[1], vFrac);
            
            const uvLeft = sourcePointsUV[3].clone().lerp(sourcePointsUV[0], vFrac);
            const uvRight = sourcePointsUV[2].clone().lerp(sourcePointsUV[1], vFrac);

            for (let i = 0; i <= segmentsX; i++) {
                const hFrac = i / segmentsX;
                const index = j * (segmentsX + 1) + i;
                
                const finalPos = posLeft.clone().lerp(posRight, hFrac);
                const finalUV = uvLeft.clone().lerp(uvRight, hFrac);
                
                let u = finalUV.x;
                let v = finalUV.y;
                if (isFlippedX) u = 1.0 - u;
                if (isFlippedY) v = 1.0 - v;
                
                positionAttribute.setXYZ(index, finalPos.x, finalPos.y, 0);
                uvAttribute.setXY(index, u, v);
            }
        }

        positionAttribute.needsUpdate = true;
        uvAttribute.needsUpdate = true;
    }

    function updateGeometryUnwarped() {
        if (!planeGeometry || !camera) return;

        const positionAttribute = planeGeometry.attributes.position;
        const uvAttribute = planeGeometry.attributes.uv;
        const segmentsX = GRID_SIZE;
        const segmentsY = GRID_SIZE;

        const viewWidth = camera.right - camera.left;
        const viewHeight = camera.top - camera.bottom;
        if (viewWidth <= 0 || viewHeight <= 0) return;

        let targetWidth = viewWidth;
        let targetHeight = viewHeight;

        if (viewWidth / viewHeight > targetAspectRatio) {
            targetWidth = targetHeight * targetAspectRatio;
        } else {
            targetHeight = targetWidth / targetAspectRatio;
        }

        const halfWidth = targetWidth / 2;
        const halfHeight = targetHeight / 2;

        const srcPoints = [
            sourcePointsUV[0].clone(),
            sourcePointsUV[1].clone(),
            sourcePointsUV[2].clone(),
            sourcePointsUV[3].clone()
        ];

        for (let j = 0; j <= segmentsY; j++) {
            const v = j / segmentsY;
            
            for (let i = 0; i <= segmentsX; i++) {
                const u = i / segmentsX;
                const index = j * (segmentsX + 1) + i;
                
                const x = -halfWidth + u * targetWidth;
                const y = -halfHeight + v * targetHeight;
                positionAttribute.setXYZ(index, x, y, 0);
                
                const unwarpedUV = perspectiveTransform(u, v, srcPoints);
                
                let texU = unwarpedUV.x;
                let texV = unwarpedUV.y;
                if (isFlippedX) texU = 1.0 - texU;
                if (isFlippedY) texV = 1.0 - texV;
                
                uvAttribute.setXY(index, texU, texV);
            }
        }

        positionAttribute.needsUpdate = true;
        uvAttribute.needsUpdate = true;

        planeMesh.scale.x = isFlippedX ? -1 : 1;
        planeMesh.scale.y = isFlippedY ? -1 : 1;
    }

    function perspectiveTransform(u, v, srcQuad) {
        const dstQuad = [
            new THREE.Vector2(0, 1),
            new THREE.Vector2(1, 1),
            new THREE.Vector2(1, 0),
            new THREE.Vector2(0, 0)
        ];
        
        const H = computeHomography(dstQuad, srcQuad);
        
        const denominator = H[6] * u + H[7] * v + H[8];
        if (Math.abs(denominator) < 1e-10) {
            return new THREE.Vector2(0.5, 0.5);
        }
        
        const newU = (H[0] * u + H[1] * v + H[2]) / denominator;
        const newV = (H[3] * u + H[4] * v + H[5]) / denominator;
        
        return new THREE.Vector2(
            Math.max(0, Math.min(1, newU)),
            Math.max(0, Math.min(1, newV))
        );
    }

    function computeHomography(srcPoints, dstPoints) {
        const A = [];
        
        for (let i = 0; i < 4; i++) {
            const s = srcPoints[i];
            const d = dstPoints[i];
            
            A.push([
                s.x, s.y, 1, 0, 0, 0, -d.x * s.x, -d.x * s.y, -d.x
            ]);
            
            A.push([
                0, 0, 0, s.x, s.y, 1, -d.y * s.x, -d.y * s.y, -d.y
            ]);
        }
        
        const H = solveHomographyEquation(A);
        
        if (Math.abs(H[8]) > 1e-10) {
            for (let i = 0; i < 8; i++) {
                H[i] /= H[8];
            }
            H[8] = 1.0;
        }
        
        return H;
    }

    function solveHomographyEquation(A) {
        const M = A.map(row => [...row]);
        const n = M.length;
        
        for (let i = 0; i < n - 1; i++) {
            let maxRow = i;
            let maxVal = Math.abs(M[i][i]);
            
            for (let j = i + 1; j < n; j++) {
                const absVal = Math.abs(M[j][i]);
                if (absVal > maxVal) {
                    maxVal = absVal;
                    maxRow = j;
                }
            }
            
            if (maxRow !== i) {
                [M[i], M[maxRow]] = [M[maxRow], M[i]];
            }
            
            for (let j = i + 1; j < n; j++) {
                const factor = M[j][i] / M[i][i];
                for (let k = i; k < M[i].length; k++) {
                    M[j][k] -= factor * M[i][k];
                }
            }
        }
        
        const H = Array(9).fill(0);
        H[8] = 1.0;
        
        for (let i = n - 1; i >= 0; i--) {
            let sum = 0;
            for (let j = i + 1; j < 9; j++) {
                if (j < M[i].length) {
                    sum += M[i][j] * H[j];
                }
            }
            
            if (i < 8) {
                H[i] = (0 - sum) / M[i][i];
            }
        }
        
        return H;
    }

    function updateBackgroundPlaneSize() {
        if (!backgroundPlaneMesh || !camera || camera.right - camera.left <= 0) {
            return;
        }

        const displayBounds = getVideoDisplayBounds();
        const width = container.clientWidth;
        const height = container.clientHeight;
        
        const viewWidth = camera.right - camera.left;
        const viewHeight = camera.top - camera.bottom;
        
        const scaleX = (displayBounds.width / width) * viewWidth;
        const scaleY = (displayBounds.height / height) * viewHeight;
        
        const posX = ((displayBounds.x / width) * viewWidth) - (viewWidth / 2) + (scaleX / 2);
        const posY = -((displayBounds.y / height) * viewHeight) + (viewHeight / 2) - (scaleY / 2);
        
        backgroundPlaneMesh.scale.set(scaleX, scaleY, 1);
        backgroundPlaneMesh.position.set(posX, posY, -0.01);
    }

    // --- UI Logic ---
    function toggleMode() {
        mode = (mode === 'calibration') ? 'unwarped' : 'calibration';
        modeToggleButton.textContent = `모드: ${mode === 'calibration' ? 'Calibration' : 'Unwarped'}`;

        if (mode === 'calibration') {
            aspectRatioControl.classList.add('hidden');
            blendModeControl.classList.add('hidden');
            svgOverlay.classList.remove('hidden');
            videoControls.classList.add('hidden');
            if (backgroundPlaneMesh) backgroundPlaneMesh.visible = true;
            updateSVGOverlay();
            planeMesh.scale.x = 1;
            planeMesh.scale.y = 1;
            
            canvasElement.style.mixBlendMode = 'normal';
            backgroundVideoElement.style.display = 'none';
            backgroundImageElement.style.display = 'none';
        } else {
            aspectRatioControl.classList.remove('hidden');
            blendModeControl.classList.remove('hidden');
            svgOverlay.classList.add('hidden');
            videoControls.classList.remove('hidden');
            if (backgroundPlaneMesh) backgroundPlaneMesh.visible = false;
            
            if (isMediaVisible && currentMediaType) {
                if (currentMediaType === 'video') {
                    backgroundVideoElement.style.display = 'block';
                } else if (currentMediaType === 'image') {
                    backgroundImageElement.style.display = 'block';
                    updateBackgroundImageSize();
                }
                applyBlendMode();
            }
            
            updateMediaTypeDisplay();
            updateVideoOnlyControls();
        }
        applyCurrentModeGeometry();
        updateBackgroundPlaneSize();
    }

    function getFlippedSourcePoints() {
        return sourcePointsUV.map(uv => {
            let u = uv.x;
            let v = uv.y;
            if (isFlippedX) u = 1.0 - u;
            if (isFlippedY) v = 1.0 - v;
            return new THREE.Vector2(u, v);
        });
    }

    function toggleFlipX() {
        isFlippedX = !isFlippedX;
        videoTexture.repeat.x = isFlippedX ? -1 : 1;
        videoTexture.offset.x = isFlippedX ? 1 : 0;
        videoTexture.needsUpdate = true;
        
        if (mode === 'calibration') {
            updateGeometryCalibration();
            updateSVGOverlay();
        } else {
            updateGeometryUnwarped();
        }
    }

    function toggleFlipY() {
        isFlippedY = !isFlippedY;
        videoTexture.repeat.y = isFlippedY ? -1 : 1;
        videoTexture.offset.y = isFlippedY ? 1 : 0;
        videoTexture.needsUpdate = true;
        
        if (mode === 'calibration') {
            updateGeometryCalibration();
            updateSVGOverlay();
        } else {
            updateGeometryUnwarped();
        }
    }

    function updateAspectRatio() {
        const aspectW = parseInt(aspectRatioWInput.value, 10);
        const aspectH = parseInt(aspectRatioHInput.value, 10);

        if (!isNaN(aspectW) && aspectW > 0 && !isNaN(aspectH) && aspectH > 0) {
            targetAspectRatio = aspectW / aspectH;
            console.log(`Target Aspect Ratio set to: ${aspectW}:${aspectH} (${targetAspectRatio.toFixed(3)})`);
            if (mode === 'unwarped') {
                updateGeometryUnwarped();
            }
            onWindowResize();
        } else {
            console.warn("Invalid aspect ratio input. Both values must be positive numbers.");
        }
    }

    function toggleFullscreen() {
        if (!document.fullscreenElement && !document.webkitFullscreenElement && !document.mozFullScreenElement && !document.msFullscreenElement) {
            const el = document.body;
            if (el.requestFullscreen) el.requestFullscreen();
            else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
            else if (el.mozRequestFullScreen) el.mozRequestFullScreen();
            else if (el.msRequestFullscreen) el.msRequestFullscreen();
        } else {
            if (document.exitFullscreen) document.exitFullscreen();
            else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
            else if (document.mozCancelFullScreen) document.mozCancelFullScreen();
            else if (document.msExitFullscreen) document.msExitFullscreen();
        }
    }

    function handleFullscreenChange() {
        setTimeout(onWindowResize, 100);
        setTimeout(updateBackgroundImageSize, 100);
    }

    function applyCurrentModeGeometry() {
        if (mode === 'calibration') {
            updateGeometryCalibration();
        } else {
            updateGeometryUnwarped();
        }
    }

    // --- Rendering & Resizing ---
    function animate() {
        requestAnimationFrame(animate);

        if (videoElement.readyState === videoElement.HAVE_ENOUGH_DATA) {
            videoTexture.needsUpdate = true;
        }

        renderer.render(scene, camera);
    }

    function onWindowResize() {
        if (!renderer || !camera || !container) return;

        const width = container.clientWidth;
        const height = container.clientHeight;
        if (width === 0 || height === 0) return;

        renderer.setSize(width, height);

        const displayAspect = width / height;
        let viewHeight = 1.0;
        let viewWidth = displayAspect * viewHeight;

        camera.left = -viewWidth / 2;
        camera.right = viewWidth / 2;
        camera.top = viewHeight / 2;
        camera.bottom = -viewHeight / 2;
        camera.updateProjectionMatrix();

        updateBackgroundPlaneSize();
        updateBackgroundImageSize();
        applyCurrentModeGeometry();
        updateSVGOverlay();
    }

    // --- Start Application ---
    init();

</script>
