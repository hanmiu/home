<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Maze · A* Multi-Agent (TSV + Route, Keyboard Fix)</title>
  <style>
    :root { --footer-h: 64px; --thumb: 64px; }
    html, body { height: 100%; margin: 0; }
    body { display: flex; flex-direction: column; align-items: center; background: #F0EEE7; color: #111; }
    #main { flex: 0 0 auto; display: flex; justify-content: center; width: 100%; }
    canvas { display: block; outline: none; touch-action: manipulation; image-rendering: auto; }
    #footer {
      height: var(--footer-h);
      display: flex; align-items: center; justify-content: center;
      gap: 12px; padding: 0 12px; overflow: hidden; width: 100%;
      box-sizing: border-box; margin: 0;
    }
    .footer-item {
      width: var(--thumb); height: var(--thumb); flex: 0 0 auto; border-radius: 50%;
      position: relative; opacity: 0; transform: scale(0.85);
      transition: opacity .5s ease, transform .5s ease;
      display: flex; align-items: center; justify-content: center;
      background: transparent;
    }
    .footer-item.pop-in { opacity: 1; transform: scale(1); }
    .footer-item.fade-out { opacity: 0; transform: scale(0.95); }
    .footer-item img.thumb { width: 100%; height: 100%; object-fit: contain; display: block; }
    .footer-item img.thumb.flip { transform: scaleX(-1); }
  </style>
</head>
<body>
  <div id="main">
    <canvas id="maze" aria-label="interactive maze canvas" role="img"></canvas>
  </div>
  <div id="footer" aria-label="agents that passed the goal"></div>

  <script>
  (function(){
    'use strict';

    // ====================== Query Parsing ======================
    const Q = new URLSearchParams(location.search);
    const def = (v, f) => (v === null || v === undefined || v === "") ? f : v;
    const ensureOdd = (n)=>{ n = Math.max(5, Math.floor(+n||0)); return (n%2===1)?n:n+1; };
    const clamp = (n,a,b)=> Math.max(a, Math.min(b, n));

    function normalizeHex(input, fallback){
      let s = (input||'').toString().trim();
      s = s.replace(/^#/,'');
      if (!/^[0-9a-fA-F]{3,8}$/.test(s)) s = fallback;
      if (s.length===3) s = s.split('').map(ch=>ch+ch).join('');
      if (s.length===4) s = s.split('').map(ch=>ch+ch).join('');
      if (s.length===6 || s.length===8) return '#'+s.toUpperCase();
      return '#'+fallback.toUpperCase();
    }

    const cols = ensureOdd(def(Q.get('cols'), 21));
    const rows = ensureOdd(def(Q.get('rows'), 13));
    const AGENTS_TARGET = clamp(Math.floor(def(Q.get('agents'), 4)), 1, 64);
    const AGENT_SPEED = clamp(parseFloat(def(Q.get('speed'), 3)) || 3, 0.25, 30); // cells/sec
    const wallColor = normalizeHex(def(Q.get('wall'), 'F0EEE7'), 'F0EEE7');
    const pathColor = normalizeHex(def(Q.get('path'), 'FFFFFF'), 'FFFFFF');

    const seedParam = Q.get('seed');
    const faceDir = (parseInt(def(Q.get('faceDir'), '1'),10) === 1);
    const footerHeight = clamp(parseInt(String(def(Q.get('footer_height'), '64')),10) || 64, 0, 400);
    const spriteScale = clamp(parseFloat(String(def(Q.get('spriteScale'), '1.8'))) || 1.8, 0.2, 3.0);

    const collectRatio = clamp(parseFloat(def(Q.get('collect'), 0.4)) || 0.4, 0.2, 1.0);
    const useSnap = (parseInt(def(Q.get('snap'), '1'),10) === 1);

    // ====================== Image list parameters (TSV-driven) ======================
    let imgBase = (Q.get('imgBase') || '').trim();
    imgBase = 'https://www.hanmiu.cc/play/evt/25_creatures/assets/';
    const TSV_URL = 'https://www.hanmiu.cc/play/evt/25_creatures/data/data.tsv';

    let goalFilesStr = `hanmi_runner.png`.normalize('NFC');
    let agentFilesStr = (Q.get('agentFiles') || '').trim();

    document.body.style.background = wallColor;
    document.documentElement.style.setProperty('--footer-h', footerHeight + 'px');
    const thumbSize = Math.max(24, Math.min(64, footerHeight - 0));
    document.documentElement.style.setProperty('--thumb', thumbSize + 'px');

    // ====================== RNG ======================
    let rand; // returns [0,1)
    if (seedParam !== null && seedParam !== undefined) {
      let s = 0x811C9DC5;
      const str = String(seedParam);
      for (let i=0;i<str.length;i++){ s ^= str.charCodeAt(i); s = Math.imul(s, 0x45d9f3b); s ^= s>>>16; }
      if (s === 0) s = 0x9E3779B9;
      let state = s|0;
      rand = ()=>{ state ^= state << 13; state ^= state >>> 17; state ^= state << 5; return ((state>>>0) / 4294967296); };
    } else {
      rand = Math.random;
    }
    const randInt = (min, max)=> (Math.floor(rand() * (max - min + 1)) + min);

    // ====================== Utility ======================
    function shuffle(arr){ for(let i=arr.length-1;i>0;i--){ const j = Math.floor(rand()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; } return arr; }
    function joinURL(base, name){
      if (!base) return null;
      let b = base; if (!/\/$/.test(b)) b += '/';
      let n = (name||'').replace(/^\/+/, '');
      if (!n) return null;
      return b + n;
    }
    function parseList(str){ return str ? str.split(',').map(s=>s.trim()).filter(Boolean) : []; }

    async function fetchAgentFilesFromTSV(url){
      const res = await fetch(url, { cache: 'no-store' });
      if (!res.ok) throw new Error('Failed to fetch TSV: ' + res.status);
      const text = (await res.text()).replace(/^\uFEFF/, ''); // BOM 제거
      const lines = text.split(/\r?\n/).filter(l => l.trim() && !/^#/.test(l));
      if (!lines.length) return [];
      const header = lines[0].split('\t').map(h => h.trim());
      const fileIdx = header.findIndex(h => h.toLowerCase() === 'file');
      if (fileIdx < 0) throw new Error('TSV missing "file" column');
      const files = [];
      for (let i = 1; i < lines.length; i++){
        const cols = lines[i].split('\t');
        const f = (cols[fileIdx] || '').trim();
        if (f) files.push(f.normalize('NFC'));
      }
      return files;
    }

    // ====================== Grid / Maze ======================
    const CELL = 32; // logical pixels per cell (internal)
    const LOGICAL_W = cols * CELL;
    const LOGICAL_H = rows * CELL;

    function generateMaze(cols, rows){
      const grid = Array.from({length: rows}, ()=> Array(cols).fill(1));
      const visited = Array.from({length: rows}, ()=> Array(cols).fill(false));
      const sx = ((randInt(1, cols-2) / 2) | 0) * 2 + 1;
      const sy = ((randInt(1, rows-2) / 2) | 0) * 2 + 1;
      const stack = [[sx, sy]];
      visited[sy][sx] = true; grid[sy][sx] = 0;
      const dirs = [[2,0],[-2,0],[0,2],[0,-2]];
      while (stack.length){
        const [cx, cy] = stack[stack.length-1];
        const choices = shuffle(dirs.slice());
        let carved = false;
        for (const [dx,dy] of choices){
          const nx = cx+dx, ny = cy+dy;
          if (nx<=0||ny<=0||nx>=cols-1||ny>=rows-1) continue;
          if (!visited[ny][nx]){
            visited[ny][nx]=true; grid[ny][nx]=0; grid[cy+dy/2][cx+dx/2]=0; stack.push([nx,ny]); carved=true; break;
          }
        }
        if (!carved) stack.pop();
      }
      for (let i=0;i<(cols*rows)/200;i++){
        const x=((randInt(1, cols-2)/2)|0)*2+1; const y=((randInt(1, rows-2)/2)|0)*2+1; grid[y][x]=0;
      }
      return grid;
    }

    const grid = generateMaze(cols, rows);

    // ====================== A* Pathfinding ======================
    function manhattan(ax, ay, bx, by){ return Math.abs(ax-bx)+Math.abs(ay-by); }
    function key(x,y){ return x+','+y; }
    function astar(grid, start, goal){
      const rows = grid.length, cols = grid[0].length;
      const inBounds = (x,y)=> x>=0 && y>=0 && x<cols && y<rows;
      const passable = (x,y)=> inBounds(x,y) && grid[y][x]===0;
      if (!passable(start.x,start.y) || !passable(goal.x,goal.y)) return null;
      const heap = [];// [f,x,y]
      const push = (n)=>{ heap.push(n); bubbleUp(heap.length-1); };
      const pop = ()=>{ if(!heap.length) return undefined; const top=heap[0]; const end=heap.pop(); if(heap.length){ heap[0]=end; sinkDown(0);} return top; };
      const score = (n)=> n[0];
      function bubbleUp(n){ const e = heap[n]; while(n>0){ const p=(n-1)>>1; if (score(e) >= score(heap[p])) break; heap[n]=heap[p]; heap[p]=e; n=p; } }
      function sinkDown(n){ const len=heap.length; while(true){ let l=(n<<1)+1, r=l+1, s=n; if(l<len && score(heap[l])<score(heap[s])) s=l; if(r<len && score(heap[r])<score(heap[s])) s=r; if(s===n) break; [heap[n],heap[s]]=[heap[s],heap[n]]; n=s; } }
      const g = new Map(); const parent = new Map();
      g.set(key(start.x,start.y), 0); push([manhattan(start.x,start.y,goal.x,goal.y), start.x, start.y]);
      const dirs=[[1,0],[-1,0],[0,1],[0,-1]];
      while (heap.length){
        const cur = pop(); if(!cur) break; const [f,x,y] = cur;
        if (x===goal.x && y===goal.y){
          const path=[]; let curK=key(x,y);
          while(true){ const [cx,cy]=curK.split(',').map(Number); path.push({x:cx,y:cy}); const p=parent.get(curK); if(!p) break; curK=p; }
          path.reverse(); return path;
        }
        const gxy = g.get(key(x,y));
        for (const [dx,dy] of dirs){ const nx=x+dx, ny=y+dy; if (!passable(nx,ny)) continue; const nk=key(nx,ny); const ng=gxy+1; if(ng < (g.get(nk)??Infinity)){ g.set(nk,ng); parent.set(nk, key(x,y)); const f=ng+manhattan(nx,ny,goal.x,goal.y); push([f,nx,ny]); } }
      }
      return null;
    }

    // ====================== Canvas & Scaling ======================
    const canvas = document.getElementById('maze');
    const ctx = canvas.getContext('2d');
    const footerEl = document.getElementById('footer');
    let scale = 1;

    function layout(){
      const dpr = Math.max(1, window.devicePixelRatio || 1);
      const vw = window.innerWidth; const vh = window.innerHeight;
      const availH = Math.max(1, vh - footerHeight);
      scale = Math.min(vw / LOGICAL_W, availH / LOGICAL_H);
      const cssW = Math.floor(LOGICAL_W * scale);
      const cssH = Math.floor(LOGICAL_H * scale);
      canvas.style.width = cssW + 'px';
      canvas.style.height = cssH + 'px';
      canvas.width = Math.max(1, Math.floor(cssW * dpr));
      canvas.height = Math.max(1, Math.floor(cssH * dpr));
    }
    layout();
    window.addEventListener('resize', layout);

    // ====================== Goal & Agents ======================
    const held = { left:false, right:false, up:false, down:false };
    const GOAL_SLIDE_SPEED = 8; // cells/s
    const agents = [];
    let nextId = 1;

    // Image cache
    const imageCache = new Map();
    function getImage(url){
      if (!url) return null;
      const entry = imageCache.get(url);
      if (entry === undefined){
        const img = new Image(); img.crossOrigin='anonymous';
        img.onload = ()=>{ imageCache.set(url, img); };
        img.onerror = ()=>{ imageCache.set(url, null); };
        imageCache.set(url, undefined);
        img.src = url;
        return null;
      }
      return entry || null;
    }
    function isLoadedImage(url){ const v = imageCache.get(url); return !!(v && v.width); }

    // Pools
    function createCyclePool(base){
      let pool = [];
      function reset(){ pool = shuffle(base.slice()); }
      function next(){ if (base.length===0) return null; if (pool.length===0) reset(); return pool.pop(); }
      return { next, reset, base: base.slice() };
    }
    let goalPool = null;
    let agentPool = null;

    function randomFreeCell(){
      for (let guard=0; guard<10000; guard++){
        const x = randInt(1, cols-2), y = randInt(1, rows-2);
        if (grid[y][x] === 0) return {x,y};
      }
      return {x:1,y:1};
    }

    // Initial goal
    let goal = (function(){ const c={x:(cols>>1), y:(rows>>1)}; return (grid[c.y]&&grid[c.x]!==undefined && grid[c.y][c.x]===0)?c:randomFreeCell(); })();
    let goalVis = { x: goal.x, y: goal.y };
    let goalFacing = 'right';
    let goalImgURL = null;

    // Route state
    let goalRoute = null;
    let routeIdx = 0;

    // Keyboard — FIX: ignore auto-repeat & don't kill current slide
    function isArrow(key){ return key==='ArrowLeft'||key==='ArrowRight'||key==='ArrowUp'||key==='ArrowDown'; }
    function isTyping(){ const a=document.activeElement; return a && (a.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/i.test(a.tagName)); }

    window.addEventListener('keydown', (e)=>{
      if (isTyping() || !isArrow(e.key)) return;

      // Set held flags first
      if (e.key==='ArrowLeft')  held.left=true;
      if (e.key==='ArrowRight') held.right=true;
      if (e.key==='ArrowUp')    held.up=true;
      if (e.key==='ArrowDown')  held.down=true;

      // Cancel only the route ONCE; keep current slide to avoid jitter
      if (!e.repeat) cancelRoute('keyboard');

      // If not currently sliding, try start immediately
      if (!sliding.active) tryStartSlideKeyboard();

      e.preventDefault();
    }, {passive:false});

    window.addEventListener('keyup', (e)=>{
      if (!isArrow(e.key)) return;
      if (e.key==='ArrowLeft')  held.left=false;
      if (e.key==='ArrowRight') held.right=false;
      if (e.key==='ArrowUp')    held.up=false;
      if (e.key==='ArrowDown')  held.down=false;
    });

    // Pointer (mouse/touch)
    const canvasRect = ()=> canvas.getBoundingClientRect();
    canvas.addEventListener('pointerdown', (e)=>{
      const rect = canvasRect();
      const nx = (e.clientX - rect.left) / rect.width;
      const ny = (e.clientY - rect.top) / rect.height;
      const lx = Math.floor((nx * LOGICAL_W) / CELL);
      const ly = Math.floor((ny * LOGICAL_H) / CELL);
      if (lx<0 || ly<0 || lx>=cols || ly>=rows) return;
      let target = {x:lx, y:ly};
      if (grid[ly][lx]!==0 && useSnap){
        const snapped = findNearestFreeCell(lx, ly);
        if (snapped) target = snapped; else return;
      } else if (grid[ly][lx]!==0) { return; }
      const start = { x: goal.x, y: goal.y };
      const route = astar(grid, start, target);
      if (route && route.length>=1){ beginRoute(route); }
    });

    function setGoal(g){ goal = {x:g.x, y:g.y}; replanAll(); }

    // Sliding state
    const sliding = { active:false, from:{x:goal.x,y:goal.y}, to:null, t:0 };

    function startSlide(from, to){
      sliding.active=true; sliding.from={x:from.x,y:from.y}; sliding.to={x:to.x,y:to.y}; sliding.t=0;
      if (faceDir){ const dx = to.x - from.x; if (dx>0) goalFacing='right'; else if (dx<0) goalFacing='left'; }
    }

    function tryStartSlideKeyboard(){
      let dx = (held.right?1:0)-(held.left?1:0);
      let dy = (held.down?1:0)-(held.up?1:0);
      if (dx && dy) dy = 0; // prefer horizontal
      if (!dx && !dy) return false;
      const nx = clamp(goal.x + dx, 0, cols-1);
      const ny = clamp(goal.y + dy, 0, rows-1);
      if (grid[ny] && grid[ny][nx]===0){ startSlide(goal, {x:nx, y:ny}); return true; }
      return false;
    }

    function randomGoalRelocate(){
      const g = randomFreeCell();
      setGoal(g);
      goalVis = {x:g.x, y:g.y};
      if (!goalIdxParam) goalImgURL = selectGoalImageURL();
    }

    function spawnAgents(n){
      const out=[];
      for(let i=0;i<n;i++){
        let s = randomFreeCell();
        let guard=0; while((s.x===goal.x && s.y===goal.y) && guard++<500) s = randomFreeCell();
        const hue = ( (nextId*57) % 360 );
        const imgURL = agentPool ? agentPool.next() : null;
        out.push({ id: nextId++, color: `hsl(${hue}, 95%, 45%)`, pos:{x:s.x, y:s.y}, path:null, idx:0, facing:'right', imgURL: imgURL || null });
      }
      agents.push(...out);
    }

    function replanAll(){
      for (const a of agents){
        const s = { x: Math.round(a.pos.x), y: Math.round(a.pos.y) };
        const p = astar(grid, s, goal);
        a.path = p; a.idx = p ? 1 : 0;
      }
    }

    // ====================== Footer Trophy Queue ======================
    let appendChain = Promise.resolve();
    function fadeOutOldest(){
      const el = footerEl.firstElementChild; if (!el) return Promise.resolve();
      return new Promise((res)=>{
        el.classList.add('fade-out');
        const done = ()=>{ el.removeEventListener('transitionend', done); if (el.parentNode) el.parentNode.removeChild(el); res(); };
        el.addEventListener('transitionend', done);
        setTimeout(done, 700);
      });
    }
    function ensureCapacity(){
      const count = footerEl.childElementCount;
      const toRemove = Math.max(0, count - (AGENTS_TARGET));
      let p = Promise.resolve();
      for (let i=0;i<toRemove;i++) p = p.then(()=>fadeOutOldest());
      return p;
    }
    function appendThumb(url, facingLeft){
      const item = document.createElement('div'); item.className='footer-item';
      const img = document.createElement('img'); img.className='thumb'; img.alt='agent passed'; img.decoding='async'; img.loading='eager'; img.src=url;
      if (facingLeft) img.classList.add('flip');
      item.appendChild(img);
      footerEl.appendChild(item);
      requestAnimationFrame(()=>{ item.classList.add('pop-in'); });
    }
    function pushTrophy(url, facingLeft){
      if (!url || !isLoadedImage(url)) return;
      appendChain = appendChain
        .then(()=>appendThumb(url, facingLeft))
        .then(()=>ensureCapacity())
        .catch(()=>{});
    }

    // ====================== Route helpers ======================
    function beginRoute(route){
      goalRoute = route.slice();
      routeIdx = Math.min(1, goalRoute.length-1);
      // keep current slide; do not reset here to avoid jitter if user clicked during movement
    }
    function cancelRoute(){ goalRoute = null; routeIdx = 0; }

    function findNearestFreeCell(sx, sy){
      if (grid[sy] && grid[sy][sx]===0) return {x:sx, y:sy};
      const inBounds = (x,y)=> x>=0 && y>=0 && x<cols && y<rows;
      const q = [{x:sx,y:sy}];
      const seen = new Set([key(sx,sy)]);
      const dirs=[[1,0],[-1,0],[0,1],[0,-1]];
      while(q.length){
        const cur = q.shift();
        for (const [dx,dy] of dirs){
          const nx = cur.x+dx, ny = cur.y+dy;
          if (!inBounds(nx,ny)) continue;
          const k = key(nx,ny); if (seen.has(k)) continue; seen.add(k);
          if (grid[ny][nx]===0) return {x:nx,y:ny};
          q.push({x:nx,y:ny});
        }
      }
      return null;
    }

    // ====================== Main Loop ======================
    let lastTs = null; let rafId = 0;
    const COLLECT_RADIUS = collectRatio; // cell units

    function frame(ts){
      if (lastTs===null) lastTs=ts;
      const dt = Math.min(0.1, (ts-lastTs)/1000); lastTs=ts;
      const dpr = Math.max(1, window.devicePixelRatio||1);

      // Advance goal by route or keyboard
      if (!sliding.active){
        if (goalRoute && routeIdx < goalRoute.length){
          const next = goalRoute[routeIdx];
          startSlide(goal, next);
        } else {
          // keyboard-controlled slide
          if (!tryStartSlideKeyboard()){
            const k = Math.min(1, 12 * dt);
            goalVis.x += (goal.x - goalVis.x) * k;
            goalVis.y += (goal.y - goalVis.y) * k;
          }
        }
      } else {
        const speed = GOAL_SLIDE_SPEED;
        sliding.t = Math.min(1, sliding.t + speed*dt);
        if (sliding.to){
          const from = sliding.from; const to = sliding.to;
          goalVis.x = from.x + (to.x - from.x) * sliding.t;
          goalVis.y = from.y + (to.y - from.y) * sliding.t;
        }
        if (sliding.t >= 1 && sliding.to){
          setGoal({x:sliding.to.x, y:sliding.to.y});
          goalVis = {x:sliding.to.x, y:sliding.to.y};
          sliding.active=false; sliding.to=null; sliding.t=0;
          collectAtCurrentCell();
          if (goalRoute && routeIdx < goalRoute.length) routeIdx++;
        }
      }

      // Move agents
      const collectedIds = new Set();
      for (const a of agents){
        let arrived = false;
        if (a.path && a.idx < a.path.length){
          const target = a.path[a.idx];
          const dx = target.x - a.pos.x; const dy = target.y - a.pos.y;
          const dist = Math.hypot(dx,dy);
          const step = AGENT_SPEED * dt;
          if (dist <= step || dist < 1e-6){
            a.pos.x = target.x; a.pos.y = target.y; a.idx++;
            if (faceDir && a.idx < a.path.length){
              const nextT = a.path[a.idx]; const sdx = nextT.x - a.pos.x;
              if (sdx > 0) a.facing='right'; else if (sdx < 0) a.facing='left';
            }
            if (a.idx >= a.path.length){ arrived = true; }
          } else {
            if (faceDir){ if (dx > 0.001) a.facing='right'; else if (dx < -0.001) a.facing='left'; }
            a.pos.x += (dx/dist)*step; a.pos.y += (dy/dist)*step;
          }
          if (arrived){ if (a.imgURL) pushTrophy(a.imgURL, a.facing==='left'); collectedIds.add(a.id); }
        } else if (a.path && a.idx >= a.path.length){
          if (a.imgURL) pushTrophy(a.imgURL, a.facing==='left'); collectedIds.add(a.id);
        } else {
          const s = { x: Math.round(a.pos.x), y: Math.round(a.pos.y) };
          const p = astar(grid, s, goal); a.path=p; a.idx=p?1:0;
        }
      }

      // Encounter during movement
      const gx = goalVis.x; const gy = goalVis.y;
      for (const a of agents){
        if (collectedIds.has(a.id)) continue;
        const dx = a.pos.x - gx; const dy = a.pos.y - gy; const d = Math.hypot(dx,dy);
        if (d <= COLLECT_RADIUS){ if (a.imgURL) pushTrophy(a.imgURL, a.facing==='left'); collectedIds.add(a.id); }
      }

      if (collectedIds.size){ for (let i=agents.length-1; i>=0; i--){ if (collectedIds.has(agents[i].id)) agents.splice(i,1); } }

      if (agents.length === 0){
        randomGoalRelocate();
        spawnAgents(AGENTS_TARGET);
        replanAll();
        cancelRoute();
      }

      // Draw
      ctx.setTransform(dpr*scale, 0, 0, dpr*scale, 0, 0);
      ctx.imageSmoothingEnabled = false;
      ctx.fillStyle = wallColor; ctx.fillRect(0,0, LOGICAL_W, LOGICAL_H);
      ctx.fillStyle = pathColor;
      for (let y=0;y<rows;y++){
        for (let x=0;x<cols;x++) if (grid[y][x]===0) ctx.fillRect(x*CELL, y*CELL, CELL, CELL);
      }

      const gpx = gx*CELL + CELL/2; const gpy = gy*CELL + CELL/2;
      const pulse = 1 + 0.20 * Math.sin(ts*0.006);
      const gImg = getImage(goalImgURL);
      if (gImg){
        const maxSize = CELL*0.9;
        const r = Math.min(maxSize / gImg.width, maxSize / gImg.height);
        const w = gImg.width*r*spriteScale, h = gImg.height*r*spriteScale;
        if (faceDir && goalFacing === 'left'){
          ctx.save(); ctx.translate(gpx, gpy); ctx.scale(-1,1); ctx.drawImage(gImg, -w/2, -h/2, w, h); ctx.restore();
        } else { ctx.drawImage(gImg, gpx - w/2, gpy - h/2, w, h); }
      } else {
        ctx.beginPath(); ctx.arc(gpx, gpy, CELL*0.36*pulse, 0, Math.PI*2);
        ctx.fillStyle = '#f59e0b'; ctx.fill();
        ctx.lineWidth = 3; ctx.strokeStyle = '#111827'; ctx.stroke();
      }

      for (let i=0;i<agents.length;i++){
        const a = agents[i];
        const ax = a.pos.x*CELL + CELL/2; const ay = a.pos.y*CELL + CELL/2;
        const img = getImage(a.imgURL);
        if (img){
          const maxSize = CELL*0.9;
          const r = Math.min(maxSize / img.width, maxSize / img.height);
          const w = img.width*r*spriteScale, h = img.height*r*spriteScale;
          if (faceDir && a.facing==='left'){
            ctx.save(); ctx.translate(ax, ay); ctx.scale(-1,1); ctx.drawImage(img, -w/2, -h/2, w, h); ctx.restore();
          } else { ctx.drawImage(img, ax - w/2, ay - h/2, w, h); }
        } else {
          /*
          ctx.save();
          ctx.beginPath(); ctx.arc(ax, ay, CELL*0.38, 0, Math.PI*2);
          ctx.shadowColor = a.color; ctx.shadowBlur = 10;
          ctx.fillStyle = a.color; ctx.fill();
          ctx.shadowBlur = 0; ctx.lineWidth = 2; ctx.strokeStyle = '#111827'; ctx.stroke();
          ctx.restore();
          */
        }
      }

      rafId = requestAnimationFrame(frame);
    }

    function collectAtCurrentCell(){
      const gx = goal.x, gy = goal.y;
      const toRemove = [];
      for (const a of agents){
        if (Math.round(a.pos.x)===gx && Math.round(a.pos.y)===gy){ if (a.imgURL) pushTrophy(a.imgURL, a.facing==='left'); toRemove.push(a.id); }
      }
      if (toRemove.length){ for (let i=agents.length-1;i>=0;i--){ if (toRemove.includes(agents[i].id)) agents.splice(i,1); } }
    }

    function start(){ cancelAnimationFrame(rafId); lastTs=null; rafId=requestAnimationFrame(frame); }

    document.addEventListener('visibilitychange', ()=>{ if (document.hidden) cancelAnimationFrame(rafId); else start(); });

    // Goal image selection
    const goalIdxParam = Q.get('goalIdx');
    function selectGoalImageURL(){
      if (goalIdxParam && goalPool){
        const idx = parseInt(goalIdxParam, 10);
        if (!Number.isNaN(idx)){
          const base = goalPool.base || [];
          if (idx>=1 && idx<=base.length){ const url = base[idx-1]; return url || goalPool.next(); }
        }
      }
      return goalPool ? goalPool.next() : null;
    }

    // Self Tests
    function runSelfTests(){
      const logs = [];
      try {
        let bordersOK = true;
        for (let x=0; x<cols; x++){ if (grid[0][x]!==1 || grid[rows-1][x]!==1){ bordersOK=false; break; } }
        for (let y=0; y<rows; y++){ if (grid[y][0]!==1 || grid[y][cols-1]!==1){ bordersOK=false; break; } }
        logs.push({ test: 'borders are walls', pass: bordersOK });
        let free=0; for (let y=1;y<rows-1;y++) for (let x=1;x<cols-1;x++) if (grid[y][x]===0) free++;
        logs.push({ test: 'has free cells', pass: free>0, free });
        logs.push({ test: 'goal on free', pass: grid[goal.y]?.[goal.x]===0 });
        let allPaths = true; for (let i=0;i<3;i++){ const s=randomFreeCell(); const p=astar(grid,s,goal); if (!p||p.length<1){ allPaths=false; break; } }
        logs.push({ test: 'A* path to goal', pass: allPaths });
        const pSame = astar(grid, goal, goal);
        logs.push({ test: 'start==goal length==1', pass: !!pSame && pSame.length===1, len: pSame? pSame.length: 0 });
      } catch (e){ logs.push({ test:'harness error', pass:false, error: String(e && e.message || e) }); }
      try { console.table ? console.table(logs) : console.log(logs); } catch(_) { }
    }

    // Bootstrap
    async function bootstrap(){
      const goalBaseFiles = parseList(goalFilesStr);
      let agentBaseFiles = parseList(agentFilesStr);
      if (agentBaseFiles.length === 0){
        try { agentBaseFiles = await fetchAgentFilesFromTSV(TSV_URL); }
        catch (e){ console.warn('[TSV] load failed:', e); agentBaseFiles = []; }
      }
      const goalURLBase = imgBase ? goalBaseFiles.map(fn => joinURL(imgBase, fn)).filter(Boolean) : [];
      const agentURLBase = imgBase ? agentBaseFiles.map(fn => joinURL(imgBase, fn)).filter(Boolean) : [];
      goalPool  = createCyclePool(goalURLBase);
      agentPool = createCyclePool(agentURLBase);
      goalImgURL = selectGoalImageURL();
      spawnAgents(AGENTS_TARGET);
      replanAll();
      runSelfTests();
      start();
    }

    bootstrap();

  })();
  </script>
</body>
